<!DOCTYPE html>
<html lang="zh-CN" data-skin="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程体系 · HSK1 / HSK2 / HSK3</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --card:#171b21; --line:rgba(255,255,255,.13);
    --text:#e6e9ed; --muted:#9aa2ad; --hint:#6e7681;
    --acc:#4fd1c5; --accb:#0f3f3c; --onacc:#08110f;
    --ok:#6ee7a8; --okb:#0f3d28; --warn:#f5c86a; --warnb:#46330d;
    --bad:#f08080; --badb:#46191c;
  }
  /* 皮肤固定为「午夜」——近黑青调，高对比。
     如需换皮肤，把 <html data-skin="..."> 改成下面任一值即可（其余四套已内置）： */
  [data-skin="light"]{
    --bg:#ffffff; --panel:#f6f6f5; --card:#ffffff; --line:rgba(0,0,0,.12);
    --text:#1a1a1a; --muted:#666666; --hint:#999999;
    --acc:#0C447C; --accb:#E6F1FB; --onacc:#ffffff;
    --ok:#0F6E56; --okb:#E1F5EE; --warn:#854F0B; --warnb:#FAEEDA;
    --bad:#A32D2D; --badb:#FCEBEB;
  }
  [data-skin="paper"]{
    --bg:#faf7f0; --panel:#f1ebdf; --card:#fffdf8; --line:rgba(70,52,24,.16);
    --text:#2e2a22; --muted:#6b6355; --hint:#9c9384;
    --acc:#8a5a1e; --accb:#f4e5cd; --onacc:#fffdf8;
    --ok:#4a6b2a; --okb:#e9f1dc; --warn:#96650f; --warnb:#f8e9c9;
    --bad:#a03528; --badb:#f8e1dd;
  }
  [data-skin="forest"]{
    --bg:#eef4ea; --panel:#e3eddd; --card:#f8fbf5; --line:rgba(34,64,28,.16);
    --text:#1e2a1c; --muted:#55654f; --hint:#8a9a84;
    --acc:#2f6b32; --accb:#dbead6; --onacc:#f8fbf5;
    --ok:#256b3f; --okb:#d6ebdd; --warn:#86620f; --warnb:#f2e6c6;
    --bad:#9c3628; --badb:#f5dfdb;
  }
  [data-skin="night"]{
    --bg:#1a1d24; --panel:#21252e; --card:#262b35; --line:rgba(255,255,255,.14);
    --text:#e8eaee; --muted:#a0a6b2; --hint:#767d8a;
    --acc:#7fb3f0; --accb:#1e3a5c; --onacc:#101620;
    --ok:#5dcfa0; --okb:#12463a; --warn:#f0c26a; --warnb:#4a3410;
    --bad:#f09090; --badb:#4a1f1f;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.75;}
  .bar{position:sticky; top:0; z-index:30; height:50px; display:flex; align-items:center; gap:18px;
    padding:0 24px; border-bottom:1px solid var(--line); background:var(--panel);}
  .brand{font-size:14px; font-weight:500; cursor:pointer;}
  .brand:hover{color:var(--acc);}
  .bc{font-size:12px; color:var(--hint);}
  .bc b{color:var(--muted); font-weight:400;}
  /* 云端内容状态点。只在有 firebase-config.json 时才会渲染出来。 */
  .fswrap{margin-left:auto; display:flex; align-items:center; gap:7px; cursor:pointer;
    font-size:11.5px; color:var(--hint);}
  .fswrap:hover{color:var(--muted);}
  .fsdot{width:7px; height:7px; border-radius:50%; background:var(--hint); flex:none;}
  .fsdot.online{background:var(--ok);}
  .fsdot.syncing{background:var(--warn);}
  .fsdot.offline{background:var(--bad);}
  .app{max-width:880px; margin:0 auto; padding:32px 28px 100px;}
  .back{font-size:12.5px; color:var(--muted); background:none; border:1px solid var(--line);
    border-radius:8px; padding:5px 14px; cursor:pointer; font-family:inherit; margin-bottom:22px;}
  .back:hover{color:var(--acc); border-color:var(--acc);}
  h1{font-size:26px; font-weight:500; margin:0 0 6px;}
  h2{font-size:16px; font-weight:500; margin:34px 0 12px;}
  h3{font-size:15px; font-weight:500; margin:30px 0 11px; display:flex; align-items:center; gap:9px;}
  h3 .n{width:23px; height:23px; flex:0 0 23px; border-radius:50%; background:var(--accb);
    color:var(--acc); font-size:11.5px; display:flex; align-items:center; justify-content:center;}
  .sub{font-size:12.5px; color:var(--hint); margin:0 0 24px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; margin:0 0 18px;}
  th,td{text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top;}
  th{color:var(--muted); font-weight:500; font-size:12px;}
  .hint{color:var(--hint);}
  .note{font-size:12.5px; color:var(--muted); background:var(--panel);
    border-radius:11px; padding:14px 17px; margin:14px 0;}
  .note b{color:var(--text); font-weight:500;}
  .tag{font-size:10.5px; border-radius:5px; padding:2px 8px;}
  .tag.ok{color:var(--ok); background:var(--okb);}
  .tag.wn{color:var(--warn); background:var(--warnb);}
  /* ---------- 级别卡 ---------- */
  .levels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:0 0 10px;}
  .lvcard{position:relative; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-radius:15px; padding:22px 20px 20px; cursor:pointer; font-family:inherit; color:var(--text);}
  .lvcard:hover{border-color:var(--acc);}
  .lvcard.pending{opacity:.72; border-style:dashed;}
  .lvbadge{position:absolute; top:16px; right:16px; font-size:10.5px; border-radius:5px; padding:2px 8px;}
  .lvbadge.ok{color:var(--ok); background:var(--okb);}
  .lvbadge.wn{color:var(--warn); background:var(--warnb);}
  .lvname{font-size:26px; font-weight:500; margin:6px 0 4px; letter-spacing:.02em;}
  .lvzh{font-size:12.5px; color:var(--muted); margin:0 0 2px;}
  .lvvi{font-size:11.5px; color:var(--hint); margin:0 0 12px;}
  .lvmeta{font-size:12px; color:var(--acc); margin:0;}
  /* ---------- 统计 ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:11px; margin:0 0 8px;}
  .sc{background:var(--panel); border-radius:11px; padding:13px 15px;}
  .scv{font-size:21px; font-weight:500; margin:0; color:var(--acc);}
  .scl{font-size:11.5px; color:var(--hint); margin:2px 0 0;}
  /* ---------- 课次网格 ---------- */
  .sgc{font-size:11px; color:var(--hint); font-weight:400; margin-left:9px;}
  .lgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:9px;}
  .lcard{display:flex; flex-direction:column; gap:2px; text-align:left; background:var(--panel);
    border:1px solid var(--line); border-radius:11px; padding:12px 14px; cursor:pointer;
    font-family:inherit; color:var(--text);}
  .lcard:hover{border-color:var(--acc); background:var(--card);}
  .lcard.off{opacity:.55; border-style:dashed;}
  .lnum{font-size:11px; color:var(--hint);}
  .lzh{font-size:14px; font-weight:500;}
  .lvi{font-size:11.5px; color:var(--hint);}
  .lwc{font-size:11px; color:var(--acc); margin-top:3px;}
  /* ---------- 目录筛选条（小、紧凑） ---------- */
  .dirbar{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:16px 0 2px;}
  .dirt{font-size:11.5px; color:var(--hint); margin-right:1px; letter-spacing:.06em;}
  .dchip{font-size:11.5px; font-family:inherit; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:4px 10px; cursor:pointer;}
  .dchip:hover{color:var(--text); border-color:var(--acc);}
  .dchip.on{background:var(--accb); color:var(--acc); border-color:var(--acc);}
  .dcn{color:var(--hint); margin-left:4px;}
  .dchip.on .dcn{color:var(--acc);}
  /* ---------- 课内分块导航 ---------- */
  .blkbar{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:20px 0 0;}
  .blk{font-size:12.5px; font-family:inherit; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:9px; padding:9px 10px; cursor:pointer;
    text-align:center; line-height:1.35;}
  .blk:hover{color:var(--text); border-color:var(--acc);}
  .blk.on{background:var(--acc); color:var(--onacc); border-color:var(--acc); font-weight:500;}
  .blkbody{margin-top:20px;}
  .blkh{font-size:15px; font-weight:500; margin:0 0 14px; padding-bottom:9px;
    border-bottom:1px solid var(--line); color:var(--text);}
  .blknav{display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top:30px; padding-top:16px; border-top:1px solid var(--line);}
  .blkpos{font-size:11.5px; color:var(--hint);}
  .printall{display:none;}
  /* ---------- 课页 ---------- */
  .lhead{display:flex; align-items:center; gap:12px; margin-bottom:8px;}
  .lno{font-size:12px; color:var(--onacc); background:var(--acc); border-radius:6px; padding:2px 11px;}
  .lstg{font-size:11.5px; color:var(--hint);}
  .ltitle{font-size:28px; margin:0 0 2px;}
  .tabs{display:flex; gap:8px; align-items:center; margin:22px 0 6px;
    border-bottom:1px solid var(--line); padding-bottom:12px;}
  .tab{font-size:12.5px; font-family:inherit; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:8px; padding:6px 16px; cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.on{background:var(--acc); color:var(--onacc); border-color:var(--acc);}
  .prt{margin-left:auto; font-size:12px; font-family:inherit; color:var(--muted);
    background:none; border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer;}
  .prt:hover{color:var(--text);}
  .goal{background:var(--panel); border-radius:11px; padding:13px 17px; margin:18px 0 4px; font-size:13px;}
  .goal b{color:var(--acc); font-weight:500; margin-right:9px;}
  table.words td.hz{font-size:17px; font-weight:500;}
  table.words td.pyc{color:var(--acc); font-size:12.5px;}
  table.words td.hv{color:var(--muted); font-size:12.5px;}
  .g{background:var(--panel); border-radius:12px; padding:16px 19px; margin:0 0 13px;}
  .gpt{font-size:14px; font-weight:500; margin:0 0 6px;}
  .gfm{font-size:13px; color:var(--acc); background:var(--accb); display:inline-block;
    border-radius:6px; padding:4px 12px; margin:0 0 9px;}
  .gnote{font-size:12.5px; color:var(--muted); margin:0 0 12px;}
  .gwrap,.exwrap{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:9px;}
  .gex,.sent{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:11px 14px;}
  .zh{font-size:15.5px; font-weight:500; margin:0 0 3px;}
  .py{font-size:12.5px; color:var(--acc); margin:0 0 3px;}
  .vi{font-size:12px; color:var(--muted); margin:0;}
  .dlg{background:var(--panel); border-radius:12px; padding:6px 17px;}
  .line{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line);}
  .line:last-child{border-bottom:0;}
  .who{width:25px; height:25px; flex:0 0 25px; border-radius:50%; background:var(--accb); color:var(--acc);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; margin-top:4px;}
  .exq{font-size:13px; margin:20px 0 10px;}
  .exq b{color:var(--acc); font-weight:500; margin-right:8px;}
  .match{display:grid; grid-template-columns:1fr 1fr; gap:40px;
    background:var(--panel); border-radius:12px; padding:16px 26px;}
  .ml,.mr{margin:0; padding-left:26px;}
  .ml li,.mr li{font-size:14px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .ml li{font-size:16px; font-weight:500;}
  .mr li{font-size:12.5px; color:var(--muted);}
  .fill{margin:0; background:var(--panel); border-radius:12px; padding:16px 26px 16px 46px;}
  .fill li{font-size:14px; padding:7px 0;}
  .qz{margin:0 0 6px;}
  .opts{display:flex; gap:10px; margin:0; flex-wrap:wrap;}
  .opt{font-size:13px; background:var(--card); border:1px solid var(--line);
    border-radius:7px; padding:3px 14px;}
  .pyq{list-style:none; margin:0; padding:16px 20px; background:var(--panel); border-radius:12px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 20px;}
  .pyq li{display:flex; align-items:center; gap:10px;}
  .pyq .hz{font-size:17px; font-weight:500; min-width:62px;}
  .pyq .blank{flex:1; border-bottom:1px solid var(--line); height:20px;}
  .ansbox{background:var(--panel); border:1px dashed var(--line); border-radius:11px;
    padding:13px 17px; margin:16px 0;}
  .anstit{font-size:12.5px; font-weight:500; margin:0 0 7px; color:var(--acc);}
  .ansl{font-size:12.5px; color:var(--muted); margin:0 0 4px; line-height:1.9;}
  .ansl b{display:inline-block; min-width:44px; color:var(--text); font-weight:500;}
  ul.pit{margin:0; padding-left:20px;}
  ul.pit li{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  ul.pit li::marker{color:var(--warn);}
  ul.plain{margin:0; padding-left:20px;}
  ul.plain li{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .lnav{display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top:44px; padding-top:20px; border-top:1px solid var(--line);}
  .mini{font-size:12.5px; font-family:inherit; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:8px; padding:6px 15px; cursor:pointer;}
  .mini:hover{color:var(--acc); border-color:var(--acc);}
  .pending-box{background:var(--panel); border:1px dashed var(--line); border-radius:14px;
    padding:44px 24px; text-align:center; margin:26px 0;}
  .pbt{font-size:15px; font-weight:500; margin:0 0 8px; color:var(--warn);}
  .pbs{font-size:12.5px; color:var(--muted); margin:0;}
  @media (max-width:760px){
    .app{padding:22px 15px 80px;}
    .levels{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .gwrap,.exwrap{grid-template-columns:1fr;}
    .match{gap:18px; padding:14px 16px;}
    .bar{gap:10px; padding:0 14px; overflow-x:auto;}
    .ltitle{font-size:23px;}
  }
  @media print{
    /* 打印时把分块导航收起来，让两个页签的所有块全部展开成完整一份 */
    .bar,.back,.lnav,.tabs,.prt,.blkbar,.blkbody,.blknav{display:none!important;}
    .printall{display:block!important;}
    .printall h2{font-size:15pt; margin:22pt 0 8pt; padding-bottom:5pt;
      border-bottom:1px solid #999;}
    .printall h3{font-size:12pt; margin:14pt 0 7pt; color:#0C447C;}
    body{background:#fff; color:#000; font-size:11pt;}
    .app{max-width:none; padding:0;}
    :root{--bg:#fff; --panel:#f4f4f2; --card:#fbfbfa; --line:rgba(0,0,0,.22);
      --text:#000; --muted:#333; --hint:#666; --acc:#0C447C; --accb:#E6F1FB; --onacc:#fff;
      --warn:#854F0B;}
    .g,.sent,.gex,.dlg,.match,.fill,.pyq,.ansbox{break-inside:avoid;}
    .pending-box{border-style:solid;}
  }
</style>
</head>

<main class="app" id="app"></main>

<script>

 em　家人 — thành viên gia đình；(cũ) người hầu　老人 — ông già hoặc bà già；người cao tuổi"},"fill":[{"blanked":"＿＿＿，请问……","opts":["小姐","先生","家人"],"ans":"先生"},{"blanked":"有，我＿＿＿八岁。","opts":["爷爷","儿子","女儿"],"ans":"女儿"},{"blanked":"这是你＿＿＿吗？","opts":["女儿","朋友","儿子"],"ans":"儿子"},{"blanked":"这个＿＿＿很好。","opts":["小朋友","小孩儿"],"ans":"小孩儿"},{"blanked":"我＿＿＿都在家。","opts":["奶奶","先生","家人"],"ans":"家人"}],"py":[{"hz":"女儿","ans":"nǚ ér"},{"hz":"小孩儿","ans":"xiǎo háir"},{"hz":"爷爷","ans":"yé ye"},{"hz":"先生","ans":"xiān sheng"}]}},"hsk1/L08":{"no":8,"id":"L08","lv":"hsk1","stage":"s1","stageZh":"第一阶段 · 发音与基础","titleZh":"男人和女人","titleVi":"Nam và nữ","goal":"会区分性别称谓，会介绍关系与姓名","words":[{"hz":"女","py":"nǚ","hv":"nữ","vi":"nữ；phụ nữ","pos":"区别词 / 语素"},{"hz":"男","py":"nán","hv":"nam","vi":"nam；Nam tước","pos":"区别词 / 语素"},{"hz":"女人","py":"nǚ rén","hv":"nữ nhân","vi":"phụ nữ；vợ","pos":"名词"},{"hz":"男人","py":"nán rén","hv":"nam nhân","vi":"một người đàn ông；một nam giới","pos":"名词"},{"hz":"女生","py":"nǚ shēng","hv":"nữ sinh","vi":"nữ sinh；học sinh nữ","pos":"名词 / 人名"},{"hz":"男生","py":"nán shēng","hv":"nam sinh","vi":"nam sinh；học sinh nam","pos":"名词"},{"hz":"女孩儿","py":"nǚ hái r","hv":"nữ hài nhi","vi":"biến thể er hoá của 女孩[nu:3 hai2]","pos":"名词"},{"hz":"男孩儿","py":"nán hái r","hv":"nam hài nhi","vi":"biến thể er hoá của 男孩","pos":"名词"},{"hz":"男朋友","py":"nán péng you","hv":"nam bằng hữu","vi":"bạn trai","pos":"名词"},{"hz":"女朋友","py":"nǚ péng you","hv":"nữ bằng hữu","vi":"bạn gái","pos":"名词"},{"hz":"名字","py":"míng zi","hv":"danh tự","vi":"tên (của người hoặc vật)","pos":"名词"},{"hz":"网友","py":"wǎng yǒu","hv":"võng hữu","vi":"bạn online；người dùng Internet","pos":"名词"}],"grammar":[{"point":"「男 / 女」作定语","formula":"男/女 + 名词","note":"男 / 女 直接放在名词前，不加「的」。","ex":[{"zh":"他是男生。","py":"tā shì nán shēng。","vi":"Cậu ấy là nam."},{"zh":"她是女生。","py":"tā shì nǚ shēng。","vi":"Cô ấy là nữ."}]},{"point":"问姓名","formula":"你叫什么名字？","note":"回答直接说「我叫 + 名字」。","ex":[{"zh":"你叫什么名字？","py":"nǐ jiào shén me míng zi？","vi":"Bạn tên là gì?"},{"zh":"我名字在这儿。","py":"wǒ míng zi zài zhèr。","vi":"Tên tôi ở đây."}]}],"sentences":[{"zh":"你叫什么名字？","py":"nǐ jiào shén me míng zi？","vi":"Bạn tên là gì?"},{"zh":"他是我男朋友。","py":"tā shì wǒ nán péng you。","vi":"Anh ấy là bạn trai tôi."},{"zh":"她是我的女朋友。","py":"tā shì wǒ de nǚ péng you。","vi":"Cô ấy là bạn gái tôi."},{"zh":"我们班有十个男生，八个女生。","py":"wǒ men bān yǒu shí gè nán shēng， bā gè nǚ shēng。","vi":"Lớp chúng tôi có mười nam, tám nữ."},{"zh":"那个女孩儿是我妹妹。","py":"nà ge nǚ háir shì wǒ mèi mei。","vi":"Cô bé kia là em gái tôi."}],"dialogue":[{"who":"A","zh":"那个人是谁？","py":"nà ge rén shì shéi？","vi":"Người kia là ai?"},{"who":"B","zh":"他是我朋友，是男生。","py":"tā shì wǒ péng you， shì nán shēng。","vi":"Anh ấy là bạn tôi, là nam."},{"who":"A","zh":"那个女孩儿呢？","py":"nà ge nǚ háir ne？","vi":"Còn cô bé kia?"},{"who":"B","zh":"她是我女朋友。我们都是学生。","py":"tā shì wǒ nǚ péng you。 wǒ men dōu shì xué sheng。","vi":"Cô ấy là bạn gái tôi. Chúng tôi đều là học sinh."},{"who":"A","zh":"你们班男生多还是女生多？","py":"nǐ men bān nán shēng duō hái shi nǚ shēng duō？","vi":"Lớp bạn nam nhiều hay nữ nhiều?"},{"who":"B","zh":"女生多。有十个女生，八个男生。","py":"nǚ shēng duō。 yǒu shí gè nǚ shēng， bā gè nán shēng。","vi":"Nữ nhiều hơn. Có mười nữ, tám nam."},{"who":"A","zh":"好，谢谢！","py":"hǎo， xiè xie！","vi":"Được, cảm ơn!"},{"who":"B","zh":"不客气。","py":"bù kè qi。","vi":"Đừng khách sáo."}],"drill":["「男/女」+ 名词 组合练习：男人 / 女人 / 男生 / 女生 / 男孩儿 / 女孩儿 / 男朋友 / 女朋友","听句子选性别：老师说句子，学员举「他」或「她」的卡"],"pitfalls":["「男朋友 / 女朋友」在中文里指恋爱对象，不只是「男性朋友」","汉字「他 / 她」读音相同，写作时必须区分","「网友」= 网上的朋友，不是所有上网的人"],"homework":["用中文写出自己班里男生、女生的人数","在 App 上完成 L08 测验"],"ex":{"match":{"left":["女人","女朋友","男生","男孩儿","女","男"],"right":["phụ nữ；vợ","biến thể er hoá của 男孩","nam；Nam tước","bạn gái","nam sinh；học sinh nam","nữ；phụ nữ"],"answer":"女人 — phụ nữ；vợ　女朋友 — bạn gái　男孩儿 — biến thể er hoá của 男孩　男生 — nam sinh；học sinh nam　女 — nữ；phụ nữ　男 — nam；Nam tước"},"fill":[{"blanked":"那个＿＿＿呢？","opts":["女孩儿","男朋友","女朋友"],"ans":"女孩儿"},{"blanked":"你叫什么＿＿＿？","opts":["名字","男生","女生"],"ans":"名字"},{"blanked":"她是我＿＿＿。我们都是学生。","opts":["男孩儿","女朋友","女孩儿"],"ans":"女朋友"},{"blanked":"他是我朋友，是＿＿＿。","opts":["网友","男生","女人"],"ans":"男生"},{"blanked":"他是我＿＿＿。","opts":["男孩儿","男朋友","女孩儿"],"ans":"男朋友"}],"py":[{"hz":"名字","ans":"míng zi"},{"hz":"男朋友","ans":"nán péng you"},{"hz":"网友","ans":"wǎng yǒu"},{"hz":"女人","ans":"nǚ rén"}]}},"hsk1/L09":{"no":9,"id":"L09","lv":"hsk1","stage":"s1","stageZh":"第一阶段 · 发音与基础","titleZh":"这个、那个","titleVi":"Cái này, cái kia","goal":"会用指示代词指认远近，会问地点","words":[{"hz":"这","py":"zhè","hv":"giá","vi":"(đại từ) này; những...này；(hình thức kết hợp) này","pos":"代词"},{"hz":"那","py":"nà","hv":"na","vi":"họ [Na1]；họ [Nuo2]","pos":"代词 / 连词"},{"hz":"这些","py":"zhè xiē","hv":"giá ta","vi":"những... này","pos":"代词"},{"hz":"那些","py":"nà xiē","hv":"na ta","vi":"những cái đó","pos":"代词"},{"hz":"这里","py":"zhè lǐ","hv":"giá lý","vi":"ở đây","pos":"代词"},{"hz":"那里","py":"nà li","hv":"na lý","vi":"ở đó; nơi đó","pos":"代词"},{"hz":"这儿","py":"zhè r","hv":"giá nhi","vi":"ở đây","pos":"代词"},{"hz":"那儿","py":"nà r","hv":"na nhi","vi":"ở đó","pos":"代词"},{"hz":"这边","py":"zhè biān","hv":"giá biên","vi":"bên này；ở đây","pos":"代词"},{"hz":"那边","py":"nà bian","hv":"na biên","vi":"đằng kia；ở đằng đó","pos":"代词"},{"hz":"哪","py":"nǎ","hv":"ná","vi":"như thế nào；cái nào","pos":"代词 / 语气词"},{"hz":"哪里","py":"nǎ lǐ","hv":"ná lý","vi":"ở đâu?；một nơi nào đó","pos":"代词"}],"grammar":[{"point":"「这 / 那」+ 量词 + 名词","formula":"这 + 量词 + 名词（近）　｜　那 + 量词 + 名词（远）","note":"指示代词不能直接修饰名词，必须带量词：不说「这书」，要说「这本书」。","ex":[{"zh":"这个人是我朋友。","py":"zhè ge rén shì wǒ péng you。","vi":"Người này là bạn tôi."},{"zh":"那本书是他的。","py":"nà běn shū shì tā de。","vi":"Cuốn sách kia là của anh ấy."}]},{"point":"这里 / 那里 / 哪里","formula":"这儿（近）／ 那儿（远）／ 哪儿（疑问）","note":"「这儿 / 那儿 / 哪儿」是口语，「这里 / 那里 / 哪里」是书面，意思相同。","ex":[{"zh":"他在这里。","py":"tā zài zhè lǐ。","vi":"Anh ấy ở đây."},{"zh":"你住在哪里？","py":"nǐ zhù zài nǎ lǐ？","vi":"Bạn sống ở đâu?"}]}],"sentences":[{"zh":"这是我的书，那是你的书。","py":"zhè shì wǒ de shū， nà shì nǐ de shū。","vi":"Đây là sách của tôi, kia là sách của bạn."},{"zh":"这些是我的朋友，那些是他的朋友。","py":"zhè xiē shì wǒ de péng you， nà xiē shì tā de péng you。","vi":"Đây là bạn của tôi, kia là bạn của anh ấy."},{"zh":"你住在哪里？","py":"nǐ zhù zài nǎ lǐ？","vi":"Bạn sống ở đâu?"},{"zh":"他在这里。","py":"tā zài zhè lǐ。","vi":"Anh ấy ở đây."},{"zh":"那是哪儿？","py":"nà shì nǎr？","vi":"Kia là đâu?"}],"dialogue":[{"who":"A","zh":"这是哪儿？","py":"zhè shì nǎr？","vi":"Đây là đâu?"},{"who":"B","zh":"这里是我的学校。","py":"zhè lǐ shì wǒ de xué xiào。","vi":"Đây là trường của tôi."},{"who":"A","zh":"那些是什么？","py":"nà xiē shì shén me？","vi":"Những cái kia là gì?"},{"who":"B","zh":"那些是教学楼。","py":"nà xiē shì jiào xué lóu。","vi":"Kia là các tòa nhà giảng đường."},{"who":"A","zh":"你的班在哪儿？","py":"nǐ de bān zài nǎr？","vi":"Lớp bạn ở đâu?"},{"who":"B","zh":"在那边，三楼。","py":"zài nà bian， sān lóu。","vi":"Ở đằng kia, tầng ba."},{"who":"A","zh":"好，谢谢！","py":"hǎo， xiè xie！","vi":"Được, cảm ơn!"},{"who":"B","zh":"不客气。","py":"bù kè qi。","vi":"Đừng khách sáo."}],"drill":["手指练习：指着近处说「这是……」，指着远处说「那是……」","儿化音对比：这儿 zhèr / 那儿 nàr / 哪儿 nǎr","「这 / 那」+ 量词 快速替换"],"pitfalls":["「哪」和「那」只差一个「口」字旁，读音不同：nǎ / nà","「这儿」和「这里」意思相同，口语多用「这儿」","指示代词后面必须接量词才能修饰名词"],"homework":["用「这 / 那」各说三句，介绍身边的东西","在 App 上完成 L09 测验"],"ex":{"match":{"left":["那儿","那","这边","这儿","那些","这些"],"right":["ở đây","bên này；ở đây","ở đó","họ [Na1]；họ [Nuo2]","những cái đó","những... này"],"answer":"这儿 — ở đây　这些 — những... này　那 — họ [Na1]；họ [Nuo2]　那些 — những cái đó　这边 — bên này；ở đây　那儿 — ở đó"},"fill":[{"blanked":"＿＿＿是哪儿？","opts":["那","这","哪"],"ans":"这"},{"blanked":"＿＿＿是哪儿？","opts":["哪","那","这"],"ans":"那"},{"blanked":"＿＿＿是什么？","opts":["这边","那儿","那些"],"ans":"那些"},{"blanked":"在＿＿＿，三楼。","opts":["那儿","这边","那边"],"ans":"那边"},{"blanked":"＿＿＿是我的学校。","opts":["那里","这里","这边"],"ans":"这里"}],"py":[{"hz":"这里","ans":"zhè lǐ"},{"hz":"那儿","ans":"nàr"},{"hz":"那些","ans":"nà xiē"},{"hz":"那边","ans":"nà bian"}]}},"hsk1/L10":{"no":10,"id":"L10","lv":"hsk1","stage":"s1","stageZh":"第一阶段 · 发音与基础","titleZh":"提问","titleVi":"Đặt câu hỏi","goal":"会用疑问词提问，会用「还是」做选择问","words":[{"hz":"什么","py":"shén me","hv":"thập ma","vi":"gì?；điều gì đó; bất kỳ điều gì","pos":"代词"},{"hz":"怎么","py":"zěn me","hv":"chẩm ma","vi":"như thế nào?；cái gì?","pos":"代词"},{"hz":"多少","py":"duō shǎo","hv":"đa thiểu","vi":"số lượng; mức độ；phần nào","pos":"代词"},{"hz":"哪儿","py":"nǎ r","hv":"ná nhi","vi":"ở đâu?；bất cứ đâu; nơi nào đó","pos":"代词"},{"hz":"哪些","py":"nǎ xiē","hv":"ná ta","vi":"những cái nào?；ai?","pos":"代词"},{"hz":"是不是","py":"shì bù shì","hv":"thị bất thị","vi":"có phải hay không；phải hoặc không","pos":"动词"},{"hz":"干什么","py":"gàn shén me","hv":"can thập ma","vi":"bạn đang làm gì?；anh ấy đang định làm gì?","pos":"动词"},{"hz":"有的","py":"yǒu de","hv":"hữu đích","vi":"(có) một số (người...)；một số (tồn tại)","pos":"代词"},{"hz":"有些","py":"yǒu xiē","hv":"hữu ta","vi":"một số；hơi","pos":"代词"},{"hz":"有一些","py":"yǒu yī xiē","hv":"hữu nhất ta","vi":"một chút；khá","pos":"动词短语"},{"hz":"话","py":"huà","hv":"thoại","vi":"phương ngữ；ngôn ngữ","pos":"名词 / 动词"},{"hz":"还是","py":"hái shi","hv":"hoàn thị","vi":"vẫn (như trước)；nên (tốt hơn)","pos":"连词 / 副词"}],"grammar":[{"point":"疑问词就位，句序不变","formula":"什么 / 谁 / 哪儿 / 多少 / 怎么 放在要问的位置","note":"中文不像越南语把疑问词提前，问什么就把疑问词放在那个位置。","ex":[{"zh":"这是什么？","py":"zhè shì shén me？","vi":"Đây là cái gì?"},{"zh":"你家在哪儿？","py":"nǐ jiā zài nǎr？","vi":"Nhà bạn ở đâu?"}]},{"point":"「A 还是 B？」选择问","formula":"A 还是 B？","note":"回答直接选一个，不用「是」。","ex":[{"zh":"你是学生还是老师？","py":"nǐ shì xué sheng hái shi lǎo shī？","vi":"Bạn là học sinh hay giáo viên?"},{"zh":"你喝茶还是喝水？","py":"nǐ hē chá hái shi hē shuǐ？","vi":"Bạn uống trà hay uống nước?"}]},{"point":"正反问","formula":"是不是 / 有没有 / 好不好","note":"把肯定和否定叠在一起提问，回答用「是 / 不是」。","ex":[{"zh":"你是不是学生？","py":"nǐ shì bù shì xué sheng？","vi":"Bạn có phải là học sinh không?"},{"zh":"我们一块儿去，好不好？","py":"wǒ men yī kuàir qù， hǎo bù hǎo？","vi":"Chúng ta cùng đi, được không?"}]}],"sentences":[{"zh":"这是什么？","py":"zhè shì shén me？","vi":"Đây là cái gì?"},{"zh":"你叫什么名字？","py":"nǐ jiào shén me míng zi？","vi":"Bạ function levelIds(lvId, stageId){
  var out = [];
  DATA.stages.forEach(function(st){
    if (st.lv !== lvId) return;
    if (stageId && st.id !== stageId) return;
    (DATA.stageLessons[st.id] || []).forEach(function(x){ out.push(x); });
  });
  return out;
}

        '" onclick="go(\'' + lvId + '/' + st.id + '\')">' + esc(st.cn) + ' ' + esc(st.short) +
        '<span class="dcn">' + n + '</span></button>';
    }).join('');
  var dirbar = '<div class="dirbar"><span class="dirt">目录</span>' + chips + '</div>';

  /* 42 张课卡平铺连号，不再按阶段分堆 */
  var ids = levelIds(lvId, stageId);
  var cards = ids.map(function(id){
    var L = DATA.lessons[lvId + '/' + id];
    if (!L) return '';
    return '<button class="lcard" onclick="go(\'' + lvId + '/' + id + '\')">' +
      '<span class="lnum">第 ' + L.no + ' 课</span>' +
      '<span class="lzh">' + esc(L.titleZh) + '</span>' +
      '<span class="lvi">' + esc(L.titleVi) + '</span>' +
      '<span class="lwc">' + L.words.length + ' 词</span></button>';
  }).join('');

  var cur = null;
  stages.forEach(function(st){ if (st.id === stageId) cur = st; });
  var h2 = cur
    ? '<h2>' + esc(cur.zh) + '<span class="sgc">' + ids.length + ' 课</span></h2>'
    : '<h2>全部课程板块<span class="sgc">' + ids.length + ' 课</span></h2>';

  return head + dirbar + h2 + '<div class="lgrid">' + cards + '</div>';
}

/* ---------- 第 3 层：课页 ---------- */
/* 每一块单独一屏：点哪一块只看哪一块，不再一路往下滚。 */

var BOOK_SECS = ['一　生词', '二　语法', '三　例句', '四　课文', '五　练习', '六　注意', '七　课后任务'];
var PLAN_SECS = ['一　本课目标', '二　语法点（讲解顺序）', '三　课堂操练', '四　易错点',
                 '五　课后任务', '六　与 45 分钟六步 SOP 的对应'];

function wordsTable(L){
  var rows = L.words.map(function(w){
    return '<tr><td class="hz">' + esc(w.hz) + '</td>' +
      '<td class="pyc">' + esc(w.py) + '</td>' +
      '<td class="hv">' + esc(w.hv) + '</td>' +
      '<td>' + esc(w.vi) + '</td>' +
      '<td class="hint">' + esc(w.pos) + '</td></tr>';
  }).join('');
  return '<table class="words"><tr><th style="width:13%">汉字</th>' +
    '<th style="width:17%">拼音</th><th style="width:17%">汉越音</th>' +
    '<th style="width:39%">越南语</th><th style="width:14%">词性</th></tr>' + rows + '</table>';
}

function exercises(L){
  var e = L.ex;
  var ml = e.match.left.map(function(w){ return '<li>' + esc(w) + '</li>'; }).join('');
  var mr = e.match.right.map(function(v){ return '<li>' + esc(v) + '</li>'; }).join('');

  var out = '<p class="exq"><b>1. 连线</b>把左边的汉字和右边的越南语连起来。</p>' +
    '<div class="match"><ol class="ml">' + ml + '</ol><ol class="mr">' + mr + '</ol></div>';

  var n = 2;
  if (e.fill.length) {
    var qs = e.fill.map(function(q, i){
      var opts = q.opts.map(function(o){ return '<span class="opt">' + esc(o) + '</span>'; }).join('');
      return '<li><p class="qz">' + esc(q.blanked) + '</p><p class="opts">' + opts + '</p></li>';
    }).join('');
    out += '<p class="exq"><b>' + n + '. 选词填空</b>从下面的词里选一个填进空格。</p>' +
      '<ol class="fill">' + qs + '</ol>';
    n++;
  }

  var pys = e.py.map(function(p){
    return '<li><span class="hz">' + esc(p.hz) + '</span><span class="blank"></span></li>';
  }).join('');
  out += '<p class="exq"><b>' + n + '. 写拼音</b>给下面的词注上拼音。</p>' +
    '<ol class="pyq">' + pys + '</ol>';
  n++;

  out += '<p class="exq"><b>' + n + '. 朗读</b>两人一组，把「四　课文」的对话读三遍，然后交换角色。</p>';

  var ans = '<p class="ansl"><b>连线</b>' + esc(e.match.answer) + '</p>';
  if (e.fill.length) {
    ans += '<p class="ansl"><b>填空</b>' +
      e.fill.map(function(q, i){ return (i + 1) + '. ' + esc(q.ans); }).join('　') + '</p>';
  }
  ans += '<p class="ansl"><b>拼音</b>' +
    e.py.map(function(p){ return esc(p.hz) + ' ' + esc(p.ans); }).join('　') + '</p>';

  return out +
    '<div class="ansbox"><p class="anstit">参考答案</p>' + ans + '</div>';
}

function grammarBlock(L){
  return L.grammar.map(function(x, i){
    var ex = x.ex.map(function(e){ return sentBlock(e, 'gex'); }).join('');
    return '<div class="g"><p class="gpt">' + (i + 1) + '. ' + esc(x.point) + '</p>' +
      '<p class="gfm">' + esc(x.formula) + '</p>' +
      '<p class="gnote">' + esc(x.note) + '</p>' +
      '<div class="gwrap">' + ex + '</div></div>';
  }).join('');
}

function secWords(L){ return wordsTable(L); }
function secGrammar(L){ return grammarBlock(L); }
function secSentences(L){
  return '<div class="exwrap">' + L.sentences.map(function(s){ return sentBlock(s); }).join('') + '</div>';
}
function secDialogue(L){
  var dlg = L.dialogue.map(function(d){
    return '<div class="line"><span class="who">' + esc(d.who) + '</span><div>' +
      '<p class="zh">' + esc(d.zh) + '</p><p class="py">' + esc(d.py) +
      '</p><p class="vi">' + esc(d.vi) + '</p></div></div>';
  }).join('');
  return '<div class="dlg">' + dlg + '</div>';
}
function secExercises(L){ return exercises(L); }
function secPitfalls(L){
  return '<ul class="pit">' + L.pitfalls.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}
function secHomework(L){
  return '<ul class="plain">' + L.homework.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}

function secGoal(L){
  return '<div class="goal"><b>本课目标</b>' + esc(L.goal) + '</div>';
}
function secDrill(L){
  return '<ul class="plain">' + L.drill.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}
function secSop(){
  var sop = SOP.map(function(r){
    return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) +
      '</td><td>' + esc(r[2]) + '</td></tr>';
  }).join('');
  return '<table><tr><th style="width:22%">课堂步骤</th><th style="width:14%">时长</th>' +
    '<th style="width:64%">用本课的哪一部分</th></tr>' + sop + '</table>' +
    '<div class="note"><b>备课提醒：</b>「课堂操练」和「易错点」不是单独环节，' +
    '而是贯穿在第 3、4、5 步里的教师提示——讲解时顺手做掉。</div>';
}

var BOOK_FN = [secWords, secGrammar, secSentences, secDialogue, secExercises, secPitfalls, secHomework];
var PLAN_FN = [secGoal, secGrammar, secDrill, secPitfalls, secHomework, secSop];

/* 打印用：两个页签的所有块全部展开，隐藏屏幕上的分块导航 */
function printAll(L){
  var out = '<h2>学员课本</h2>';
  BOOK_SECS.forEach(function(t, i){ out += '<h3>' + esc(t) + '</h3>' + BOOK_FN[i](L); });
  out += '<h2>教师教案</h2>';
  PLAN_SECS.forEach(function(t, i){ out += '<h3>' + esc(t) + '</h3>' + PLAN_FN[i](L); });
  return '<div class="printall">' + out + '</div>';
}

function renderLesson(lvId, lid, tab, blk){
  var L = DATA.lessons[lvId + '/' + lid];
  var lv = null;
  DATA.levels.forEach(function(x){ if (x.id === lvId) lv = x; });
  if (!lv) return renderHome();

  if (!L) {
    return '<button class="back" onclick="go(\'' + lvId + '\')">← 返回课程板块</button>' +
      '<h1>' + esc(lv.name) + ' · ' + esc(lid) + '</h1>' +
      '<div class="pending-box"><p class="pbt">本课内容待导入</p>' +
      '<p class="pbs">' + esc(lv.name) + ' 的课次板块已经建好，导入时直接填内容，' +
      '不需要改结构。</p></div>';
  }

  var ids = levelIds(lvId, null);
  var idx = ids.indexOf(lid);
  var prev = idx > 0 ? ids[idx - 1] : null;
  var next = idx >= 0 && idx < ids.length - 1 ? ids[idx + 1] : null;

  var nav = '<div class="lnav">' +
    (prev ? '<button class="mini" onclick="go(\'' + lvId + '/' + prev + '\')">← 第 ' +
      DATA.lessons[lvId + '/' + prev].no + ' 课</button>' : '<span></span>') +
    '<button class="mini" onclick="go(\'' + lvId + '\')">返回课程板块</button>' +
    (next ? '<button class="mini" onclick="go(\'' + lvId + '/' + next + '\')">第 ' +
      DATA.lessons[lvId + '/' + next].no + ' 课 →</button>' : '<span></span>') + '</div>';

  var isPlan = tab === 'plan';
  var secs = isPlan ? PLAN_SECS : BOOK_SECS;
  var fns = isPlan ? PLAN_FN : BOOK_FN;
  var n = secs.length;
  var bi = parseInt(blk, 10);
  if (!(bi >= 1 && bi <= n)) bi = 1;
  var i0 = bi - 1;

  var base = lvId + '/' + lid + (isPlan ? '/plan' : '');
  var blocks = secs.map(function(t, k){
    return '<button class="blk ' + (k === i0 ? 'on' : '') + '" onclick="go(\'' + base +
      (isPlan ? '/' : '/b') + (k + 1) + '\')">' + esc(t) + '</button>';
  }).join('');

  var body = '<div class="blkbody"><h3 class="blkh">' + esc(secs[i0]) + '</h3>' +
    fns[i0](L) + '</div>';

  var pn = '<div class="blknav">' +
    (i0 > 0 ? '<button class="mini" onclick="go(\'' + base + (isPlan ? '/' : '/b') + i0 +
      '\')">← 上一块</button>' : '<span></span>') +
    '<span class="blkpos">' + (i0 + 1) + ' / ' + n + '</span>' +
    (i0 < n - 1 ? '<button class="mini" onclick="go(\'' + base + (isPlan ? '/' : '/b') +
      (i0 + 2) + '\')">下一块 →</button>' : '<span></span>') + '</div>';

  return '<button class="back" onclick="go(\'' + lvId + '\')">← 返回 ' + esc(lv.name) +
    ' 课程板块</button>' +
    '<div class="lhead"><span class="lno">第 ' + L.no + ' 课</span>' +
    '<span class="lstg">' + esc(L.stageZh) + '</span></div>' +
    '<h1 class="ltitle">' + esc(L.titleZh) + '</h1>' +
    '<p class="sub">' + esc(L.titleVi) + '</p>' +
    '<div class="tabs">' +
    '<button class="tab ' + (isPlan ? '' : 'on') + '" onclick="go(\'' + lvId + '/' + lid +
      '\')">学员课本</button>' +
    '<button class="tab ' + (isPlan ? 'on' : '') + '" onclick="go(\'' + lvId + '/' + lid +
      '/plan\')">教师教案</button>' +
    '<button class="prt" onclick="window.print()">打印本课</button>' +
    '</div>' +
    '<div class="blkbar">' + blocks + '</div>' + body + pn + nav + printAll(L);
}

/* ---------- 路由 ---------- */
function route(){
  var h = location.hash.replace(/^#\/?/, '');
  var p = h.split('/').filter(Boolean);
  var el = document.getElementById('app');
  if (!p.length) {
    el.innerHTML = renderHome();
  } else if (p.length === 1) {
    el.innerHTML = renderLevel(p[0], null);
  } else if (/^s\d+$/.test(p[1])) {
    el.innerHTML = renderLevel(p[0], p[1]);
  } else {
    var tab = 'book', blk = 1;
    if (p[2] === 'plan') { tab = 'plan'; blk = parseInt(p[3] || '1', 10) || 1; }
    else if (p[2] && /^b\d+$/.test(p[2])) { blk = parseInt(p[2].slice(1), 10) || 1; }
    el.innerHTML = renderLesson(p[0], p[1], tab, blk);
  }
  window.scrollTo(0, 0);
}

/* ---------- 云端内容（Firestore REST，可选） ----------
   页面本身依然零依赖、可离线。FSCONF 为空时下面这一整段不生效。
   有配置时：联网就用云端内容覆盖内嵌副本；读不到（断网、file:// 被 CORS 拦、
   规则没生效…）就静默退回内嵌副本，页面照常能用。
   刻意不引 Firebase JS SDK —— 只用 fetch 打 REST，保住「单文件零依赖」这个性质。 */
var FS = FSCONF ? { pid: FSCONF.pid, key: FSCONF.key, state: 'idle', n: 0, msg: '' } : null;

function fsDec(v){
  if (v === null || v === undefined) return null;
  if ('nullValue' in v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsDec);
  if ('mapValue' in v) return fsDecFields(v.mapValue.fields || {});
  return undefined;
}
function fsDecFields(f){
  var o = {}, k;
  for (k in f) { if (Object.prototype.hasOwnProperty.call(f, k)) o[k] = fsDec(f[k]); }
  return o;
}
function fsPaint(){
  if (!FS) return;
  var d = document.getElementById('fsdot'), t = document.getElementById('fstxt');
  if (d) d.className = 'fsdot ' + FS.state;
  if (t) t.textContent =
    FS.state === 'online' ? ('云端 · ' + FS.n + ' 课') :
    FS.state === 'syncing' ? '读取中' :
    FS.state === 'offline' ? '离线' : '…';
  var w = document.querySelector('.fswrap');
  if (w) w.title = FS.msg;
}
function cloudSync(){
  if (!FS) return;
  if (typeof fetch !== 'function') {
    FS.state = 'offline'; FS.msg = '当前环境不支持 fetch'; return fsPaint();
  }
  FS.state = 'syncing'; fsPaint();
  var base = 'https://firestore.googleapis.com/v1/projects/' + FS.pid +
             '/databases/(default)/documents';
  var q = '?key=' + encodeURIComponent(FS.key);
  Promise.all([
    fetch(base + '/lessons?pageSize=300' + q).then(function(r){
      if (!r.ok) throw new Error('lessons HTTP ' + r.status);
      return r.json();
    }),
    fetch(base + '/meta/curriculum' + q).then(function(r){
      return r.ok ? r.json() : null;
    }).catch(function(){ return null; })
  ]).then(function(res){
    var docs = (res[0] && res[0].documents) || [];
    if (!docs.length) throw new Error('云端 lessons 为空');
    var n = 0;
    docs.forEach(function(d){
      var o = fsDecFields(d.fields || {});
      if (!o.lv || !o.id) return;
      DATA.lessons[o.lv + '/' + o.id] = o;
      n++;
    });
    var m = (res[1] && res[1].fields) ? fsDecFields(res[1].fields) : null;
    if (m) {
      if (m.levels && m.levels.length) DATA.levels = m.levels;
      if (m.stages && m.stages.length) DATA.stages = m.stages;
      if (m.stageLessons) DATA.stageLessons = m.stageLessons;
    }
    FS.n = n; FS.state = 'online';
    FS.msg = '已用云端内容覆盖内嵌副本（' + n + ' 课）。点此重新拉取。';
    route(); fsPaint();
  }).catch(function(e){
    FS.state = 'offline';
    FS.msg = '云端读取失败，正在使用内嵌副本：' + e.message + '。点此重试。';
    fsPaint();
  });
}

route();
window.addEventListener('hashchange', route);
cloudSync();

</script>
