    {title:"L42 虚词与方位", id:"l42", html:"<h1>L42 · 虚词与方位</h1>\n<p class=\"sub\">第六阶段 · 虚词与语法　|　Hư từ và vị trí</p>\n<div class=\"lead\"><b>本课目标：</b>系统整理最常用的虚词</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">的</td><td class=\"pyc\">de</td><td class=\"hv\">đích</td><td>của; ~(hậu tố sở hữu)；(dùng sau định ngữ)</td><td class=\"hint\">助词 / 名词</td></tr><tr><td class=\"hz\">了</td><td class=\"pyc\">le</td><td class=\"hv\">liễu</td><td>—</td><td class=\"hint\">语气词 / 助词</td></tr><tr><td class=\"hz\">着</td><td class=\"pyc\">zhe</td><td class=\"hv\">trước</td><td>trợ từ thể hiện hành động đang diễ</td><td class=\"hint\">助词 / 动词</td></tr><tr><td class=\"hz\">过</td><td class=\"pyc\">guò</td><td class=\"hv\">quá</td><td>băng qua；đi qua</td><td class=\"hint\">助词 / 动词</td></tr><tr><td class=\"hz\">地</td><td class=\"pyc\">de</td><td class=\"hv\">địa</td><td>trợ từ kết cấu: dùng trước động từ</td><td class=\"hint\">助词 / 名词</td></tr><tr><td class=\"hz\">吧</td><td class=\"pyc\">ba</td><td class=\"hv\">ba</td><td>phải không?；được chứ?</td><td class=\"hint\">语气词</td></tr><tr><td class=\"hz\">吗</td><td class=\"pyc\">ma</td><td class=\"hv\">ma</td><td>—</td><td class=\"hint\">语气词</td></tr><tr><td class=\"hz\">呢</td><td class=\"pyc\">ne</td><td class=\"hv\">ni</td><td>trợ từ chỉ rằng câu hỏi được hỏi t；trợ từ để hỏi về địa điểm</td><td class=\"hint\">语气词</td></tr><tr><td class=\"hz\">们</td><td class=\"pyc\">men</td><td class=\"hv\">môn</td><td>dùng để chỉ số nhiều cho đại từ và</td><td class=\"hint\">后缀</td></tr><tr><td class=\"hz\">车上</td><td class=\"pyc\">chē shàng</td><td class=\"hv\">xa thượng</td><td>trên xe</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">地上</td><td class=\"pyc\">dì shang</td><td class=\"hv\">địa thượng</td><td>trên mặt đất；trên sàn nhà</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">马路</td><td class=\"pyc\">mǎ lù</td><td class=\"hv\">mã lộ</td><td>đường phố；đường</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「的」表示所属</p><p class=\"gfm\">人 / 名词 + 的 + 名词</p><p class=\"gnote\">「的」连接修饰语和被修饰语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这是我的书。</p><p class=\"py\">zhè shì wǒ de shū。</p><p class=\"vi\">Đây là sách của tôi.</p></div><div class=\"gex\"><p class=\"zh\">他的手机很新。</p><p class=\"py\">tā de shǒu jī hěn xīn。</p><p class=\"vi\">Điện thoại của anh ấy rất mới.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「了」表示完成或变化</p><p class=\"gfm\">动词 + 了　｜　形容词 + 了</p><p class=\"gnote\">「了」表示完成，不表示过去。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我吃饭了。</p><p class=\"py\">wǒ chī fàn le。</p><p class=\"vi\">Tôi ăn cơm rồi.</p></div><div class=\"gex\"><p class=\"zh\">我饿了。</p><p class=\"py\">wǒ è le。</p><p class=\"vi\">Tôi đói rồi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 「着」表示持续，「过」表示经历</p><p class=\"gfm\">动词 + 着（持续）　｜　动词 + 过（经历过）</p><p class=\"gnote\">「着」是状态持续，「过」是曾经发生过。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他坐着看书。</p><p class=\"py\">tā zuò zhe kàn shū。</p><p class=\"vi\">Anh ấy ngồi đọc sách.</p></div><div class=\"gex\"><p class=\"zh\">我去过北京。</p><p class=\"py\">wǒ qù guò Běi jīng。</p><p class=\"vi\">Tôi đã từng đến Bắc Kinh.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">4. 语气词「吗 / 呢 / 吧」</p><p class=\"gfm\">吗（疑问）　｜　呢（追问）　｜　吧（建议、推测）</p><p class=\"gnote\">放在句末，不改变句子的基本结构。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你吃了吗？</p><p class=\"py\">nǐ chī le ma？</p><p class=\"vi\">Bạn ăn chưa?</p></div><div class=\"gex\"><p class=\"zh\">我很好，你呢？</p><p class=\"py\">wǒ hěn hǎo， nǐ ne？</p><p class=\"vi\">Tôi khỏe, còn bạn?</p></div><div class=\"gex\"><p class=\"zh\">我们走吧。</p><p class=\"py\">wǒ men zǒu ba。</p><p class=\"vi\">Chúng ta đi thôi.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我的书。</p><p class=\"py\">zhè shì wǒ de shū。</p><p class=\"vi\">Đây là sách của tôi.</p></div><div class=\"sent\"><p class=\"zh\">我吃饭了。</p><p class=\"py\">wǒ chī fàn le。</p><p class=\"vi\">Tôi ăn cơm rồi.</p></div><div class=\"sent\"><p class=\"zh\">他坐着看书。</p><p class=\"py\">tā zuò zhe kàn shū。</p><p class=\"vi\">Anh ấy ngồi đọc sách.</p></div><div class=\"sent\"><p class=\"zh\">我去过北京。</p><p class=\"py\">wǒ qù guò Běi jīng。</p><p class=\"vi\">Tôi đã từng đến Bắc Kinh.</p></div><div class=\"sent\"><p class=\"zh\">你吃了吗？</p><p class=\"py\">nǐ chī le ma？</p><p class=\"vi\">Bạn ăn chưa?</p></div><div class=\"sent\"><p class=\"zh\">我很好，你呢？</p><p class=\"py\">wǒ hěn hǎo， nǐ ne？</p><p class=\"vi\">Tôi khỏe, còn bạn?</p></div><div class=\"sent\"><p class=\"zh\">我们走吧。</p><p class=\"py\">wǒ men zǒu ba。</p><p class=\"vi\">Chúng ta đi thôi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你吃了吗？</p><p class=\"py\">nǐ chī le ma？</p><p class=\"vi\">Bạn ăn chưa?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">吃了。你呢？</p><p class=\"py\">chī le。 nǐ ne？</p><p class=\"vi\">Ăn rồi. Còn bạn?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我还没吃。</p><p class=\"py\">wǒ hái méi chī。</p><p class=\"vi\">Tôi chưa ăn.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我们一块儿去吧。</p><p class=\"py\">wǒ men yī kuàir qù ba。</p><p class=\"vi\">Chúng ta cùng đi nhé.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好。你的书在哪儿？</p><p class=\"py\">hǎo。 nǐ de shū zài nǎr？</p><p class=\"vi\">Được. Sách của bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在车上。</p><p class=\"py\">zài chē shàng。</p><p class=\"vi\">Ở trên xe.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我去过那个地方。</p><p class=\"py\">wǒ qù guò nà ge dì fāng。</p><p class=\"vi\">Tôi đã từng đến nơi đó.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我们走马路这边。</p><p class=\"py\">hǎo， wǒ men zǒu mǎ lù zhè biān。</p><p class=\"vi\">Được, chúng ta đi bên này đường.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>虚词卡：的 / 了 / 着 / 过 / 地 / 吧 / 吗 / 呢 / 们</li><li>一句话换虚词，对比意思变化</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「了」表示完成，不表示过去；「过」才表示经历</li><li>「着」表示状态持续，常与「坐、站、拿」搭配</li><li>「的 / 地 / 得」三个字读音相近，用法不同</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「的 / 了 / 着 / 过」各写一句</li><li>在 App 上完成 L42 测验与结课测验</li></ul>"}
  ]},
  {title:"八、语法点索引", id:"g8", children:[
    {title:"8.1 全部语法点", id:"gr1", html:"\n<h1>语法点索引</h1>\n<p class=\"sub\">全部 92 个语法点，按课次排列</p>\n<div class=\"lead\">用途：<b>备课前扫一遍本课语法点；复习课按索引回查；新教师按索引快速掌握全级语法骨架。</b></div>\n<table>\n  <tr><th style=\"width:10%\">课次</th><th style=\"width:38%\">语法点</th><th style=\"width:52%\">公式</th></tr>\n  <tr><td class=\"hint\">L01</td><td><b>「请」+ 动词</b></td><td class=\"fm\">请 + V</td></tr><tr><td class=\"hint\">L01</td><td><b>礼貌用语必须成对记</b></td><td class=\"fm\">谢谢 → 不客气　｜　对不起 → 没关系</td></tr><tr><td class=\"hint\">L02</td><td><b>复数加「们」</b></td><td class=\"fm\">我 → 我们　｜　你 → 你们　｜　他/她 → 他们/她们</td></tr><tr><td class=\"hint\">L02</td><td><b>「谁」提问人</b></td><td class=\"fm\">主语 + 是谁？　｜　谁 + 是 + 名词？</td></tr><tr><td class=\"hint\">L03</td><td><b>数词直接修饰名词</b></td><td class=\"fm\">数词 + 名词（人 / 岁）</td></tr><tr><td class=\"hint\">L03</td><td><b>「二」和「两」分工</b></td><td class=\"fm\">数数用「二」　｜　量词前用「两」</td></tr><tr><td class=\"hint\">L04</td><td><b>「第」+ 数词 = 序数</b></td><td class=\"fm\">第 + 数词</td></tr><tr><td class=\"hint\">L04</td><td><b>「几」提问小数量</b></td><td class=\"fm\">几 + 量词 + 名词？</td></tr><tr><td class=\"hint\">L05</td><td><b>数词 + 量词 + 名词</b></td><td class=\"fm\">数词 + 量词 + 名词</td></tr><tr><td class=\"hint\">L05</td><td><b>报时间与报钱</b></td><td class=\"fm\">几点几分　｜　多少元 / 多少块</td></tr><tr><td class=\"hint\">L06</td><td><b>单音节 + 重叠 = 称呼</b></td><td class=\"fm\">爸 → 爸爸　｜　哥 → 哥哥　｜　妹 → 妹妹</td></tr><tr><td class=\"hint\">L06</td><td><b>介绍家庭构成</b></td><td class=\"fm\">我 + 有 + 数词 + 量词 + 家人</td></tr><tr><td class=\"hint\">L07</td><td><b>指人名词 + 们 = 复数</b></td><td class=\"fm\">朋友 → 朋友们</td></tr><tr><td class=\"hint\">L07</td><td><b>「先生 / 小姐」称呼陌生人</b></td><td class=\"fm\">先生 / 小姐 + 姓（可省略）</td></tr><tr><td class=\"hint\">L08</td><td><b>「男 / 女」作定语</b></td><td class=\"fm\">男/女 + 名词</td></tr><tr><td class=\"hint\">L08</td><td><b>问姓名</b></td><td class=\"fm\">你叫什么名字？</td></tr><tr><td class=\"hint\">L09</td><td><b>「这 / 那」+ 量词 + 名词</b></td><td class=\"fm\">这 + 量词 + 名词（近）　｜　那 + 量词 + 名词（远）</td></tr><tr><td class=\"hint\">L09</td><td><b>这里 / 那里 / 哪里</b></td><td class=\"fm\">这儿（近）／ 那儿（远）／ 哪儿（疑问）</td></tr><tr><td class=\"hint\">L10</td><td><b>疑问词就位，句序不变</b></td><td class=\"fm\">什么 / 谁 / 哪儿 / 多少 / 怎么 放在要问的位置</td></tr><tr><td class=\"hint\">L10</td><td><b>「A 还是 B？」选择问</b></td><td class=\"fm\">A 还是 B？</td></tr><tr><td class=\"hint\">L10</td><td><b>正反问</b></td><td class=\"fm\">是不是 / 有没有 / 好不好</td></tr><tr><td class=\"hint\">L11</td><td><b>「是」表判断</b></td><td class=\"fm\">A 是 B　｜　否定：A 不是 B</td></tr><tr><td class=\"hint\">L11</td><td><b>「有」表拥有／存在</b></td><td class=\"fm\">A 有 B　｜　否定：A 没有 B</td></tr><tr><td class=\"hint\">L11</td><td><b>「在」表位置</b></td><td class=\"fm\">A 在 + 地点　｜　否定：A 不在 + 地点</td></tr><tr><td class=\"hint\">L12</td><td><b>「和 / 跟」连接名词</b></td><td class=\"fm\">A 和 B　｜　A 跟 B</td></tr><tr><td class=\"hint\">L12</td><td><b>「给」引出对象</b></td><td class=\"fm\">A 给 B + 东西</td></tr><tr><td class=\"hint\">L12</td><td><b>「比」比较</b></td><td class=\"fm\">A 比 B + 形容词</td></tr><tr><td class=\"hint\">L12</td><td><b>「从」引出起点</b></td><td class=\"fm\">从 + 起点 + 到 + 终点</td></tr><tr><td class=\"hint\">L13</td><td><b>时间词的位置</b></td><td class=\"fm\">主语 + 时间词 + 动词</td></tr><tr><td class=\"hint\">L13</td><td><b>「时候」的用法</b></td><td class=\"fm\">……的时候　｜　有的时候</td></tr><tr><td class=\"hint\">L14</td><td><b>年月日从大到小</b></td><td class=\"fm\">年 + 月 + 日（号）</td></tr><tr><td class=\"hint\">L14</td><td><b>「马上」表示立刻</b></td><td class=\"fm\">马上 + 动词</td></tr><tr><td class=\"hint\">L15</td><td><b>时段词 + 时间</b></td><td class=\"fm\">早上 / 上午 / 中午 / 下午 / 晚上 + 几点</td></tr><tr><td class=\"hint\">L15</td><td><b>频率副词放在动词前</b></td><td class=\"fm\">常 / 常常 / 有时候 + 动词</td></tr><tr><td class=\"hint\">L16</td><td><b>「好吃」作谓语</b></td><td class=\"fm\">名词 + 很好吃</td></tr><tr><td class=\"hint\">L16</td><td><b>「想」+ 动词</b></td><td class=\"fm\">想 + 动词</td></tr><tr><td class=\"hint\">L17</td><td><b>三餐 + 吃</b></td><td class=\"fm\">吃 + 早饭 / 午饭 / 晚饭</td></tr><tr><td class=\"hint\">L17</td><td><b>存在句「地点 + 有 + 名词」</b></td><td class=\"fm\">地点 + 有 + 名词</td></tr><tr><td class=\"hint\">L18</td><td><b>「生病了」表示状态变化</b></td><td class=\"fm\">主语 + 生病了</td></tr><tr><td class=\"hint\">L18</td><td><b>「累」作谓语</b></td><td class=\"fm\">主语 + 很累</td></tr><tr><td class=\"hint\">L19</td><td><b>「睡觉 / 起床」是固定搭配</b></td><td class=\"fm\">几点 + 睡觉 / 起床</td></tr><tr><td class=\"hint\">L19</td><td><b>「在 + 地点」表位置</b></td><td class=\"fm\">主语 + 在 + 地点</td></tr><tr><td class=\"hint\">L20</td><td><b>天气 + 形容词</b></td><td class=\"fm\">天气 + 很 + 形容词</td></tr><tr><td class=\"hint\">L20</td><td><b>「下雨了」表示天气变化</b></td><td class=\"fm\">下雨了 / 有风</td></tr><tr><td class=\"hint\">L21</td><td><b>形容词作谓语要加程度副词</b></td><td class=\"fm\">主语 + 很 + 形容词</td></tr><tr><td class=\"hint\">L21</td><td><b>反义配对</b></td><td class=\"fm\">大—小　多—少　快—慢　好—差　新—老</td></tr><tr><td class=\"hint\">L22</td><td><b>「上课 / 下课 / 放学」是动宾结构</b></td><td class=\"fm\">几点 + 上课 / 下课 / 放学</td></tr><tr><td class=\"hint\">L22</td><td><b>「有课 / 没课」</b></td><td class=\"fm\">主语 + 有课 / 没课</td></tr><tr><td class=\"hint\">L23</td><td><b>「教」和「学」是一对</b></td><td class=\"fm\">老师教 + 人 + 内容　｜　学生学 + 内容</td></tr><tr><td class=\"hint\">L23</td><td><b>「上学 / 请假 / 放假」</b></td><td class=\"fm\">上学 = 去学校　｜　请假 = 申请不上班/课　｜　放假 = 集体休息</td></tr><tr><td class=\"hint\">L24</td><td><b>「读」的多个意思</b></td><td class=\"fm\">读 + 课文（朗读）　｜　读 + 大学（上学）</td></tr><tr><td class=\"hint\">L24</td><td><b>语言名称</b></td><td class=\"fm\">汉语 / 中文 / 外语</td></tr><tr><td class=\"hint\">L25</td><td><b>「记住 / 忘记」表示结果</b></td><td class=\"fm\">记住（记住了）　｜　忘记（忘记了）</td></tr><tr><td class=\"hint\">L25</td><td><b>「考试」可作名词也可作动词</b></td><td class=\"fm\">有考试（名词）　｜　考试（动词）</td></tr><tr><td class=\"hint\">L26</td><td><b>「会」表技能，「能」表条件</b></td><td class=\"fm\">会 + 学会的技能　｜　能 + 有条件做的事</td></tr><tr><td class=\"hint\">L26</td><td><b>「觉得」引出看法</b></td><td class=\"fm\">我 + 觉得 + 句子</td></tr><tr><td class=\"hint\">L26</td><td><b>「喜欢」和「爱」</b></td><td class=\"fm\">喜欢 &lt; 爱（程度）</td></tr><tr><td class=\"hint\">L27</td><td><b>「上班 / 下班 / 开会」是动宾结构</b></td><td class=\"fm\">几点 + 上班 / 下班　｜　在 + 开会</td></tr><tr><td class=\"hint\">L27</td><td><b>「在 + 动词」表示正在进行</b></td><td class=\"fm\">在 + 动词</td></tr><tr><td class=\"hint\">L28</td><td><b>名词 + 方位词</b></td><td class=\"fm\">名词 + 上 / 下 / 里 / 外 / 前 / 后 / 左 / 右</td></tr><tr><td class=\"hint\">L28</td><td><b>「中间 / 旁边」可直接用</b></td><td class=\"fm\">在 + 名词 + 中间 / 旁边</td></tr><tr><td class=\"hint\">L29</td><td><b>方位词 + 边</b></td><td class=\"fm\">上边 / 下边 / 前边 / 后边 / 左边 / 右边</td></tr><tr><td class=\"hint\">L29</td><td><b>方向词 + 边</b></td><td class=\"fm\">东边 / 西边 / 南边 / 北边</td></tr><tr><td class=\"hint\">L30</td><td><b>四个基本方向</b></td><td class=\"fm\">东 / 西 / 南 / 北（+ 边）</td></tr><tr><td class=\"hint\">L30</td><td><b>「地方」和「地点」</b></td><td class=\"fm\">地方（泛指空间）　｜　地点（具体位置）</td></tr><tr><td class=\"hint\">L31</td><td><b>「楼上 / 楼下」指同一栋楼</b></td><td class=\"fm\">在 + 楼上 / 楼下</td></tr><tr><td class=\"hint\">L31</td><td><b>「在 + 地点 + 方位」</b></td><td class=\"fm\">在 + 地点 + 门口 / 路口 / 旁边</td></tr><tr><td class=\"hint\">L32</td><td><b>「坐 / 开 + 交通工具」</b></td><td class=\"fm\">坐 + 汽车 / 火车 / 飞机　｜　开 + 汽车</td></tr><tr><td class=\"hint\">L32</td><td><b>「上 / 下 + 车」</b></td><td class=\"fm\">上车 / 下车</td></tr><tr><td class=\"hint\">L33</td><td><b>「来」和「去」的方向</b></td><td class=\"fm\">来 = 朝说话人方向　｜　去 = 背离说话人方向</td></tr><tr><td class=\"hint\">L33</td><td><b>「进 / 出」+「来 / 去」</b></td><td class=\"fm\">进来 / 进去　｜　出来 / 出去</td></tr><tr><td class=\"hint\">L34</td><td><b>「到」表示到达</b></td><td class=\"fm\">到 + 地点（+ 了）</td></tr><tr><td class=\"hint\">L34</td><td><b>「坐 / 住 / 送」的常见搭配</b></td><td class=\"fm\">坐下　｜　住在 + 地点　｜　送 + 人 + 回家</td></tr><tr><td class=\"hint\">L35</td><td><b>「看」是动作，「看见 / 看到」是结果</b></td><td class=\"fm\">看（动作）→ 看见 / 看到（结果）</td></tr><tr><td class=\"hint\">L35</td><td><b>「好看 / 好听」作谓语</b></td><td class=\"fm\">名词 + 很好看 / 很好听</td></tr><tr><td class=\"hint\">L36</td><td><b>「说 + 语言」</b></td><td class=\"fm\">说 + 汉语 / 中文</td></tr><tr><td class=\"hint\">L36</td><td><b>「告诉 + 人 + 事」</b></td><td class=\"fm\">告诉 + 人 + 事</td></tr><tr><td class=\"hint\">L37</td><td><b>「唱 / 打 / 玩」+ 名词</b></td><td class=\"fm\">唱歌　｜　打球　｜　玩儿</td></tr><tr><td class=\"hint\">L37</td><td><b>「好玩儿」作谓语</b></td><td class=\"fm\">名词 + 很好玩儿</td></tr><tr><td class=\"hint\">L38</td><td><b>「找」和「找到」</b></td><td class=\"fm\">找（动作）→ 找到（结果）</td></tr><tr><td class=\"hint\">L38</td><td><b>「打开 / 关上」是一对反义</b></td><td class=\"fm\">打开 + 名词　｜　关上 + 名词</td></tr><tr><td class=\"hint\">L39</td><td><b>「帮」和「帮忙」</b></td><td class=\"fm\">帮 + 人　｜　帮忙（不带宾语）</td></tr><tr><td class=\"hint\">L39</td><td><b>「开 / 关」</b></td><td class=\"fm\">开 / 关 + 门 / 电脑</td></tr><tr><td class=\"hint\">L40</td><td><b>「高兴 / 生气」是心理形容词</b></td><td class=\"fm\">主语 + 很 + 高兴 / 生气</td></tr><tr><td class=\"hint\">L40</td><td><b>「最好」表示建议</b></td><td class=\"fm\">你最好 + 动词</td></tr><tr><td class=\"hint\">L41</td><td><b>程度副词阶梯</b></td><td class=\"fm\">很 &lt; 非常 &lt; 太 &lt; 最</td></tr><tr><td class=\"hint\">L41</td><td><b>「正在 / 正」表示进行</b></td><td class=\"fm\">正在 + 动词</td></tr><tr><td class=\"hint\">L41</td><td><b>「别」表示禁止，「再」表示重复</b></td><td class=\"fm\">别 + 动词　｜　再 + 动词 + 数量</td></tr><tr><td class=\"hint\">L42</td><td><b>「的」表示所属</b></td><td class=\"fm\">人 / 名词 + 的 + 名词</td></tr><tr><td class=\"hint\">L42</td><td><b>「了」表示完成或变化</b></td><td class=\"fm\">动词 + 了　｜　形容词 + 了</td></tr><tr><td class=\"hint\">L42</td><td><b>「着」表示持续，「过」表示经历</b></td><td class=\"fm\">动词 + 着（持续）　｜　动词 + 过（经历过）</td></tr><tr><td class=\"hint\">L42</td><td><b>语气词「吗 / 呢 / 吧」</b></td><td class=\"fm\">吗（疑问）　｜　呢（追问）　｜　吧（建议、推测）</td></tr>\n</table>\n"}
  ]},
  {title:"九、测验与题库", id:"g9", children:[
    {title:"9.1 分级测试（10 分钟定级）", id:"qz1", html:"\n<h1>分级测试 · 10 分钟定级</h1>\n<p class=\"sub\">判定新学员从哪一级开始，不做教学，只做分流</p>\n<div class=\"lead\"><b>目的：</b>把学员放进正确的级别，避免「零基础和学过的人同班」这种最伤留存的情况。</div>\n\n<h2>测试结构（10 分钟）</h2>\n<table>\n  <tr><th style=\"width:16%\">部分</th><th style=\"width:14%\">时长</th><th style=\"width:40%\">内容</th><th style=\"width:30%\">判定</th></tr>\n  <tr><td><b>1 听力</b></td><td>3 分钟</td><td>听 10 个词，指认图片或选中文</td><td>正确 ≥ 6 → 不是零基础</td></tr>\n  <tr><td><b>2 认词</b></td><td>4 分钟</td><td>看 20 个词，说越南语意思</td><td>正确 ≥ 15 → 可进 L2</td></tr>\n  <tr><td><b>3 问答</b></td><td>3 分钟</td><td>3 个口语问题：你叫什么名字 / 你家有几口人 / 你去过哪儿</td><td>能答 2 个 → 可进 L2</td></tr>\n</table>\n\n<h2>定级规则</h2>\n<table>\n  <tr><th style=\"width:26%\">表现</th><th style=\"width:20%\">定级</th><th style=\"width:54%\">说明</th></tr>\n  <tr><td>三部分都不达标</td><td><b>L1（零基础）</b></td><td>从 L01 开始</td></tr>\n  <tr><td>认词 ≥ 15，问答能答 2 个</td><td><b>L2</b></td><td>跳过 L1，但仍需补前 10 课的核心词</td></tr>\n  <tr><td>认词 ≥ 15 且能读短句</td><td><b>L3</b></td><td>需加试一段短文朗读</td></tr>\n</table>\n\n<div class=\"note\"><b>题库状态：</b>待建。需要 10 条听力题（配音频）+ 20 个认词题 + 3 个口语问题。\n认词题可直接从 HSK1 506 词里按频次抽取，成本低；听力题需先生成音频。</div>\n"},
    {title:"9.2 阶段测验（4 次）", id:"qz2", html:"\n<h1>阶段测验 · 每 10 课次一次</h1>\n<p class=\"sub\">共 4 次，作为升级判定依据</p>\n<div class=\"lead\"><b>目的：</b>及时发现跟不上的人，在还有救的时候干预，而不是等到结课才发现。</div>\n\n<h2>四次测验的覆盖范围</h2>\n<table>\n  <tr><th style=\"width:14%\">次序</th><th style=\"width:22%\">考完课次</th><th style=\"width:26%\">词汇范围</th><th style=\"width:38%\">重点</th></tr>\n  <tr><td><b>第 1 次</b></td><td>L10 之后</td><td>L01–L10 的词</td><td>声调、礼貌用语、数字、人称</td></tr>\n  <tr><td><b>第 2 次</b></td><td>L20 之后</td><td>L01–L20 的词</td><td>时间表达、吃喝、身体状况</td></tr>\n  <tr><td><b>第 3 次</b></td><td>L30 之后</td><td>L01–L30 的词</td><td>学习工作、方位地点</td></tr>\n  <tr><td><b>第 4 次</b></td><td>L42 之后</td><td>全部 506 词</td><td>动词、虚词、综合理解</td></tr>\n</table>\n\n<h2>每次测验的结构（100 分）</h2>\n<table>\n  <tr><th style=\"width:22%\">题型</th><th style=\"width:14%\">分值</th><th style=\"width:14%\">题量</th><th style=\"width:50%\">考查能力</th></tr>\n  <tr><td>听音选词</td><td>30 分</td><td>15 题</td><td>听力辨别（含声调区分）</td></tr>\n  <tr><td>看词选义</td><td>30 分</td><td>15 题</td><td>词汇认读</td></tr>\n  <tr><td>句子填空</td><td>20 分</td><td>10 题</td><td>语法点应用</td></tr>\n  <tr><td>朗读</td><td>20 分</td><td>5 句</td><td>发音与流利度</td></tr>\n</table>\n\n<h2>判定标准</h2>\n<table>\n  <tr><th style=\"width:24%\">总分</th><th style=\"width:24%\">判定</th><th style=\"width:52%\">处理</th></tr>\n  <tr><td>≥ 85</td><td>优秀</td><td>正常推进，可作为班级学习标兵</td></tr>\n  <tr><td>70 – 84</td><td>达标</td><td>正常推进</td></tr>\n  <tr><td>60 – 69</td><td>预警</td><td>助教安排一对一补课 1 次</td></tr>\n  <tr><td>&lt; 60</td><td>不合格</td><td>班主任约谈，评估是否重修最近 10 课</td></tr>\n</table>\n\n<div class=\"note\"><b>题库状态：</b>待建。共需 4 套 × 45 题 = 180 题。\n<b>建议生成方式：</b>听音选词从 506 词音频库自动抽题；看词选义用越南语释义做干扰项；\n句子填空可从本文件的例句里挖空。<b>这三类都能由脚本半自动生成。</b></div>\n"},
    {title:"9.3 结课测验与升级", id:"qz3", html:"\n<h1>结课测验与升级</h1>\n<p class=\"sub\">42 课结束后的总验收</p>\n<div class=\"lead\"><b>目的：</b>判定学员能否升入 L2，以及能否报考 HSK1。</div>\n\n<h2>结课测验结构（100 分，60 分钟）</h2>\n<table>\n  <tr><th style=\"width:22%\">部分</th><th style=\"width:14%\">分值</th><th style=\"width:64%\">内容</th></tr>\n  <tr><td><b>听力</b></td><td>40 分</td><td>20 题，覆盖全部 506 词</td></tr>\n  <tr><td><b>阅读</b></td><td>40 分</td><td>20 题：选词填空 + 句子理解</td></tr>\n  <tr><td><b>口语</b></td><td>20 分</td><td>朗读 5 句 + 回答 3 个问题</td></tr>\n</table>\n\n<h2>升级判定（三项全达标才升级）</h2>\n<table>\n  <tr><th style=\"width:34%\">判定项</th><th style=\"width:26%\">标准</th><th style=\"width:40%\">不达标处理</th></tr>\n  <tr><td>课次完成</td><td>42 / 42</td><td>补完剩余课次</td></tr>\n  <tr><td>出勤率</td><td>≥ 80%</td><td>补课或重修</td></tr>\n  <tr><td>阶段测验均分</td><td>≥ 70 分</td><td>重修最后 10 课次</td></tr>\n  <tr><td>结课测验</td><td>≥ 70 分</td><td>不升级，安排补考 1 次</td></tr>\n</table>\n\n<div class=\"note\"><b>与 HSK 考试的关系：</b>结课测验 70 分约对应 HSK1 及格线。\n<b>但不建议把「考过 HSK」当作唯一目标</b>——考过就忘、不能上岗是常见问题。\n结课测验里<b>口语占 20 分</b>，就是为了防止「只会做题不会说」。</div>\n"}
  ]},
  {title:"十、教师使用说明", id:"g10", children:[
    {title:"10.1 培训与备课流程", id:"tc1", html:"\n<h1>教师使用说明</h1>\n<p class=\"sub\">新助教拿到这份文件后，怎么开始</p>\n\n<h2>培训一周就能上岗</h2>\n<table>\n  <tr><th style=\"width:18%\">时间</th><th style=\"width:44%\">内容</th><th style=\"width:38%\">验收标准</th></tr>\n  <tr><td><b>第 1–2 天</b></td><td>通读本文件，掌握 42 课的语法骨架（看第八章索引最快）</td><td>能说出每课的 1 个核心语法点</td></tr>\n  <tr><td><b>第 3 天</b></td><td>背熟前 10 课的生词表与例句</td><td>抽查 20 个词，读对 ≥ 18 个</td></tr>\n  <tr><td><b>第 4 天</b></td><td>跟听 2 节老教师的课，记录六步 SOP 的实际执行</td><td>写出六步各用了多久</td></tr>\n  <tr><td><b>第 5 天</b></td><td>试讲 L01，按教案完整走一遍</td><td>六步齐备、时长误差 ≤ 5 分钟</td></tr>\n  <tr><td><b>第 6–7 天</b></td><td>试讲本阶段其余课次，接受评课</td><td>评课通过</td></tr>\n</table>\n\n<h2>备课流程（每课 20 分钟）</h2>\n<div class=\"flow\">\n  <span class=\"step\">1 看本课语法点</span><span class=\"arrow\">→</span>\n  <span class=\"step\">2 过一遍生词表</span><span class=\"arrow\">→</span>\n  <span class=\"step\">3 读例句和对话</span><span class=\"arrow\">→</span>\n  <span class=\"step\">4 看易错点</span><span class=\"arrow\">→</span>\n  <span class=\"step\">5 准备操练活动</span>\n</div>\n<div class=\"note\"><b>不要跳过第 4 步。</b>易错点是针对越南学员的发音和语法难点写的，\n提前打预防针比课上纠正省一半时间。</div>\n\n<h2>课堂执行要点</h2>\n<table>\n  <tr><th style=\"width:24%\">环节</th><th style=\"width:76%\">要点</th></tr>\n  <tr><td><b>新词导入</b></td><td>顺序固定：<b>发音 → 汉越音 → 越南语释义</b>。\n  汉越音是越南学员的记忆钩子，不要省。</td></tr>\n  <tr><td><b>句型操练</b></td><td><b>人人开口</b>。领读 → 轮读 → 纠音，不允许只听不说。</td></tr>\n  <tr><td><b>互动练习</b></td><td>直接用本课对话做角色扮演，两人一组，然后交换角色。</td></tr>\n  <tr><td><b>纠音</b></td><td>重点盯：x / s（谢 xiè 不是 sè）、zh / z（十 shí 不是 sí）、声调第三声。</td></tr>\n</table>\n\n<h2>交接规则</h2>\n<div class=\"note\">换老师时，只需交接两件事：<b>① 上到第几课次；② 本班的易错点集中在哪几条</b>。\n因为教案是固定的，新老师不需要重新学「怎么教」，只需要知道「教到哪了、学生哪里弱」。</div>\n\n<h2>打印建议</h2>\n<div class=\"note\">点右上角「打印」可直接出纸质教案。建议<b>按课次打印</b>——\n备课时只打本课那一页，不要整本打。</div>\n"}
  ]}
  ],
  hsk2: [
  {title:"一、总览", id:"hsk2-g0", children:[
    {title:"1.1 大纲总览", id:"hsk2-ov1", html:"<h1>HSK2 教学大纲 · 总览</h1>\n<div class=\"lead\">基准：<b>《国际中文教育中文水平等级标准》GF 0025—2021</b>（HSK 3.0）。\n标准用「音节 / 汉字 / 词汇 / 语法」四种语言基本要素构成<b>四维基准</b>，\n再用「言语交际能力 / 话题任务内容 / 语言量化指标」三个维度评价，\n技能上覆盖听、说、读、写、译五项。</div>\n<table>\n<tr><td>本级新词</td><td><b>751</b> 词（不含前级已学的词）</td></tr>\n<tr><td>累计词表</td><td><b>1,257</b> 词（HSK1 506 + HSK2 751）——学员文本用词上限</td></tr>\n<tr><td>课数</td><td><b>50</b> 课，每课 <b>15</b> 词</td></tr>\n<tr><td>教学单元</td><td><b>6</b> 个单元（划分依据见 1.2）</td></tr>\n<tr><td>每课课时</td><td><b>45 分钟</b>（六步固定结构，见 1.3）</td></tr>\n<tr><td>课次总数</td><td><b>57</b> 次 = 教学 50 + 单元测验 6 + 结课测验 1</td></tr>\n<tr><td>课堂总时数</td><td><b>42.75</b> 小时（37.5 小时授课 + 测验）</td></tr>\n<tr><td>周期</td><td>每周 2 次 → <b>28.5 周</b>（约 6.5 个月）</td></tr>\n<tr><td>自学时数</td><td>每课次课前预习 10 分钟 + 课后 App 复习 15 分钟 → 共约 <b>23.75</b> 小时</td></tr>\n</table>\n<div class=\"note\"><b>词量口径说明：</b>50 课 × 15 词 = 750，另加官方二级新增的「表示」1 词 = 751。官方口径 772 是词条数，见「与官方口径对齐」页。</div>\n\n<h2>词汇量口径对照</h2>\n<table>\n<tr><td>等级</td><td>官方新增</td><td>官方累计</td><td>本系统语料</td></tr>\n<tr><td><b>一级</b></td><td>500 词（本级）</td><td>累计 500</td><td>本系统实际 506 词</td></tr><tr><td><b>二级</b></td><td>772 词（本级）</td><td>累计 1,272</td><td>本系统实际 751 词（已补「表示」；官方 772 是词条数，见「与官方口径对齐」）</td></tr><tr><td><b>三级</b></td><td>973 词（本级）</td><td>累计 2,245</td><td>本系统实际 953 词</td></tr>\n</table>\n<div class=\"note\"><b>对照：HSK 2.0（旧标准，2009）</b><br>\n官方教材《HSK标准教程2》按旧标准编写：15 课，适合「学过 30–34 学时、掌握 150 个左右汉语词」的学习者，二级新增 150 词（累计 300）。<br>\n我们不用它作基准，但它的语法点序列是成熟经验，编排时作参考。差异见「待确认」页。</div>"},
    {title:"1.2 单元划分", id:"hsk2-ov2", html:"<h1>单元划分</h1>\n<div class=\"lead\">6 个单元按<b>语法功能</b>划分，不按话题。理由：二级的新词主体是虚词与抽象动词，按话题分不出可教的课；按语法功能分，每单元内部语法点同族，学员能形成体系。（一级按主题编排的缺陷已在一级「已知问题」页记录。）</div>\n<table>\n<tr><td>单元</td><td>单元名称</td><td>课数</td><td>词量</td><td>课时</td><td>单元目标</td></tr>\n<tr><td><b>一</b></td><td><b>比较与程度</b><br><span style=\"font-size:11.5px;color:var(--muted)\">So sánh và mức độ</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>能用「比」字句和程度补语比较人与事物、说明程度差异——这是二级最核心的新句式。</td></tr><tr><td><b>二</b></td><td><b>结果、完成与经历</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Kết quả, hoàn thành và trải nghiệm</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>掌握结果补语与「了 / 过」，能把动作说到「结果」和「经验」这一层——二级从「做什么」升级到「做成什么」。</td></tr><tr><td><b>三</b></td><td><b>时间、顺序与频率</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Thời gian, trình tự và tần suất</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>能把事情排到时间轴上，并按顺序说清流程——职场沟通的基础能力。</td></tr><tr><td><b>四</b></td><td><b>因果、转折与条件</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Nhân quả, chuyển ý và điều kiện</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>掌握二级全部关联词，能说清「为什么、虽然但是、如果就」——从单句进入复句，是二级的分水岭。</td></tr><tr><td><b>五</b></td><td><b>存在、方位与移动</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Tồn tại, phương vị và di chuyển</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>能描述「在哪里、有什么、往哪儿去、怎么去」——工厂与城市生活场景的高频表达。</td></tr><tr><td><b>六</b></td><td><b>职场与生活场景综合</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Tổng hợp tình huống công việc và đời sống</span></td><td>10 课</td><td>150 词</td><td>450 分钟</td><td>把前五个单元的语法点放进真实场景，能完成职场与生活的基本交际任务——这一单元是「能不能用」的验收关。</td></tr>\n</table>\n<div class=\"note\">合计：50 课 · 750 词。\n每个单元结束安排一次 45 分钟的单元测验。</div>\n\n<h2>单元与语法主线</h2>\n<table>\n<tr><td>单元</td><td>课次范围</td><td>语法主线（由浅入深）</td></tr>\n<tr><td><b>一</b></td><td class='mono'>L01–L08</td><td>A 比 B + 形容词 → 比字句扩展：数量、一点儿、得多、还/更 → A 没有 B + 形容词（否定比较） → A 跟 B 一样 / 不一样 → 程度副词：最 / 更 → 程度副词：特别 / 非常 / 真 → 程度补语：V + 得 + 形容词 → 程度补语扩展：否定式与疑问式</td></tr><tr><td><b>二</b></td><td class='mono'>L09–L16</td><td>结果补语：完 / 好 → 结果补语：到 / 见 → 结果补语：懂 / 会 / 错 → 结果补语综合与高频搭配 → 动态助词「了」：完成 → 动态助词「过」：经历 → 副词：已经 / 刚 / 才 → 副词：就 / 再 / 又</td></tr><tr><td><b>三</b></td><td class='mono'>L17–L24</td><td>时间点与时段（几点 / 多长时间） → 从…到… / 从…开始 → 「第」表示顺序与序数表达 → 时间副词：一直 / 从来 / 总是 / 有时候 → 频率表达：每、一次、多久一次 → 一边…一边… → 先…然后…最后… → 时间与顺序综合表达</td></tr><tr><td><b>四</b></td><td class='mono'>L25–L32</td><td>因为…所以… → 虽然…但是… → 但是 / 可是 / 不过（转折三兄弟） → 如果…就… → 只要…就… / 只有…才… → 不但…而且… → 或者 / 还是（选择） → 复句综合：因果 / 转折 / 条件 / 递进</td></tr><tr><td><b>五</b></td><td class='mono'>L33–L40</td><td>存现句：处所 + 有 / 是 → 方位词与「在 / 有」 → 介词：从 / 往 / 向 → 趋向补语：来 / 去 → 趋向补语扩展：上/下/进/出/回/过/起 → 动态助词「着」：状态持续 → 动词 + 着 + 动词 → 移动与方位综合</td></tr><tr><td><b>六</b></td><td class='mono'>L41–L50</td><td>兼语句：让 / 请 / 叫 / 使 → 双宾语句：给 / 送 / 教 / 问 → 连动句：去…买… / 来…帮助… → 语气助词：吧 / 呢 / 啊 → 「是…的」强调句 → 话题：工作与任务安排 → 话题：工厂与安全 → 话题：购物与服务 → 话题：健康与看病 → 综合复习与结课准备</td></tr>\n</table>"},
    {title:"1.3 一课的标准结构", id:"hsk2-ov3", html:"<h1>一课的标准结构（课时安排）</h1>\n<div class=\"lead\">每课 45 分钟固定六步（与 HSK1 相同）——骨架固定 = 备课成本低、\n换老师只需交接进度。每课 <b>1 个语法点 + 15 个配套词</b>，\n语法点决定教什么句型，配套词专门练这个句型。</div>\n<table>\n<tr><td>环节</td><td>时长</td><td>内容</td><td>负责人</td></tr>\n<tr><td><b>签到</b></td><td>2 分钟</td><td>点名、复习上节课作业</td><td>越籍助教</td></tr><tr><td><b>复习</b></td><td>5 分钟</td><td>上节课 15 词快速问答 + 1 个句型操练</td><td>越籍助教</td></tr><tr><td><b>新词导入</b></td><td>12 分钟</td><td>本课 15 个新词：读音、释义、搭配</td><td>中方讲师</td></tr><tr><td><b>句型操练</b></td><td>12 分钟</td><td>本课语法点：公式 → 例句 → 替换练习</td><td>中方讲师</td></tr><tr><td><b>互动练习</b></td><td>10 分钟</td><td>两人对话 / 情景任务，用本课词与句型</td><td>双方</td></tr><tr><td><b>小结作业</b></td><td>4 分钟</td><td>总结语法点、布置 App 作业与预习</td><td>中方讲师</td></tr>\n</table>\n\n<h2>一次完整课次的投入</h2>\n<table>\n<tr><td>课前预习（App）</td><td>10 分钟</td><td>学员自学：听音频、认生词</td></tr>\n<tr><td>课堂教学</td><td>45 分钟</td><td>上面六步</td></tr>\n<tr><td>课后复习（App）</td><td>15 分钟</td><td>FSRS 间隔重复 + 作业</td></tr>\n<tr><td><b>合计</b></td><td><b>70 分钟</b></td><td>每课次</td></tr>\n</table>\n<div class=\"note\">整级投入：57 课次 × 70 分钟 ≈ <b>66 小时</b>\n（课堂 42.75 小时 + 自学 23.75 小时）。</div>\n\n<h2>每课备课四要素</h2>\n<table>\n<tr><td>要素</td><td>说明</td><td>在哪看</td></tr>\n<tr><td>结构公式</td><td>这一课教的句型，写成可替换的公式</td><td>每课备课卡首行</td></tr>\n<tr><td>教学目标</td><td>学完能做什么（听 / 说 / 读）</td><td>每课备课卡</td></tr>\n<tr><td>前置课次</td><td>学本课之前必须先掌握哪几课</td><td>每课备课卡</td></tr>\n<tr><td>越南学员易错点</td><td>汉越对比下的高频错误</td><td>每课备课卡</td></tr>\n</table>"},
    {title:"1.4 与官方口径对齐", id:"hsk2-ov4", html:"<h1>与官方口径对齐（772 词到底差在哪）</h1>\n<div class=\"lead\">官方「772 词」是<b>词条数</b>，不是不同字的个数。官方原表把「词汇」写作 Vocabulary (Words and Phrases)，即词与短语合计。772 拆开是：764 个不同字形 + 8 个同形分列词条（倒/头/实在/得/省/老/长/面 各占 2 条）。764 个字形里又有 17 个是一级已经学过的字、在二级新增了词性（兼类），所以二级<b>真正要新学的字是 747 个</b>。</div>\n<table>\n<tr><td>官方词条数</td><td><b>772</b></td></tr>\n<tr><td>官方不同字形</td><td><b>764</b></td></tr>\n<tr><td>同形分列词条</td><td><b>8</b> 个（倒、头、实在、得、省、老、长、面 各占 2 条）</td></tr>\n<tr><td>其中一级已学的字形</td><td><b>17</b> 个（二级新增词性，即「兼类用法」）</td></tr>\n<tr><td>二级真正新字形</td><td><b>747</b> 个</td></tr>\n<tr><td>本系统收录</td><td><b>751</b> 词，覆盖 <b>744</b></td></tr>\n</table>\n<div class=\"note\"><b>结论：</b>本系统二级现有 751 词，覆盖官方 744 个字形（97.4%）。差的部分不是「22 个新词」——只有「表示」1 个是真·新词（已补），其余 20 个是：17 条「旧字新用法」（一级已学，见下表）+ 3 条官方记法与我们的差异（官方「有（一）点儿」= 我们的「有点儿/有一点儿」；官方「这时候/这时」「那时候/那时」= 我们拆成两条）。</div>\n\n<h2>这 17 个「旧字新用法」必须单独教</h2>\n<div class=\"lead\">这些字学员在一级已经学过，二级不是重新学这个字，而是学它的<b>新词性</b>。不专门讲，学员会用一级的用法硬套，说出「我两香蕉」这种句子。</div>\n<table>\n<tr><td>字</td><td>一级词性</td><td>一级义</td><td>二级词性</td><td>二级义</td><td>例</td></tr>\n<tr><td><b>会</b></td><td class='mono'>V</td><td>biết, có thể</td><td class='mono'><b>N</b></td><td>cuộc họp</td><td class='mono'>开会</td></tr><tr><td><b>下</b></td><td class='mono'>N, V</td><td>dưới, xuống</td><td class='mono'><b>Cl</b></td><td>lượng từ (一下)</td><td class='mono'>等一下</td></tr><tr><td><b>两</b></td><td class='mono'>Num</td><td>hai</td><td class='mono'><b>Cl</b></td><td>lạng (đơn vị cân)</td><td class='mono'>买两香蕉</td></tr><tr><td><b>分</b></td><td class='mono'>N, Cl</td><td>phút, phần</td><td class='mono'><b>V</b></td><td>chia, tách</td><td class='mono'>分开</td></tr><tr><td><b>回</b></td><td class='mono'>V</td><td>trở về</td><td class='mono'><b>Cl</b></td><td>lần</td><td class='mono'>去过一回</td></tr><tr><td><b>多</b></td><td class='mono'>A, Pron</td><td>nhiều</td><td class='mono'><b>Adv</b></td><td>biết bao</td><td class='mono'>多好</td></tr><tr><td><b>好</b></td><td class='mono'>A</td><td>tốt</td><td class='mono'><b>Adv</b></td><td>rất (好久)</td><td class='mono'>好久不见</td></tr><tr><td><b>家</b></td><td class='mono'>N, Cl</td><td>nhà</td><td class='mono'><b>Suf</b></td><td>hậu tố nghề</td><td class='mono'>科学家</td></tr><tr><td><b>对</b></td><td class='mono'>A</td><td>đúng</td><td class='mono'><b>Prep, V</b></td><td>đối với, với</td><td class='mono'>对我说</td></tr><tr><td><b>小</b></td><td class='mono'>A</td><td>nhỏ</td><td class='mono'><b>Pref</b></td><td>tiền tố thân mật</td><td class='mono'>小王</td></tr><tr><td><b>站</b></td><td class='mono'>N</td><td>trạm, ga</td><td class='mono'><b>V</b></td><td>đứng</td><td class='mono'>站起来</td></tr><tr><td><b>等</b></td><td class='mono'>V</td><td>đợi</td><td class='mono'><b>Part, N</b></td><td>v.v., vân vân</td><td class='mono'>苹果、香蕉等</td></tr><tr><td><b>老</b></td><td class='mono'>A</td><td>già</td><td class='mono'><b>Adv, Pref</b></td><td>cứ, luôn / Lão</td><td class='mono'>老是迟到 / 老王</td></tr><tr><td><b>花</b></td><td class='mono'>N</td><td>hoa</td><td class='mono'><b>V</b></td><td>tiêu (tiền)</td><td class='mono'>花钱</td></tr><tr><td><b>过</b></td><td class='mono'>V</td><td>đi qua</td><td class='mono'><b>Part</b></td><td>trợ từ thể nghiệm</td><td class='mono'>吃过</td></tr><tr><td><b>那</b></td><td class='mono'>Pron</td><td>đó, kia</td><td class='mono'><b>Conj</b></td><td>thế thì</td><td class='mono'>那么</td></tr><tr><td><b>一会儿</b></td><td class='mono'>Other</td><td>một lát</td><td class='mono'><b>Adv</b></td><td>một lát nữa</td><td class='mono'>一会儿就来</td></tr>\n</table>\n\n<h2>其余差异（官方记法 vs 本系统）</h2>\n<table>\n<tr><td>官方写法</td><td>本系统写法</td><td>性质</td></tr>\n<tr><td class='mono'>有（一）点儿</td><td class='mono'>有点儿 / 有一点儿</td><td>官方收一条，我们拆成两条同义写法</td></tr><tr><td class='mono'>这时候/这时</td><td class='mono'>这时候 / 这时</td><td>官方一条内用斜杠并列两种形式</td></tr><tr><td class='mono'>那时候/那时</td><td class='mono'>那时候 / 那时</td><td>同上</td></tr>\n<tr><td>—</td><td class=\"mono\">称、面、这时、那时 等 9 个</td>\n<td>本系统多出，多为社区整理版增补，不影响教学</td></tr>\n</table>\n<div class=\"note\">核对数据：<b>build/official-hsk3.json</b>（官方一至三级词表）；\n核对脚本：<b>build/17_sync_official_vocab.py</b>。随时可重跑复核。</div>"},
    {title:"1.5 待办与风险", id:"hsk2-ov5", html:"<h1>待办与风险</h1>\n<h2>待办清单</h2>\n<table><tr><td>事项</td><td>内容</td><td>状态</td></tr><tr><td>逐课挑词</td><td>从 751 词里为 50 课各挑 15 个词，要求能练该课语法点（已分配 8 课：单元一；单元二~六待分配）</td><td>进行中</td></tr><tr><td>写教案</td><td>每课 7 段：本课目标 / 语法点 / 例句 / 对话 / 课堂操练 / 易错点 / 作业（已写 8 课：单元一 L01–L08）</td><td>进行中</td></tr><tr><td>校订越南语</td><td>751 条释义逐条改对（词典原值常取到姓氏或罕用义）</td><td>未开始</td></tr><tr><td>扩展校验脚本</td><td>06 已改为累计词表口径（HSK1 506 + HSK2 751 = 1,257 词），并新增「本课词表覆盖率」「提前用词」两项体检</td><td>已完成</td></tr><tr><td>扩展拼音脚本</td><td>04 加载 HSK2 权威拼音（现在只加载 HSK1 的 506 条）</td><td>未开始</td></tr><tr><td>音频</td><td>HSK2 新词 751 个 mp3（沿用 edge-tts + zh-CN-XiaoxiaoNeural）</td><td>未开始</td></tr><tr><td>官方词表核对</td><td>官方词表已落成 build/official-hsk3.json，核对脚本 build/17</td><td>已完成</td></tr></table>\n<h2>风险与需要确认的事</h2>\n<table><tr><td>事项</td><td>说明</td></tr><tr><td><b>官方教材语言点序列</b></td><td>《HSK标准教程2》的 15 课语言点序列在公开渠道拿不到完整版（付费墙）。本方案的语法主线是依据标准二级语法范围整理的，方向一致但<b>不是逐条对应官方教材</b>。若必须逐条对应，需要提供教材或教学大纲原文，我按它重排。</td></tr><tr><td><b>词量口径（已查明，非缺口）</b></td><td>官方二级 772 是<b>词条数</b>不是字形数：772 = 764 个字形 + 8 个同形分列词条。其中 17 个字形是一级已学、二级新增词性的「兼类用法」，真正新字形 747 个。本系统已补唯一缺失的真·新词「表示」，现有 751 词，覆盖官方 744 个字形（97.4%）。剩余 20 个差异全部是「旧字新用法」（见对齐页表格）与官方记法差异，不是缺词。</td></tr><tr><td><b>15 词/课的密度</b></td><td>二级学员已有 506 词基础，15 词/课可行。Tony 已决定：先按 15 词/课推进，若学员跟不上再自行下调（降到 12 词/课 → 课数 63、周期 31.5 周）。</td></tr><tr><td><b>越南语释义质量</b></td><td>词典对多义词取第一义项，错例多（才→khả năng、药→鸢尾叶、故事→旧习俗、向/万/红→姓氏）。必须在写教案时逐条改对，否则会把错误教给学员。</td></tr></table>"}
  ]},
  {title:"二、单元一 比较与程度", id:"hsk2-g1", children:[
    {title:"✓ L01 A 比 B + 形容词", id:"hsk2-l01", html:"<h1>L01 · A 比 B + 形容词</h1>\n<div class=\"lead\">掌握比字句基本结构，能比较两件事物</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A + 比 + B + 形容词</b></td></tr>\n<tr><td>教学目标</td><td>掌握比字句基本结构，能比较两件事物</td></tr>\n<tr><td>Tiếng Việt</td><td>Cấu trúc câu so sánh với 比</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;hơn&quot; 放在形容词后（Tôi cao hơn bạn），学员会直译成「我高比你」；必须建立「比」在形容词前的语序。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">便宜</td><td class=\"pyc\">pián yi</td><td class=\"hv\">tiện nghi</td><td>rẻ; không đắt；lợi ích nhỏ</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">漂亮</td><td class=\"pyc\">piào liang</td><td class=\"hv\">phiêu lượng</td><td>xinh đẹp; đẹp</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">年轻</td><td class=\"pyc\">nián qīng</td><td class=\"hv\">niên khinh</td><td>trẻ</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">舒服</td><td class=\"pyc\">shū fu</td><td class=\"hv\">thư phục</td><td>thoải mái；cảm thấy khỏe</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">安静</td><td class=\"pyc\">ān jìng</td><td class=\"hv\">an tĩnh</td><td>yên tĩnh；bình yên</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">快乐</td><td class=\"pyc\">kuài lè</td><td class=\"hv\">khoái nhạc</td><td>vui vẻ; hạnh phúc</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">开心</td><td class=\"pyc\">kāi xīn</td><td class=\"hv\">khai tâm</td><td>cảm thấy vui；vui mừng</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">健康</td><td class=\"pyc\">jiàn kāng</td><td class=\"hv\">kiện khang</td><td>sức khỏe；khỏe mạnh</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">顺利</td><td class=\"pyc\">shùn lì</td><td class=\"hv\">thuận lợi</td><td>suôn sẻ; thuận lợi；không gặp trở ngại</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">方便</td><td class=\"pyc\">fāng biàn</td><td class=\"hv\">phương tiện</td><td>tiện lợi; thích hợp；tạo điều kiện; làm cho dễ dàng</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">清楚</td><td class=\"pyc\">qīng chu</td><td class=\"hv\">thanh sở</td><td>rõ ràng；minh bạch</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">短</td><td class=\"pyc\">duǎn</td><td class=\"hv\">đoản</td><td>ngắn；gọn</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">低</td><td class=\"pyc\">dī</td><td class=\"hv\">đê</td><td>thấp；bên dưới</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">近</td><td class=\"pyc\">jìn</td><td class=\"hv\">cận</td><td>gần；sát</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">长</td><td class=\"pyc\">cháng</td><td class=\"hv\">trường</td><td>chiều dài；dài</td><td class=\"hint\">形容词 / 动词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「比」字句比较两个人和事物，说清谁高谁低、哪个好哪个便宜</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「比」放在形容词前面</p><p class=\"gfm\">A + 比 + B + 形容词</p><p class=\"gnote\">越南语的 &quot;hơn&quot; 放在形容词<b>后面</b>（Tôi cao hơn bạn ＝ 我高比你），汉语的「比」必须放在形容词<b>前面</b>。这是本课要钉死的第一条语序，学员一放松就会按越南语说成「我高比你」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我比他高。</p><p class=\"py\">wǒ bǐ tā gāo。</p><p class=\"vi\">Tôi cao hơn anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这个比那个好。</p><p class=\"py\">zhè ge bǐ nà ge hǎo。</p><p class=\"vi\">Cái này tốt hơn cái kia.</p></div><div class=\"gex\"><p class=\"zh\">今天比昨天热。</p><p class=\"py\">jīn tiān bǐ zuó tiān rè。</p><p class=\"vi\">Hôm nay nóng hơn hôm qua.</p></div><div class=\"gex\"><p class=\"zh\">这个比那个短，那个比这个长。</p><p class=\"py\">zhè ge bǐ nà ge duǎn， nà ge bǐ zhè ge zhǎng。</p><p class=\"vi\">Cái này ngắn hơn cái kia, cái kia dài hơn cái này.</p></div><div class=\"gex\"><p class=\"zh\">这个字比那个清楚。</p><p class=\"py\">zhè ge zì bǐ nà ge qīng chǔ。</p><p class=\"vi\">Chữ này rõ hơn chữ kia.</p></div><div class=\"gex\"><p class=\"zh\">他的桌子比我的低。</p><p class=\"py\">tā de zhuō zi bǐ wǒ de dī。</p><p class=\"vi\">Bàn của anh ấy thấp hơn bàn của tôi.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「比」字句里不能用「很」</p><p class=\"gfm\">A 比 B + 形容词（×很 ×非常 ×太）</p><p class=\"gnote\">「他比我很高」是错的。要比出程度，用「更」「还」或程度补语，就是不能用「很」「非常」「太」——「比」本身已经含了「更」的意思。这是二级最高频的错误之一。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他比我高。</p><p class=\"py\">tā bǐ wǒ gāo。</p><p class=\"vi\">Anh ấy cao hơn tôi.</p></div><div class=\"gex\"><p class=\"zh\">这个比那个便宜。</p><p class=\"py\">zhè ge bǐ nà ge pián yi。</p><p class=\"vi\">Cái này rẻ hơn cái kia.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 「比」字句的否定：不比</p><p class=\"gfm\">A + 不比 + B + 形容词</p><p class=\"gnote\">「不比」的意思是「不一定比……」。它和下一课的「没有」不同：「我不比他高」可能一样高，「我没有他高」是我确实矮。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我不比他高。</p><p class=\"py\">wǒ bù bǐ tā gāo。</p><p class=\"vi\">Tôi không cao hơn anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这个不比那个贵。</p><p class=\"py\">zhè ge bù bǐ nà ge guì。</p><p class=\"vi\">Cái này không đắt hơn cái kia.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我比他高。</p><p class=\"py\">wǒ bǐ tā gāo。</p><p class=\"vi\">Tôi cao hơn anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">这个比那个便宜。</p><p class=\"py\">zhè ge bǐ nà ge pián yi。</p><p class=\"vi\">Cái này rẻ hơn cái kia.</p></div><div class=\"sent\"><p class=\"zh\">今天比昨天热。</p><p class=\"py\">jīn tiān bǐ zuó tiān rè。</p><p class=\"vi\">Hôm nay nóng hơn hôm qua.</p></div><div class=\"sent\"><p class=\"zh\">他比我年轻。</p><p class=\"py\">tā bǐ wǒ nián qīng。</p><p class=\"vi\">Anh ấy trẻ hơn tôi.</p></div><div class=\"sent\"><p class=\"zh\">这里的菜比那里的好吃。</p><p class=\"py\">zhè lǐ de cài bǐ nà li de hǎo chī。</p><p class=\"vi\">Món ăn ở đây ngon hơn ở kia.</p></div><div class=\"sent\"><p class=\"zh\">他的房间比我的安静。</p><p class=\"py\">tā de fáng jiān bǐ wǒ de ān jìng。</p><p class=\"vi\">Phòng của anh ấy yên tĩnh hơn phòng tôi.</p></div><div class=\"sent\"><p class=\"zh\">学校比商店近。</p><p class=\"py\">xué xiào bǐ shāng diàn jìn。</p><p class=\"vi\">Trường học gần hơn cửa hàng.</p></div><div class=\"sent\"><p class=\"zh\">她比我漂亮。</p><p class=\"py\">tā bǐ wǒ piào liàng。</p><p class=\"vi\">Cô ấy xinh hơn tôi.</p></div><div class=\"sent\"><p class=\"zh\">这个房间比那个舒服。</p><p class=\"py\">zhè ge fáng jiān bǐ nà ge shū fú。</p><p class=\"vi\">Phòng này thoải mái hơn phòng kia.</p></div><div class=\"sent\"><p class=\"zh\">他比我健康。</p><p class=\"py\">tā bǐ wǒ jiàn kāng。</p><p class=\"vi\">Anh ấy khỏe hơn tôi.</p></div><div class=\"sent\"><p class=\"zh\">我的工作比去年顺利。</p><p class=\"py\">wǒ de gōng zuò bǐ qù nián shùn lì。</p><p class=\"vi\">Công việc của tôi thuận lợi hơn năm ngoái.</p></div><div class=\"sent\"><p class=\"zh\">坐车比走路方便。</p><p class=\"py\">zuò chē bǐ zǒu lù fāng biàn。</p><p class=\"vi\">Đi xe tiện hơn đi bộ.</p></div><div class=\"sent\"><p class=\"zh\">他今天很快乐。</p><p class=\"py\">tā jīn tiān hěn kuài lè。</p><p class=\"vi\">Hôm nay anh ấy rất vui.</p></div><div class=\"sent\"><p class=\"zh\">我今天很开心。</p><p class=\"py\">wǒ jīn tiān hěn kāi xīn。</p><p class=\"vi\">Hôm nay tôi rất vui.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这两个房间，哪个好？</p><p class=\"py\">zhè liǎng gè fáng jiān， nǎ ge hǎo？</p><p class=\"vi\">Hai phòng này, phòng nào tốt?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这个好。这个比那个大。</p><p class=\"py\">zhè ge hǎo。 zhè ge bǐ nà ge dà。</p><p class=\"vi\">Phòng này tốt. Phòng này lớn hơn phòng kia.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这个贵吗？</p><p class=\"py\">zhè ge guì ma？</p><p class=\"vi\">Phòng này đắt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不贵，这个比那个便宜。</p><p class=\"py\">bù guì， zhè ge bǐ nà ge pián yi。</p><p class=\"vi\">Không đắt, phòng này rẻ hơn phòng kia.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个安静吗？</p><p class=\"py\">nà ge ān jìng ma？</p><p class=\"vi\">Phòng kia có yên tĩnh không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很安静。那个比这个安静。</p><p class=\"py\">hěn ān jìng。 nà ge bǐ zhè ge ān jìng。</p><p class=\"vi\">Rất yên tĩnh. Phòng kia yên tĩnh hơn phòng này.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那我们要哪个？</p><p class=\"py\">nà wǒ men yào nǎ ge？</p><p class=\"vi\">Vậy chúng ta lấy phòng nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">要这个吧。这个好，也便宜。</p><p class=\"py\">yào zhè ge ba。 zhè ge hǎo， yě pián yi。</p><p class=\"vi\">Lấy phòng này đi. Phòng này tốt, cũng rẻ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，就这个。</p><p class=\"py\">hǎo， jiù zhè ge。</p><p class=\"vi\">Được, chính phòng này.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>两人一组，用「A 比 B + 形容词」比较教室里看得见的十样东西（桌子、书、手机、门……）</li><li>句型替换：老师给形容词「高/大/便宜/近/长/舒服/漂亮/健康」，学员逐个造句</li><li>纠错操练：老师故意说「我高比他」「他比我很高」，学员听出并改对</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>越南语 &quot;hơn&quot; 在形容词后，学员会直译成「我高比他」；「比」必须钉在形容词前</li><li>「比」字句里加「很/非常/太」是最高频错误，必须反复纠</li><li>「比」读 bǐ（第三声），越南学员易读成 bì（第四声）</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L01 十五个形容词的听读</li><li>用「比」写 5 个句子，比较家人或家里的东西</li></ul>"},
    {title:"✓ L02 比字句扩展：数量、一点儿、得多、还/更", id:"hsk2-l02", html:"<h1>L02 · 比字句扩展：数量、一点儿、得多、还/更</h1>\n<div class=\"lead\">能说明差多少、差得多不多</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A + 比 + B + 形容词 + 一点儿 / 得多 / 数量词</b></td></tr>\n<tr><td>教学目标</td><td>能说明差多少、差得多不多</td></tr>\n<tr><td>Tiếng Việt</td><td>Mở rộng câu 比: số lượng, 一点儿, 得多</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「一点儿」和「得多」都放在形容词<b>后面</b>，学员受越南语影响容易前置；「得多」不能说成「很得多」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">得</td><td class=\"pyc\">de</td><td class=\"hv\">đắc</td><td>trợ từ kết cấu: dùng sau động từ</td><td class=\"hint\">助词 / 动词</td></tr><tr><td class=\"hz\">差不多</td><td class=\"pyc\">chà bu duō</td><td class=\"hv\">sai bất đa</td><td>gần；suýt nữa</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">一般</td><td class=\"pyc\">yī bān</td><td class=\"hv\">nhất bàn</td><td>giống nhau; bằng nhau；bình thường; thông thường</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">同样</td><td class=\"pyc\">tóng yàng</td><td class=\"hv\">đồng dạng</td><td>giống nhau; bằng nhau; tương tự；tương tự; cũng; nữa</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">好像</td><td class=\"pyc\">hǎo xiàng</td><td class=\"hv\">hảo tượng</td><td>như thể；giống như</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">不如</td><td class=\"pyc\">bù rú</td><td class=\"hv\">bất như</td><td>không bằng；sẽ tốt hơn nếu</td><td class=\"hint\">动词 / 连词</td></tr><tr><td class=\"hz\">不一定</td><td class=\"pyc\">bù yī dìng</td><td class=\"hv\">bất nhất định</td><td>không nhất thiết；có thể</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">许多</td><td class=\"pyc\">xǔ duō</td><td class=\"hv\">hứa đa</td><td>nhiều；rất nhiều</td><td class=\"hint\">数词</td></tr><tr><td class=\"hz\">完全</td><td class=\"pyc\">wán quán</td><td class=\"hv\">hoàn toàn</td><td>hoàn chỉnh; toàn bộ；hoàn toàn; toàn diện</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">够</td><td class=\"pyc\">gòu</td><td class=\"hv\">cú</td><td>đủ (đầy đủ)；đủ (quá nhiều)</td><td class=\"hint\">动词 / 副词</td></tr><tr><td class=\"hz\">挺</td><td class=\"pyc\">tǐng</td><td class=\"hv\">đĩnh</td><td>khá; rất (khẩu ngữ)；thẳng; đứng thẳng</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">更</td><td class=\"pyc\">gèng</td><td class=\"hv\">canh</td><td>hơn；còn hơn</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">满</td><td class=\"pyc\">mǎn</td><td class=\"hv\">mãn</td><td>đầy; đầy ắp；hài lòng; thỏa mãn</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">数字</td><td class=\"pyc\">shù zì</td><td class=\"hv\">sổ tự</td><td>chữ số；số</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">水平</td><td class=\"pyc\">shuǐ píng</td><td class=\"hv\">thủy bình</td><td>mức độ (thành tựu, v.v.)；tiêu chuẩn</td><td class=\"hint\">名词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「比」字句说清差多少——差三岁、差一点儿、差得多</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 差多少放在形容词后面</p><p class=\"gfm\">A 比 B + 形容词 + 数量</p><p class=\"gnote\">数量（三岁、十块）放在形容词<b>后面</b>。越南语说 &quot;lớn hơn ba tuổi&quot;，数量也在后面，这一条学员接受得快。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他比我大三岁。</p><p class=\"py\">tā bǐ wǒ dà sān suì。</p><p class=\"vi\">Anh ấy lớn hơn tôi ba tuổi.</p></div><div class=\"gex\"><p class=\"zh\">这个比那个贵十块。</p><p class=\"py\">zhè ge bǐ nà ge guì shí kuài。</p><p class=\"vi\">Cái này đắt hơn cái kia mười đồng.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 一点儿 / 得多</p><p class=\"gfm\">形容词 + 一点儿（差得少）｜形容词 + 得多（差得多）</p><p class=\"gnote\">「一点儿」表示差别很小；「得多」表示差别很大。两个都放在形容词后面。「得多」的「得」读轻声 de，不能读成 dé。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个比那个好一点儿。</p><p class=\"py\">zhè ge bǐ nà ge hǎo yī diǎnr。</p><p class=\"vi\">Cái này tốt hơn cái kia một chút.</p></div><div class=\"gex\"><p class=\"zh\">他比我高得多。</p><p class=\"py\">tā bǐ wǒ gāo dé duō。</p><p class=\"vi\">Anh ấy cao hơn tôi nhiều.</p></div><div class=\"gex\"><p class=\"zh\">他比我大许多。</p><p class=\"py\">tā bǐ wǒ dà xǔ duō。</p><p class=\"vi\">Anh ấy lớn hơn tôi nhiều.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 还 / 更 放在形容词前面</p><p class=\"gfm\">A 比 B + 还/更 + 形容词</p><p class=\"gnote\">「还」「更」放在形容词<b>前面</b>，表示程度更进一步。「他比我还高」＝ 他比我更高。注意和「一点儿」「得多」的位置正好相反：一个在前，一个在后。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他比我还高。</p><p class=\"py\">tā bǐ wǒ hái gāo。</p><p class=\"vi\">Anh ấy còn cao hơn tôi.</p></div><div class=\"gex\"><p class=\"zh\">今天比昨天更热。</p><p class=\"py\">jīn tiān bǐ zuó tiān gèng rè。</p><p class=\"vi\">Hôm nay còn nóng hơn hôm qua.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">4. 比字句之外的其他比较说法</p><p class=\"gfm\">跟…同样 + 形容词 ｜ 跟…一般 + 形容词 ｜ 好像 ｜ 不如 ｜ 不一定</p><p class=\"gnote\">「同样」「一般」相当于「一样」；「好像」是看上去像；「不如」是比不上；「不一定」是不确定。这五个词是二级高频，能替换比字句，也能和比字句连用。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我跟他同样高。</p><p class=\"py\">wǒ gēn tā tóng yàng gāo。</p><p class=\"vi\">Tôi cao bằng anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这两个东西一般大。</p><p class=\"py\">zhè liǎng gè dōng xi yī bān dà。</p><p class=\"vi\">Hai cái này to như nhau.</p></div><div class=\"gex\"><p class=\"zh\">他好像比我高。</p><p class=\"py\">tā hǎo xiàng bǐ wǒ gāo。</p><p class=\"vi\">Anh ấy hình như cao hơn tôi.</p></div><div class=\"gex\"><p class=\"zh\">我不如他。</p><p class=\"py\">wǒ bù rú tā。</p><p class=\"vi\">Tôi không bằng anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">他不一定比我高。</p><p class=\"py\">tā bù yī dìng bǐ wǒ gāo。</p><p class=\"vi\">Anh ấy chưa chắc cao hơn tôi.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他比我大三岁。</p><p class=\"py\">tā bǐ wǒ dà sān suì。</p><p class=\"vi\">Anh ấy lớn hơn tôi ba tuổi.</p></div><div class=\"sent\"><p class=\"zh\">这个比那个好一点儿。</p><p class=\"py\">zhè ge bǐ nà ge hǎo yī diǎnr。</p><p class=\"vi\">Cái này tốt hơn cái kia một chút.</p></div><div class=\"sent\"><p class=\"zh\">他比我高得多。</p><p class=\"py\">tā bǐ wǒ gāo dé duō。</p><p class=\"vi\">Anh ấy cao hơn tôi nhiều.</p></div><div class=\"sent\"><p class=\"zh\">他比我还高。</p><p class=\"py\">tā bǐ wǒ hái gāo。</p><p class=\"vi\">Anh ấy còn cao hơn tôi.</p></div><div class=\"sent\"><p class=\"zh\">今天比昨天更热。</p><p class=\"py\">jīn tiān bǐ zuó tiān gèng rè。</p><p class=\"vi\">Hôm nay còn nóng hơn hôm qua.</p></div><div class=\"sent\"><p class=\"zh\">我的汉语比去年好得多。</p><p class=\"py\">wǒ de Hàn yǔ bǐ qù nián hǎo dé duō。</p><p class=\"vi\">Tiếng Trung của tôi tốt hơn năm ngoái nhiều.</p></div><div class=\"sent\"><p class=\"zh\">这两个差不多，一样好。</p><p class=\"py\">zhè liǎng gè chà bu duō， yī yàng hǎo。</p><p class=\"vi\">Hai cái này gần như nhau, tốt như nhau.</p></div><div class=\"sent\"><p class=\"zh\">这里的菜比那里好一点儿。</p><p class=\"py\">zhè lǐ de cài bǐ nà li hǎo yī diǎnr。</p><p class=\"vi\">Món ăn ở đây ngon hơn ở kia một chút.</p></div><div class=\"sent\"><p class=\"zh\">这个数字很大。</p><p class=\"py\">zhè ge shù zì hěn dà。</p><p class=\"vi\">Con số này rất lớn.</p></div><div class=\"sent\"><p class=\"zh\">他的水平比我高。</p><p class=\"py\">tā de shuǐ píng bǐ wǒ gāo。</p><p class=\"vi\">Trình độ của anh ấy cao hơn tôi.</p></div><div class=\"sent\"><p class=\"zh\">杯子满了。</p><p class=\"py\">bēi zi mǎn le。</p><p class=\"vi\">Cái cốc đầy rồi.</p></div><div class=\"sent\"><p class=\"zh\">我完全明白。</p><p class=\"py\">wǒ wán quán míng bai。</p><p class=\"vi\">Tôi hoàn toàn hiểu.</p></div><div class=\"sent\"><p class=\"zh\">这个够好了。</p><p class=\"py\">zhè ge gòu hǎo le。</p><p class=\"vi\">Cái này đủ tốt rồi.</p></div><div class=\"sent\"><p class=\"zh\">他挺高。</p><p class=\"py\">tā tǐng gāo。</p><p class=\"vi\">Anh ấy khá cao.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你多大？</p><p class=\"py\">nǐ duō dà？</p><p class=\"vi\">Bạn bao nhiêu tuổi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我二十五岁。</p><p class=\"py\">wǒ èr shí wǔ suì。</p><p class=\"vi\">Tôi hai mươi lăm tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你弟弟呢？</p><p class=\"py\">nǐ dì di ne？</p><p class=\"vi\">Em trai bạn thì sao?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他比我小三岁。</p><p class=\"py\">tā bǐ wǒ xiǎo sān suì。</p><p class=\"vi\">Nó nhỏ hơn tôi ba tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他比你高吗？</p><p class=\"py\">tā bǐ nǐ gāo ma？</p><p class=\"vi\">Nó cao hơn bạn không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他比我还高，高得多。</p><p class=\"py\">tā bǐ wǒ hái gāo， gāo dé duō。</p><p class=\"vi\">Nó còn cao hơn tôi, cao hơn nhiều.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你们差不多高。</p><p class=\"py\">nǐ men chà bu duō gāo。</p><p class=\"vi\">Hai người gần như cao bằng nhau.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对，差不多。</p><p class=\"py\">duì， chà bu duō。</p><p class=\"vi\">Đúng, gần như nhau.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>数字操练：老师给两个数（年龄、价钱、分数），学员用「A 比 B + 形容词 + 数量」说出来</li><li>「一点儿」和「得多」对比操练：同一个形容词，学员各造一句，体会差别大小</li><li>升级操练：把「他比我高」依次升级成「他比我还高」「他比我高一点儿」「他比我高得多」，体会四种程度</li><li>替换操练：同一句分别用「同样」「一般」「好像」「不如」「不一定」说一遍</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>「得多」的「得」是轻声 de，学员易读成 dé（得到）</li><li>「一点儿」不能省成「一点」——本系统词表里只有「一点儿」这个写法</li><li>「还」在「比」字句里读 hái，不是 huán（还钱）</li><li>「不如」后面直接跟比较对象，不能加「比」：「我不如他」不说「我不如比他」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L02 十五个词的听读，重点练「得」的轻声</li><li>比较自己和一位家人：身高、年龄各写一句，用上「一点儿」和「得多」</li></ul>"},
    {title:"✓ L03 A 没有 B + 形容词（否定比较）", id:"hsk2-l03", html:"<h1>L03 · A 没有 B + 形容词（否定比较）</h1>\n<div class=\"lead\">能说「A 不如 B」，与比字句互转</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A + 没有 + B +（这么 / 那么）+ 形容词</b></td></tr>\n<tr><td>教学目标</td><td>能说「A 不如 B」，与比字句互转</td></tr>\n<tr><td>Tiếng Việt</td><td>Phủ định so sánh: A 没有 B + tính từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">否定比较用「没有」，不用「不比」；「这么 / 那么」可省但不可换成「很」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">不错</td><td class=\"pyc\">bù cuò</td><td class=\"hv\">bất thác</td><td>không tệ; khá tốt；đúng; chính xác</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">难看</td><td class=\"pyc\">nán kàn</td><td class=\"hv\">nan khán</td><td>xấu；xấu xí</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">难听</td><td class=\"pyc\">nán tīng</td><td class=\"hv\">nan thính</td><td>khó nghe；thô tục</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">难受</td><td class=\"pyc\">nán shòu</td><td class=\"hv\">nan thụ</td><td>cảm thấy không khỏe；chịu đau khổ</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">难过</td><td class=\"pyc\">nán guò</td><td class=\"hv\">nan quá</td><td>cảm thấy buồn；cảm thấy không khỏe</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">普通</td><td class=\"pyc\">pǔ tōng</td><td class=\"hv\">phổ thông</td><td>phổ thông；bình thường</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">正常</td><td class=\"pyc\">zhèng cháng</td><td class=\"hv\">chánh thường</td><td>bình thường；thông thường</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">科学</td><td class=\"pyc\">kē xué</td><td class=\"hv\">khoa học</td><td>khoa học；kiến thức khoa học</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">高级</td><td class=\"pyc\">gāo jí</td><td class=\"hv\">cao cấp</td><td>cấp cao；chất lượng cao</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">理想</td><td class=\"pyc\">lǐ xiǎng</td><td class=\"hv\">lý tưởng</td><td>một lý tưởng；một giấc mơ</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">准确</td><td class=\"pyc\">zhǔn què</td><td class=\"hv\">chuẩn xác</td><td>chính xác; đúng; chuẩn xác</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">熟</td><td class=\"pyc\">shú</td><td class=\"hv\">thục</td><td>chín; trưởng thành；nấu chín; xong</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">平安</td><td class=\"pyc\">píng ān</td><td class=\"hv\">bình an</td><td>bình an；khỏe mạnh</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">平等</td><td class=\"pyc\">píng děng</td><td class=\"hv\">bình đẳng</td><td>bình đẳng；sự bình đẳng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">公平</td><td class=\"pyc\">gōng píng</td><td class=\"hv\">công bình</td><td>công bằng；không thiên vị</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「没有」做否定比较，会用评价词说东西好不好</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「没有」表否定比较</p><p class=\"gfm\">A + 没有 + B + 形容词</p><p class=\"gnote\">「没有」在这里表示「A 不如 B」。形容词前<b>不能</b>加「很」。越南语 &quot;không bằng&quot; 的语序和汉语一致，这一条学员接受得快。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我没有他高。</p><p class=\"py\">wǒ méi yǒu tā gāo。</p><p class=\"vi\">Tôi không cao bằng anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这个没有那个好。</p><p class=\"py\">zhè ge méi yǒu nà ge hǎo。</p><p class=\"vi\">Cái này không tốt bằng cái kia.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「不比」和「没有」的区别</p><p class=\"gfm\">不比 ＝ 未必更…（可能一样）｜没有 ＝ 确实不如</p><p class=\"gnote\">「我不比他高」＝ 我可能跟他一样高；「我没有他高」＝ 我确实比他矮。这两个字考试常考，要能分清。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我不比他高。</p><p class=\"py\">wǒ bù bǐ tā gāo。</p><p class=\"vi\">Tôi không cao hơn anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">我没有他高。</p><p class=\"py\">wǒ méi yǒu tā gāo。</p><p class=\"vi\">Tôi không cao bằng anh ấy.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 四个评价词：不错 / 难看 / 难受 / 难过</p><p class=\"gfm\">不错 ＝ 挺好｜难看 ＝ 不好看｜难受 ＝ 身体或心里不舒服｜难过 ＝ 伤心</p><p class=\"gnote\">四个词都带「不」或「难」，学员最容易混。「不错」不是「没错」的意思，是「挺好的」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个菜不错。</p><p class=\"py\">zhè ge cài bù cuò。</p><p class=\"vi\">Món này ngon đấy.</p></div><div class=\"gex\"><p class=\"zh\">他的衣服很难看。</p><p class=\"py\">tā de yī fu hěn nán kàn。</p><p class=\"vi\">Quần áo của anh ấy xấu quá.</p></div><div class=\"gex\"><p class=\"zh\">我今天很难受。</p><p class=\"py\">wǒ jīn tiān hěn nán shòu。</p><p class=\"vi\">Hôm nay tôi rất khó chịu.</p></div><div class=\"gex\"><p class=\"zh\">她很难过。</p><p class=\"py\">tā hěn nán guò。</p><p class=\"vi\">Cô ấy rất buồn.</p></div><div class=\"gex\"><p class=\"zh\">他说话很难听。</p><p class=\"py\">tā shuō huà hěn nán tīng。</p><p class=\"vi\">Anh ấy nói chuyện rất khó nghe.</p></div><div class=\"gex\"><p class=\"zh\">这是一个普通的东西。</p><p class=\"py\">zhè shì yī gè pǔ tōng de dōng xi。</p><p class=\"vi\">Đây là một thứ bình thường.</p></div><div class=\"gex\"><p class=\"zh\">他的身体很正常。</p><p class=\"py\">tā de shēn tǐ hěn zhèng cháng。</p><p class=\"vi\">Sức khỏe của anh ấy rất bình thường.</p></div><div class=\"gex\"><p class=\"zh\">我们平等。</p><p class=\"py\">wǒ men píng děng。</p><p class=\"vi\">Chúng tôi bình đẳng.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我没有他高。</p><p class=\"py\">wǒ méi yǒu tā gāo。</p><p class=\"vi\">Tôi không cao bằng anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">这个没有那个好。</p><p class=\"py\">zhè ge méi yǒu nà ge hǎo。</p><p class=\"vi\">Cái này không tốt bằng cái kia.</p></div><div class=\"sent\"><p class=\"zh\">这里的菜没有那里的好吃。</p><p class=\"py\">zhè lǐ de cài méi yǒu nà li de hǎo chī。</p><p class=\"vi\">Món ăn ở đây không ngon bằng ở kia.</p></div><div class=\"sent\"><p class=\"zh\">这个房间没有那个房间安静。</p><p class=\"py\">zhè ge fáng jiān méi yǒu nà ge fáng jiān ān jìng。</p><p class=\"vi\">Phòng này không yên tĩnh bằng phòng kia.</p></div><div class=\"sent\"><p class=\"zh\">这个菜不错。</p><p class=\"py\">zhè ge cài bù cuò。</p><p class=\"vi\">Món này ngon đấy.</p></div><div class=\"sent\"><p class=\"zh\">他的衣服很难看。</p><p class=\"py\">tā de yī fu hěn nán kàn。</p><p class=\"vi\">Quần áo của anh ấy xấu quá.</p></div><div class=\"sent\"><p class=\"zh\">我今天很难受。</p><p class=\"py\">wǒ jīn tiān hěn nán shòu。</p><p class=\"vi\">Hôm nay tôi rất khó chịu.</p></div><div class=\"sent\"><p class=\"zh\">她很难过。</p><p class=\"py\">tā hěn nán guò。</p><p class=\"vi\">Cô ấy rất buồn.</p></div><div class=\"sent\"><p class=\"zh\">他说得很科学。</p><p class=\"py\">tā shuō dé hěn kē xué。</p><p class=\"vi\">Anh ấy nói rất khoa học.</p></div><div class=\"sent\"><p class=\"zh\">这是一家高级的饭店。</p><p class=\"py\">zhè shì yī jiā gāo jí de fàn diàn。</p><p class=\"vi\">Đây là một nhà hàng cao cấp.</p></div><div class=\"sent\"><p class=\"zh\">他的理想很好。</p><p class=\"py\">tā de lǐ xiǎng hěn hǎo。</p><p class=\"vi\">Lý tưởng của anh ấy rất tốt.</p></div><div class=\"sent\"><p class=\"zh\">这个数字很准确。</p><p class=\"py\">zhè ge shù zì hěn zhǔn què。</p><p class=\"vi\">Con số này rất chính xác.</p></div><div class=\"sent\"><p class=\"zh\">这个菜很熟。</p><p class=\"py\">zhè ge cài hěn shú。</p><p class=\"vi\">Món này chín rồi.</p></div><div class=\"sent\"><p class=\"zh\">我们都很平安。</p><p class=\"py\">wǒ men dōu hěn píng ān。</p><p class=\"vi\">Chúng tôi đều bình an.</p></div><div class=\"sent\"><p class=\"zh\">这对他不公平。</p><p class=\"py\">zhè duì tā bù gōng píng。</p><p class=\"vi\">Điều này không công bằng với anh ấy.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你看这个，好看吗？</p><p class=\"py\">nǐ kàn zhè ge， hǎo kàn ma？</p><p class=\"vi\">Bạn xem cái này, có đẹp không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不错。那个更好看。</p><p class=\"py\">bù cuò。 nà ge gèng hǎo kàn。</p><p class=\"vi\">Được đấy. Cái kia còn đẹp hơn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个贵吗？</p><p class=\"py\">nà ge guì ma？</p><p class=\"vi\">Cái kia đắt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">那个没有这个便宜。</p><p class=\"py\">nà ge méi yǒu zhè ge pián yi。</p><p class=\"vi\">Cái kia không rẻ bằng cái này.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">东西好吗？</p><p class=\"py\">dōng xi hǎo ma？</p><p class=\"vi\">Đồ có tốt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">东西不错。这个便宜。</p><p class=\"py\">dōng xi bù cuò。 zhè ge pián yi。</p><p class=\"vi\">Đồ tốt. Cái này rẻ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那我买这个吧。</p><p class=\"py\">nà wǒ mǎi zhè ge ba。</p><p class=\"vi\">Vậy tôi mua cái này.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好。</p><p class=\"py\">hǎo。</p><p class=\"vi\">Được.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>「不比 / 没有」辨析：老师给一句，学员判断说话人到底是「比对方高」还是「可能一样高」</li><li>评价词卡片操练：老师给情景（考试没考好 / 生病 / 衣服很土），学员选词造句</li><li>肯定改否定：「这个好」→「这个没有那个好」，「他比我高」→「他没有我高」</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>「没有」在比较句里不能省成「没」，书面练习要求写完整形式</li><li>「没有」后面不能加「很」：「我没有他很高兴」是错的</li><li>「不错」不等于「没错」；学员常把「不错」理解成「正确」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L03 十五个词的听读</li><li>用「没有」写 3 句否定比较，再用「不错」「难过」各写一句</li></ul>"},
    {title:"✓ L04 A 跟 B 一样 / 不一样", id:"hsk2-l04", html:"<h1>L04 · A 跟 B 一样 / 不一样</h1>\n<div class=\"lead\">能表达「相同 / 不同」</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A + 跟 + B + 一样 +（形容词）　｜　A + 跟 + B + 不一样</b></td></tr>\n<tr><td>教学目标</td><td>能表达「相同 / 不同」</td></tr>\n<tr><td>Tiếng Việt</td><td>A 跟 B 一样 / 不一样</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01、L03</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">否定形式是「不一样」而不是「没一样」；形容词可以省略不说。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">样子</td><td class=\"pyc\">yàng zi</td><td class=\"hv\">dạng tử</td><td>dáng vẻ；tác phong</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">意见</td><td class=\"pyc\">yì jiàn</td><td class=\"hv\">ý kiến</td><td>ý kiến；quan điểm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">想法</td><td class=\"pyc\">xiǎng fǎ</td><td class=\"hv\">tưởng pháp</td><td>cách nghĩ; ý kiến; quan niệm；nghĩ cách (làm gì đó)</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">习惯</td><td class=\"pyc\">xí guàn</td><td class=\"hv\">tập quán</td><td>thói quen；phong tục</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">心情</td><td class=\"pyc\">xīn qíng</td><td class=\"hv\">tâm tình</td><td>tâm trạng; trạng thái tinh thần</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">态度</td><td class=\"pyc\">tài du</td><td class=\"hv\">thái độ</td><td>thái độ；tác phong; cách cư xử</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">味道</td><td class=\"pyc\">wèi dao</td><td class=\"hv\">vị đạo</td><td>hương vị; mùi vị；(nghĩa bóng) cảm giác (về...)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">声音</td><td class=\"pyc\">shēng yīn</td><td class=\"hv\">thanh âm</td><td>giọng；âm thanh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">广告</td><td class=\"pyc\">guǎng gào</td><td class=\"hv\">nghiễm cáo</td><td>quảng cáo；mục quảng cáo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">新闻</td><td class=\"pyc\">xīn wén</td><td class=\"hv\">tân văn</td><td>tin tức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">照片</td><td class=\"pyc\">zhào piàn</td><td class=\"hv\">chiếu phiến</td><td>bức ảnh；hình ảnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">音乐</td><td class=\"pyc\">yīn yuè</td><td class=\"hv\">âm nhạc</td><td>âm nhạc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">礼物</td><td class=\"pyc\">lǐ wù</td><td class=\"hv\">lễ vật</td><td>quà; món quà</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">不同</td><td class=\"pyc\">bù tóng</td><td class=\"hv\">bất đồng</td><td>khác；riêng biệt</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">相同</td><td class=\"pyc\">xiāng tóng</td><td class=\"hv\">tương đồng</td><td>giống hệt；giống nhau</td><td class=\"hint\">形容词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会说「A 跟 B 一样 / 不一样」，能比较两个人的想法、习惯、水平</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「跟……一样」</p><p class=\"gfm\">A + 跟 + B + 一样 + 形容词</p><p class=\"gnote\">「一样」后面可以再带形容词，说明在<b>哪方面</b>一样：「我跟他一样高」。也可以只说「我跟他一样」，意思就是「我们相同」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我跟他一样高。</p><p class=\"py\">wǒ gēn tā yī yàng gāo。</p><p class=\"vi\">Tôi cao bằng anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这个跟那个一样贵。</p><p class=\"py\">zhè ge gēn nà ge yī yàng guì。</p><p class=\"vi\">Cái này đắt bằng cái kia.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「跟……不一样」</p><p class=\"gfm\">A + 跟 + B + 不一样</p><p class=\"gnote\">否定式是把「一样」换成「不一样」，不是把「跟」换成「不跟」。「我不跟一样」是错的。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我的想法跟他的不一样。</p><p class=\"py\">wǒ de xiǎng fǎ gēn tā de bù yī yàng。</p><p class=\"vi\">Ý nghĩ của tôi khác với anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">这两个东西不一样。</p><p class=\"py\">zhè liǎng gè dōng xi bù yī yàng。</p><p class=\"vi\">Hai cái này không giống nhau.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 「一样」和「相同 / 不同」</p><p class=\"gfm\">一样 / 不一样（口语）｜相同 / 不同（书面、正式）</p><p class=\"gnote\">意思相同，场合不同。跟同事说话用「一样」，写报告、开会用「相同」「不同」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我们的意见相同。</p><p class=\"py\">wǒ men de yī jiàn xiāng tóng。</p><p class=\"vi\">Ý kiến của chúng tôi giống nhau.</p></div><div class=\"gex\"><p class=\"zh\">这两个数字不同。</p><p class=\"py\">zhè liǎng gè shù zì bù tóng。</p><p class=\"vi\">Hai con số này khác nhau.</p></div><div class=\"gex\"><p class=\"zh\">这两个菜的味道一样。</p><p class=\"py\">zhè liǎng gè cài de wèi dào yī yàng。</p><p class=\"vi\">Mùi vị hai món này giống nhau.</p></div><div class=\"gex\"><p class=\"zh\">他的态度跟我的不一样。</p><p class=\"py\">tā de tài dù gēn wǒ de bù yī yàng。</p><p class=\"vi\">Thái độ của anh ấy khác với tôi.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我跟他一样高。</p><p class=\"py\">wǒ gēn tā yī yàng gāo。</p><p class=\"vi\">Tôi cao bằng anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">这个跟那个一样贵。</p><p class=\"py\">zhè ge gēn nà ge yī yàng guì。</p><p class=\"vi\">Cái này đắt bằng cái kia.</p></div><div class=\"sent\"><p class=\"zh\">我的想法跟他的不一样。</p><p class=\"py\">wǒ de xiǎng fǎ gēn tā de bù yī yàng。</p><p class=\"vi\">Ý nghĩ của tôi khác với anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">我们的意见相同。</p><p class=\"py\">wǒ men de yī jiàn xiāng tóng。</p><p class=\"vi\">Ý kiến của chúng tôi giống nhau.</p></div><div class=\"sent\"><p class=\"zh\">这两个数字不同。</p><p class=\"py\">zhè liǎng gè shù zì bù tóng。</p><p class=\"vi\">Hai con số này khác nhau.</p></div><div class=\"sent\"><p class=\"zh\">他的习惯跟我一样。</p><p class=\"py\">tā de xí guàn gēn wǒ yī yàng。</p><p class=\"vi\">Thói quen của anh ấy giống tôi.</p></div><div class=\"sent\"><p class=\"zh\">他说话的声音很大。</p><p class=\"py\">tā shuō huà de shēng yīn hěn dà。</p><p class=\"vi\">Giọng nói của anh ấy rất to.</p></div><div class=\"sent\"><p class=\"zh\">这个音乐很好听。</p><p class=\"py\">zhè ge yīn yuè hěn hǎo tīng。</p><p class=\"vi\">Bản nhạc này rất hay.</p></div><div class=\"sent\"><p class=\"zh\">他的样子跟他爸爸一样。</p><p class=\"py\">tā de yàng zi gēn tā bà ba yī yàng。</p><p class=\"vi\">Anh ấy trông giống bố.</p></div><div class=\"sent\"><p class=\"zh\">我们的水平不一样。</p><p class=\"py\">wǒ men de shuǐ píng bù yī yàng。</p><p class=\"vi\">Trình độ của chúng tôi không giống nhau.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的想法跟我的不一样。</p><p class=\"py\">nǐ de xiǎng fǎ gēn wǒ de bù yī yàng。</p><p class=\"vi\">Ý nghĩ của bạn khác với tôi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">哪里不一样？</p><p class=\"py\">nǎ lǐ bù yī yàng？</p><p class=\"vi\">Khác ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我觉得这个广告好，你觉得那个好。</p><p class=\"py\">wǒ jué de zhè ge guǎng gào hǎo， nǐ jué de nà ge hǎo。</p><p class=\"vi\">Tôi thấy quảng cáo này tốt, bạn thấy cái kia tốt.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对，我们的意见不一样。</p><p class=\"py\">duì， wǒ men de yī jiàn bù yī yàng。</p><p class=\"vi\">Đúng, ý kiến chúng ta không giống nhau.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那我们的习惯呢？</p><p class=\"py\">nà wǒ men de xí guàn ne？</p><p class=\"vi\">Vậy thói quen của chúng ta thì sao?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">习惯一样，我们都爱早上打球。</p><p class=\"py\">xí guàn yī yàng， wǒ men dōu ài zǎo shang dǎ qiú。</p><p class=\"vi\">Thói quen giống nhau, chúng ta đều thích chơi bóng buổi sáng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这是你的照片吗？</p><p class=\"py\">zhè shì nǐ de zhào piān ma？</p><p class=\"vi\">Đây là ảnh của bạn à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">是，这是我妈妈给我的礼物。</p><p class=\"py\">shì， zhè shì wǒ mā ma gěi wǒ de lǐ wù。</p><p class=\"vi\">Vâng, đây là món quà mẹ tôi tặng tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">今天的新闻你看了吗？</p><p class=\"py\">jīn tiān de xīn wén nǐ kàn le ma？</p><p class=\"vi\">Tin tức hôm nay bạn xem chưa?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">看了。我们的心情一样。</p><p class=\"py\">kàn le。 wǒ men de xīn qíng yī yàng。</p><p class=\"vi\">Xem rồi. Tâm trạng chúng ta giống nhau.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>「一样 / 不一样」快问快答：老师指两样东西，学员立刻用「跟……一样」造句</li><li>口语 ↔ 书面转换：同一句话用「一样」说一遍、用「相同」再说一遍</li><li>找不同：两人一组，各自说出三个和对方不一样的习惯</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>否定式是「不一样」，不能说「不跟……一样」</li><li>「一样」后面接形容词时不要省：「我跟他一样高」比「我跟他一样」信息更完整，练习要求说全</li><li>「相同」「不同」是形容词，不能带宾语：「我们的意见相同」不说「我们相同意见」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L04 十五个词的听读</li><li>比较自己和同事：想法、习惯、水平各写一句，一句用「一样」，一句用「不一样」</li></ul>"},
    {title:"✓ L05 程度副词：最 / 更", id:"hsk2-l05", html:"<h1>L05 · 程度副词：最 / 更</h1>\n<div class=\"lead\">能在三者以上中比较，能表达「更」的递进</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>最 + 形容词　｜　更 + 形容词</b></td></tr>\n<tr><td>教学目标</td><td>能在三者以上中比较，能表达「更」的递进</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ mức độ: 最 / 更</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「最」用于三者以上，「更」用于两者比较；越南语 &quot;nhất / hơn&quot; 都在形容词后，位置相反。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">十分</td><td class=\"pyc\">shí fēn</td><td class=\"hv\">thập phân</td><td>rất；hoàn toàn</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">多么</td><td class=\"pyc\">duō me</td><td class=\"hv\">đa ma</td><td>biết bao; thật là (câu cảm thán)；như thế nào</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">实在</td><td class=\"pyc\">shí zài</td><td class=\"hv\">thật tại</td><td>thực sự；thật sự</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">真正</td><td class=\"pyc\">zhēn zhèng</td><td class=\"hv\">chân chánh</td><td>chính hãng; thật; đúng；thật sự; quả thật</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">老是</td><td class=\"pyc\">lǎo shi</td><td class=\"hv\">lão thị</td><td>luôn luôn</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">主要</td><td class=\"pyc\">zhǔ yào</td><td class=\"hv\">chủ yếu</td><td>chính</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">越来越</td><td class=\"pyc\">yuè lái yuè</td><td class=\"hv\">việt lai việt</td><td>ngày càng</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">越</td><td class=\"pyc\">yuè</td><td class=\"hv\">việt</td><td>càng ... càng；vượt; vượt qua</td><td class=\"hint\">副词 / 语素</td></tr><tr><td class=\"hz\">重点</td><td class=\"pyc\">zhòng diǎn</td><td class=\"hv\">trọng điểm</td><td>điểm quan trọng；dự án quan trọng</td><td class=\"hint\">名词 / 副词</td></tr><tr><td class=\"hz\">平常</td><td class=\"pyc\">píng cháng</td><td class=\"hv\">bình thường</td><td>bình thường；phổ biến</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">经常</td><td class=\"pyc\">jīng cháng</td><td class=\"hv\">kinh thường</td><td>thường xuyên；ngày thường; hằng ngày; mỗi ngày</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">永远</td><td class=\"pyc\">yǒng yuǎn</td><td class=\"hv\">vĩnh viễn</td><td>mãi mãi；vĩnh cửu</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">直接</td><td class=\"pyc\">zhí jiē</td><td class=\"hv\">trực tiếp</td><td>ngay lập tức；thẳng thắn</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">原来</td><td class=\"pyc\">yuán lái</td><td class=\"hv\">nguyên lai</td><td>vốn dĩ; trước đây；thì ra; hóa ra</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">热情</td><td class=\"pyc\">rè qíng</td><td class=\"hv\">nhiệt tình</td><td>nồng nhiệt；nhiệt tình</td><td class=\"hint\">名形词 / 形容词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「最」「更」和高程度副词说明程度高低，会表达「越来越……」</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「最」表示程度第一</p><p class=\"gfm\">最 + 形容词（三个以上对象里排第一）</p><p class=\"gnote\">「最」后面接形容词，不能加「很」。「他最高」＝ 所有人里他第一。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他最高。</p><p class=\"py\">tā zuì gāo。</p><p class=\"vi\">Anh ấy cao nhất.</p></div><div class=\"gex\"><p class=\"zh\">这里最好。</p><p class=\"py\">zhè lǐ zuì hǎo。</p><p class=\"vi\">Ở đây tốt nhất.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「更」表示程度更进一步</p><p class=\"gfm\">更 + 形容词（两个对象比较）</p><p class=\"gnote\">只有两个对象比较时用「更」；三个以上选第一才用「最」。学员常把两个对象也说成「最」，要纠。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他更高。</p><p class=\"py\">tā gèng gāo。</p><p class=\"vi\">Anh ấy cao hơn.</p></div><div class=\"gex\"><p class=\"zh\">今天更热。</p><p class=\"py\">jīn tiān gèng rè。</p><p class=\"vi\">Hôm nay nóng hơn.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 程度递进：越来越 / 越……越……</p><p class=\"gfm\">越来越 + 形容词 ｜ 越 + A + 越 + B</p><p class=\"gnote\">「越来越」表示随着时间变化；「越……越……」表示两个变化同步。两者后面都只能接形容词或心理动词。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">天气越来越热。</p><p class=\"py\">tiān qì yuè lái yuè rè。</p><p class=\"vi\">Thời tiết ngày càng nóng.</p></div><div class=\"gex\"><p class=\"zh\">他的汉语越来越好。</p><p class=\"py\">tā de Hàn yǔ yuè lái yuè hǎo。</p><p class=\"vi\">Tiếng Trung của anh ấy ngày càng tốt.</p></div><div class=\"gex\"><p class=\"zh\">越说越快。</p><p class=\"py\">yuè shuō yuè kuài。</p><p class=\"vi\">Càng nói càng nhanh.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">4. 高程度副词：十分 / 多么 / 实在 / 真正</p><p class=\"gfm\">十分 + 形容词（书面）｜多么 + 形容词（感叹）｜实在 + 形容词｜真正 + 的 + 名词</p><p class=\"gnote\">「十分」偏书面；「多么」多用于感叹；「实在」＝ 真的、确实；「真正」常带「的」作定语。四个词都能替换「很」，但语气和场合不同。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这里的菜十分好吃。</p><p class=\"py\">zhè lǐ de cài shí fēn hǎo chī。</p><p class=\"vi\">Món ăn ở đây rất ngon.</p></div><div class=\"gex\"><p class=\"zh\">这里的菜多么好吃！</p><p class=\"py\">zhè lǐ de cài duō me hǎo chī！</p><p class=\"vi\">Món ăn ở đây ngon biết bao!</p></div><div class=\"gex\"><p class=\"zh\">我实在累了。</p><p class=\"py\">wǒ shí zài lèi le。</p><p class=\"vi\">Tôi thật sự mệt rồi.</p></div><div class=\"gex\"><p class=\"zh\">他是真正的好朋友。</p><p class=\"py\">tā shì zhēn zhèng de hǎo péng you。</p><p class=\"vi\">Anh ấy là người bạn tốt thật sự.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他最高。</p><p class=\"py\">tā zuì gāo。</p><p class=\"vi\">Anh ấy cao nhất.</p></div><div class=\"sent\"><p class=\"zh\">他更高。</p><p class=\"py\">tā gèng gāo。</p><p class=\"vi\">Anh ấy cao hơn.</p></div><div class=\"sent\"><p class=\"zh\">天气越来越热。</p><p class=\"py\">tiān qì yuè lái yuè rè。</p><p class=\"vi\">Thời tiết ng
