ày càng nóng.</p></div><div class=\"sent\"><p class=\"zh\">他的汉语越来越好。</p><p class=\"py\">tā de Hàn yǔ yuè lái yuè hǎo。</p><p class=\"vi\">Tiếng Trung của anh ấy ngày càng tốt.</p></div><div class=\"sent\"><p class=\"zh\">越说越快。</p><p class=\"py\">yuè shuō yuè kuài。</p><p class=\"vi\">Càng nói càng nhanh.</p></div><div class=\"sent\"><p class=\"zh\">他老是晚来。</p><p class=\"py\">tā lǎo shì wǎn lái。</p><p class=\"vi\">Anh ấy cứ đến muộn.</p></div><div class=\"sent\"><p class=\"zh\">我原来不知道。</p><p class=\"py\">wǒ yuán lái bù zhī dào。</p><p class=\"vi\">Trước đây tôi không biết.</p></div><div class=\"sent\"><p class=\"zh\">他很热情。</p><p class=\"py\">tā hěn rè qíng。</p><p class=\"vi\">Anh ấy rất nhiệt tình.</p></div><div class=\"sent\"><p class=\"zh\">这是今天的重点。</p><p class=\"py\">zhè shì jīn tiān de zhòng diǎn。</p><p class=\"vi\">Đây là trọng điểm của hôm nay.</p></div><div class=\"sent\"><p class=\"zh\">这里的人主要是老人。</p><p class=\"py\">zhè lǐ de rén zhǔ yào shì lǎo rén。</p><p class=\"vi\">Người ở đây chủ yếu là người già.</p></div><div class=\"sent\"><p class=\"zh\">我永远爱你。</p><p class=\"py\">wǒ yǒng yuǎn ài nǐ。</p><p class=\"vi\">Tôi mãi mãi yêu em.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你们班谁最高？</p><p class=\"py\">nǐ men bān shéi zuì gāo？</p><p class=\"vi\">Lớp bạn ai cao nhất?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我最高。</p><p class=\"py\">wǒ zuì gāo。</p><p class=\"vi\">Tôi cao nhất.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他跟你一样高吗？</p><p class=\"py\">tā gēn nǐ yī yàng gāo ma？</p><p class=\"vi\">Cậu ấy cao bằng bạn không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他跟我一样高，他跑得更快。</p><p class=\"py\">tā gēn wǒ yī yàng gāo， tā pǎo dé gèng kuài。</p><p class=\"vi\">Cậu ấy cao bằng tôi, cậu ấy chạy nhanh hơn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这里的天气好吗？</p><p class=\"py\">zhè lǐ de tiān qì hǎo ma？</p><p class=\"vi\">Thời tiết ở đây tốt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，越来越热。</p><p class=\"py\">hǎo， yuè lái yuè rè。</p><p class=\"vi\">Tốt, ngày càng nóng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你平常来这里吗？</p><p class=\"py\">nǐ píng cháng lái zhè lǐ ma？</p><p class=\"vi\">Bạn thường đến đây không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">经常来。这里的菜实在好吃。</p><p class=\"py\">jīng cháng lái。 zhè lǐ de cài shí zài hǎo chī。</p><p class=\"vi\">Thường xuyên đến. Món ăn ở đây thật sự ngon.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那我也要来。</p><p class=\"py\">nà wǒ yě yào lái。</p><p class=\"vi\">Vậy tôi cũng phải đến.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我直接跟你去。</p><p class=\"py\">hǎo， wǒ zhí jiē gēn nǐ qù。</p><p class=\"vi\">Được, tôi đi cùng bạn luôn.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>「最 / 更」二选一：老师给情景（两个 / 三个对象），学员判断该用「最」还是「更」</li><li>「越来越」造句接龙：每人一句，说出身边正在变化的事（天气、汉语、价钱……）</li><li>「很」升级操练：把「这里的菜很好吃」依次换成「十分好吃」「多么好吃」「实在好吃」</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>「最」不能说成「最很」；「最」本身已含极限义</li><li>两个对象用「更」，三个以上选第一用「最」——学员常把两个对象也说成「最」</li><li>「越来越」后面不能接一般动词，只能说「越来越 + 形容词/心理动词」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L05 十五个词的听读</li><li>用「最」「更」「越来越」各写一句，写自己班上的情况</li></ul>"},
    {title:"✓ L06 程度副词：特别 / 非常 / 真", id:"hsk2-l06", html:"<h1>L06 · 程度副词：特别 / 非常 / 真</h1>\n<div class=\"lead\">能表达强烈主观感受，区分语体轻重</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>特别 / 非常 + 形容词　｜　真 + 形容词 + 啊</b></td></tr>\n<tr><td>教学目标</td><td>能表达强烈主观感受，区分语体轻重</td></tr>\n<tr><td>Tiếng Việt</td><td>特别 / 非常 / 真</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L05</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「非常」前面不能再加「很」（× 很非常好）；「真」偏口语，后面常带语气词。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">特别</td><td class=\"pyc\">tè bié</td><td class=\"hv\">đặc biệt</td><td>khác thường; đặc biệt；rất; đặc biệt; đặc biệt là</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">感动</td><td class=\"pyc\">gǎn dòng</td><td class=\"hv\">cảm động</td><td>làm cảm động；chạm đến (cảm xúc của ai đó)</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">不满</td><td class=\"pyc\">bù mǎn</td><td class=\"hv\">bất mãn</td><td>bực bội；không hài lòng</td><td class=\"hint\">名形词 / 形容词</td></tr><tr><td class=\"hz\">努力</td><td class=\"pyc\">nǔ lì</td><td class=\"hv\">nỗ lực</td><td>nỗ lực; cố gắng; phấn đấu；chăm chỉ; tận tụy</td><td class=\"hint\">副形词 / 名形词</td></tr><tr><td class=\"hz\">小心</td><td class=\"pyc\">xiǎo xīn</td><td class=\"hv\">tiểu tâm</td><td>cẩn thận；chú ý</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">随便</td><td class=\"pyc\">suí biàn</td><td class=\"hv\">tùy tiện</td><td>tuỳ ý；tùy thích</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">自由</td><td class=\"pyc\">zì yóu</td><td class=\"hv\">tự do</td><td>tự do; sự tự do；tự do; không bị hạn chế</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">常见</td><td class=\"pyc\">cháng jiàn</td><td class=\"hv\">thường kiến</td><td>thường thấy；phổ biến</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">常用</td><td class=\"pyc\">cháng yòng</td><td class=\"hv\">thường dụng</td><td>được sử dụng phổ biến</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">凉快</td><td class=\"pyc\">liáng kuai</td><td class=\"hv\">lương khoái</td><td>mát mẻ；dễ chịu và mát</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">急</td><td class=\"pyc\">jí</td><td class=\"hv\">cấp</td><td>khẩn cấp；cấp bách</td><td class=\"hint\">动词 / 副形词</td></tr><tr><td class=\"hz\">疼</td><td class=\"pyc\">téng</td><td class=\"hv\">đông</td><td>(bị) đau; nhức；yêu thương hết mực</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">响</td><td class=\"pyc\">xiǎng</td><td class=\"hv\">hưởng</td><td>tiếng；vang</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">亮</td><td class=\"pyc\">liàng</td><td class=\"hv\">lượng</td><td>sáng; ánh；soi rọi; loé sáng</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">脏</td><td class=\"pyc\">zāng</td><td class=\"hv\">tạng</td><td>bẩn；thô tục</td><td class=\"hint\">形容词 / 语素</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「特别」「非常」「真」加强语气，会表达强烈的感受</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「特别」＋ 形容词 / 动词</p><p class=\"gfm\">特别 + 形容词 ｜ 特别 + 喜欢/想/要 + 名词</p><p class=\"gnote\">「特别」比「很」语气强，口语常用。它还能当形容词用，表示「与众不同」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个菜特别好吃。</p><p class=\"py\">zhè ge cài tè bié hǎo chī。</p><p class=\"vi\">Món này đặc biệt ngon.</p></div><div class=\"gex\"><p class=\"zh\">我特别想去。</p><p class=\"py\">wǒ tè bié xiǎng qù。</p><p class=\"vi\">Tôi rất muốn đi.</p></div><div class=\"gex\"><p class=\"zh\">他很特别。</p><p class=\"py\">tā hěn tè bié。</p><p class=\"vi\">Anh ấy rất đặc biệt.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「非常」和「真」</p><p class=\"gfm\">非常 + 形容词（书面）｜真 + 形容词（感叹）</p><p class=\"gnote\">「非常」偏正式，写报告常用；「真」用于感叹，语气直接、口语化。两个词都是本课重点。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这里的菜非常好。</p><p class=\"py\">zhè lǐ de cài fēi cháng hǎo。</p><p class=\"vi\">Món ăn ở đây rất ngon.</p></div><div class=\"gex\"><p class=\"zh\">真好吃！</p><p class=\"py\">zhēn hǎo chī！</p><p class=\"vi\">Ngon thật!</p></div><div class=\"gex\"><p class=\"zh\">真不错！</p><p class=\"py\">zhēn bù cuò！</p><p class=\"vi\">Được thật đấy!</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 「太……了」表示过分或感叹</p><p class=\"gfm\">太 + 形容词 + 了</p><p class=\"gnote\">表示程度过分或强烈感叹，句末的「了」不能省。「太」是一级词，本课复习它的固定搭配。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">太贵了！</p><p class=\"py\">tài guì le！</p><p class=\"vi\">Đắt quá!</p></div><div class=\"gex\"><p class=\"zh\">太好了！</p><p class=\"py\">tài hǎo le！</p><p class=\"vi\">Tốt quá!</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">4. 心理感受词：感动 / 不满</p><p class=\"gfm\">很/特别 + 感动 ｜ 对 + 某人/某事 + 不满</p><p class=\"gnote\">「感动」是被触动；「不满」是心里不满意，常带「对」。两个词都能直接受「很/特别/非常」修饰。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我很感动。</p><p class=\"py\">wǒ hěn gǎn dòng。</p><p class=\"vi\">Tôi rất cảm động.</p></div><div class=\"gex\"><p class=\"zh\">他对这个不满。</p><p class=\"py\">tā duì zhè ge bù mǎn。</p><p class=\"vi\">Anh ấy không hài lòng với cái này.</p></div><div class=\"gex\"><p class=\"zh\">你要小心。</p><p class=\"py\">nǐ yào xiǎo xīn。</p><p class=\"vi\">Bạn phải cẩn thận.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">今天我特别开心。</p><p class=\"py\">jīn tiān wǒ tè bié kāi xīn。</p><p class=\"vi\">Hôm nay tôi đặc biệt vui.</p></div><div class=\"sent\"><p class=\"zh\">他工作特别努力。</p><p class=\"py\">tā gōng zuò tè bié nǔ lì。</p><p class=\"vi\">Anh ấy làm việc đặc biệt chăm chỉ.</p></div><div class=\"sent\"><p class=\"zh\">今天很凉快。</p><p class=\"py\">jīn tiān hěn liáng kuài。</p><p class=\"vi\">Hôm nay rất mát.</p></div><div class=\"sent\"><p class=\"zh\">这个字很常见。</p><p class=\"py\">zhè ge zì hěn cháng jiàn。</p><p class=\"vi\">Chữ này rất thường gặp.</p></div><div class=\"sent\"><p class=\"zh\">常用的字不多。</p><p class=\"py\">cháng yòng de zì bù duō。</p><p class=\"vi\">Chữ thường dùng không nhiều.</p></div><div class=\"sent\"><p class=\"zh\">我很急。</p><p class=\"py\">wǒ hěn jí。</p><p class=\"vi\">Tôi rất gấp.</p></div><div class=\"sent\"><p class=\"zh\">我的手很疼。</p><p class=\"py\">wǒ de shǒu hěn téng。</p><p class=\"vi\">Tay tôi rất đau.</p></div><div class=\"sent\"><p class=\"zh\">这个声音太响了。</p><p class=\"py\">zhè ge shēng yīn tài xiǎng le。</p><p class=\"vi\">Tiếng này to quá.</p></div><div class=\"sent\"><p class=\"zh\">这个房间很亮。</p><p class=\"py\">zhè ge fáng jiān hěn liàng。</p><p class=\"vi\">Phòng này rất sáng.</p></div><div class=\"sent\"><p class=\"zh\">他的衣服很脏。</p><p class=\"py\">tā de yī fu hěn zāng。</p><p class=\"vi\">Quần áo của anh ấy rất bẩn.</p></div><div class=\"sent\"><p class=\"zh\">他很喜欢自由。</p><p class=\"py\">tā hěn xǐ huan zì yóu。</p><p class=\"vi\">Anh ấy rất thích tự do.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">今天天气真好！</p><p class=\"py\">jīn tiān tiān qì zhēn hǎo！</p><p class=\"vi\">Thời tiết hôm nay đẹp thật!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对，不冷也不热。</p><p class=\"py\">duì， bù lěng yě bù rè。</p><p class=\"vi\">Đúng, không lạnh cũng không nóng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们出去走走？</p><p class=\"py\">wǒ men chū qù zǒu zǒu？</p><p class=\"vi\">Chúng ta ra ngoài đi dạo nhé?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好。你想去哪里？</p><p class=\"py\">hǎo。 nǐ xiǎng qù nǎ lǐ？</p><p class=\"vi\">Được. Bạn muốn đi đâu?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个商店不错，我们去看看。</p><p class=\"py\">nà ge shāng diàn bù cuò， wǒ men qù kàn kàn。</p><p class=\"vi\">Cửa hàng kia được đấy, chúng ta đi xem.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，随便走走也好。</p><p class=\"py\">hǎo， suí biàn zǒu zǒu yě hǎo。</p><p class=\"vi\">Được, đi dạo tùy ý cũng tốt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这里真安静。</p><p class=\"py\">zhè lǐ zhēn ān jìng。</p><p class=\"vi\">Ở đây yên tĩnh thật.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">是，我特别开心。</p><p class=\"py\">shì， wǒ tè bié kāi xīn。</p><p class=\"vi\">Vâng, tôi đặc biệt vui.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">太好了！</p><p class=\"py\">tài hǎo le！</p><p class=\"vi\">Tốt quá!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">走吧！</p><p class=\"py\">zǒu ba！</p><p class=\"vi\">Đi thôi!</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>语气升级操练：「好吃」→「很好吃」→「特别好吃」→「非常好吃」→「真好吃」→「太好吃了」</li><li>情景选词：老师给情景（看到好风景 / 收到礼物 / 朋友生病），学员选「特别/非常/真/太…了」说一句</li><li>「感动 / 不满」辨析：老师给两个情景，学员判断该用哪个词</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>「特别」不能说成「特别很」；「特别」本身已含程度</li><li>「真」是副词，只能修饰形容词或动词，不能直接修饰名词</li><li>「太……了」句末的「了」不能省；「非常」后面不能加「了」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L06 十五个词的听读</li><li>用「特别」「非常」「真」「太…了」各写一句，写今天发生的事</li></ul>"},
    {title:"✓ L07 程度补语：V + 得 + 形容词", id:"hsk2-l07", html:"<h1>L07 · 程度补语：V + 得 + 形容词</h1>\n<div class=\"lead\">能评价动作做得怎么样（说得好、跑得快）</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 动词 + 得 + 形容词（他跑得快）</b></td></tr>\n<tr><td>教学目标</td><td>能评价动作做得怎么样（说得好、跑得快）</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ mức độ: V + 得 + tính từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语没有对应结构，学员会漏掉「得」说成「他跑快」；「得」念 de 轻声，不是 dé。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">讲</td><td class=\"pyc\">jiǎng</td><td class=\"hv\">giảng</td><td>nói；giải thích</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">帮助</td><td class=\"pyc\">bāng zhù</td><td class=\"hv\">bang trợ</td><td>sự giúp đỡ; hỗ trợ；giúp đỡ; hỗ trợ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">完成</td><td class=\"pyc\">wán chéng</td><td class=\"hv\">hoàn thành</td><td>hoàn thành; thực hiện</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">检查</td><td class=\"pyc\">jiǎn chá</td><td class=\"hv\">kiểm tra</td><td>kiểm tra；khám xét</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">服务</td><td class=\"pyc\">fú wù</td><td class=\"hv\">phục vụ</td><td>phục vụ；dịch vụ</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">装</td><td class=\"pyc\">zhuāng</td><td class=\"hv\">trang</td><td>lắp; đóng gói；trang điểm; giả vờ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">收</td><td class=\"pyc\">shōu</td><td class=\"hv\">thu</td><td>nhận；chấp nhận</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">查</td><td class=\"pyc\">chá</td><td class=\"hv\">tra</td><td>nghiên cứu；kiểm tra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">弄</td><td class=\"pyc\">nòng</td><td class=\"hv\">lộng</td><td>làm；quản lý</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">做到</td><td class=\"pyc\">zuò dào</td><td class=\"hv\">tố đáo</td><td>hoàn thành；đạt được</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">办</td><td class=\"pyc\">bàn</td><td class=\"hv\">bạn</td><td>làm；quản lý</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">留</td><td class=\"pyc\">liú</td><td class=\"hv\">lưu</td><td>để lại (tin nhắn, v.v.)；giữ lại</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">交</td><td class=\"pyc\">jiāo</td><td class=\"hv\">giao</td><td>giao nộp；kết bạn</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">带来</td><td class=\"pyc\">dài lái</td><td class=\"hv\">đái lai</td><td>mang đến；(nghĩa bóng) mang lại; tạo ra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">想到</td><td class=\"pyc\">xiǎng dào</td><td class=\"hv\">tưởng đáo</td><td>nghĩ đến；gợi nhớ</td><td class=\"hint\">动词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会用「动词 + 得 + 形容词」评价一个动作做得怎么样</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 「得」把动词和评价连起来</p><p class=\"gfm\">动词 + 得 + 形容词</p><p class=\"gnote\">「得」在动词后，形容词是评价<b>动作做得怎么样</b>，不是评价人。越南语没有对应结构，这是二级最大的难点。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他讲得很好。</p><p class=\"py\">tā jiǎng dé hěn hǎo。</p><p class=\"vi\">Anh ấy giảng rất hay.</p></div><div class=\"gex\"><p class=\"zh\">你写得很好。</p><p class=\"py\">nǐ xiě dé hěn hǎo。</p><p class=\"vi\">Bạn viết rất đẹp.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 「得」不能省</p><p class=\"gfm\">说 + 得 + 快（× 说快）</p><p class=\"gnote\">少了「得」就不是这个结构了。「他说得快」意思是「他说话的速度快」。学员最容易漏掉「得」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他说得很快。</p><p class=\"py\">tā shuō dé hěn kuài。</p><p class=\"vi\">Anh ấy nói rất nhanh.</p></div><div class=\"gex\"><p class=\"zh\">他走得很快。</p><p class=\"py\">tā zǒu dé hěn kuài。</p><p class=\"vi\">Anh ấy đi rất nhanh.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 「得」的三个读音</p><p class=\"gfm\">得 de（补语，本课）｜得 dé（得到）｜得 děi（必须）</p><p class=\"gnote\">本课只练轻声 de。学员看到「得」就读 dé 是常见错误，要专门练轻声。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他做得很好。</p><p class=\"py\">tā zuò dé hěn hǎo。</p><p class=\"vi\">Anh ấy làm rất tốt.</p></div><div class=\"gex\"><p class=\"zh\">你唱得真好听。</p><p class=\"py\">nǐ chàng dé zhēn hǎo tīng。</p><p class=\"vi\">Bạn hát hay thật.</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他讲得很好。</p><p class=\"py\">tā jiǎng dé hěn hǎo。</p><p class=\"vi\">Anh ấy giảng rất hay.</p></div><div class=\"sent\"><p class=\"zh\">你写得很好。</p><p class=\"py\">nǐ xiě dé hěn hǎo。</p><p class=\"vi\">Bạn viết rất đẹp.</p></div><div class=\"sent\"><p class=\"zh\">他说得很快。</p><p class=\"py\">tā shuō dé hěn kuài。</p><p class=\"vi\">Anh ấy nói rất nhanh.</p></div><div class=\"sent\"><p class=\"zh\">他走得很快。</p><p class=\"py\">tā zǒu dé hěn kuài。</p><p class=\"vi\">Anh ấy đi rất nhanh.</p></div><div class=\"sent\"><p class=\"zh\">我们完成得很快。</p><p class=\"py\">wǒ men wán chéng dé hěn kuài。</p><p class=\"vi\">Chúng tôi hoàn thành rất nhanh.</p></div><div class=\"sent\"><p class=\"zh\">他检查得很清楚。</p><p class=\"py\">tā jiǎn chá dé hěn qīng chǔ。</p><p class=\"vi\">Anh ấy kiểm tra rất rõ ràng.</p></div><div class=\"sent\"><p class=\"zh\">他帮助我很多。</p><p class=\"py\">tā bāng zhù wǒ hěn duō。</p><p class=\"vi\">Anh ấy giúp tôi rất nhiều.</p></div><div class=\"sent\"><p class=\"zh\">这里的服务很好。</p><p class=\"py\">zhè lǐ de fú wù hěn hǎo。</p><p class=\"vi\">Dịch vụ ở đây rất tốt.</p></div><div class=\"sent\"><p class=\"zh\">这个怎么装？</p><p class=\"py\">zhè ge zěn me zhuāng？</p><p class=\"vi\">Cái này lắp thế nào?</p></div><div class=\"sent\"><p class=\"zh\">你在弄什么？</p><p class=\"py\">nǐ zài nòng shén me？</p><p class=\"vi\">Bạn đang làm gì đấy?</p></div><div class=\"sent\"><p class=\"zh\">我做到了。</p><p class=\"py\">wǒ zuò dào le。</p><p class=\"vi\">Tôi làm được rồi.</p></div><div class=\"sent\"><p class=\"zh\">我收了很多礼物。</p><p class=\"py\">wǒ shōu le hěn duō lǐ wù。</p><p class=\"vi\">Tôi nhận được nhiều quà.</p></div><div class=\"sent\"><p class=\"zh\">这些东西明天交。</p><p class=\"py\">zhè xiē dōng xi míng tiān jiāo。</p><p class=\"vi\">Những thứ này mai nộp.</p></div><div class=\"sent\"><p class=\"zh\">他带来了一个礼物。</p><p class=\"py\">tā dài lái le yī gè lǐ wù。</p><p class=\"vi\">Anh ấy mang đến một món quà.</p></div><div class=\"sent\"><p class=\"zh\">我想到他了。</p><p class=\"py\">wǒ xiǎng dào tā le。</p><p class=\"vi\">Tôi nhớ ra anh ấy rồi.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他讲得好吗？</p><p class=\"py\">tā jiǎng dé hǎo ma？</p><p class=\"vi\">Anh ấy giảng có hay không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">讲得很好。</p><p class=\"py\">jiǎng dé hěn hǎo。</p><p class=\"vi\">Giảng rất hay.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他写得好吗？</p><p class=\"py\">tā xiě dé hǎo ma？</p><p class=\"vi\">Anh ấy viết có đẹp không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">写得很好，比我好得多。</p><p class=\"py\">xiě dé hěn hǎo， bǐ wǒ hǎo dé duō。</p><p class=\"vi\">Viết rất đẹp, hơn tôi nhiều.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你做得也很好。</p><p class=\"py\">nǐ zuò dé yě hěn hǎo。</p><p class=\"vi\">Bạn làm cũng rất tốt.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">谢谢。我做得慢。</p><p class=\"py\">xiè xie。 wǒ zuò dé màn。</p><p class=\"vi\">Cảm ơn. Tôi làm chậm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">慢一点儿没关系。</p><p class=\"py\">màn yī diǎnr méi guān xi。</p><p class=\"vi\">Chậm một chút không sao.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这个我来办吧。</p><p class=\"py\">zhè ge wǒ lái bàn ba。</p><p class=\"vi\">Cái này để tôi lo.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，请你查这个。</p><p class=\"py\">hǎo， qǐng nǐ chá zhè ge。</p><p class=\"vi\">Được, bạn kiểm tra cái này nhé.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我留了很多东西，都给你。</p><p class=\"py\">wǒ liú le hěn duō dōng xi， dōu gěi nǐ。</p><p class=\"vi\">Tôi để lại nhiều đồ, đều cho bạn.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>补语操练：老师给动词（说/写/走/唱/做/讲），学员加「得 + 形容词」评价</li><li>漏「得」纠错：老师说「他说很快」，学员改成「他说得很快」</li><li>「得」读音操练：把 de / dé / děi 三个音的例句混在一起，学员听音选句</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>「得」不能省：「他说快」不成立，要说「他说得快」</li><li>三个 de 要分清：说得好（得）/ 他的书（的）/ 慢慢地走（地）</li><li>越南语没有程度补语，学员会用「他讲很好」直译，漏掉「得」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L07 十五个动词的听读</li><li>用「动词 + 得 + 形容词」写 5 句，评价家人做家务做得怎么样</li></ul>"},
    {title:"✓ L08 程度补语扩展：否定式与疑问式", id:"hsk2-l08", html:"<h1>L08 · 程度补语扩展：否定式与疑问式</h1>\n<div class=\"lead\">能问「他跑得快不快」，能说「跑得不快」</div>\n<table>\n<tr><td>所属单元</td><td>单元一 · 比较与程度（So sánh và mức độ）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 得不 + 形容词　｜　动词 + 得 + 形容词 + 吗 / 正反疑问</b></td></tr>\n<tr><td>教学目标</td><td>能问「他跑得快不快」，能说「跑得不快」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ mức độ: phủ định và nghi vấn</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L07</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">正反疑问要重复整个「动词 + 得 + 形容词」：「他跑得快不快」，不能只说「他跑快不快」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">感觉</td><td class=\"pyc\">gǎn jué</td><td class=\"hv\">cảm giác</td><td>cảm giác; ấn tượng; cảm nhận；cảm thấy; nhận biết</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">意思</td><td class=\"pyc\">yì si</td><td class=\"hv\">ý tư</td><td>ý nghĩa; ý；ý kiến</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">说明</td><td class=\"pyc\">shuō míng</td><td class=\"hv\">thuyết minh</td><td>giải thích；minh họa</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">作用</td><td class=\"pyc\">zuò yòng</td><td class=\"hv\">tác dụng</td><td>tác động đến; ảnh hưởng；hành động; chức năng; hoạt động</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">表示</td><td class=\"pyc\">biǎo shì</td><td class=\"hv\">biểu thị</td><td>(về ai đó) bày tỏ；(về điều gì đó) biểu thị</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">认为</td><td class=\"pyc\">rèn wéi</td><td class=\"hv\">nhận vi</td><td>tin; nghĩ; xem xét; cảm thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">应该</td><td class=\"pyc\">yīng gāi</td><td class=\"hv\">ứng cai</td><td>nên；phải</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">能够</td><td class=\"pyc\">néng gòu</td><td class=\"hv\">năng cú</td><td>có khả năng；có thể</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">愿意</td><td class=\"pyc\">yuàn yì</td><td class=\"hv\">nguyện ý</td><td>muốn；nguyện</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">相信</td><td class=\"pyc\">xiāng xìn</td><td class=\"hv\">tương tín</td><td>tin tưởng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">出现</td><td class=\"pyc\">chū xiàn</td><td class=\"hv\">xuất hiện</td><td>xuất hiện；phát sinh</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">以为</td><td class=\"pyc\">yǐ wéi</td><td class=\"hv\">dĩ vi</td><td>nghĩ rằng (tức là cho là đúng ...)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">变成</td><td class=\"pyc\">biàn chéng</td><td class=\"hv\">biến thành</td><td>thay đổi thành；biến thành</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">感到</td><td class=\"pyc\">gǎn dào</td><td class=\"hv\">cảm đáo</td><td>cảm thấy; cảm nhận; nhận ra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">怎么样</td><td class=\"pyc\">zěn me yàng</td><td class=\"hv\">chẩm ma dạng</td><td>như thế nào?；thế nào?</td><td class=\"hint\">代词</td></tr></table>\n\n<h2>本课目标</h2>\n<div class=\"lead\">会问「……得怎么样」，会说「……得不……」的否定式，会用「觉得/认为/感觉」表达评价</div>\n\n<h2>语法点</h2>\n\n<div class=\"g\"><p class=\"gpt\">1. 疑问式：动词 + 得 + 怎么样</p><p class=\"gfm\">动词 + 得 + 怎么样？</p><p class=\"gnote\">「怎么样」是问程度和评价的固定说法，问的是「做得如何」。回答要用「得 + 形容词」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他讲得怎么样？</p><p class=\"py\">tā jiǎng dé zěn me yàng？</p><p class=\"vi\">Anh ấy giảng thế nào?</p></div><div class=\"gex\"><p class=\"zh\">你写得怎么样？</p><p class=\"py\">nǐ xiě dé zěn me yàng？</p><p class=\"vi\">Bạn viết thế nào?</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">2. 否定式：动词 + 得不 + 形容词</p><p class=\"gfm\">动词 + 得不 + 形容词</p><p class=\"gnote\">「说得好」的否定是「说得不好」，不是「不说得好」。否定词「不」放在「得」和形容词<b>之间</b>。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他写得不好。</p><p class=\"py\">tā xiě dé bù hǎo。</p><p class=\"vi\">Anh ấy viết không đẹp.</p></div><div class=\"gex\"><p class=\"zh\">我做得不好。</p><p class=\"py\">wǒ zuò dé bù hǎo。</p><p class=\"vi\">Tôi làm không tốt.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">3. 「觉得 / 认为 / 感觉」引出评价</p><p class=\"gfm\">觉得 / 认为 / 感觉 + 小句</p><p class=\"gnote\">「觉得」口语；「认为」正式，常用于表态；「感觉」偏身体或心里的感受。三个词后面都接一整个小句。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我觉得他说得对。</p><p class=\"py\">wǒ jué de tā shuō dé duì。</p><p class=\"vi\">Tôi thấy anh ấy nói đúng.</p></div><div class=\"gex\"><p class=\"zh\">我认为这个想法不错。</p><p class=\"py\">wǒ rèn wéi zhè ge xiǎng fǎ bù cuò。</p><p class=\"vi\">Tôi cho rằng ý nghĩ này được.</p></div><div class=\"gex\"><p class=\"zh\">我感觉今天很累。</p><p class=\"py\">wǒ gǎn jué jīn tiān hěn lèi。</p><p class=\"vi\">Tôi cảm thấy hôm nay rất mệt.</p></div></div></div>\n\n<div class=\"g\"><p class=\"gpt\">4. 说明与表态：表示 / 说明 / 作用</p><p class=\"gfm\">表示 + 感受/态度 ｜ 说明 + 意思/原因 ｜ 有什么作用</p><p class=\"gnote\">「表示」是表态，「说明」是把意思讲清楚，「作用」是功能、用处。三个词偏书面，职场沟通常用。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他表示不满。</p><p class=\"py\">tā biǎo shì bù mǎn。</p><p class=\"vi\">Anh ấy tỏ vẻ không hài lòng.</p></div><div class=\"gex\"><p class=\"zh\">他说明了这个意思。</p><p class=\"py\">tā shuō míng le zhè ge yī si。</p><p class=\"vi\">Anh ấy đã nói rõ ý này.</p></div><div class=\"gex\"><p class=\"zh\">这个东西有什么作用？</p><p class=\"py\">zhè ge dōng xi yǒu shén me zuò yòng？</p><p class=\"vi\">Cái này có tác dụng gì?</p></div></div></div>\n\n<h2>例句</h2><div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这个字我写得不好。</p><p class=\"py\">zhè ge zì wǒ xiě dé bù hǎo。</p><p class=\"vi\">Chữ này tôi viết không đẹp.</p></div><div class=\"sent\"><p class=\"zh\">他的意思我明白了。</p><p class=\"py\">tā de yī si wǒ míng bai le。</p><p class=\"vi\">Ý của anh ấy tôi hiểu rồi.</p></div><div class=\"sent\"><p class=\"zh\">这里出现了一个人。</p><p class=\"py\">zhè lǐ chū xiàn le yī gè rén。</p><p class=\"vi\">Ở đây xuất hiện một người.</p></div><div class=\"sent\"><p class=\"zh\">我以为他不在。</p><p class=\"py\">wǒ yǐ wéi tā bù zài。</p><p class=\"vi\">Tôi tưởng anh ấy không có ở đây.</p></div><div class=\"sent\"><p class=\"zh\">他变成了一个医生。</p><p class=\"py\">tā biàn chéng le yī gè yī shēng。</p><p class=\"vi\">Anh ấy đã trở thành bác sĩ.</p></div><div class=\"sent\"><p class=\"zh\">我感到很累。</p><p class=\"py\">wǒ gǎn dào hěn lèi。</p><p class=\"vi\">Tôi cảm thấy rất mệt.</p></div><div class=\"sent\"><p class=\"zh\">你应该早来。</p><p class=\"py\">nǐ yīng gāi zǎo lái。</p><p class=\"vi\">Bạn nên đến sớm.</p></div><div class=\"sent\"><p class=\"zh\">他能够做到。</p><p class=\"py\">tā néng gòu zuò dào。</p><p class=\"vi\">Anh ấy có thể làm được.</p></div><div class=\"sent\"><p class=\"zh\">我愿意帮助你。</p><p class=\"py\">wǒ yuàn yī bāng zhù nǐ。</p><p class=\"vi\">Tôi sẵn lòng giúp bạn.</p></div><div class=\"sent\"><p class=\"zh\">我相信他。</p><p class=\"py\">wǒ xiāng xìn tā。</p><p class=\"vi\">Tôi tin anh ấy.</p></div></div>\n\n<h2>对话</h2><div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">昨天的会，他讲得怎么样？</p><p class=\"py\">zuó tiān de huì， tā jiǎng dé zěn me yàng？</p><p class=\"vi\">Cuộc họp hôm qua, anh ấy giảng thế nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">讲得不错。</p><p class=\"py\">jiǎng dé bù cuò。</p><p class=\"vi\">Giảng được đấy.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你听得清楚吗？</p><p class=\"py\">nǐ tīng dé qīng chǔ ma？</p><p class=\"vi\">Bạn nghe rõ không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">听得清楚，他讲得很慢。</p><p class=\"py\">tīng dé qīng chǔ， tā jiǎng dé hěn màn。</p><p class=\"vi\">Nghe rõ, anh ấy giảng rất chậm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我觉得他讲得比上次好。</p><p class=\"py\">wǒ jué de tā jiǎng dé bǐ shàng cì hǎo。</p><p class=\"vi\">Tôi thấy anh ấy giảng tốt hơn lần trước.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对，我也觉得。</p><p class=\"py\">duì， wǒ yě jué de。</p><p class=\"vi\">Đúng, tôi cũng thấy vậy.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你听得怎么样？</p><p class=\"py\">nǐ tīng dé zěn me yàng？</p><p class=\"vi\">Bạn nghe thế nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">有的地方不明白。</p><p class=\"py\">yǒu de dì fāng bù míng bái。</p><p class=\"vi\">Có chỗ tôi không hiểu.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那你要问他吗？</p><p class=\"py\">nà nǐ yào wèn tā ma？</p><p class=\"vi\">Vậy bạn có hỏi anh ấy không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">要，我明天去问他。</p><p class=\"py\">yào， wǒ míng tiān qù wèn tā。</p><p class=\"vi\">Có, mai tôi đi hỏi anh ấy.</p></div></div></div>\n\n<h2>课堂操练</h2><ul class=\"plain\"><li>问答操练：一个学员问「他……得怎么样？」，另一个用「得 + 形容词」回答</li><li>否定式转换：「他说得好」→「他说得不好」，注意「不」的位置</li><li>三个评价动词替换：「我觉得」→「我认为」→「我感觉」，同一句说三遍，体会语气差别</li></ul>\n\n<h2>易错点</h2><ul class=\"pit\"><li>否定式是「动词 + 得不 + 形容词」，「不」放在「得」和形容词之间，不能放在动词前</li><li>「怎么样」问的是评价，回答必须用「得 + 形容词」，不能直接回答「很好」而漏掉「得」</li><li>「觉得」后面接小句：「我觉得他讲得很好」，不要写成「我觉得他很好讲」</li></ul>\n\n<h2>作业</h2><ul class=\"plain\"><li>在 App 上完成 L08 十五个词的听读</li><li>听一段中文音频，用「他讲得怎么样」写 3 句评价</li></ul>"}
  ]},
  {title:"三、单元二 结果、完成与经历", id:"hsk2-g2", children:[
    {title:"L09 结果补语：完 / 好", id:"hsk2-l09", html:"<h1>L09 · 结果补语：完 / 好</h1>\n<div class=\"lead\">能说「做完了、准备好了」</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 完 / 好</b></td></tr>\n<tr><td>教学目标</td><td>能说「做完了、准备好了」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ kết quả: 完 / 好</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L07</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「完」表动作结束，「好」表完成且结果令人满意（做好了）；越南语 &quot;xong&quot; 只对应前者，后者要专门讲。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L10 结果补语：到 / 见", id:"hsk2-l10", html:"<h1>L10 · 结果补语：到 / 见</h1>\n<div class=\"lead\">能说「看到、买到、听见」</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 到 / 见</b></td></tr>\n<tr><td>教学目标</td><td>能说「看到、买到、听见」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ kết quả: 到 / 见</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「看到」偏结果状态、「看见」偏视觉感知，越南语都译 &quot;thấy&quot;，需对比。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L11 结果补语：懂 / 会 / 错", id:"hsk2-l11", html:"<h1>L11 · 结果补语：懂 / 会 / 错</h1>\n<div class=\"lead\">能说「听懂了、做错了」</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 懂 / 会 / 错</b></td></tr>\n<tr><td>教学目标</td><td>能说「听懂了、做错了」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ kết quả: 懂 / 会 / 错</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「看懂 / 学会」里的「懂 / 会」是补语，不是能愿动词，不能提到动词前。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L12 结果补语综合与高频搭配", id:"hsk2-l12", html:"<h1>L12 · 结果补语综合与高频搭配</h1>\n<div class=\"lead\">整理常用「动词 + 结果补语」组合表</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 结果补语 +（宾语）</b></td></tr>\n<tr><td>教学目标</td><td>整理常用「动词 + 结果补语」组合表</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp bổ ngữ kết quả</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09、L10、L11</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">有宾语时补语紧贴动词：「看完书」不能说成「看书完」。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L13 动态助词「了」：完成", id:"hsk2-l13", html:"<h1>L13 · 动态助词「了」：完成</h1>\n<div class=\"lead\">区分「了」表完成与句尾「了」表变化</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 了 +（数量）+ 宾语</b></td></tr>\n<tr><td>教学目标</td><td>区分「了」表完成与句尾「了」表变化</td></tr>\n<tr><td>Tiếng Việt</td><td>Trợ từ động thái 了 (hoàn thành)</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;đã / rồi&quot; 兼表完成，学员会「已经…了」重复叠用；「了」在动词后，不在句尾。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L14 动态助词「过」：经历", id:"hsk2-l14", html:"<h1>L14 · 动态助词「过」：经历</h1>\n<div class=\"lead\">能说「我去过、没吃过」</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 过</b></td></tr>\n<tr><td>教学目标</td><td>能说「我去过、没吃过」</td></tr>\n<tr><td>Tiếng Việt</td><td>Trợ từ 过 (đã từng)</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「过」表经历（曾经），「了」表完成（这次做完）；越南语都用 &quot;rồi&quot;，是最容易混的一对。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L15 副词：已经 / 刚 / 才", id:"hsk2-l15", html:"<h1>L15 · 副词：已经 / 刚 / 才</h1>\n<div class=\"lead\">能表达时间上的「已经、刚刚、才」</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>已经 + 动词 + 了　｜　刚 + 动词　｜　才 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>能表达时间上的「已经、刚刚、才」</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ: 已经 / 刚 / 才</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「才」含「晚了 / 勉强」的口气（等了两小时才来），越南语 &quot;mới&quot; 相近但不完全等同。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L16 副词：就 / 再 / 又", id:"hsk2-l16", html:"<h1>L16 · 副词：就 / 再 / 又</h1>\n<div class=\"lead\">区分「就、再、又」三种重复与承接</div>\n<table>\n<tr><td>所属单元</td><td>单元二 · 结果、完成与经历（Kết quả, hoàn thành và trải nghiệm）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>就（早 / 快）　｜　再（将来重复）　｜　又（过去重复）</b></td></tr>\n<tr><td>教学目标</td><td>区分「就、再、又」三种重复与承接</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ: 就 / 再 / 又</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L15</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「再」指将来、「又」指已发生；越南语都用 &quot;lại&quot;，必须靠时间词区分。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
  ]},
  {title:"四、单元三 时间、顺序与频率", id:"hsk2-g3", children:[
    {title:"L17 时间点与时段（几点 / 多长时间）", id:"hsk2-l17", html:"<h1>L17 · 时间点与时段（几点 / 多长时间）</h1>\n<div class=\"lead\">能说具体时刻与时长</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>时间点 + 动词　｜　动词 + 时段</b></td></tr>\n<tr><td>教学目标</td><td>能说具体时刻与时长</td></tr>\n<tr><td>Tiếng Việt</td><td>Thời điểm và khoảng thời gian</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">时间点在动词<b>前</b>、时段在动词<b>后</b>（我三点看书 / 我看三小时书）；越南语两者都在后，语序要专门练。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L18 从…到… / 从…开始", id:"hsk2-l18", html:"<h1>L18 · 从…到… / 从…开始</h1>\n<div class=\"lead\">能表达时间与空间的起止</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>从 + 起点 + 到 + 终点</b></td></tr>\n<tr><td>教学目标</td><td>能表达时间与空间的起止</td></tr>\n<tr><td>Tiếng Việt</td><td>从…到… / 从…开始</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;từ…đến…&quot; 结构一致，迁移较易；注意「到」后不能加「了」。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L19 「第」表示顺序与序数表达", id:"hsk2-l19", html:"<h1>L19 · 「第」表示顺序与序数表达</h1>\n<div class=\"lead\">能说「第一次、第三天、第一名」</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>第 + 数词 +（量词 / 名词）</b></td></tr>\n<tr><td>教学目标</td><td>能说「第一次、第三天、第一名」</td></tr>\n<tr><td>Tiếng Việt</td><td>Số thứ tự với 第</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「第」后面必须有数词，不能单说「第天」；越南语 &quot;thứ&quot; 用法相近。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L20 时间副词：一直 / 从来 / 总是 / 有时候", id:"hsk2-l20", html:"<h1>L20 · 时间副词：一直 / 从来 / 总是 / 有时候</h1>\n<div class=\"lead\">能表达持续、习惯与频率</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>一直 + 动词　｜　从来不 + 动词　｜　总是 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>能表达持续、习惯与频率</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ thời gian: 一直 / 从来 / 总是</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「从来」多用于否定（从来没去过），肯定式罕见，学员容易误用。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L21 频率表达：每、一次、多久一次", id:"hsk2-l21", html:"<h1>L21 · 频率表达：每、一次、多久一次</h1>\n<div class=\"lead\">能回答「多长时间一次」</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>每 + 时间词 + 动词 + 次数（一天三次）</b></td></tr>\n<tr><td>教学目标</td><td>能回答「多长时间一次」</td></tr>\n<tr><td>Tiếng Việt</td><td>Tần suất: 每, 一次, bao lâu một lần</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L20</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">频率短语「一天三次」整体在动词前，不能拆开分置动词两侧。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L22 一边…一边…", id:"hsk2-l22", html:"<h1>L22 · 一边…一边…</h1>\n<div class=\"lead\">能表达两个动作同时进行</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>一边 + 动词1 + 一边 + 动词2</b></td></tr>\n<tr><td>教学目标</td><td>能表达两个动作同时进行</td></tr>\n<tr><td>Tiếng Việt</td><td>一边…一边…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L20</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">两个动作必须<b>同时</b>进行；先后发生的动作要用「先…然后…」（L23）。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L23 先…然后…最后…", id:"hsk2-l23", html:"<h1>L23 · 先…然后…最后…</h1>\n<div class=\"lead\">能按顺序叙述流程（作业流程、操作步骤）</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>先 + 动词1，然后 + 动词2，最后 + 动词3</b></td></tr>\n<tr><td>教学目标</td><td>能按顺序叙述流程（作业流程、操作步骤）</td></tr>\n<tr><td>Tiếng Việt</td><td>先…然后…最后…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L22</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">连接词放在<b>主语之后</b>：「我先去，然后你去」不能说「先我去」。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L24 时间与顺序综合表达", id:"hsk2-l24", html:"<h1>L24 · 时间与顺序综合表达</h1>\n<div class=\"lead\">能完整叙述一天或一个工作流程</div>\n<table>\n<tr><td>所属单元</td><td>单元三 · 时间、顺序与频率（Thời gian, trình tự và tần suất）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>本单元语法点综合运用</b></td></tr>\n<tr><td>教学目标</td><td>能完整叙述一天或一个工作流程</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp thời gian và trình tự</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17、L18、L19、L20、L21、L22、L23</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">综合课重点不是新知识，而是把时间词与频率词放进同一个句子里不打架。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
  ]},
  {title:"五、单元四 因果、转折与条件", id:"hsk2-g4", children:[
    {title:"L25 因为…所以…", id:"hsk2-l25", html:"<h1>L25 · 因为…所以…</h1>\n<div class=\"lead\">能说明原因与结果</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>因为 + 原因，所以 + 结果</b></td></tr>\n<tr><td>教学目标</td><td>能说明原因与结果</td></tr>\n<tr><td>Tiếng Việt</td><td>因为…所以…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;vì…nên…&quot; 对应完整，但学员常只说「因为」漏掉「所以」；前后分句主语相同时后一主语可省。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L26 虽然…但是…", id:"hsk2-l26", html:"<h1>L26 · 虽然…但是…</h1>\n<div class=\"lead\">能表达让步与转折</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>虽然 + 让步，但是 + 转折</b></td></tr>\n<tr><td>教学目标</td><td>能表达让步与转折</td></tr>\n<tr><td>Tiếng Việt</td><td>虽然…但是…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L25</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「虽然」和「但是」必须配对出现，不能像越南语 &quot;tuy…nhưng…&quot; 那样省略其一。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L27 但是 / 可是 / 不过（转折三兄弟）", id:"hsk2-l27", html:"<h1>L27 · 但是 / 可是 / 不过（转折三兄弟）</h1>\n<div class=\"lead\">区分三种转折词的语气强弱与语体</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>句子 + 但是 / 可是 / 不过 + 句子</b></td></tr>\n<tr><td>教学目标</td><td>区分三种转折词的语气强弱与语体</td></tr>\n<tr><td>Tiếng Việt</td><td>但是 / 可是 / 不过</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L26</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">三者语体轻重不同：「但是」最正式、「可是」中性、「不过」最口语，可单用不配「虽然」。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L28 如果…就…", id:"hsk2-l28", html:"<h1>L28 · 如果…就…</h1>\n<div class=\"lead\">能表达假设条件</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>如果 + 条件，就 + 结果</b></td></tr>\n<tr><td>教学目标</td><td>能表达假设条件</td></tr>\n<tr><td>Tiếng Việt</td><td>如果…就…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L25</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;nếu…thì…&quot; 结构一致；关键是「就」必须放在主语<b>之后</b>（我就去）。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L29 只要…就… / 只有…才…", id:"hsk2-l29", html:"<h1>L29 · 只要…就… / 只有…才…</h1>\n<div class=\"lead\">能表达必要条件与充分条件</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>只要 + 条件 + 就　｜　只有 + 条件 + 才</b></td></tr>\n<tr><td>教学目标</td><td>能表达必要条件与充分条件</td></tr>\n<tr><td>Tiếng Việt</td><td>只要…就… / 只有…才…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L28</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「只要…就」是<b>充分条件</b>（够了就行）、「只有…才」是<b>必要条件</b>（非它不可）；越南语都译 &quot;chỉ cần / chỉ có&quot;，最易混。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L30 不但…而且…", id:"hsk2-l30", html:"<h1>L30 · 不但…而且…</h1>\n<div class=\"lead\">能表达递进</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>不但 + A，而且 + B</b></td></tr>\n<tr><td>教学目标</td><td>能表达递进</td></tr>\n<tr><td>Tiếng Việt</td><td>不但…而且…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L26</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">递进关系，B 比 A 更进一步；越南语 &quot;không những…mà còn…&quot; 结构对应。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L31 或者 / 还是（选择）", id:"hsk2-l31", html:"<h1>L31 · 或者 / 还是（选择）</h1>\n<div class=\"lead\">区分陈述选择与疑问选择</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>或者（陈述句）　｜　还是（疑问句）</b></td></tr>\n<tr><td>教学目标</td><td>区分陈述选择与疑问选择</td></tr>\n<tr><td>Tiếng Việt</td><td>或者 / 还是</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L27</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语陈述用 &quot;hoặc&quot;、疑问用 &quot;hay&quot;，汉语靠「或者 / 还是」区分，规则一致但需明说。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L32 复句综合：因果 / 转折 / 条件 / 递进", id:"hsk2-l32", html:"<h1>L32 · 复句综合：因果 / 转折 / 条件 / 递进</h1>\n<div class=\"lead\">能在一段话里混用多种复句</div>\n<table>\n<tr><td>所属单元</td><td>单元四 · 因果、转折与条件（Nhân quả, chuyển ý và điều kiện）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>本单元关联词综合运用</b></td></tr>\n<tr><td>教学目标</td><td>能在一段话里混用多种复句</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp câu ghép</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L25、L26、L27、L28、L29、L30、L31</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">复句是二级的分水岭：综合课要求学员能自己选对关联词，而不只是认得出。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
  ]},
  {title:"六、单元五 存在、方位与移动", id:"hsk2-g5", children:[
    {title:"L33 存现句：处所 + 有 / 是", id:"hsk2-l33", html:"<h1>L33 · 存现句：处所 + 有 / 是</h1>\n<div class=\"lead\">能说「桌子上有一本书」</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>处所词 + 有 + 人 / 物　｜　处所词 + 动词 + 着 + 人 / 物</b></td></tr>\n<tr><td>教学目标</td><td>能说「桌子上有一本书」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu tồn hiện: nơi chốn + 有 / 是</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">汉语把<b>处所词放句首</b>（桌上有一本书），越南语语序不同，学员易说成「一本书在桌上」。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L34 方位词与「在 / 有」", id:"hsk2-l34", html:"<h1>L34 · 方位词与「在 / 有」</h1>\n<div class=\"lead\">能准确描述位置关系（里外上下前后旁边）</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>名词 + 上 / 下 / 里 / 外 / 前 / 后 / 左 / 右 / 旁边</b></td></tr>\n<tr><td>教学目标</td><td>能准确描述位置关系（里外上下前后旁边）</td></tr>\n<tr><td>Tiếng Việt</td><td>Từ phương vị và 在 / 有</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L33</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语 &quot;trên / dưới / trong&quot; 也后置，语序一致；难点在「里」与「中」的取舍。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L35 介词：从 / 往 / 向", id:"hsk2-l35", html:"<h1>L35 · 介词：从 / 往 / 向</h1>\n<div class=\"lead\">能表达起点与方向</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>从 + 起点 + 动词　｜　往 / 向 + 方向 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>能表达起点与方向</td></tr>\n<tr><td>Tiếng Việt</td><td>Giới từ: 从 / 往 / 向</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L18</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「往」多接方向（往前走）、「向」可接对象（向他学习）；越南语 &quot;về / hướng&quot; 分工不同。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L36 趋向补语：来 / 去", id:"hsk2-l36", html:"<h1>L36 · 趋向补语：来 / 去</h1>\n<div class=\"lead\">能说「进来、出去、上来、下去」</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 来 / 去</b></td></tr>\n<tr><td>教学目标</td><td>能说「进来、出去、上来、下去」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ xu hướng: 来 / 去</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">用「来」还是「去」取决于<b>说话人的位置</b>，不是动作方向本身，学员最容易搞反。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L37 趋向补语扩展：上/下/进/出/回/过/起", id:"hsk2-l37", html:"<h1>L37 · 趋向补语扩展：上/下/进/出/回/过/起</h1>\n<div class=\"lead\">掌握常用趋向补语组合</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 上 / 下 / 出 / 起 / 回 / 过 + 来 / 去</b></td></tr>\n<tr><td>教学目标</td><td>掌握常用趋向补语组合</td></tr>\n<tr><td>Tiếng Việt</td><td>Mở rộng bổ ngữ xu hướng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L36</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">复合趋向补语还有引申义（说起来 = 开始说），不能只按字面理解。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L38 动态助词「着」：状态持续", id:"hsk2-l38", html:"<h1>L38 · 动态助词「着」：状态持续</h1>\n<div class=\"lead\">能说「门开着、他站着」</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 着（表示状态持续）</b></td></tr>\n<tr><td>教学目标</td><td>能说「门开着、他站着」</td></tr>\n<tr><td>Tiếng Việt</td><td>Trợ từ 着 (trạng thái duy trì)</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L13</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「着」表持续状态（门开着），越南语没有对应助词，需靠「đang / vẫn」意译体会。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L39 动词 + 着 + 动词", id:"hsk2-l39", html:"<h1>L39 · 动词 + 着 + 动词</h1>\n<div class=\"lead\">能表达伴随动作与方式</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词1 + 着 + 动词2（两个动作同时）</b></td></tr>\n<tr><td>教学目标</td><td>能表达伴随动作与方式</td></tr>\n<tr><td>Tiếng Việt</td><td>Động từ + 着 + động từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L38、L22</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">与「一边…一边…」近义，但「V 着 V」更强调<b>伴随状态</b>（笑着说）。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L40 移动与方位综合", id:"hsk2-l40", html:"<h1>L40 · 移动与方位综合</h1>\n<div class=\"lead\">能完整描述路线与位置</div>\n<table>\n<tr><td>所属单元</td><td>单元五 · 存在、方位与移动（Tồn tại, phương vị và di chuyển）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>本单元语法点综合运用</b></td></tr>\n<tr><td>教学目标</td><td>能完整描述路线与位置</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp phương vị và di chuyển</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L33、L34、L35、L36、L37、L38、L39</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">方位与趋向是工厂场景的高频表达，综合课直接对接「东西放哪儿、怎么搬」的真实任务。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
  ]},
  {title:"七、单元六 职场与生活场景综合", id:"hsk2-g6", children:[
    {title:"L41 兼语句：让 / 请 / 叫 / 使", id:"hsk2-l41", html:"<h1>L41 · 兼语句：让 / 请 / 叫 / 使</h1>\n<div class=\"lead\">能表达「让他做、请他帮忙」</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 让 / 请 / 叫 / 使 + 宾语 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>能表达「让他做、请他帮忙」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu kiêm ngữ: 让 / 请 / 叫 / 使</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L28</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">兼语句的第二个动词由<b>宾语</b>发出，不是主语；越南语 &quot;để / cho&quot; 结构不同，易混。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L42 双宾语句：给 / 送 / 教 / 问", id:"hsk2-l42", html:"<h1>L42 · 双宾语句：给 / 送 / 教 / 问</h1>\n<div class=\"lead\">能说「给我一本书、问他一个问题」</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 人 + 物（给 / 送 / 教 / 问）</b></td></tr>\n<tr><td>教学目标</td><td>能说「给我一本书、问他一个问题」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu hai tân ngữ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L41</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">双宾语顺序固定为<b>人前物后</b>（给我一本书），越南语顺序相同，迁移较易。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L43 连动句：去…买… / 来…帮助…", id:"hsk2-l43", html:"<h1>L43 · 连动句：去…买… / 来…帮助…</h1>\n<div class=\"lead\">能连说两个动作</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 动词1 + 动词2（同一主语连续动作）</b></td></tr>\n<tr><td>教学目标</td><td>能连说两个动作</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu liên động</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L42</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">连动句两个动词同一主语（去商店买东西）；兼语句两个动词不同主语，必须对比讲。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L44 语气助词：吧 / 呢 / 啊", id:"hsk2-l44", html:"<h1>L44 · 语气助词：吧 / 呢 / 啊</h1>\n<div class=\"lead\">能表达建议、疑问、感叹语气</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>吧 / 呢 / 啊 / 嘛</b></td></tr>\n<tr><td>教学目标</td><td>能表达建议、疑问、感叹语气</td></tr>\n<tr><td>Tiếng Việt</td><td>Trợ từ ngữ khí: 吧 / 呢 / 啊</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L27</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语语气词 &quot;nhé / nhỉ / ạ&quot; 与汉语不完全对应，需要按「疑问 / 确认 / 感叹」功能教。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L45 「是…的」强调句", id:"hsk2-l45", html:"<h1>L45 · 「是…的」强调句</h1>\n<div class=\"lead\">能强调时间、地点、方式</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>是 +（时间 / 地点 / 方式）+ 动词 + 的</b></td></tr>\n<tr><td>教学目标</td><td>能强调时间、地点、方式</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu nhấn mạnh 是…的</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L44</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「是…的」只用于<b>已经发生</b>的动作，强调状语部分；不能用于将来的事。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L46 话题：工作与任务安排", id:"hsk2-l46", html:"<h1>L46 · 话题：工作与任务安排</h1>\n<div class=\"lead\">能接任务、报进度、问要求</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>职场任务场景综合（安排工作、汇报进度）</b></td></tr>\n<tr><td>教学目标</td><td>能接任务、报进度、问要求</td></tr>\n<tr><td>Tiếng Việt</td><td>Chủ đề: công việc và phân công</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L41、L42、L43、L44、L45</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">本课不再引入新语法，重点是把二级全部句式放进真实工作对话里串起来。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L47 话题：工厂与安全", id:"hsk2-l47", html:"<h1>L47 · 话题：工厂与安全</h1>\n<div class=\"lead\">能听懂安全要求、报告异常</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>工厂与安全场景综合（指令、警示、流程）</b></td></tr>\n<tr><td>教学目标</td><td>能听懂安全要求、报告异常</td></tr>\n<tr><td>Tiếng Việt</td><td>Chủ đề: nhà máy và an toàn</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L46</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">安全指令多用祈使句与「得 / 必须」，越南学员易漏「请 / 要」显得生硬。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L48 话题：购物与服务", id:"hsk2-l48", html:"<h1>L48 · 话题：购物与服务</h1>\n<div class=\"lead\">能问价、比较、投诉与致谢</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>购物与服务场景综合（询价、退换、投诉）</b></td></tr>\n<tr><td>教学目标</td><td>能问价、比较、投诉与致谢</td></tr>\n<tr><td>Tiếng Việt</td><td>Chủ đề: mua sắm và dịch vụ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L47</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">询价与退换高频使用「比」字句（L01）与「没有」比较（L03），是前四单元的回收。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L49 话题：健康与看病", id:"hsk2-l49", html:"<h1>L49 · 话题：健康与看病</h1>\n<div class=\"lead\">能描述症状、请假、遵医嘱</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>健康与看病场景综合（描述症状、请假）</b></td></tr>\n<tr><td>教学目标</td><td>能描述症状、请假、遵医嘱</td></tr>\n<tr><td>Tiếng Việt</td><td>Chủ đề: sức khỏe và khám bệnh</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L48</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">描述症状常用结果补语与程度补语（L07、L09），要提醒学员别退回单句表达。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L50 综合复习与结课准备", id:"hsk2-l50", html:"<h1>L50 · 综合复习与结课准备</h1>\n<div class=\"lead\">串起全部语法点，做结课测验演练</div>\n<table>\n<tr><td>所属单元</td><td>单元六 · 职场与生活场景综合（Tổng hợp tình huống công việc và đời sống）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>全级 50 课语法点与 751 词总复习</b></td></tr>\n<tr><td>教学目标</td><td>串起全部语法点，做结课测验演练</td></tr>\n<tr><td>Tiếng Việt</td><td>Ôn tập tổng hợp và chuẩn bị kiểm tra</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01、L02、L03、L04、L05、L06、L07、L08、L09、L10、L11、L12、L13、L14、L15、L16、L17、L18、L19、L20、L21、L22、L23、L24、L25、L26、L27、L28、L29、L30、L31、L32、L33、L34、L35、L36、L37、L38、L39、L40、L41、L42、L43、L44、L45、L46、L47、L48、L49</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">结课复习按「单元 → 语法点 → 高频词」三层回收；本课之后进入结课测验。</div>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"八、语法点索引", id:"hsk2-g8", children:[
    {title:"8.1 全部语法点（50 个）", id:"hsk2-gr1", html:"<h1>全部语法点（50 个）</h1>\n<div class=\"lead\">二级的课次顺序 = 语法难度递进顺序。这张表是备课与复习的总索引：\n左边单元、中间课次、右边结构公式。「前置」列是学该课前必须先掌握的课次，\n排课时如果学员缺课，照这一列补。「教案」列标出哪些课已经有完整教案正文。</div>\n<table>\n<tr><td>单元</td><td>课次</td><td>语法点</td><td>结构公式</td><td>前置</td><td>词量</td><td>教案</td></tr>\n<tr><td><b>一</b></td><td class='mono'>L01</td><td>A 比 B + 形容词</td><td class='mono'>A + 比 + B + 形容词</td><td>—</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L02</td><td>比字句扩展：数量、一点儿、得多、还/更</td><td class='mono'>A + 比 + B + 形容词 + 一点儿 / 得多 / 数量词</td><td>L01</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L03</td><td>A 没有 B + 形容词（否定比较）</td><td class='mono'>A + 没有 + B +（这么 / 那么）+ 形容词</td><td>L01</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L04</td><td>A 跟 B 一样 / 不一样</td><td class='mono'>A + 跟 + B + 一样 +（形容词）　｜　A + 跟 + B + 不一样</td><td>L01、L03</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L05</td><td>程度副词：最 / 更</td><td class='mono'>最 + 形容词　｜　更 + 形容词</td><td>L01</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L06</td><td>程度副词：特别 / 非常 / 真</td><td class='mono'>特别 / 非常 + 形容词　｜　真 + 形容词 + 啊</td><td>L05</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L07</td><td>程度补语：V + 得 + 形容词</td><td class='mono'>主语 + 动词 + 得 + 形容词（他跑得快）</td><td>L01</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>一</b></td><td class='mono'>L08</td><td>程度补语扩展：否定式与疑问式</td><td class='mono'>动词 + 得不 + 形容词　｜　动词 + 得 + 形容词 + 吗 / 正反疑问</td><td>L07</td><td>15</td><td>✓ 已写</td></tr><tr><td><b>二</b></td><td class='mono'>L09</td><td>结果补语：完 / 好</td><td class='mono'>动词 + 完 / 好</td><td>L07</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L10</td><td>结果补语：到 / 见</td><td class='mono'>动词 + 到 / 见</td><td>L09</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L11</td><td>结果补语：懂 / 会 / 错</td><td class='mono'>动词 + 懂 / 会 / 错</td><td>L09</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L12</td><td>结果补语综合与高频搭配</td><td class='mono'>动词 + 结果补语 +（宾语）</td><td>L09、L10、L11</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L13</td><td>动态助词「了」：完成</td><td class='mono'>动词 + 了 +（数量）+ 宾语</td><td>L09</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L14</td><td>动态助词「过」：经历</td><td class='mono'>动词 + 过</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L15</td><td>副词：已经 / 刚 / 才</td><td class='mono'>已经 + 动词 + 了　｜　刚 + 动词　｜　才 + 动词</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>二</b></td><td class='mono'>L16</td><td>副词：就 / 再 / 又</td><td class='mono'>就（早 / 快）　｜　再（将来重复）　｜　又（过去重复）</td><td>L15</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L17</td><td>时间点与时段（几点 / 多长时间）</td><td class='mono'>时间点 + 动词　｜　动词 + 时段</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L18</td><td>从…到… / 从…开始</td><td class='mono'>从 + 起点 + 到 + 终点</td><td>L17</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L19</td><td>「第」表示顺序与序数表达</td><td class='mono'>第 + 数词 +（量词 / 名词）</td><td>L17</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L20</td><td>时间副词：一直 / 从来 / 总是 / 有时候</td><td class='mono'>一直 + 动词　｜　从来不 + 动词　｜　总是 + 动词</td><td>L17</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L21</td><td>频率表达：每、一次、多久一次</td><td class='mono'>每 + 时间词 + 动词 + 次数（一天三次）</td><td>L20</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L22</td><td>一边…一边…</td><td class='mono'>一边 + 动词1 + 一边 + 动词2</td><td>L20</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L23</td><td>先…然后…最后…</td><td class='mono'>先 + 动词1，然后 + 动词2，最后 + 动词3</td><td>L22</td><td>0</td><td>待写</td></tr><tr><td><b>三</b></td><td class='mono'>L24</td><td>时间与顺序综合表达</td><td class='mono'>本单元语法点综合运用</td><td>L17、L18、L19、L20、L21、L22、L23</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L25</td><td>因为…所以…</td><td class='mono'>因为 + 原因，所以 + 结果</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L26</td><td>虽然…但是…</td><td class='mono'>虽然 + 让步，但是 + 转折</td><td>L25</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L27</td><td>但是 / 可是 / 不过（转折三兄弟）</td><td class='mono'>句子 + 但是 / 可是 / 不过 + 句子</td><td>L26</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L28</td><td>如果…就…</td><td class='mono'>如果 + 条件，就 + 结果</td><td>L25</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L29</td><td>只要…就… / 只有…才…</td><td class='mono'>只要 + 条件 + 就　｜　只有 + 条件 + 才</td><td>L28</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L30</td><td>不但…而且…</td><td class='mono'>不但 + A，而且 + B</td><td>L26</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L31</td><td>或者 / 还是（选择）</td><td class='mono'>或者（陈述句）　｜　还是（疑问句）</td><td>L27</td><td>0</td><td>待写</td></tr><tr><td><b>四</b></td><td class='mono'>L32</td><td>复句综合：因果 / 转折 / 条件 / 递进</td><td class='mono'>本单元关联词综合运用</td><td>L25、L26、L27、L28、L29、L30、L31</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L33</td><td>存现句：处所 + 有 / 是</td><td class='mono'>处所词 + 有 + 人 / 物　｜　处所词 + 动词 + 着 + 人 / 物</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L34</td><td>方位词与「在 / 有」</td><td class='mono'>名词 + 上 / 下 / 里 / 外 / 前 / 后 / 左 / 右 / 旁边</td><td>L33</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L35</td><td>介词：从 / 往 / 向</td><td class='mono'>从 + 起点 + 动词　｜　往 / 向 + 方向 + 动词</td><td>L18</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L36</td><td>趋向补语：来 / 去</td><td class='mono'>动词 + 来 / 去</td><td>L09</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L37</td><td>趋向补语扩展：上/下/进/出/回/过/起</td><td class='mono'>动词 + 上 / 下 / 出 / 起 / 回 / 过 + 来 / 去</td><td>L36</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L38</td><td>动态助词「着」：状态持续</td><td class='mono'>动词 + 着（表示状态持续）</td><td>L13</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L39</td><td>动词 + 着 + 动词</td><td class='mono'>动词1 + 着 + 动词2（两个动作同时）</td><td>L38、L22</td><td>0</td><td>待写</td></tr><tr><td><b>五</b></td><td class='mono'>L40</td><td>移动与方位综合</td><td class='mono'>本单元语法点综合运用</td><td>L33、L34、L35、L36、L37、L38、L39</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L41</td><td>兼语句：让 / 请 / 叫 / 使</td><td class='mono'>主语 + 让 / 请 / 叫 / 使 + 宾语 + 动词</td><td>L28</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L42</td><td>双宾语句：给 / 送 / 教 / 问</td><td class='mono'>动词 + 人 + 物（给 / 送 / 教 / 问）</td><td>L41</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L43</td><td>连动句：去…买… / 来…帮助…</td><td class='mono'>主语 + 动词1 + 动词2（同一主语连续动作）</td><td>L42</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L44</td><td>语气助词：吧 / 呢 / 啊</td><td class='mono'>吧 / 呢 / 啊 / 嘛</td><td>L27</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L45</td><td>「是…的」强调句</td><td class='mono'>是 +（时间 / 地点 / 方式）+ 动词 + 的</td><td>L44</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L46</td><td>话题：工作与任务安排</td><td class='mono'>职场任务场景综合（安排工作、汇报进度）</td><td>L41、L42、L43、L44、L45</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L47</td><td>话题：工厂与安全</td><td class='mono'>工厂与安全场景综合（指令、警示、流程）</td><td>L46</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L48</td><td>话题：购物与服务</td><td class='mono'>购物与服务场景综合（询价、退换、投诉）</td><td>L47</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L49</td><td>话题：健康与看病</td><td class='mono'>健康与看病场景综合（描述症状、请假）</td><td>L48</td><td>0</td><td>待写</td></tr><tr><td><b>六</b></td><td class='mono'>L50</td><td>综合复习与结课准备</td><td class='mono'>全级 50 课语法点与 751 词总复习</td><td>L01、L02、L03、L04、L05、L06、L07、L08、L09、L10、L11、L12、L13、L14、L15、L16、L17、L18、L19、L20、L21、L22、L23、L24、L25、L26、L27、L28、L29、L30、L31、L32、L33、L34、L35、L36、L37、L38、L39、L40、L41、L42、L43、L44、L45、L46、L47、L48、L49</td><td>0</td><td>待写</td></tr>\n</table>"}
