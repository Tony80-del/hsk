  {title:"四、单元3 经济与商业", id:"hsk3-g3", children:[
    {title:"L17 比较：不如 / 没有…这么", id:"hsk3-l17", html:"<h1>L17 · 比较：不如 / 没有…这么</h1>\n<div class=\"lead\">掌握「不如」与「没有…这么」，能表达「比不上」</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A + 不如 + B +（形容词）｜ A + 没有 + B +（这么/那么）+ 形容词</b></td></tr>\n<tr><td>教学目标</td><td>掌握「不如」与「没有…这么」，能表达「比不上」</td></tr>\n<tr><td>Tiếng Việt</td><td>So sánh: 「不如」「没有…这么」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「不如」后面形容词可省（我不如他），「没有」后面<b>必须</b>有形容词或「这么」。越南语 &quot;không bằng&quot; 两种都能覆盖，学员会漏掉「这么」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">美元</td><td class=\"pyc\">Měi yuán</td><td class=\"hv\">mỹ nguyên</td><td>đô la Mỹ；đô la Hoa Kỳ</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">人民币</td><td class=\"pyc\">rén mín bì</td><td class=\"hv\">nhân dân tệ</td><td>Nhân dân tệ (NDT)；Đồng Yuan Trung Quốc (CNY)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">金</td><td class=\"pyc\">jīn</td><td class=\"hv\">kim</td><td>vàng；nguyên tố hóa học Au</td><td class=\"hint\">区别词 / 语素</td></tr><tr><td class=\"hz\">银</td><td class=\"pyc\">yín</td><td class=\"hv\">ngân</td><td>bạc；màu bạc</td><td class=\"hint\">区别词 / 语素</td></tr><tr><td class=\"hz\">现金</td><td class=\"pyc\">xiàn jīn</td><td class=\"hv\">hiện kim</td><td>tiền mặt</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">资金</td><td class=\"pyc\">zī jīn</td><td class=\"hv\">tư kim</td><td>quỹ; vốn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">费用</td><td class=\"pyc\">fèi yòng</td><td class=\"hv\">phí dụng</td><td>chi phí；kinh phí</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">收费</td><td class=\"pyc\">shōu fèi</td><td class=\"hv\">thu phí</td><td>thu phí</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">交费</td><td class=\"pyc\">jiāo fèi</td><td class=\"hv\">giao phí</td><td>trả phí</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">支付</td><td class=\"pyc\">zhī fù</td><td class=\"hv\">chi phó</td><td>trả tiền</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">付</td><td class=\"pyc\">fù</td><td class=\"hv\">phó</td><td>trả；giao cho</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">票价</td><td class=\"pyc\">piào jià</td><td class=\"hv\">phiếu giới</td><td>giá vé; giá vé xe; phí vào cửa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">价钱</td><td class=\"pyc\">jià qian</td><td class=\"hv\">giới tiền</td><td>giá cả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">价格</td><td class=\"pyc\">jià gé</td><td class=\"hv\">giới cách</td><td>giá</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">消费</td><td class=\"pyc\">xiāo fèi</td><td class=\"hv\">tiêu phí</td><td>tiêu thụ</td><td class=\"hint\">动名词 / 动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L18 「越来越」「越…越…」", id:"hsk3-l18", html:"<h1>L18 · 「越来越」「越…越…」</h1>\n<div class=\"lead\">掌握两种「越」结构，能表达递进变化</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>越来越 + 形容词 ｜ 越 + A + 越 + B（越来越热 / 越说越快）</b></td></tr>\n<tr><td>教学目标</td><td>掌握两种「越」结构，能表达递进变化</td></tr>\n<tr><td>Tiếng Việt</td><td>「越来越」「越…越…」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">两者后面<b>只能</b>接形容词或心理动词（× 越来越吃饭）。越南语 &quot;ngày càng / càng…càng&quot; 结构相似，这一条学员接受得快。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">浪费</td><td class=\"pyc\">làng fèi</td><td class=\"hv\">lãng phí</td><td>lãng phí；phung phí</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">牌子</td><td class=\"pyc\">pái zi</td><td class=\"hv\">bài tử</td><td>biển hiệu；thương hiệu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">约</td><td class=\"pyc\">yuē</td><td class=\"hv\">ước</td><td>hẹn；mời</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">支</td><td class=\"pyc\">zhī</td><td class=\"hv\">chi</td><td>hỗ trợ；duy trì</td><td class=\"hint\">量词 / 动词</td></tr><tr><td class=\"hz\">经济</td><td class=\"pyc\">jīng jì</td><td class=\"hv\">kinh tể</td><td>kinh tế；thuộc về kinh tế</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">市场</td><td class=\"pyc\">shì chǎng</td><td class=\"hv\">thị tràng</td><td>khu chợ；thị trường</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">商品</td><td class=\"pyc\">shāng pǐn</td><td class=\"hv\">thương phẩm</td><td>hàng hóa; sản phẩm; thương phẩm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">需求</td><td class=\"pyc\">xū qiú</td><td class=\"hv\">nhu cầu</td><td>yêu cầu；cần</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">开业</td><td class=\"pyc\">kāi yè</td><td class=\"hv\">khai nghiệp</td><td>khai trương kinh doanh；mở phòng khám</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">风险</td><td class=\"pyc\">fēng xiǎn</td><td class=\"hv\">phong hiểm</td><td>rủi ro; mối nguy</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">比较</td><td class=\"pyc\">bǐ jiào</td><td class=\"hv\">bỉ giác</td><td>so sánh；đối chiếu</td><td class=\"hint\">副词 / 动名词</td></tr><tr><td class=\"hz\">更加</td><td class=\"pyc\">gèng jiā</td><td class=\"hv\">canh gia</td><td>hơn (so với cái gì đó)；càng hơn</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">相当</td><td class=\"pyc\">xiāng dāng</td><td class=\"hv\">tương đương</td><td>tương đương；phù hợp</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">较</td><td class=\"pyc\">jiào</td><td class=\"hv\">giác</td><td>(hình thức ràng buộc) so sánh；(văn học) tranh luận</td><td class=\"hint\">副词 / 介词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L19 数量表达：倍数 / 分数 / 百分比 / 大约", id:"hsk3-l19", html:"<h1>L19 · 数量表达：倍数 / 分数 / 百分比 / 大约</h1>\n<div class=\"lead\">掌握倍数、分数、百分比与约数表达</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A 是 B 的 + 倍数 ｜ 几分之几 ｜ 百分之 + 数 ｜ 大约 / 左右 + 数量</b></td></tr>\n<tr><td>教学目标</td><td>掌握倍数、分数、百分比与约数表达</td></tr>\n<tr><td>Tiếng Việt</td><td>Biểu đạt số lượng: bội số / phân số / phần trăm / ước chừng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「是…的两倍」不能说「多两倍」（后者指净增两倍）。「百分之」是「一百份中的几份」，越南语 &quot;phần trăm&quot; 一致，好接受。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">相比</td><td class=\"pyc\">xiāng bǐ</td><td class=\"hv\">tương bỉ</td><td>so sánh</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">接近</td><td class=\"pyc\">jiē jìn</td><td class=\"hv\">tiếp cận</td><td>tiếp cận; đến gần</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">至少</td><td class=\"pyc\">zhì shǎo</td><td class=\"hv\">chí thiểu</td><td>ít nhất；(nói một cách) tối thiểu</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">大约</td><td class=\"pyc\">dà yuē</td><td class=\"hv\">đại ước</td><td>khoảng；chắc là</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">大概</td><td class=\"pyc\">dà gài</td><td class=\"hv\">đại khái</td><td>đại khái；có lẽ</td><td class=\"hint\">副词 / 名词</td></tr><tr><td class=\"hz\">将近</td><td class=\"pyc\">jiāng jìn</td><td class=\"hv\">tương cận</td><td>gần như；hầu như</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">比例</td><td class=\"pyc\">bǐ lì</td><td class=\"hv\">bỉ lệ</td><td>tỷ lệ；quy mô</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">数量</td><td class=\"pyc\">shù liàng</td><td class=\"hv\">sổ lượng</td><td>thuộc về số lượng；(toán) đại lượng vô hướng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">增长</td><td class=\"pyc\">zēng zhǎng</td><td class=\"hv\">tăng trường</td><td>tăng trưởng；tăng lên</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">增加</td><td class=\"pyc\">zēng jiā</td><td class=\"hv\">tăng gia</td><td>tăng; tăng thêm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">上升</td><td class=\"pyc\">shàng shēng</td><td class=\"hv\">thượng thăng</td><td>tăng lên；đi lên</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">退</td><td class=\"pyc\">tuì</td><td class=\"hv\">thối</td><td>rút lui; rút khỏi；từ chối; trả lại (cái gì đó)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">升</td><td class=\"pyc\">shēng</td><td class=\"hv\">thăng</td><td>thăng lên；tăng lên chức</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">退出</td><td class=\"pyc\">tuì chū</td><td class=\"hv\">thối xuất</td><td>rút lui；hủy bỏ</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L20 时量补语", id:"hsk3-l20", html:"<h1>L20 · 时量补语</h1>\n<div class=\"lead\">掌握时量补语，能说清「动作持续了多久」</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 了 + 时量 +（宾语）（等了两小时）｜ 动词 + 时量 + 的 + 宾语</b></td></tr>\n<tr><td>教学目标</td><td>掌握时量补语，能说清「动作持续了多久」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ thời lượng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">宾语是<b>普通名词</b>时要重复动词（看书看了一小时）；宾语是<b>人称代词</b>时不重复（等了他一小时）。越南语没有这个区分。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">缺</td><td class=\"pyc\">quē</td><td class=\"hv\">khuyết</td><td>sự thiếu；hụt</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">缺少</td><td class=\"pyc\">quē shǎo</td><td class=\"hv\">khuyết thiểu</td><td>thiếu；sự thiếu hụt</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">富</td><td class=\"pyc\">fù</td><td class=\"hv\">phú</td><td>giàu；có nhiều</td><td class=\"hint\">语素 / 形容词</td></tr><tr><td class=\"hz\">有的是</td><td class=\"pyc\">yǒu de shì</td><td class=\"hv\">hữu đích thị</td><td>có nhiều；không thiếu</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">共有</td><td class=\"pyc\">gòng yǒu</td><td class=\"hv\">cộng hữu</td><td>có tất cả；tổng cộng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">有利</td><td class=\"pyc\">yǒu lì</td><td class=\"hv\">hữu lợi</td><td>có lợi; thuận lợi</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">值</td><td class=\"pyc\">zhí</td><td class=\"hv\">—</td><td>giá trị；(thì) đáng</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">费</td><td class=\"pyc\">fèi</td><td class=\"hv\">phí</td><td>tốn；tiêu phí</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">发展</td><td class=\"pyc\">fā zhǎn</td><td class=\"hv\">phát triển</td><td>sự phát triển；tăng trưởng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">推广</td><td class=\"pyc\">tuī guǎng</td><td class=\"hv\">thôi nghiễm</td><td>mở rộng；lan rộng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">落后</td><td class=\"pyc\">luò hòu</td><td class=\"hv\">lạc hậu</td><td>tụt hậu；lạc hậu (về công nghệ, v.v.)</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">发达</td><td class=\"pyc\">fā dá</td><td class=\"hv\">phát đạt</td><td>phát triển tốt; hưng thịnh；phát triển; thúc đẩy; mở rộng</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">保险</td><td class=\"pyc\">bǎo xiǎn</td><td class=\"hv\">bảo hiểm</td><td>bảo hiểm；an toàn</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">成果</td><td class=\"pyc\">chéng guǒ</td><td class=\"hv\">thành quả</td><td>kết quả；thành tựu</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L21 动量补语", id:"hsk3-l21", html:"<h1>L21 · 动量补语</h1>\n<div class=\"lead\">掌握动量补语，能说清「动作做了几次」</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 数 + 次 / 遍 / 回 / 趟（去过三次 / 读了两遍）</b></td></tr>\n<tr><td>教学目标</td><td>掌握动量补语，能说清「动作做了几次」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ động lượng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L20</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「次」泛指次数、「遍」指从头到尾、「趟」指往返一次。越南语 &quot;lần&quot; 全包，学员会一律用「次」。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">成就</td><td class=\"pyc\">chéng jiù</td><td class=\"hv\">thành tựu</td><td>thành tựu；thành công</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">效果</td><td class=\"pyc\">xiào guǒ</td><td class=\"hv\">hiệu quả</td><td>kết quả；hiệu quả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">从事</td><td class=\"pyc\">cóng shì</td><td class=\"hv\">tòng sự</td><td>làm；gia nhập</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">领先</td><td class=\"pyc\">lǐng xiān</td><td class=\"hv\">lĩnh tiên</td><td>dẫn đầu；dẫn trước</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">不仅</td><td class=\"pyc\">bù jǐn</td><td class=\"hv\">bất cận</td><td>không chỉ; không giới hạn ở；(như một liên từ tương quan) không</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">不光</td><td class=\"pyc\">bù guāng</td><td class=\"hv\">bất quang</td><td>không phải duy nhất；không chỉ</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">不论</td><td class=\"pyc\">bù lùn</td><td class=\"hv\">bất luận</td><td>bất kể；cho dù là (ai, như thế nào, v.v.)</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">不必</td><td class=\"pyc\">bù bì</td><td class=\"hv\">bất tất</td><td>không cần；không phải</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">不得不</td><td class=\"pyc\">bù dé bù</td><td class=\"hv\">bất đắc bất</td><td>không có lựa chọn nào khác ngoài；phải</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">为了</td><td class=\"pyc\">wèi le</td><td class=\"hv\">vi liễu</td><td>để; nhằm mục đích; để mà</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">分别</td><td class=\"pyc\">fēn bié</td><td class=\"hv\">phân biệt</td><td>chia tay; rời nhau；phân biệt; nhận ra sự khác biệt</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">保证</td><td class=\"pyc\">bǎo zhèng</td><td class=\"hv\">bảo chứng</td><td>bảo đảm；đảm bảo</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">停止</td><td class=\"pyc\">tíng zhǐ</td><td class=\"hv\">đình chỉ</td><td>dừng; tạm dừng; ngừng lại</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">创造</td><td class=\"pyc\">chuàng zào</td><td class=\"hv\">sang tạo</td><td>tạo ra；mang lại</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L22 「不仅…而且」「不但…还」", id:"hsk3-l22", html:"<h1>L22 · 「不仅…而且」「不但…还」</h1>\n<div class=\"lead\">掌握递进复句，能表达「不止如此，还更进一步」</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>不仅 / 不但 + A，而且 / 还 / 也 + B</b></td></tr>\n<tr><td>教学目标</td><td>掌握递进复句，能表达「不止如此，还更进一步」</td></tr>\n<tr><td>Tiếng Việt</td><td>「不仅…而且」「不但…还」: không những…mà còn</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">前后分句主语<b>相同时</b>，「不仅」可在主语前也可在后；主语<b>不同时</b>必须放在主语前。越南语没有这个位置限制。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">前进</td><td class=\"pyc\">qián jìn</td><td class=\"hv\">tiền tiến</td><td>tiến lên；tiến về phía trước</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">变为</td><td class=\"pyc\">biàn wéi</td><td class=\"hv\">biến vi</td><td>thay đổi thành</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">变化</td><td class=\"pyc\">biàn huà</td><td class=\"hv\">biến hóa</td><td>thay đổi; biến đổi; biến hoá</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">同意</td><td class=\"pyc\">tóng yì</td><td class=\"hv\">đồng ý</td><td>đồng ý；tán thành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">坚决</td><td class=\"pyc\">jiān jué</td><td class=\"hv\">kiên quyết</td><td>vững vàng; kiên quyết; quyết tâm</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">复杂</td><td class=\"pyc\">fù zá</td><td class=\"hv\">phục tạp</td><td>phức tạp; rắc rối</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">好好</td><td class=\"pyc\">hǎo hǎo</td><td class=\"hv\">hảo hảo</td><td>tốt; cẩn thận; đẹp đẽ; đúng mực</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">存</td><td class=\"pyc\">cún</td><td class=\"hv\">tồn</td><td>tồn tại；gửi</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">展开</td><td class=\"pyc\">zhǎn kāi</td><td class=\"hv\">triển khai</td><td>mở ra; trải ra; mở rộng；phát động; tiến hành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">快速</td><td class=\"pyc\">kuài sù</td><td class=\"hv\">khoái tốc</td><td>nhanh; tốc độ cao; mau lẹ</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">已</td><td class=\"pyc\">yǐ</td><td class=\"hv\">dĩ</td><td>đã；ngừng</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">带领</td><td class=\"pyc\">dài lǐng</td><td class=\"hv\">đái lĩnh</td><td>dẫn dắt；lãnh đạo</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">形成</td><td class=\"pyc\">xíng chéng</td><td class=\"hv\">hình thành</td><td>hình thành; định hình</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">总</td><td class=\"pyc\">zǒng</td><td class=\"hv\">tổng</td><td>tổng thể; toàn bộ；tóm lại</td><td class=\"hint\">副词 / 区别词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L23 「既然…就」「只要…就」", id:"hsk3-l23", html:"<h1>L23 · 「既然…就」「只要…就」</h1>\n<div class=\"lead\">掌握因果与条件复句，能表达「既然这样那就…」「只要…就…」</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>既然 + 已定事实，就 + 结论 ｜ 只要 + 条件，就 + 结果</b></td></tr>\n<tr><td>教学目标</td><td>掌握因果与条件复句，能表达「既然这样那就…」「只要…就…」</td></tr>\n<tr><td>Tiếng Việt</td><td>「既然…就」「只要…就」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L22</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「既然」的根据是<b>已知事实</b>，「如果」是<b>假设</b>；越南语 &quot;nếu / vì&quot; 容易混。二者不能互换。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">意外</td><td class=\"pyc\">yì wài</td><td class=\"hv\">ý ngoại</td><td>bất ngờ；tai nạn</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">成功</td><td class=\"pyc\">chéng gōng</td><td class=\"hv\">thành công</td><td>thành công；sự thành công</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">打听</td><td class=\"pyc\">dǎ ting</td><td class=\"hv\">đả thính</td><td>hỏi thăm；tìm hiểu</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">打破</td><td class=\"pyc\">dǎ pò</td><td class=\"hv\">đả phá</td><td>làm vỡ; đập vỡ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">批评</td><td class=\"pyc\">pī píng</td><td class=\"hv\">phê bình</td><td>phê bình; chỉ trích；LT:次,番</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">把握</td><td class=\"pyc\">bǎ wò</td><td class=\"hv\">bả ác</td><td>nắm bắt (cũng nghĩa bóng)；nắm giữ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">排名</td><td class=\"pyc\">pái míng</td><td class=\"hv\">bài danh</td><td>xếp hạng (1, 2 v.v.)；bảng xếp hạng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">推进</td><td class=\"pyc\">tuī jìn</td><td class=\"hv\">thôi tiến</td><td>thúc đẩy；tiến hành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">提前</td><td class=\"pyc\">tí qián</td><td class=\"hv\">đề tiền</td><td>dời lên ngày sớm hơn；làm gì đó trước thời hạn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">整个</td><td class=\"pyc\">zhěng gè</td><td class=\"hv\">chỉnh cá</td><td>toàn bộ；toàn thể</td><td class=\"hint\">区别词 / 数词</td></tr><tr><td class=\"hz\">整齐</td><td class=\"pyc\">zhěng qí</td><td class=\"hv\">chỉnh tề</td><td>ngăn nắp；gọn gàng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">时刻</td><td class=\"pyc\">shí kè</td><td class=\"hv\">thì khắc</td><td>thời gian；thời điểm</td><td class=\"hint\">名词 / 副词</td></tr><tr><td class=\"hz\">明显</td><td class=\"pyc\">míng xiǎn</td><td class=\"hv\">minh hiển</td><td>rõ ràng；rõ rệt</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">本来</td><td class=\"pyc\">běn lái</td><td class=\"hv\">bổn lai</td><td>gốc gác；vốn dĩ</td><td class=\"hint\">副词 / 区别词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L24 单元三综合：商业汇报", id:"hsk3-l24", html:"<h1>L24 · 单元三综合：商业汇报</h1>\n<div class=\"lead\">综合运用比较、数量、补语与递进复句，完成一次商业数据汇报</div>\n<table>\n<tr><td>所属单元</td><td>单元3 · 经济与商业（Kinh tế và thương mại）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>不如 ｜ 越来越 ｜ 倍数 ｜ 时量/动量补语 ｜ 不仅…而且（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用比较、数量、补语与递进复句，完成一次商业数据汇报</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 3: Báo cáo kinh doanh</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L17、L19、L21、L22</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">报数据时量词与补语最容易错位（「增加了三倍」vs「增加了三倍」）。要固定「变化动词 + 了 + 数量」的模板。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">根本</td><td class=\"pyc\">gēn běn</td><td class=\"hv\">căn bổn</td><td>cơ bản；cơ sở</td><td class=\"hint\">副词 / 名词</td></tr><tr><td class=\"hz\">没用</td><td class=\"pyc\">méi yòng</td><td class=\"hv\">một dụng</td><td>vô dụng</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">注意</td><td class=\"pyc\">zhù yì</td><td class=\"hv\">chú ý</td><td>chú ý đến; quan tâm đến</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">消失</td><td class=\"pyc\">xiāo shī</td><td class=\"hv\">tiêu thất</td><td>biến mất; phai nhạt</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">深入</td><td class=\"pyc\">shēn rù</td><td class=\"hv\">thâm nhập</td><td>thâm nhập sâu；kỹ lưỡng</td><td class=\"hint\">动词 / 副形词</td></tr><tr><td class=\"hz\">深刻</td><td class=\"pyc\">shēn kè</td><td class=\"hv\">thâm khắc</td><td>sâu sắc；sâu</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">状态</td><td class=\"pyc\">zhuàng tài</td><td class=\"hv\">trạng thái</td><td>tình trạng; trạng thái; tình hình</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">理由</td><td class=\"pyc\">lǐ yóu</td><td class=\"hv\">lý do</td><td>lý do；cơ sở</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">目前</td><td class=\"pyc\">mù qián</td><td class=\"hv\">mục tiền</td><td>hiện tại；bây giờ</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">确实</td><td class=\"pyc\">què shí</td><td class=\"hv\">xác thật</td><td>thực sự；thật</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">终于</td><td class=\"pyc\">zhōng yú</td><td class=\"hv\">chung vu</td><td>cuối cùng；rốt cuộc</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">结束</td><td class=\"pyc\">jié shù</td><td class=\"hv\">kết thúc</td><td>chấm dứt；hoàn thành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">继续</td><td class=\"pyc\">jì xù</td><td class=\"hv\">kế tục</td><td>tiếp tục; tiến hành; tiếp diễn</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">达到</td><td class=\"pyc\">dá dào</td><td class=\"hv\">đạt đáo</td><td>đạt tới; đạt được; đạt đến</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">进一步</td><td class=\"pyc\">jìn yī bù</td><td class=\"hv\">tiến nhất bộ</td><td>tiến thêm một bước</td><td class=\"hint\">副词 / 区别词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"五、单元4 生产、科技与网络", id:"hsk3-g4", children:[
    {title:"L25 趋向补语（一）：动词 + 来 / 去", id:"hsk3-l25", html:"<h1>L25 · 趋向补语（一）：动词 + 来 / 去</h1>\n<div class=\"lead\">掌握基本趋向补语，能表达动作的方向</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 来 / 去（进来 / 出去 / 带来 / 拿去）</b></td></tr>\n<tr><td>教学目标</td><td>掌握基本趋向补语，能表达动作的方向</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ xu hướng (1): động từ + 来/去</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「来/去」以<b>说话人</b>为参照：朝向说话人用「来」，远离用「去」。越南语 &quot;đến / đi&quot; 以<b>目的地</b>为参照，参照点不同，学员常反。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">技术</td><td class=\"pyc\">jì shù</td><td class=\"hv\">kĩ thuật</td><td>công nghệ; kỹ thuật; kỹ năng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">科技</td><td class=\"pyc\">kē jì</td><td class=\"hv\">khoa kĩ</td><td>khoa học và công nghệ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">设计</td><td class=\"pyc\">shè jì</td><td class=\"hv\">thiết kế</td><td>thiết kế; lập kế hoạch；thiết kế; kế hoạch</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">发明</td><td class=\"pyc\">fā míng</td><td class=\"hv\">phát minh</td><td>phát minh；một phát minh</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">创新</td><td class=\"pyc\">chuàng xīn</td><td class=\"hv\">sang tân</td><td>đề xuất ý tưởng mới; mở đường mới；đổi mới</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">开发</td><td class=\"pyc\">kāi fā</td><td class=\"hv\">khai phát</td><td>khai thác (tài nguyên)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">试验</td><td class=\"pyc\">shì yàn</td><td class=\"hv\">thí nghiệm</td><td>thí nghiệm；kiểm tra</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">实验</td><td class=\"pyc\">shí yàn</td><td class=\"hv\">thật nghiệm</td><td>thí nghiệm；kiểm tra</td><td class=\"hint\">动名词 / 名词</td></tr><tr><td class=\"hz\">实验室</td><td class=\"pyc\">shí yàn shì</td><td class=\"hv\">thật nghiệm thất</td><td>phòng thí nghiệm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">应用</td><td class=\"pyc\">yìng yòng</td><td class=\"hv\">ứng dụng</td><td>đưa vào sử dụng; áp dụng；thực tiễn</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">自动</td><td class=\"pyc\">zì dòng</td><td class=\"hv\">tự động</td><td>tự động；tự nguyện</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">人工</td><td class=\"pyc\">rén gōng</td><td class=\"hv\">nhân công</td><td>nhân tạo；nhân lực</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">机器</td><td class=\"pyc\">jī qì</td><td class=\"hv\">cơ khí</td><td>máy móc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">设备</td><td class=\"pyc\">shè bèi</td><td class=\"hv\">thiết bị</td><td>thiết bị; cơ sở vật chất; lắp đặt</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L26 趋向补语（二）：动词 + 上来 / 下去 / 出来 / 起来", id:"hsk3-l26", html:"<h1>L26 · 趋向补语（二）：动词 + 上来 / 下去 / 出来 / 起来</h1>\n<div class=\"lead\">掌握复合趋向补语，能描述复杂位移</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 上/下/出/起 + 来/去（走上来 / 跑出去 / 拿出来）</b></td></tr>\n<tr><td>教学目标</td><td>掌握复合趋向补语，能描述复杂位移</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ xu hướng (2): động từ + 上来/下去/出来/起来</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L25</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">有宾语时位置有讲究：「拿出来一本书」「拿一本书出来」都对，但「拿一本书出来」不能是「拿出来一本书」以外的第三种序。处所宾语则必须夹在中间（× 走出去教室）。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">工具</td><td class=\"pyc\">gōng jù</td><td class=\"hv\">công cụ</td><td>công cụ；dụng cụ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">功能</td><td class=\"pyc\">gōng néng</td><td class=\"hv\">công năng</td><td>chức năng; khả năng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">制作</td><td class=\"pyc\">zhì zuò</td><td class=\"hv\">chế tác</td><td>làm; sản xuất</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">制造</td><td class=\"pyc\">zhì zào</td><td class=\"hv\">chế tạo</td><td>sản xuất; làm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">生产</td><td class=\"pyc\">shēng chǎn</td><td class=\"hv\">sinh sản</td><td>sản xuất; chế tạo；sinh con</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">加工</td><td class=\"pyc\">jiā gōng</td><td class=\"hv\">gia công</td><td>chế biến；xử lý</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">工厂</td><td class=\"pyc\">gōng chǎng</td><td class=\"hv\">công hán</td><td>nhà máy；LT:家,座</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">厂</td><td class=\"pyc\">chǎng</td><td class=\"hv\">hán</td><td>nhà máy；sân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">工业</td><td class=\"pyc\">gōng yè</td><td class=\"hv\">công nghiệp</td><td>công nghiệp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">农业</td><td class=\"pyc\">nóng yè</td><td class=\"hv\">nông nghiệp</td><td>nông nghiệp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">石油</td><td class=\"pyc\">shí yóu</td><td class=\"hv\">thạch du</td><td>dầu；dầu mỏ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">铁</td><td class=\"pyc\">tiě</td><td class=\"hv\">thiết</td><td>sắt (kim loại)；vũ khí</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">板</td><td class=\"pyc\">bǎn</td><td class=\"hv\">bản</td><td>tấm；ván</td><td class=\"hint\">语素 / 名词</td></tr><tr><td class=\"hz\">运输</td><td class=\"pyc\">yùn shū</td><td class=\"hv\">vận thâu</td><td>vận chuyển；mang</td><td class=\"hint\">动名词 / 动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L27 趋向补语的引申义：「起来」「下去」", id:"hsk3-l27", html:"<h1>L27 · 趋向补语的引申义：「起来」「下去」</h1>\n<div class=\"lead\">掌握趋向补语的引申用法，能表达「开始并继续」「继续下去」</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>形容词/动词 + 起来（表开始并持续）｜ 动词 + 下去（表继续）</b></td></tr>\n<tr><td>教学目标</td><td>掌握趋向补语的引申用法，能表达「开始并继续」「继续下去」</td></tr>\n<tr><td>Tiếng Việt</td><td>Nghĩa mở rộng của bổ ngữ xu hướng: 「起来」「下去」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L26</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「起来」的引申义与方向无关（笑起来了 = 开始笑），学员会按字面理解成「站起来」。必须整块教，不拆字。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">通信</td><td class=\"pyc\">tōng xìn</td><td class=\"hv\">thông tín</td><td>trao đổi thư từ；giao tiếp</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">改进</td><td class=\"pyc\">gǎi jìn</td><td class=\"hv\">cải tiến</td><td>cải thiện; làm cho tốt hơn；sự cải thiện</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">改造</td><td class=\"pyc\">gǎi zào</td><td class=\"hv\">cải tạo</td><td>cải tạo；cải cách</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">完善</td><td class=\"pyc\">wán shàn</td><td class=\"hv\">hoàn thiện</td><td>phát triển tốt；xuất sắc</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">加强</td><td class=\"pyc\">jiā qiáng</td><td class=\"hv\">gia cường</td><td>củng cố; tăng cường; nâng cao</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">加快</td><td class=\"pyc\">jiā kuài</td><td class=\"hv\">gia khoái</td><td>tăng tốc；đẩy nhanh</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">推动</td><td class=\"pyc\">tuī dòng</td><td class=\"hv\">thôi động</td><td>thúc đẩy</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">带动</td><td class=\"pyc\">dài dòng</td><td class=\"hv\">đái động</td><td>thúc đẩy; tạo động lực; dẫn động</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">发动</td><td class=\"pyc\">fā dòng</td><td class=\"hv\">phát động</td><td>bắt đầu；phát động</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">普及</td><td class=\"pyc\">pǔ jí</td><td class=\"hv\">phổ cập</td><td>lan rộng；phổ biến</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">结实</td><td class=\"pyc\">jiē shí</td><td class=\"hv\">kết thật</td><td>ra quả</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">收音机</td><td class=\"pyc\">shōu yīn jī</td><td class=\"hv\">thu âm cơ</td><td>radio</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">下来</td><td class=\"pyc\">xià lai</td><td class=\"hv\">hạ lai</td><td>đi xuống；(thành tố động tác hoàn thành)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">下去</td><td class=\"pyc\">xià qù</td><td class=\"hv\">hạ khứ</td><td>đi xuống；tiếp tục</td><td class=\"hint\">动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L28 「进行 / 加以 / 予以」+ 双音节动词", id:"hsk3-l28", html:"<h1>L28 · 「进行 / 加以 / 予以」+ 双音节动词</h1>\n<div class=\"lead\">掌握虚化动词，能把动词性成分名词化</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>进行 / 加以 / 予以 + 双音节动词（进行研究 / 加以解决）</b></td></tr>\n<tr><td>教学目标</td><td>掌握虚化动词，能把动词性成分名词化</td></tr>\n<tr><td>Tiếng Việt</td><td>Động từ hư hóa: 「进行/加以/予以」+ động từ hai âm tiết</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>13 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">这三个词后面<b>只能</b>接双音节动词（× 进行看），且是书面语，口语里不用。越南语没有对应虚化动词，学员会漏用或误用。</div>\n\n<h2>本课词表 13 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">互联网</td><td class=\"pyc\">Hù lián wǎng</td><td class=\"hv\">hỗ liên võng</td><td>Internet</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电子邮件</td><td class=\"pyc\">diàn zǐ yóu jiàn</td><td class=\"hv\">điện tử bưu kiện</td><td>email；LT:封,份</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">邮件</td><td class=\"pyc\">yóu jiàn</td><td class=\"hv\">bưu kiện</td><td>thư từ；bưu phẩm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">邮箱</td><td class=\"pyc\">yóu xiāng</td><td class=\"hv\">bưu tương</td><td>hộp thư；hộp thư bưu điện</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">发送</td><td class=\"pyc\">fā sòng</td><td class=\"hv\">phát tống</td><td>truyền đi；gửi đi</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">输入</td><td class=\"pyc\">shū rù</td><td class=\"hv\">thâu nhập</td><td>nhập khẩu；nhập liệu</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">录</td><td class=\"pyc\">lù</td><td class=\"hv\">lục</td><td>khắc gỗ；nhật ký</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">录音</td><td class=\"pyc\">lù yīn</td><td class=\"hv\">lục âm</td><td>ghi âm (âm thanh)；bản ghi âm</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">上去</td><td class=\"pyc\">shàng qù</td><td class=\"hv\">thượng khứ</td><td>đi lên</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">上来</td><td class=\"pyc\">shàng lái</td><td class=\"hv\">thượng lai</td><td>đi lên；tiếp cận</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">放到</td><td class=\"pyc\">fàng dào</td><td class=\"hv\">phóng đáo</td><td>đặt vào；để vào</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">抓</td><td class=\"pyc\">zhuā</td><td class=\"hv\">trảo</td><td>bắt；nắm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">抓住</td><td class=\"pyc\">zhuā zhù</td><td class=\"hv\">trảo trụ</td><td>nắm bắt; bắt giữ</td><td class=\"hint\">动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L29 「为…所…」「被…所…」", id:"hsk3-l29", html:"<h1>L29 · 「为…所…」「被…所…」</h1>\n<div class=\"lead\">掌握书面被动式，能读懂和写出正式文体的被动句</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>为 / 被 + 施事 + 所 + 动词（为人们所喜爱）</b></td></tr>\n<tr><td>教学目标</td><td>掌握书面被动式，能读懂和写出正式文体的被动句</td></tr>\n<tr><td>Tiếng Việt</td><td>Thể bị động văn viết: 「为…所…」「被…所…」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L03</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「所」后面的动词<b>必须是双音节</b>且多不带其他成分。这是纯书面格式，口语说「大家都喜欢」。学员容易在口语里误用。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">配</td><td class=\"pyc\">pèi</td><td class=\"hv\">phối</td><td>kết hợp；phù hợp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">保</td><td class=\"pyc\">bǎo</td><td class=\"hv\">bảo</td><td>phòng thủ; bảo vệ; giữ；bảo đảm; đảm bảo</td><td class=\"hint\">动词 / 区别词</td></tr><tr><td class=\"hz\">建</td><td class=\"pyc\">jiàn</td><td class=\"hv\">kiến</td><td>thiết lập；sáng lập</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">补</td><td class=\"pyc\">bǔ</td><td class=\"hv\">bổ</td><td>sửa；chắp vá</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">修</td><td class=\"pyc\">xiū</td><td class=\"hv\">tu</td><td>trang trí；tô điểm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">安装</td><td class=\"pyc\">ān zhuāng</td><td class=\"hv\">an trang</td><td>lắp đặt；dựng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">推开</td><td class=\"pyc\">tuī kāi</td><td class=\"hv\">thôi khai</td><td>đẩy đi；từ chối</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">显示</td><td class=\"pyc\">xiǎn shì</td><td class=\"hv\">hiển thị</td><td>hiển thị；minh họa</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">发出</td><td class=\"pyc\">fā chū</td><td class=\"hv\">phát xuất</td><td>ban hành；phát ra (âm thanh)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">观察</td><td class=\"pyc\">guān chá</td><td class=\"hv\">quan sát</td><td>quan sát; theo dõi; khảo sát</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">利用</td><td class=\"pyc\">lì yòng</td><td class=\"hv\">lợi dụng</td><td>tận dụng；sử dụng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">订</td><td class=\"pyc\">dìng</td><td class=\"hv\">đính</td><td>đồng ý；kết luận</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">领</td><td class=\"pyc\">lǐng</td><td class=\"hv\">lĩnh</td><td>cổ；cổ áo</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">挂</td><td class=\"pyc\">guà</td><td class=\"hv\">quải</td><td>treo; móc (từ móc v.v.)；gác máy (điện thoại)</td><td class=\"hint\">动词 / 量词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L30 被动意义的其他表达：受 / 挨 / 给", id:"hsk3-l30", html:"<h1>L30 · 被动意义的其他表达：受 / 挨 / 给</h1>\n<div class=\"lead\">掌握「受/挨/给」的被动用法，扩展被动表达</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>受 + 动作名词 ｜ 挨 + 打/骂/批评 ｜ 给 + 动词（表被动）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「受/挨/给」的被动用法，扩展被动表达</td></tr>\n<tr><td>Tiếng Việt</td><td>Các cách diễn đạt bị động khác: 「受/挨/给」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L03</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「受」多接抽象名词（受欢迎）、「挨」多接<b>不如意</b>的具体动作（挨打）。越南语 &quot;bị&quot; 一个词全包，学员分不清语体与搭配。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">管</td><td class=\"pyc\">guǎn</td><td class=\"hv\">quản</td><td>chăm sóc；kiểm soát</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">调</td><td class=\"pyc\">diào</td><td class=\"hv\">điều</td><td>điều chuyển；di chuyển (quân đội hoặc cán bộ)</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">受</td><td class=\"pyc\">shòu</td><td class=\"hv\">thụ</td><td>nhận；chấp nhận</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">指</td><td class=\"pyc\">zhǐ</td><td class=\"hv\">chỉ</td><td>ngón tay；chỉ vào hoặc đến</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">按</td><td class=\"pyc\">àn</td><td class=\"hv\">án</td><td>nhấn；đẩy</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">拍</td><td class=\"pyc\">pāi</td><td class=\"hv\">phách</td><td>vỗ；vỗ tay</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">照</td><td class=\"pyc\">zhào</td><td class=\"hv\">chiếu</td><td>chiếu；soi sáng</td><td class=\"hint\">动词 / 介词</td></tr><tr><td class=\"hz\">转</td><td class=\"pyc\">zhuǎn</td><td class=\"hv\">chuyển</td><td>xoay；chuyển hướng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">转变</td><td class=\"pyc\">zhuǎn biàn</td><td class=\"hv\">chuyển biến</td><td>thay đổi；chuyển hóa</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">计算</td><td class=\"pyc\">jì suàn</td><td class=\"hv\">kế toán</td><td>đếm；tính toán</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">认出</td><td class=\"pyc\">rèn chū</td><td class=\"hv\">nhận xuất</td><td>nhận ra；nhận diện</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">认得</td><td class=\"pyc\">rèn de</td><td class=\"hv\">nhận đắc</td><td>nhận ra；nhớ điều gì đó (hoặc ai đó) khi nh</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">解开</td><td class=\"pyc\">jiě kāi</td><td class=\"hv\">giải khai</td><td>tháo ra；mở ra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">造</td><td class=\"pyc\">zào</td><td class=\"hv\">tạo</td><td>làm；xây dựng</td><td class=\"hint\">动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L31 定语进阶：动词短语 + 的 + 名词", id:"hsk3-l31", html:"<h1>L31 · 定语进阶：动词短语 + 的 + 名词</h1>\n<div class=\"lead\">掌握复杂定语，能把一个句子压缩成名词短语</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>（主谓/动宾短语）+ 的 + 名词（他昨天买的那本书）</b></td></tr>\n<tr><td>教学目标</td><td>掌握复杂定语，能把一个句子压缩成名词短语</td></tr>\n<tr><td>Tiếng Việt</td><td>Định ngữ nâng cao: cụm động từ + 的 + danh từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">长定语一律<b>前置</b>且必须带「的」；越南语定语<b>后置</b>，学员会把「我买的书」说成「书的我买」。这是越籍学员最顽固的语序错误。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">速度</td><td class=\"pyc\">sù dù</td><td class=\"hv\">tốc độ</td><td>tốc độ；tốc suất</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">难度</td><td class=\"pyc\">nán dù</td><td class=\"hv\">nan độ</td><td>mức độ khó</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">集中</td><td class=\"pyc\">jí zhōng</td><td class=\"hv\">tập trung</td><td>tập trung；tập hợp</td><td class=\"hint\">动词 / 副形词</td></tr><tr><td class=\"hz\">预计</td><td class=\"pyc\">yù jì</td><td class=\"hv\">dự kế</td><td>dự báo；dự đoán</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">游戏</td><td class=\"pyc\">yóu xì</td><td class=\"hv\">du hí</td><td>trò chơi；chơi</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">玩具</td><td class=\"pyc\">wán jù</td><td class=\"hv\">ngoạn cụ</td><td>đồ chơi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">图</td><td class=\"pyc\">tú</td><td class=\"hv\">đồ</td><td>sơ đồ；hình ảnh</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">形状</td><td class=\"pyc\">xíng zhuàng</td><td class=\"hv\">hình trạng</td><td>hình dạng; hình dáng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">形象</td><td class=\"pyc\">xíng xiàng</td><td class=\"hv\">hình tượng</td><td>hình ảnh；hình tượng</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">彩色</td><td class=\"pyc\">cǎi sè</td><td class=\"hv\">thải sắc</td><td>màu；sặc sỡ</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">张</td><td class=\"pyc\">zhāng</td><td class=\"hv\">trương</td><td>mở ra；trải ra</td><td class=\"hint\">量词 / 人名</td></tr><tr><td class=\"hz\">围</td><td class=\"pyc\">wéi</td><td class=\"hv\">vi</td><td>bao quanh；bao vây</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">束</td><td class=\"pyc\">shù</td><td class=\"hv\">thúc</td><td>buộc；bó</td><td class=\"hint\">量词 / 动词</td></tr><tr><td class=\"hz\">断</td><td class=\"pyc\">duàn</td><td class=\"hv\">đoạn</td><td>làm gãy；bẻ gãy</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L32 单元四综合：科技与网络", id:"hsk3-l32", html:"<h1>L32 · 单元四综合：科技与网络</h1>\n<div class=\"lead\">综合运用趋向补语、书面被动式与虚化动词，讨论科技与网络话题</div>\n<table>\n<tr><td>所属单元</td><td>单元4 · 生产、科技与网络（Sản xuất, công nghệ và internet）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>趋向补语 ｜ 为…所… ｜ 进行/加以 ｜ 复杂定语（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用趋向补语、书面被动式与虚化动词，讨论科技与网络话题</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 4: Công nghệ và internet</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L26、L28、L29、L31</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">科技话题里书面语比例高，学员会「口语句式 + 书面词汇」混搭。要按<b>语体</b>分两组模板练。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">破</td><td class=\"pyc\">pò</td><td class=\"hv\">phá</td><td>hỏng；hư</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">压</td><td class=\"pyc\">yā</td><td class=\"hv\">áp</td><td>đè；ấn xuống</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">合</td><td class=\"pyc\">hé</td><td class=\"hv\">hợp</td><td>đóng；gia nhập</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">系</td><td class=\"pyc\">xì</td><td class=\"hv\">hệ</td><td>kết nối；liên quan đến</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">空</td><td class=\"pyc\">kōng</td><td class=\"hv\">không</td><td>trống không；không khí</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">紧</td><td class=\"pyc\">jǐn</td><td class=\"hv\">khẩn</td><td>chặt；chặt chẽ</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">念</td><td class=\"pyc\">niàn</td><td class=\"hv\">niệm</td><td>đọc；học (một môn)</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">演</td><td class=\"pyc\">yǎn</td><td class=\"hv\">diễn</td><td>biểu diễn；(hình thức kết hợp) phát triển</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">观看</td><td class=\"pyc\">guān kàn</td><td class=\"hv\">quan khán</td><td>xem; quan sát</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">证</td><td class=\"pyc\">zhèng</td><td class=\"hv\">chứng</td><td>khiển trách；chứng chỉ</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">部</td><td class=\"pyc\">bù</td><td class=\"hv\">bộ</td><td>bộ；phòng</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">种</td><td class=\"pyc\">zhǒng</td><td class=\"hv\">chủng</td><td>hạt；loài</td><td class=\"hint\">量词 / 动词</td></tr><tr><td class=\"hz\">团</td><td class=\"pyc\">tuán</td><td class=\"hv\">đoàn</td><td>tròn；cục</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">巧</td><td class=\"pyc\">qiǎo</td><td class=\"hv\">xảo</td><td>một cách tình cờ；trùng hợp</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"六、单元5 健康与身体", id:"hsk3-g5", children:[
    {title:"L33 程度补语：动词 + 得 + 很 / 不得了", id:"hsk3-l33", html:"<h1>L33 · 程度补语：动词 + 得 + 很 / 不得了</h1>\n<div class=\"lead\">掌握程度补语，能表达动作或状态的程度</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词/形容词 + 得 + 很 / 不得了 / 要命（累得很 / 高兴得不得了）</b></td></tr>\n<tr><td>教学目标</td><td>掌握程度补语，能表达动作或状态的程度</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ trình độ: động từ + 得 + 很/不得了</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L07</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">程度补语用「得」连接，与结果补语形式相同但语义不同：「跑得快」是程度（跑的速度），「跑得累」是结果。学员会混。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">心</td><td class=\"pyc\">xīn</td><td class=\"hv\">tâm</td><td>tim；tâm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">血</td><td class=\"pyc\">xuè</td><td class=\"hv\">huyết</td><td>máu；khẩu ngữ đọc là</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">皮</td><td class=\"pyc\">pí</td><td class=\"hv\">bì</td><td>da；da lông</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">力</td><td class=\"pyc\">lì</td><td class=\"hv\">lực</td><td>sức mạnh；lực</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">力量</td><td class=\"pyc\">lì liang</td><td class=\"hv\">lực lượng</td><td>sức mạnh; lực lượng; sức lực</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">生命</td><td class=\"pyc\">shēng mìng</td><td class=\"hv\">sinh mệnh</td><td>sự sống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">手指</td><td class=\"pyc\">shǒu zhǐ</td><td class=\"hv\">thủ chỉ</td><td>ngón tay</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">头脑</td><td class=\"pyc\">tóu nǎo</td><td class=\"hv\">đầu não</td><td>bộ não；tâm trí</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">伤</td><td class=\"pyc\">shāng</td><td class=\"hv\">thương</td><td>làm bị thương；vết thương</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">受伤</td><td class=\"pyc\">shòu shāng</td><td class=\"hv\">thụ thương</td><td>bị thương；bị thương (trong tai nạn, v.v.)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">痛</td><td class=\"pyc\">tòng</td><td class=\"hv\">thống</td><td>đau；đau đớn</td><td class=\"hint\">形容词 / 语素</td></tr><tr><td class=\"hz\">痛苦</td><td class=\"pyc\">tòng kǔ</td><td class=\"hv\">thống khổ</td><td>đau đớn；khổ sở</td><td class=\"hint\">名形词 / 形容词</td></tr><tr><td class=\"hz\">感冒</td><td class=\"pyc\">gǎn mào</td><td class=\"hv\">cảm mạo</td><td>bị cảm lạnh；bệnh cảm lạnh</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">大夫</td><td class=\"pyc\">dà fū</td><td class=\"hv\">đại phu</td><td>quan chức cấp cao</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L34 「使 / 让 / 令」使役表达", id:"hsk3-l34", html:"<h1>L34 · 「使 / 让 / 令」使役表达</h1>\n<div class=\"lead\">掌握使役表达的区别，能说清「某事使人怎么样」</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>使 / 让 / 令 + 人 + 心理动词（使人高兴 / 令人失望）</b></td></tr>\n<tr><td>教学目标</td><td>掌握使役表达的区别，能说清「某事使人怎么样」</td></tr>\n<tr><td>Tiếng Việt</td><td>Diễn đạt sai khiến: 「使/让/令」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L04</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「使」后面多接<b>抽象事物</b>作主语（运动使身体健康）、「让」主语多是人、「令」最书面。越南语 &quot;khiến&quot; 一个词全包。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">救</td><td class=\"pyc\">jiù</td><td class=\"hv\">cứu</td><td>cứu；cứu giúp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">死</td><td class=\"pyc\">sǐ</td><td class=\"hv\">tử</td><td>chết；không thể qua được</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">去世</td><td class=\"pyc\">qù shì</td><td class=\"hv\">khứ thế</td><td>qua đời；chết</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">卫生</td><td class=\"pyc\">wèi shēng</td><td class=\"hv\">vệ sinh</td><td>sức khỏe；vệ sinh</td><td class=\"hint\">名形词 / 形容词</td></tr><tr><td class=\"hz\">卫生间</td><td class=\"pyc\">wèi shēng jiān</td><td class=\"hv\">vệ sinh gian</td><td>phòng tắm；nhà vệ sinh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">预防</td><td class=\"pyc\">yù fáng</td><td class=\"hv\">dự phòng</td><td>ngăn ngừa；phòng chống</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">营养</td><td class=\"pyc\">yíng yǎng</td><td class=\"hv\">doanh dưỡng</td><td>dinh dưỡng；nuôi dưỡng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">食品</td><td class=\"pyc\">shí pǐn</td><td class=\"hv\">thực phẩm</td><td>thực phẩm; đồ ăn; lương thực</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">困</td><td class=\"pyc\">kùn</td><td class=\"hv\">khốn</td><td>bẫy；bao vây</td><td class=\"hint\">动词 / 名形词</td></tr><tr><td class=\"hz\">紧急</td><td class=\"pyc\">jǐn jí</td><td class=\"hv\">khẩn cấp</td><td>khẩn cấp；tình huống khẩn cấp</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">防</td><td class=\"pyc\">fáng</td><td class=\"hv\">phòng</td><td>bảo vệ；phòng thủ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">防止</td><td class=\"pyc\">fáng zhǐ</td><td class=\"hv\">phòng chỉ</td><td>ngăn chặn；phòng ngừa</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">反应</td><td class=\"pyc\">fǎn yìng</td><td class=\"hv\">phản ứng</td><td>phản ứng；đáp lại</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">压力</td><td class=\"pyc\">yā lì</td><td class=\"hv\">áp lực</td><td>áp lực</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L35 时间副词：已经 / 曾经 / 刚刚 / 立刻", id:"hsk3-l35", html:"<h1>L35 · 时间副词：已经 / 曾经 / 刚刚 / 立刻</h1>\n<div class=\"lead\">掌握时间副词的语义差别，能精确表达时间关系</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>已经 + 动词 + 了 ｜ 曾经 + 动词 + 过 ｜ 刚刚 + 动词 ｜ 立刻 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>掌握时间副词的语义差别，能精确表达时间关系</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ thời gian: 「已经/曾经/刚刚/立刻」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「已经」谈<b>现在</b>的完成、「曾经」谈<b>过去</b>的经历，分别要求「了」和「过」。越南语 &quot;đã / từng&quot; 区分不如汉语严格。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">胖</td><td class=\"pyc\">pàng</td><td class=\"hv\">bàn</td><td>mập；mũm mĩm</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">甜</td><td class=\"pyc\">tián</td><td class=\"hv\">điềm</td><td>ngọt</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">糖</td><td class=\"pyc\">táng</td><td class=\"hv\">đường</td><td>đường；kẹo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">汤</td><td class=\"pyc\">tāng</td><td class=\"hv\">thang</td><td>canh；nước nóng hoặc sôi</td><td class=\"hint\">名词 / 人名</td></tr><tr><td class=\"hz\">果汁</td><td class=\"pyc\">guǒ zhī</td><td class=\"hv\">quả trấp</td><td>nước ép trái cây</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">奶茶</td><td class=\"pyc\">nǎi chá</td><td class=\"hv\">nãi trà</td><td>trà sữa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">红茶</td><td class=\"pyc\">hóng chá</td><td class=\"hv\">hồng trà</td><td>trà đen</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">绿茶</td><td class=\"pyc\">lǜ chá</td><td class=\"hv\">lục trà</td><td>trà xanh；(tiếng lóng) (về một cô gái) tưởng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">红酒</td><td class=\"pyc\">hóng jiǔ</td><td class=\"hv\">hồng tửu</td><td>rượu vang đỏ</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">啤酒</td><td class=\"pyc\">pí jiǔ</td><td class=\"hv\">tửu</td><td>bia (từ mượn)；LT:杯,瓶,罐,桶,缸</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">可乐</td><td class=\"pyc\">kě lè</td><td class=\"hv\">khả nhạc</td><td>vui；hay ho, thú vị</td><td class=\"hint\">名词 / 专名</td></tr><tr><td class=\"hz\">凉水</td><td class=\"pyc\">liáng shuǐ</td><td class=\"hv\">lương thủy</td><td>nước mát；nước chưa đun sôi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">曾经</td><td class=\"pyc\">céng jīng</td><td class=\"hv\">tằng kinh</td><td>một lần；đã</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">立刻</td><td class=\"pyc\">lì kè</td><td class=\"hv\">lập khắc</td><td>ngay lập tức；lập tức</td><td class=\"hint\">副词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L36 频率副词：总是 / 经常 / 往往 / 从来", id:"hsk3-l36", html:"<h1>L36 · 频率副词：总是 / 经常 / 往往 / 从来</h1>\n<div class=\"lead\">掌握频率副词的语义差别，能表达习惯与规律</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>总是 / 经常 / 往往 + 动词 ｜ 从来 + 不/没 + 动词</b></td></tr>\n<tr><td>教学目标</td><td>掌握频率副词的语义差别，能表达习惯与规律</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ tần suất: 「总是/经常/往往/从来」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L35</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「往往」只能用于<b>客观规律</b>，不能用于个人习惯（× 我往往跑步）；「从来」后面必须跟否定。这两条越南语都没有。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">总是</td><td class=\"pyc\">zǒng shì</td><td class=\"hv\">tổng thị</td><td>luôn luôn</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">从来</td><td class=\"pyc\">cóng lái</td><td class=\"hv\">tòng lai</td><td>luôn luôn；mọi lúc</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">往往</td><td class=\"pyc\">wǎng wǎng</td><td class=\"hv\">vãng vãng</td><td>thường thường；trong nhiều trường hợp</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">始终</td><td class=\"pyc\">shǐ zhōng</td><td class=\"hv\">thủy chung</td><td>từ đầu đến cuối；luôn luôn</td><td class=\"hint\">副词 / 名词</td></tr><tr><td class=\"hz\">及时</td><td class=\"pyc\">jí shí</td><td class=\"hv\">cập thì</td><td>kịp thời; đúng lúc；ngay lập tức; không chậm trễ</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">赶</td><td class=\"pyc\">gǎn</td><td class=\"hv\">cản</td><td>đuổi kịp; bắt kịp；vội; gấp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">赶到</td><td class=\"pyc\">gǎn dào</td><td class=\"hv\">cản đáo</td><td>vội đến (một nơi)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">赶紧</td><td class=\"pyc\">gǎn jǐn</td><td class=\"hv\">cản khẩn</td><td>vội vàng；không chậm trễ</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">连忙</td><td class=\"pyc\">lián máng</td><td class=\"hv\">liên mang</td><td>ngay lập tức；lập tức</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">突然</td><td class=\"pyc\">tū rán</td><td class=\"hv\">đột nhiên</td><td>đột ngột; bất ngờ; không dự kiến</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">跑步</td><td class=\"pyc\">pǎo bù</td><td class=\"hv\">bào bộ</td><td>chạy；chạy bộ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">散步</td><td class=\"pyc\">sàn bù</td><td class=\"hv\">tán bộ</td><td>đi dạo; đi bộ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">日常</td><td class=\"pyc\">rì cháng</td><td class=\"hv\">nhật thường</td><td>hằng ngày; thường nhật; mỗi ngày</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">适应</td><td class=\"pyc\">shì yìng</td><td class=\"hv\">quát ứng</td><td>thích nghi；phù hợp</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L37 离合词", id:"hsk3-l37", html:"<h1>L37 · 离合词</h1>\n<div class=\"lead\">掌握离合词的用法，能正确插入成分</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动宾式离合词：见面 → 见了一次面 ｜ 帮忙 → 帮他的忙</b></td></tr>\n<tr><td>教学目标</td><td>掌握离合词的用法，能正确插入成分</td></tr>\n<tr><td>Tiếng Việt</td><td>Từ ly hợp</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">离合词不能直接带宾语（× 见面他），必须用介词引出（跟他见面）。越南语没有离合词概念，这是三级最容易被忽略的语法点。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">成长</td><td class=\"pyc\">chéng zhǎng</td><td class=\"hv\">thành trường</td><td>trưởng thành；phát triển</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">生长</td><td class=\"pyc\">shēng zhǎng</td><td class=\"hv\">sinh trường</td><td>phát triển；lớn lên</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">开始</td><td class=\"pyc\">kāi shǐ</td><td class=\"hv\">khai thủy</td><td>bắt đầu；khởi đầu</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">活</td><td class=\"pyc\">huó</td><td class=\"hv\">hoạt</td><td>sống；còn sống</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">性别</td><td class=\"pyc\">xìng bié</td><td class=\"hv\">tính biệt</td><td>giới tính</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">子女</td><td class=\"pyc\">zǐ nǚ</td><td class=\"hv\">tử nữ</td><td>con cái; con trai và con gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">亲人</td><td class=\"pyc\">qīn rén</td><td class=\"hv\">thân nhân</td><td>người thân thiết</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">家属</td><td class=\"pyc\">jiā shǔ</td><td class=\"hv\">gia chúc</td><td>thành viên gia đình；người phụ thuộc (trong gia đình)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">父亲</td><td class=\"pyc\">fù qīn</td><td class=\"hv\">phụ thân</td><td>cha；hoặc đọc là</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">母亲</td><td class=\"pyc\">mǔ qīn</td><td class=\"hv\">mẫu thân</td><td>mẹ；cũng đọc là</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">父母</td><td class=\"pyc\">fù mǔ</td><td class=\"hv\">phụ mẫu</td><td>cha và mẹ; phụ huynh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">老太太</td><td class=\"pyc\">lǎo tài tai</td><td class=\"hv\">lão thái thái</td><td>bà lão (tôn kính)；mẹ kính yêu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">老头儿</td><td class=\"pyc\">lǎo tóu r</td><td class=\"hv\">lão đầu nhi</td><td>ông lão；ông già</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">年纪</td><td class=\"pyc\">nián jì</td><td class=\"hv\">niên kỉ</td><td>tuổi</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L38 「越…越…」与「越来越」辨析", id:"hsk3-l38", html:"<h1>L38 · 「越…越…」与「越来越」辨析</h1>\n<div class=\"lead\">辨析两种「越」结构，能准确表达递进</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>越来越 + 形容词（单变量）｜ 越 + A + 越 + B（双变量同步）</b></td></tr>\n<tr><td>教学目标</td><td>辨析两种「越」结构，能准确表达递进</td></tr>\n<tr><td>Tiếng Việt</td><td>Phân biệt 「越…越…」và 「越来越」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L18</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「越来越」只有一个变量（随时间变），「越…越…」有两个变量同步变。学员会用「越来越」硬套双变量（× 越来越吃越胖）。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">状况</td><td class=\"pyc\">zhuàng kuàng</td><td class=\"hv\">trạng huống</td><td>tình trạng; trạng thái; tình huống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">保持</td><td class=\"pyc\">bǎo chí</td><td class=\"hv\">bảo trì</td><td>giữ；duy trì</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">久</td><td class=\"pyc\">jiǔ</td><td class=\"hv\">cửu</td><td>thời gian (dài)；(khoảng) thời gian dài</td><td class=\"hint\">形容词 / 语素</td></tr><tr><td class=\"hz\">乱</td><td class=\"pyc\">luàn</td><td class=\"hv\">loạn</td><td>trong tình trạng rối loạn；trạng thái tinh thần bối rối</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">刀</td><td class=\"pyc\">dāo</td><td class=\"hv\">đao</td><td>dao；lưỡi dao</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">充满</td><td class=\"pyc\">chōng mǎn</td><td class=\"hv\">sung mãn</td><td>đầy；rạng rỡ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">慢慢</td><td class=\"pyc\">màn màn</td><td class=\"hv\">mạn mạn</td><td>chậm rãi; dần dần</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">赶快</td><td class=\"pyc\">gǎn kuài</td><td class=\"hv\">cản khoái</td><td>nhanh chóng; ngay lập tức</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">超级</td><td class=\"pyc\">chāo jí</td><td class=\"hv\">siêu cấp</td><td>siêu-；cực-</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">足够</td><td class=\"pyc\">zú gòu</td><td class=\"hv\">túc cú</td><td>đủ; đủ mức</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">精彩</td><td class=\"pyc\">jīng cǎi</td><td class=\"hv\">tinh thải</td><td>tuyệt vời；kỳ diệu</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">生动</td><td class=\"pyc\">shēng dòng</td><td class=\"hv\">sinh động</td><td>sinh động；sống động</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">热烈</td><td class=\"pyc\">rè liè</td><td class=\"hv\">nhiệt liệt</td><td>nhiệt tình；nồng nhiệt</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">动人</td><td class=\"pyc\">dòng rén</td><td class=\"hv\">động nhân</td><td>cảm động；xúc động</td><td class=\"hint\">形容词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L39 形容词 + 得 + 不得了 / 极了", id:"hsk3-l39", html:"<h1>L39 · 形容词 + 得 + 不得了 / 极了</h1>\n<div class=\"lead\">掌握「极了」「不得了」等程度表达</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>形容词 + 极了 ｜ 形容词 + 得 + 不得了（好极了 / 好得不得了）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「极了」「不得了」等程度表达</td></tr>\n<tr><td>Tiếng Việt</td><td>Tính từ + 得 + 不得了 ｜ …极了</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L33</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「极了」直接跟形容词后（好极了），不加「得」；「不得了」前面<b>必须</b>有「得」。两者形式不同但程度相近，学员会混。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">紧张</td><td class=\"pyc\">jǐn zhāng</td><td class=\"hv\">khẩn trương</td><td>căng thẳng；hồi hộp</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">美食</td><td class=\"pyc\">měi shí</td><td class=\"hv\">mỹ thực</td><td>món ngon；món ăn tinh tế</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">白菜</td><td class=\"pyc\">bái cài</td><td class=\"hv\">bạch thái</td><td>cải thảo；cải bẹ trắng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">功夫</td><td class=\"pyc\">gōng fu</td><td class=\"hv\">công phu</td><td>kỹ năng；nghệ thuật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">武术</td><td class=\"pyc\">wǔ shù</td><td class=\"hv\">vũ thuật</td><td>kỹ năng hoặc kỹ thuật quân sự；các môn thể thao võ thuật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">跳舞</td><td class=\"pyc\">tiào wǔ</td><td class=\"hv\">khiêu vũ</td><td>nhảy múa</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">剧场</td><td class=\"pyc\">jù chǎng</td><td class=\"hv\">kịch tràng</td><td>rạp hát</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">歌声</td><td class=\"pyc\">gē shēng</td><td class=\"hv\">ca thanh</td><td>giọng hát；nghĩa bóng: giọng gốc của nhà thơ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">歌迷</td><td class=\"pyc\">gē mí</td><td class=\"hv\">ca mê</td><td>người hâm mộ ca sĩ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">等待</td><td class=\"pyc\">děng dài</td><td class=\"hv\">đẳng đãi</td><td>chờ; chờ đợi</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">节约</td><td class=\"pyc\">jié yuē</td><td class=\"hv\">tiết ước</td><td>tiết kiệm；bảo tồn (tài nguyên)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">搬</td><td class=\"pyc\">bān</td><td class=\"hv\">bàn</td><td>di chuyển (tức là tự dời đi)；di chuyển</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">直</td><td class=\"pyc\">zhí</td><td class=\"hv\">trực</td><td>thẳng；làm thẳng</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">眼前</td><td class=\"pyc\">yǎn qián</td><td class=\"hv\">nhãn tiền</td><td>trước mắt；bây giờ</td><td class=\"hint\">处所词 / 时间词</td></tr><tr><td class=\"hz\">极了</td><td class=\"pyc\">jí le</td><td class=\"hv\">cực liễu</td><td>cực kỳ；vô cùng</td><td class=\"hint\">语气词 / 助词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L40 单元五综合：健康与生活习惯", id:"hsk3-l40", html:"<h1>L40 · 单元五综合：健康与生活习惯</h1>\n<div class=\"lead\">综合运用程度补语、副词与离合词，讨论健康与生活习惯</div>\n<table>\n<tr><td>所属单元</td><td>单元5 · 健康与身体（Sức khỏe và cơ thể）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>程度补语 ｜ 时间/频率副词 ｜ 离合词（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用程度补语、副词与离合词，讨论健康与生活习惯</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 5: Sức khỏe và thói quen sinh hoạt</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L33、L35、L36、L37</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">谈生活习惯时频率副词与离合词高频共现（「我经常跟他见面」），离合词误带宾语是最集中的错误。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">相互</td><td class=\"pyc\">xiāng hù</td><td class=\"hv\">tương hỗ</td><td>lẫn nhau；tương hỗ</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">表面</td><td class=\"pyc\">biǎo miàn</td><td class=\"hv\">biểu diện</td><td>bề mặt；bề ngoài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">表达</td><td class=\"pyc\">biǎo dá</td><td class=\"hv\">biểu đạt</td><td>diễn đạt; truyền tải</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">必要</td><td class=\"pyc\">bì yào</td><td class=\"hv\">tất yếu</td><td>cần thiết；thiết yếu</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">建设</td><td class=\"pyc\">jiàn shè</td><td class=\"hv\">kiến thiết</td><td>xây dựng</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">建成</td><td class=\"pyc\">jiàn chéng</td><td class=\"hv\">kiến thành</td><td>xây dựng；thiết lập</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">初</td><td class=\"pyc\">chū</td><td class=\"hv\">sơ</td><td>lúc đầu；(vào) lúc bắt đầu</td><td class=\"hint\">方位词 / 副词</td></tr><tr><td class=\"hz\">古</td><td class=\"pyc\">gǔ</td><td class=\"hv\">cổ</td><td>cổ；thời xa xưa</td><td class=\"hint\">形容词 / 时间语素</td></tr><tr><td class=\"hz\">先进</td><td class=\"pyc\">xiān jìn</td><td class=\"hv\">tiên tiến</td><td>tiên tiến (công nghệ, v.v.)；xuất sắc</td><td class=\"hint\">形容词 / 名词</td></tr><tr><td class=\"hz\">共同</td><td class=\"pyc\">gòng tóng</td><td class=\"hv\">cộng đồng</td><td>chung；cùng</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">因此</td><td class=\"pyc\">yīn cǐ</td><td class=\"hv\">nhân thử</td><td>do đó; vì vậy; kết quả là</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">后果</td><td class=\"pyc\">hòu guǒ</td><td class=\"hv\">hậu quả</td><td>hậu quả；hệ quả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">场合</td><td class=\"pyc\">chǎng hé</td><td class=\"hv\">tràng hợp</td><td>tình huống；dịp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">对手</td><td class=\"pyc\">duì shǒu</td><td class=\"hv\">đối thủ</td><td>đối thủ；địch thủ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">尽量</td><td class=\"pyc\">jǐn liàng</td><td class=\"hv\">tận lượng</td><td>càng nhiều càng tốt；đến mức tối đa</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">连</td><td class=\"pyc\">lián</td><td class=\"hv\">liên</td><td>liên kết；gia nhập</td><td class=\"hint\">助词 / 副词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
