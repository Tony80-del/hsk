    {title:"L22 学校", id:"l22", html:"<h1>L22 · 学校</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Trường học</p>\n<div class=\"lead\"><b>本课目标：</b>会说学校场所和上课流程</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">学校</td><td class=\"pyc\">xué xiào</td><td class=\"hv\">học hiệu</td><td>trường học；Lượng từ: 所</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">大学</td><td class=\"pyc\">dà xué</td><td class=\"hv\">đại học</td><td>trường đại học；trường cao đẳng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">中学</td><td class=\"pyc\">zhōng xué</td><td class=\"hv\">trung học</td><td>trường trung học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小学</td><td class=\"pyc\">xiǎo xué</td><td class=\"hv\">tiểu học</td><td>trường tiểu học; trường cấp một</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">学院</td><td class=\"pyc\">xué yuàn</td><td class=\"hv\">học viện</td><td>trường cao đẳng；học viện</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">教学楼</td><td class=\"pyc\">jiào xué lóu</td><td class=\"hv\">giáo học lâu</td><td>tòa nhà trường học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">图书馆</td><td class=\"pyc\">tú shū guǎn</td><td class=\"hv\">đồ thư quán</td><td>thư viện</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">班</td><td class=\"pyc\">bān</td><td class=\"hv\">ban</td><td>nhóm; lớp; khối；(quân sự) tiểu đội</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">课</td><td class=\"pyc\">kè</td><td class=\"hv\">khóa</td><td>môn học；khoá học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">上课</td><td class=\"pyc\">shàng kè</td><td class=\"hv\">thượng khóa</td><td>đi học；tham dự lớp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">下课</td><td class=\"pyc\">xià kè</td><td class=\"hv\">hạ khóa</td><td>tan học；ra khỏi lớp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">放学</td><td class=\"pyc\">fàng xué</td><td class=\"hv\">phóng học</td><td>tan học</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「上课 / 下课 / 放学」是动宾结构</p><p class=\"gfm\">几点 + 上课 / 下课 / 放学</p><p class=\"gnote\">时间词放在动词前。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我们八点上课。</p><p class=\"py\">wǒ men bā diǎn shàng kè。</p><p class=\"vi\">Chúng tôi vào học lúc tám giờ.</p></div><div class=\"gex\"><p class=\"zh\">十一点下课。</p><p class=\"py\">shí yī diǎn xià kè。</p><p class=\"vi\">Mười một giờ tan học.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「有课 / 没课」</p><p class=\"gfm\">主语 + 有课 / 没课</p><p class=\"gnote\">表示有没有课要上。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我今天有课。</p><p class=\"py\">wǒ jīn tiān yǒu kè。</p><p class=\"vi\">Hôm nay tôi có tiết.</p></div><div class=\"gex\"><p class=\"zh\">明天我没课。</p><p class=\"py\">míng tiān wǒ méi kè。</p><p class=\"vi\">Mai tôi không có tiết.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我的学校。</p><p class=\"py\">zhè shì wǒ de xué xiào。</p><p class=\"vi\">Đây là trường của tôi.</p></div><div class=\"sent\"><p class=\"zh\">我在大学上课。</p><p class=\"py\">wǒ zài dà xué shàng kè。</p><p class=\"vi\">Tôi học ở trường đại học.</p></div><div class=\"sent\"><p class=\"zh\">图书馆在教学楼旁边。</p><p class=\"py\">tú shū guǎn zài jiào xué lóu páng biān。</p><p class=\"vi\">Thư viện ở cạnh tòa nhà giảng đường.</p></div><div class=\"sent\"><p class=\"zh\">我们班有二十个学生。</p><p class=\"py\">wǒ men bān yǒu èr shí gè xué sheng。</p><p class=\"vi\">Lớp chúng tôi có hai mươi học sinh.</p></div><div class=\"sent\"><p class=\"zh\">我们八点上课，十一点下课。</p><p class=\"py\">wǒ men bā diǎn shàng kè， shí yī diǎn xià kè。</p><p class=\"vi\">Chúng tôi vào học lúc tám giờ, tan học lúc mười một giờ.</p></div><div class=\"sent\"><p class=\"zh\">下午三点放学。</p><p class=\"py\">xià wǔ sān diǎn fàng xué。</p><p class=\"vi\">Ba giờ chiều tan học.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的学校在哪儿？</p><p class=\"py\">nǐ de xué xiào zài nǎr？</p><p class=\"vi\">Trường bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在大学旁边。</p><p class=\"py\">zài dà xué páng biān。</p><p class=\"vi\">Ở cạnh trường đại học.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你们几点上课？</p><p class=\"py\">nǐ men jǐ diǎn shàng kè？</p><p class=\"vi\">Các bạn vào học lúc mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">八点。</p><p class=\"py\">bā diǎn。</p><p class=\"vi\">Tám giờ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">几点下课？</p><p class=\"py\">jǐ diǎn xià kè？</p><p class=\"vi\">Mấy giờ tan học?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">十一点。下午三点放学。</p><p class=\"py\">shí yī diǎn。 xià wǔ sān diǎn fàng xué。</p><p class=\"vi\">Mười một giờ. Ba giờ chiều tan học.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">下课你去哪儿？</p><p class=\"py\">xià kè nǐ qù nǎr？</p><p class=\"vi\">Tan học bạn đi đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我去图书馆看书。</p><p class=\"py\">wǒ qù tú shū guǎn kàn shū。</p><p class=\"vi\">Tôi đến thư viện đọc sách.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>校园地点卡：学校 / 大学 / 中学 / 小学 / 学院 / 教学楼 / 图书馆</li><li>「几点上课 / 下课」问答接龙</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「上课」的主语可以是学生也可以是老师，意思不同</li><li>「放学」只用于中小学，大学说「下课」</li><li>「班」既是班级，也可作量词（一班学生）</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出自己学校的三个地点</li><li>在 App 上完成 L22 测验</li></ul>"},
    {title:"L23 老师和学生", id:"l23", html:"<h1>L23 · 老师和学生</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Giáo viên và học sinh</p>\n<div class=\"lead\"><b>本课目标：</b>会介绍身份与学习状态</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">老师</td><td class=\"pyc\">lǎo shī</td><td class=\"hv\">lão sư</td><td>giáo viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">学生</td><td class=\"pyc\">xué sheng</td><td class=\"hv\">học sinh</td><td>học sinh；trẻ đi học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">同学</td><td class=\"pyc\">tóng xué</td><td class=\"hv\">đồng học</td><td>học cùng trường；bạn học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小学生</td><td class=\"pyc\">xiǎo xué shēng</td><td class=\"hv\">tiểu học sinh</td><td>học sinh tiểu học；trẻ em đi học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">中学生</td><td class=\"pyc\">zhōng xué shēng</td><td class=\"hv\">trung học sinh</td><td>học sinh trung học；học sinh cấp ba</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">大学生</td><td class=\"pyc\">dà xué shēng</td><td class=\"hv\">đại học sinh</td><td>sinh viên đại học；sinh viên cao đẳng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">教</td><td class=\"pyc\">jiào</td><td class=\"hv\">giáo</td><td>tôn giáo；giảng dạy</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">学</td><td class=\"pyc\">xué</td><td class=\"hv\">học</td><td>học；học tập</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">学习</td><td class=\"pyc\">xué xí</td><td class=\"hv\">học tập</td><td>học；tìm hiểu</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">上学</td><td class=\"pyc\">shàng xué</td><td class=\"hv\">thượng học</td><td>đi học；theo học</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">请假</td><td class=\"pyc\">qǐng jià</td><td class=\"hv\">thỉnh giả</td><td>xin nghỉ phép</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">放假</td><td class=\"pyc\">fàng jià</td><td class=\"hv\">phóng giả</td><td>nghỉ lễ hoặc kỳ nghỉ</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「教」和「学」是一对</p><p class=\"gfm\">老师教 + 人 + 内容　｜　学生学 + 内容</p><p class=\"gnote\">「教」读 jiāo（第一声），不是 jiào。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">老师教我们中文。</p><p class=\"py\">lǎo shī jiào wǒ men Zhōng wén。</p><p class=\"vi\">Giáo viên dạy chúng tôi tiếng Trung.</p></div><div class=\"gex\"><p class=\"zh\">我在大学学习中文。</p><p class=\"py\">wǒ zài dà xué xué xí Zhōng wén。</p><p class=\"vi\">Tôi học tiếng Trung ở trường đại học.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「上学 / 请假 / 放假」</p><p class=\"gfm\">上学 = 去学校　｜　请假 = 申请不上班/课　｜　放假 = 集体休息</p><p class=\"gnote\">「放假」的主语是学校或单位，不是个人。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我早上七点上学。</p><p class=\"py\">wǒ zǎo shang qī diǎn shàng xué。</p><p class=\"vi\">Tôi đi học lúc bảy giờ sáng.</p></div><div class=\"gex\"><p class=\"zh\">明天放假。</p><p class=\"py\">míng tiān fàng jià。</p><p class=\"vi\">Mai được nghỉ.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他是老师，我是学生。</p><p class=\"py\">tā shì lǎo shī， wǒ shì xué sheng。</p><p class=\"vi\">Anh ấy là giáo viên, tôi là học sinh.</p></div><div class=\"sent\"><p class=\"zh\">老师教我们中文。</p><p class=\"py\">lǎo shī jiào wǒ men Zhōng wén。</p><p class=\"vi\">Giáo viên dạy chúng tôi tiếng Trung.</p></div><div class=\"sent\"><p class=\"zh\">我在大学学习中文。</p><p class=\"py\">wǒ zài dà xué xué xí Zhōng wén。</p><p class=\"vi\">Tôi học tiếng Trung ở trường đại học.</p></div><div class=\"sent\"><p class=\"zh\">我早上七点上学。</p><p class=\"py\">wǒ zǎo shang qī diǎn shàng xué。</p><p class=\"vi\">Tôi đi học lúc bảy giờ sáng.</p></div><div class=\"sent\"><p class=\"zh\">明天放假。</p><p class=\"py\">míng tiān fàng jià。</p><p class=\"vi\">Mai được nghỉ.</p></div><div class=\"sent\"><p class=\"zh\">他请假了。</p><p class=\"py\">tā qǐng jià le。</p><p class=\"vi\">Anh ấy đã xin nghỉ.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你是老师吗？</p><p class=\"py\">nǐ shì lǎo shī ma？</p><p class=\"vi\">Bạn là giáo viên à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不是，我是学生。</p><p class=\"py\">bù shì， wǒ shì xué sheng。</p><p class=\"vi\">Không, tôi là học sinh.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在哪个学院？</p><p class=\"py\">nǐ zài nǎ ge xué yuàn？</p><p class=\"vi\">Bạn học ở học viện nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我在中文学院。</p><p class=\"py\">wǒ zài Zhōng wén xué yuàn。</p><p class=\"vi\">Tôi học ở học viện tiếng Trung.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你学习什么？</p><p class=\"py\">nǐ xué xí shén me？</p><p class=\"vi\">Bạn học gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我学习中文。老师很好。</p><p class=\"py\">wǒ xué xí Zhōng wén。 lǎo shī hěn hǎo。</p><p class=\"vi\">Tôi học tiếng Trung. Giáo viên rất tốt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">明天放假吗？</p><p class=\"py\">míng tiān fàng jià ma？</p><p class=\"vi\">Mai được nghỉ không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不放假。我同学请假了。</p><p class=\"py\">bù fàng jià。 wǒ tóng xué qǐng jià le。</p><p class=\"vi\">Không nghỉ. Bạn cùng lớp tôi đã xin nghỉ.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>身份卡：小学生 / 中学生 / 大学生 / 老师 / 同学</li><li>「教 / 学」对比句练习</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「学习」是动词也是名词，「学」更口语</li><li>「放假」是集体行为；个人要休息用「请假」</li><li>「同学」指同班或同校的人，朋友不一定是同学</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文介绍自己的学校、班级和学习内容</li><li>在 App 上完成 L23 测验</li></ul>"},
    {title:"L24 书与字", id:"l24", html:"<h1>L24 · 书与字</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Sách và chữ</p>\n<div class=\"lead\"><b>本课目标：</b>会说学习用品和语言名称</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">书</td><td class=\"pyc\">shū</td><td class=\"hv\">thư</td><td>sách；thư</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">课本</td><td class=\"pyc\">kè běn</td><td class=\"hv\">khóa bổn</td><td>sách giáo khoa；LT:本</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">本子</td><td class=\"pyc\">běn zi</td><td class=\"hv\">bổn tử</td><td>sách；quyển tập</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">书包</td><td class=\"pyc\">shū bāo</td><td class=\"hv\">thư bao</td><td>cặp sách；cặp đeo lưng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">字</td><td class=\"pyc\">zì</td><td class=\"hv\">tự</td><td>chữ；ký hiệu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">汉字</td><td class=\"pyc\">hàn zì</td><td class=\"hv\">hán tự</td><td>chữ Hán；Nhật: kanji</td><td class=\"hint\">专名 / 名词</td></tr><tr><td class=\"hz\">汉语</td><td class=\"pyc\">Hàn yǔ</td><td class=\"hv\">hán ngữ</td><td>Ngôn ngữ tiếng Trung</td><td class=\"hint\">专名</td></tr><tr><td class=\"hz\">中文</td><td class=\"pyc\">Zhōng wén</td><td class=\"hv\">trung văn</td><td>ngôn ngữ Trung Quốc</td><td class=\"hint\">专名</td></tr><tr><td class=\"hz\">外语</td><td class=\"pyc\">wài yǔ</td><td class=\"hv\">ngoại ngữ</td><td>ngôn ngữ nước ngoài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">课文</td><td class=\"pyc\">kè wén</td><td class=\"hv\">khóa văn</td><td>bài đọc；LT:篇</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">知识</td><td class=\"pyc\">zhī shi</td><td class=\"hv\">tri thức</td><td>kiến thức；trí thức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">读</td><td class=\"pyc\">dú</td><td class=\"hv\">độc</td><td>đọc ra; đọc to；đọc</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「读」的多个意思</p><p class=\"gfm\">读 + 课文（朗读）　｜　读 + 大学（上学）</p><p class=\"gnote\">看搭配判断意思。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我读课文。</p><p class=\"py\">wǒ dú kè wén。</p><p class=\"vi\">Tôi đọc bài khóa.</p></div><div class=\"gex\"><p class=\"zh\">他在读大学。</p><p class=\"py\">tā zài dú dà xué。</p><p class=\"vi\">Anh ấy đang học đại học.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 语言名称</p><p class=\"gfm\">汉语 / 中文 / 外语</p><p class=\"gnote\">「汉语」和「中文」基本同义；「外语」指非母语的语言。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我学习汉语。</p><p class=\"py\">wǒ xué xí Hàn yǔ。</p><p class=\"vi\">Tôi học tiếng Hán.</p></div><div class=\"gex\"><p class=\"zh\">他会说三门外语。</p><p class=\"py\">tā huì shuō sān mén wài yǔ。</p><p class=\"vi\">Anh ấy nói được ba ngoại ngữ.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我的课本。</p><p class=\"py\">zhè shì wǒ de kè běn。</p><p class=\"vi\">Đây là sách giáo khoa của tôi.</p></div><div class=\"sent\"><p class=\"zh\">我书包里有三本书。</p><p class=\"py\">wǒ shū bāo lǐ yǒu sān běn shū。</p><p class=\"vi\">Trong cặp tôi có ba cuốn sách.</p></div><div class=\"sent\"><p class=\"zh\">我认识很多汉字。</p><p class=\"py\">wǒ rèn shi hěn duō hàn zì。</p><p class=\"vi\">Tôi biết rất nhiều chữ Hán.</p></div><div class=\"sent\"><p class=\"zh\">我学习汉语。</p><p class=\"py\">wǒ xué xí Hàn yǔ。</p><p class=\"vi\">Tôi học tiếng Hán.</p></div><div class=\"sent\"><p class=\"zh\">我读课文。</p><p class=\"py\">wǒ dú kè wén。</p><p class=\"vi\">Tôi đọc bài khóa.</p></div><div class=\"sent\"><p class=\"zh\">他在读大学。</p><p class=\"py\">tā zài dú dà xué。</p><p class=\"vi\">Anh ấy đang học đại học.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你学习什么？</p><p class=\"py\">nǐ xué xí shén me？</p><p class=\"vi\">Bạn học gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我学习汉语。</p><p class=\"py\">wǒ xué xí Hàn yǔ。</p><p class=\"vi\">Tôi học tiếng Hán.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你认识多少汉字？</p><p class=\"py\">nǐ rèn shi duō shǎo hàn zì？</p><p class=\"vi\">Bạn biết bao nhiêu chữ Hán?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我认识五百多个汉字。</p><p class=\"py\">wǒ rèn shi wǔ bǎi duō gè hàn zì。</p><p class=\"vi\">Tôi biết hơn năm trăm chữ Hán.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的课本在哪儿？</p><p class=\"py\">nǐ de kè běn zài nǎr？</p><p class=\"vi\">Sách giáo khoa của bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在我的书包里。</p><p class=\"py\">zài wǒ de shū bāo lǐ。</p><p class=\"vi\">Trong cặp của tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你读课文了吗？</p><p class=\"py\">nǐ dú kè wén le ma？</p><p class=\"vi\">Bạn đọc bài khóa chưa?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">读了。</p><p class=\"py\">dú le。</p><p class=\"vi\">Đọc rồi.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>学习用品卡：书 / 课本 / 本子 / 书包</li><li>汉字认读比赛：看字说读音和意思</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「汉语」和「中文」基本同义；汉语更强调语言，中文也可指文字</li><li>「读」既可以是朗读，也可以是上学（读大学）</li><li>「知识」是抽象名词，不能加量词「个」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>整理自己的书包，用中文说出里面每样东西</li><li>在 App 上完成 L24 测验</li></ul>"},
    {title:"L25 读书与写字", id:"l25", html:"<h1>L25 · 读书与写字</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Đọc và viết</p>\n<div class=\"lead\"><b>本课目标：</b>会说学习动作，会表达记住和忘记</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">读书</td><td class=\"pyc\">dú shū</td><td class=\"hv\">độc thư</td><td>đọc sách；học</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">写</td><td class=\"pyc\">xiě</td><td class=\"hv\">tả</td><td>viết</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">听写</td><td class=\"pyc\">tīng xiě</td><td class=\"hv\">thính tả</td><td>(của học sinh) viết chính tả；(âm nhạc) chép lại bằng tai</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">考试</td><td class=\"pyc\">kǎo shì</td><td class=\"hv\">khảo thí</td><td>dự thi；kỳ thi</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">考</td><td class=\"pyc\">kǎo</td><td class=\"hv\">khảo</td><td>đánh；đập</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">试</td><td class=\"pyc\">shì</td><td class=\"hv\">thí</td><td>thử；thí nghiệm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">认识</td><td class=\"pyc\">rèn shi</td><td class=\"hv\">nhận thức</td><td>biết；nhận ra</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">记</td><td class=\"pyc\">jì</td><td class=\"hv\">kí</td><td>ghi chép；ghi lại</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">记住</td><td class=\"pyc\">jì zhu</td><td class=\"hv\">kí trụ</td><td>nhớ；ghi nhớ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">忘记</td><td class=\"pyc\">wàng jì</td><td class=\"hv\">vong kí</td><td>quên</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">忘</td><td class=\"pyc\">wàng</td><td class=\"hv\">vong</td><td>quên；bỏ qua</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">见</td><td class=\"pyc\">jiàn</td><td class=\"hv\">kiến</td><td>thấy；gặp</td><td class=\"hint\">动词 / 语素</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「记住 / 忘记」表示结果</p><p class=\"gfm\">记住（记住了）　｜　忘记（忘记了）</p><p class=\"gnote\">「记」只表示动作，「记住」表示结果。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我记住了。</p><p class=\"py\">wǒ jì zhu le。</p><p class=\"vi\">Tôi nhớ rồi.</p></div><div class=\"gex\"><p class=\"zh\">我忘记他的名字了。</p><p class=\"py\">wǒ wàng jì tā de míng zi le。</p><p class=\"vi\">Tôi quên tên anh ấy rồi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「考试」可作名词也可作动词</p><p class=\"gfm\">有考试（名词）　｜　考试（动词）</p><p class=\"gnote\">「考」和「试」也能分开用。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">明天有考试。</p><p class=\"py\">míng tiān yǒu kǎo shì。</p><p class=\"vi\">Mai có kỳ thi.</p></div><div class=\"gex\"><p class=\"zh\">我们明天考试。</p><p class=\"py\">wǒ men míng tiān kǎo shì。</p><p class=\"vi\">Mai chúng tôi thi.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我在读书。</p><p class=\"py\">wǒ zài dú shū。</p><p class=\"vi\">Tôi đang đọc sách.</p></div><div class=\"sent\"><p class=\"zh\">我写汉字。</p><p class=\"py\">wǒ xiě hàn zì。</p><p class=\"vi\">Tôi viết chữ Hán.</p></div><div class=\"sent\"><p class=\"zh\">明天有考试。</p><p class=\"py\">míng tiān yǒu kǎo shì。</p><p class=\"vi\">Mai có kỳ thi.</p></div><div class=\"sent\"><p class=\"zh\">我记住了。</p><p class=\"py\">wǒ jì zhu le。</p><p class=\"vi\">Tôi nhớ rồi.</p></div><div class=\"sent\"><p class=\"zh\">我忘记他的名字了。</p><p class=\"py\">wǒ wàng jì tā de míng zi le。</p><p class=\"vi\">Tôi quên tên anh ấy rồi.</p></div><div class=\"sent\"><p class=\"zh\">我们明天见。</p><p class=\"py\">wǒ men míng tiān jiàn。</p><p class=\"vi\">Mai chúng ta gặp nhau.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">明天有考试吗？</p><p class=\"py\">míng tiān yǒu kǎo shì ma？</p><p class=\"vi\">Mai có kỳ thi không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">有。你记住了吗？</p><p class=\"py\">yǒu。 nǐ jì zhu le ma？</p><p class=\"vi\">Có. Bạn nhớ chưa?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">没有，我忘记了一些字。</p><p class=\"py\">méi yǒu， wǒ wàng jì le yī xiē zì。</p><p class=\"vi\">Chưa, tôi quên mất vài chữ.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">没关系，我们再读一次。</p><p class=\"py\">méi guān xi， wǒ men zài dú yī cì。</p><p class=\"vi\">Không sao, chúng ta đọc lại một lần nữa.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好。你认识这些字吗？</p><p class=\"py\">hǎo。 nǐ rèn shi zhè xiē zì ma？</p><p class=\"vi\">Được. Bạn biết những chữ này không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">认识。我们一块儿写。</p><p class=\"py\">rèn shi。 wǒ men yī kuàir xiě。</p><p class=\"vi\">Biết. Chúng ta cùng viết.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，明天见！</p><p class=\"py\">hǎo， míng tiān jiàn！</p><p class=\"vi\">Được, mai gặp!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">明天见！</p><p class=\"py\">míng tiān jiàn！</p><p class=\"vi\">Mai gặp!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>听写练习：老师读词，学员写汉字</li><li>「记住 / 忘记」情景造句</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「记住」表示结果，「记」只表示动作</li><li>「忘记」和「忘」意思相同，「忘」更口语</li><li>「见」单独用较少，常说「见面」「再见」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>把本课十二个词各写三遍</li><li>在 App 上完成 L25 测验</li></ul>"},
    {title:"L26 知道与明白", id:"l26", html:"<h1>L26 · 知道与明白</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Biết và hiểu</p>\n<div class=\"lead\"><b>本课目标：</b>会用「知道 / 明白 / 觉得 / 会 / 能」表达认知与能力</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">知道</td><td class=\"pyc\">zhī dào</td><td class=\"hv\">tri đạo</td><td>biết; nhận thức được；cũng đọc là</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">明白</td><td class=\"pyc\">míng bai</td><td class=\"hv\">minh bạch</td><td>rõ ràng；hiển nhiên</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">记得</td><td class=\"pyc\">jì de</td><td class=\"hv\">kí đắc</td><td>nhớ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">觉得</td><td class=\"pyc\">jué de</td><td class=\"hv\">giác đắc</td><td>nghĩ rằng ...; cảm thấy rằng；cảm thấy (không thoải mái, v.v.)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">想</td><td class=\"pyc\">xiǎng</td><td class=\"hv\">tưởng</td><td>nghĩ (về)；nghĩ đến; nghĩ ra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">要</td><td class=\"pyc\">yào</td><td class=\"hv\">yếu</td><td>muốn; cần; yêu cầu；sẽ; sắp; sắp sửa</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">会</td><td class=\"pyc\">huì</td><td class=\"hv\">hội</td><td>có thể; có kỹ năng; biết cách；có khả năng; chắc chắn</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">能</td><td class=\"pyc\">néng</td><td class=\"hv\">năng</td><td>có thể；có khả năng</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">喜欢</td><td class=\"pyc\">xǐ huan</td><td class=\"hv\">hỉ hoan</td><td>thích; ưa thích</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">爱</td><td class=\"pyc\">ài</td><td class=\"hv\">ái</td><td>yêu; thích；tình cảm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">爱好</td><td class=\"pyc\">ài hào</td><td class=\"hv\">ái hảo</td><td>thích；sở thích</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">行</td><td class=\"pyc\">xíng</td><td class=\"hv\">hành</td><td>đi；đến</td><td class=\"hint\">动词 / 语素</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「会」表技能，「能」表条件</p><p class=\"gfm\">会 + 学会的技能　｜　能 + 有条件做的事</p><p class=\"gnote\">「会」是学会了，「能」是有能力或条件做。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我会说汉语。</p><p class=\"py\">wǒ huì shuō Hàn yǔ。</p><p class=\"vi\">Tôi biết nói tiếng Hán.</p></div><div class=\"gex\"><p class=\"zh\">今天我不能去。</p><p class=\"py\">jīn tiān wǒ bù néng qù。</p><p class=\"vi\">Hôm nay tôi không đi được.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「觉得」引出看法</p><p class=\"gfm\">我 + 觉得 + 句子</p><p class=\"gnote\">「觉得」后面接完整的主谓结构。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我觉得不难。</p><p class=\"py\">wǒ jué de bù nán。</p><p class=\"vi\">Tôi thấy không khó.</p></div><div class=\"gex\"><p class=\"zh\">我觉得这个很好。</p><p class=\"py\">wǒ jué de zhè ge hěn hǎo。</p><p class=\"vi\">Tôi thấy cái này rất tốt.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 「喜欢」和「爱」</p><p class=\"gfm\">喜欢 &lt; 爱（程度）</p><p class=\"gnote\">「爱」程度更深，家人之间常用。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我喜欢看书。</p><p class=\"py\">wǒ xǐ huan kàn shū。</p><p class=\"vi\">Tôi thích đọc sách.</p></div><div class=\"gex\"><p class=\"zh\">我爱我的家人。</p><p class=\"py\">wǒ ài wǒ de jiā rén。</p><p class=\"vi\">Tôi yêu gia đình tôi.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我知道他。</p><p class=\"py\">wǒ zhī dào tā。</p><p class=\"vi\">Tôi biết anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">我明白你的话。</p><p class=\"py\">wǒ míng bai nǐ de huà。</p><p class=\"vi\">Tôi hiểu lời bạn nói.</p></div><div class=\"sent\"><p class=\"zh\">我会说汉语。</p><p class=\"py\">wǒ huì shuō Hàn yǔ。</p><p class=\"vi\">Tôi biết nói tiếng Hán.</p></div><div class=\"sent\"><p class=\"zh\">今天我不能去。</p><p class=\"py\">jīn tiān wǒ bù néng qù。</p><p class=\"vi\">Hôm nay tôi không đi được.</p></div><div class=\"sent\"><p class=\"zh\">我喜欢看书。</p><p class=\"py\">wǒ xǐ huan kàn shū。</p><p class=\"vi\">Tôi thích đọc sách.</p></div><div class=\"sent\"><p class=\"zh\">我爱我的家人。</p><p class=\"py\">wǒ ài wǒ de jiā rén。</p><p class=\"vi\">Tôi yêu gia đình tôi.</p></div><div class=\"sent\"><p class=\"zh\">我的爱好是看书。</p><p class=\"py\">wǒ de ài hào shì kàn shū。</p><p class=\"vi\">Sở thích của tôi là đọc sách.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你会说汉语吗？</p><p class=\"py\">nǐ huì shuō Hàn yǔ ma？</p><p class=\"vi\">Bạn biết nói tiếng Hán không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">会一点儿。</p><p class=\"py\">huì yī diǎnr。</p><p class=\"vi\">Biết một chút.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你能写汉字吗？</p><p class=\"py\">nǐ néng xiě hàn zì ma？</p><p class=\"vi\">Bạn viết được chữ Hán không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">能。我写字很慢。</p><p class=\"py\">néng。 wǒ xiě zì hěn màn。</p><p class=\"vi\">Được. Tôi viết chữ rất chậm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你觉得汉语难吗？</p><p class=\"py\">nǐ jué de Hàn yǔ nán ma？</p><p class=\"vi\">Bạn thấy tiếng Hán khó không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我觉得不难。我喜欢汉语。</p><p class=\"py\">wǒ jué de bù nán。 wǒ xǐ huan Hàn yǔ。</p><p class=\"vi\">Tôi thấy không khó. Tôi thích tiếng Hán.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的爱好是什么？</p><p class=\"py\">nǐ de ài hào shì shén me？</p><p class=\"vi\">Sở thích của bạn là gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我的爱好是看书和听歌。</p><p class=\"py\">wǒ de ài hào shì kàn shū hé tīng gē。</p><p class=\"vi\">Sở thích của tôi là đọc sách và nghe nhạc.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「会 / 能」对比练习：会游泳 vs 今天不能去</li><li>「觉得」表达看法：对三件事各说一句</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「会」是学会的技能，「能」是条件允许，不能互换</li><li>「知道」是知道事实，「明白」是理解了道理</li><li>「爱」比「喜欢」程度深，不要随便对人说「我爱你」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「会 / 能 / 觉得 / 喜欢」各写一句</li><li>在 App 上完成 L26 测验</li></ul>"},
    {title:"L27 工作", id:"l27", html:"<h1>L27 · 工作</h1>\n<p class=\"sub\">第三阶段 · 学习与工作　|　Công việc</p>\n<div class=\"lead\"><b>本课目标：</b>会谈论工作安排</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">工作</td><td class=\"pyc\">gōng zuò</td><td class=\"hv\">công tác</td><td>làm việc；(máy móc) vận hành</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">上班</td><td class=\"pyc\">shàng bān</td><td class=\"hv\">thượng ban</td><td>đi làm；đi trực</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">下班</td><td class=\"pyc\">xià bān</td><td class=\"hv\">hạ ban</td><td>tan làm；tan ca</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">工人</td><td class=\"pyc\">gōng rén</td><td class=\"hv\">công nhân</td><td>công nhân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">忙</td><td class=\"pyc\">máng</td><td class=\"hv\">mang</td><td>bận；vội vã</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">开会</td><td class=\"pyc\">kāi huì</td><td class=\"hv\">khai hội</td><td>tổ chức cuộc họp；tham gia cuộc họp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">准备</td><td class=\"pyc\">zhǔn bèi</td><td class=\"hv\">chuẩn bị</td><td>sự chuẩn bị；chuẩn bị</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">重要</td><td class=\"pyc\">zhòng yào</td><td class=\"hv\">trọng yếu</td><td>quan trọng; đáng kể; chính yếu</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">有用</td><td class=\"pyc\">yǒu yòng</td><td class=\"hv\">hữu dụng</td><td>hữu ích</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">事</td><td class=\"pyc\">shì</td><td class=\"hv\">sự</td><td>sự việc；điều</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">最后</td><td class=\"pyc\">zuì hòu</td><td class=\"hv\">tối hậu</td><td>cuối cùng；sau cùng</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">认真</td><td class=\"pyc\">rèn zhēn</td><td class=\"hv\">nhận chân</td><td>tận tâm；nghiêm túc</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「上班 / 下班 / 开会」是动宾结构</p><p class=\"gfm\">几点 + 上班 / 下班　｜　在 + 开会</p><p class=\"gnote\">这几个词后面不能直接接宾语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我八点上班，五点下班。</p><p class=\"py\">wǒ bā diǎn shàng bān， wǔ diǎn xià bān。</p><p class=\"vi\">Tôi đi làm lúc tám giờ, tan làm lúc năm giờ.</p></div><div class=\"gex\"><p class=\"zh\">他在开会。</p><p class=\"py\">tā zài kāi huì。</p><p class=\"vi\">Anh ấy đang họp.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「在 + 动词」表示正在进行</p><p class=\"gfm\">在 + 动词</p><p class=\"gnote\">表示动作正在进行。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在开会。</p><p class=\"py\">tā zài kāi huì。</p><p class=\"vi\">Anh ấy đang họp.</p></div><div class=\"gex\"><p class=\"zh\">我在准备。</p><p class=\"py\">wǒ zài zhǔn bèi。</p><p class=\"vi\">Tôi đang chuẩn bị.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我在这里工作。</p><p class=\"py\">wǒ zài zhè lǐ gōng zuò。</p><p class=\"vi\">Tôi làm việc ở đây.</p></div><div class=\"sent\"><p class=\"zh\">我八点上班，五点下班。</p><p class=\"py\">wǒ bā diǎn shàng bān， wǔ diǎn xià bān。</p><p class=\"vi\">Tôi đi làm lúc tám giờ, tan làm lúc năm giờ.</p></div><div class=\"sent\"><p class=\"zh\">他在开会。</p><p class=\"py\">tā zài kāi huì。</p><p class=\"vi\">Anh ấy đang họp.</p></div><div class=\"sent\"><p class=\"zh\">我今天很忙。</p><p class=\"py\">wǒ jīn tiān hěn máng。</p><p class=\"vi\">Hôm nay tôi rất bận.</p></div><div class=\"sent\"><p class=\"zh\">我下午有事。</p><p class=\"py\">wǒ xià wǔ yǒu shì。</p><p class=\"vi\">Chiều nay tôi có việc.</p></div><div class=\"sent\"><p class=\"zh\">最后，我要谢谢您。</p><p class=\"py\">zuì hòu， wǒ yào xiè xie nín。</p><p class=\"vi\">Cuối cùng, tôi xin cảm ơn ông/bà.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在哪儿工作？</p><p class=\"py\">nǐ zài nǎr gōng zuò？</p><p class=\"vi\">Bạn làm việc ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我在学校工作。</p><p class=\"py\">wǒ zài xué xiào gōng zuò。</p><p class=\"vi\">Tôi làm việc ở trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你几点上班？</p><p class=\"py\">nǐ jǐ diǎn shàng bān？</p><p class=\"vi\">Bạn đi làm lúc mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">八点上班，五点下班。</p><p class=\"py\">bā diǎn shàng bān， wǔ diǎn xià bān。</p><p class=\"vi\">Tám giờ đi làm, năm giờ tan làm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">今天忙吗？</p><p class=\"py\">jīn tiān máng ma？</p><p class=\"vi\">Hôm nay bận không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很忙。上午开会，下午有事。</p><p class=\"py\">hěn máng。 shàng wǔ kāi huì， xià wǔ yǒu shì。</p><p class=\"vi\">Rất bận. Sáng họp, chiều có việc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这个工作重要吗？</p><p class=\"py\">zhè ge gōng zuò zhòng yào ma？</p><p class=\"vi\">Công việc này quan trọng không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很重要。我要认真准备。</p><p class=\"py\">hěn zhòng yào。 wǒ yào rèn zhēn zhǔn bèi。</p><p class=\"vi\">Rất quan trọng. Tôi phải chuẩn bị nghiêm túc.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>工作动词卡：上班 / 下班 / 开会 / 准备 / 工作</li><li>情景练习：描述一份自己理想工作的日常</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「上班 / 下班」是不及物动词，后面不能接宾语</li><li>「事」是名词，要说「一件事」，不说「一个事」</li><li>「认真」是形容词，也可作状语：认真准备</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出自己一天的工作或学习安排</li><li>在 App 上完成 L27 测验</li></ul>"}
  ]},
