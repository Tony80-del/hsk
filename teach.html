  {title:"七、单元6 情感与性格", id:"hsk3-g6", children:[
    {title:"L41 语气副词（一）：到底 / 究竟 / 简直", id:"hsk3-l41", html:"<h1>L41 · 语气副词（一）：到底 / 究竟 / 简直</h1>\n<div class=\"lead\">掌握语气副词，能表达追问与夸张</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>到底 / 究竟 + 疑问（你到底去不去？）｜ 简直 + 不 + 动词（简直不敢相信）</b></td></tr>\n<tr><td>教学目标</td><td>掌握语气副词，能表达追问与夸张</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ ngữ khí (1): 「到底/究竟/简直」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「到底/究竟」用于<b>追问</b>，不能用于一般疑问；「简直」含夸张，多跟「不/太」搭配。越南语 &quot;rốt cuộc / quả thực&quot; 语气弱得多。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">幸福</td><td class=\"pyc\">xìng fú</td><td class=\"hv\">hạnh phúc</td><td>hạnh phúc；vui vẻ</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">伤心</td><td class=\"pyc\">shāng xīn</td><td class=\"hv\">thương tâm</td><td>đau buồn；tan nát cõi lòng</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">害怕</td><td class=\"pyc\">hài pà</td><td class=\"hv\">hại phạ</td><td>sợ hãi; lo sợ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">不安</td><td class=\"pyc\">bù ān</td><td class=\"hv\">bất an</td><td>không yên；bất ổn</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">欢乐</td><td class=\"pyc\">huān lè</td><td class=\"hv\">hoan nhạc</td><td>sự vui vẻ；vui mừng</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">乐</td><td class=\"pyc\">lè</td><td class=\"hv\">nhạc</td><td>vui；vui vẻ</td><td class=\"hint\">形容词 / 语素</td></tr><tr><td class=\"hz\">满足</td><td class=\"pyc\">mǎn zú</td><td class=\"hv\">mãn túc</td><td>thoả mãn；đáp ứng (nhu cầu)</td><td class=\"hint\">动词 / 名形词</td></tr><tr><td class=\"hz\">温暖</td><td class=\"pyc\">wēn nuǎn</td><td class=\"hv\">ôn noãn</td><td>ấm áp</td><td class=\"hint\">名形词 / 形容词</td></tr><tr><td class=\"hz\">就是</td><td class=\"pyc\">jiù shì</td><td class=\"hv\">tựu thị</td><td>chính xác; đúng；chỉ; đơn giản; chỉ là</td><td class=\"hint\">动词 / 副词</td></tr><tr><td class=\"hz\">其实</td><td class=\"pyc\">qí shí</td><td class=\"hv\">kỳ thật</td><td>thực ra; thực tế; thật sự</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">当然</td><td class=\"pyc\">dāng rán</td><td class=\"hv\">đương nhiên</td><td>đương nhiên；như lẽ ra phải thế</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">只是</td><td class=\"pyc\">zhǐ shì</td><td class=\"hv\">chỉ thị</td><td>chỉ; chỉ là; không gì ngoài；đơn giản</td><td class=\"hint\">副词 / 连词</td></tr><tr><td class=\"hz\">到底</td><td class=\"pyc\">dào dǐ</td><td class=\"hv\">đáo để</td><td>cuối cùng；rốt cuộc</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">绝对</td><td class=\"pyc\">jué duì</td><td class=\"hv\">tuyệt đối</td><td>tuyệt đối; vô điều kiện</td><td class=\"hint\">副词 / 形容词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L42 语气副词（二）：难道 / 千万 / 反正", id:"hsk3-l42", html:"<h1>L42 · 语气副词（二）：难道 / 千万 / 反正</h1>\n<div class=\"lead\">掌握反问与叮嘱语气，能表达反问、叮嘱、无所谓</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>难道 + …吗（反问）｜ 千万 + 别/要（叮嘱）｜ 反正 + 结论（无所谓）</b></td></tr>\n<tr><td>教学目标</td><td>掌握反问与叮嘱语气，能表达反问、叮嘱、无所谓</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ ngữ khí (2): 「难道/千万/反正」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L41</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「难道」句尾<b>必须</b>有「吗」，且答案与字面相反；「千万」只用于<b>叮嘱</b>，不能用于陈述。学员会漏掉「吗」把反问说成陈述。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">简直</td><td class=\"pyc\">jiǎn zhí</td><td class=\"hv\">giản trực</td><td>thực sự; thật sự</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">难道</td><td class=\"pyc\">nán dào</td><td class=\"hv\">nan đạo</td><td>chẳng lẽ；có thể nào...?</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">千万</td><td class=\"pyc\">qiān wàn</td><td class=\"hv\">thiên vạn</td><td>mười triệu；vô số</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">反正</td><td class=\"pyc\">fǎn zhèng</td><td class=\"hv\">phản chánh</td><td>dù sao đi nữa；dù thế nào</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">恐怕</td><td class=\"pyc\">kǒng pà</td><td class=\"hv\">khủng phạ</td><td>sợ；sợ rằng</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">只好</td><td class=\"pyc\">zhǐ hǎo</td><td class=\"hv\">chỉ hảo</td><td>không còn lựa chọn nào khác ngoài</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">性格</td><td class=\"pyc\">xìng gé</td><td class=\"hv\">tính cách</td><td>bản chất；tính tình</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">个性</td><td class=\"pyc\">gè xìng</td><td class=\"hv\">cá tính</td><td>cá tính；tính cách</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">积极</td><td class=\"pyc\">jī jí</td><td class=\"hv\">tích cực</td><td>chủ động；năng động</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">乐观</td><td class=\"pyc\">lè guān</td><td class=\"hv\">nhạc quan</td><td>lạc quan; đầy hy vọng</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">坚强</td><td class=\"pyc\">jiān qiáng</td><td class=\"hv\">kiên cường</td><td>kiên cường；mạnh mẽ</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">强</td><td class=\"pyc\">qiáng</td><td class=\"hv\">cường</td><td>mạnh；mạnh mẽ</td><td class=\"hint\">形容词 / 语素</td></tr><tr><td class=\"hz\">强烈</td><td class=\"pyc\">qiáng liè</td><td class=\"hv\">cường liệt</td><td>mạnh mẽ; dữ dội</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">成熟</td><td class=\"pyc\">chéng shú</td><td class=\"hv\">thành thục</td><td>trưởng thành; chín；trưởng thành; làm cho chín</td><td class=\"hint\">形容词 / 名形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L43 副词：恐怕 / 只好 / 当然 / 其实", id:"hsk3-l43", html:"<h1>L43 · 副词：恐怕 / 只好 / 当然 / 其实</h1>\n<div class=\"lead\">掌握推测与转折副词，能表达推测与让步</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>恐怕 + 推测 ｜ 只好 + 无奈的选择 ｜ 当然 + 理应如此 ｜ 其实 + 事实</b></td></tr>\n<tr><td>教学目标</td><td>掌握推测与转折副词，能表达推测与让步</td></tr>\n<tr><td>Tiếng Việt</td><td>Phó từ: 「恐怕/只好/当然/其实」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L42</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「恐怕」表<b>不太乐观</b>的推测（恐怕来不及了）；「只好」表<b>没有别的选择</b>。越南语 &quot;e rằng / đành phải&quot; 语气接近但使用频率低。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">可靠</td><td class=\"pyc\">kě kào</td><td class=\"hv\">khả kháo</td><td>đáng tin cậy</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">好奇</td><td class=\"pyc\">hào qí</td><td class=\"hv\">hảo kì</td><td>tò mò；hiếu kỳ</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">奇怪</td><td class=\"pyc\">qí guài</td><td class=\"hv\">kì quái</td><td>kỳ lạ；lập dị</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">亲切</td><td class=\"pyc\">qīn qiè</td><td class=\"hv\">thân thiết</td><td>thân thiện；ấm áp</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">决心</td><td class=\"pyc\">jué xīn</td><td class=\"hv\">quyết tâm</td><td>quyết tâm；sự kiên quyết</td><td class=\"hint\">名词 / 副词</td></tr><tr><td class=\"hz\">热爱</td><td class=\"pyc\">rè ài</td><td class=\"hv\">nhiệt ái</td><td>yêu nhiệt thành；ngưỡng mộ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">感情</td><td class=\"pyc\">gǎn qíng</td><td class=\"hv\">cảm tình</td><td>cảm xúc; tình cảm；tình cảm giữa hai người</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">情感</td><td class=\"pyc\">qíng gǎn</td><td class=\"hv\">tình cảm</td><td>cảm giác；cảm xúc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">结婚</td><td class=\"pyc\">jié hūn</td><td class=\"hv\">kết hôn</td><td>kết hôn；cưới</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">离婚</td><td class=\"pyc\">lí hūn</td><td class=\"hv\">ly hôn</td><td>ly hôn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">吵架</td><td class=\"pyc\">chǎo jià</td><td class=\"hv\">sảo giá</td><td>cãi nhau；có cuộc cãi vã</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">吵</td><td class=\"pyc\">chǎo</td><td class=\"hv\">sảo</td><td>cãi nhau；gây ồn ào</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">告别</td><td class=\"pyc\">gào bié</td><td class=\"hv\">cáo biệt</td><td>rời đi; chia tay；chào tạm biệt; nói lời tạm biệt</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">握手</td><td class=\"pyc\">wò shǒu</td><td class=\"hv\">ác thủ</td><td>bắt tay</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L44 「即使…也」「哪怕…也」", id:"hsk3-l44", html:"<h1>L44 · 「即使…也」「哪怕…也」</h1>\n<div class=\"lead\">掌握让步复句，能表达「就算这样也…」</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>即使 / 哪怕 + 假设（含极端情况），也 + 结果</b></td></tr>\n<tr><td>教学目标</td><td>掌握让步复句，能表达「就算这样也…」</td></tr>\n<tr><td>Tiếng Việt</td><td>「即使…也」「哪怕…也」: cho dù…cũng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L15</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「即使」是<b>假设</b>让步（还没发生），「虽然」是<b>事实</b>让步（已经发生）。越南语 &quot;dù&quot; 兼表两者，学员会混用。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">熟人</td><td class=\"pyc\">shú rén</td><td class=\"hv\">thục nhân</td><td>người quen；bạn bè</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">希望</td><td class=\"pyc\">xī wàng</td><td class=\"hv\">hy vọng</td><td>hy vọng</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">理解</td><td class=\"pyc\">lǐ jiě</td><td class=\"hv\">lý giải</td><td>lĩnh hội; hiểu</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">信任</td><td class=\"pyc\">xìn rèn</td><td class=\"hv\">tín nhâm</td><td>tin tưởng；có niềm tin vào</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">体会</td><td class=\"pyc\">tǐ huì</td><td class=\"hv\">thể hội</td><td>biết từ kinh nghiệm；học qua trải nghiệm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">印象</td><td class=\"pyc\">yìn xiàng</td><td class=\"hv\">ấn tượng</td><td>ấn tượng；một ký ức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">主张</td><td class=\"pyc\">zhǔ zhāng</td><td class=\"hv\">chủ trương</td><td>ủng hộ；tán thành</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">判断</td><td class=\"pyc\">pàn duàn</td><td class=\"hv\">phán đoạn</td><td>phán đoán；xác định</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">否认</td><td class=\"pyc\">fǒu rèn</td><td class=\"hv\">phủ nhận</td><td>tuyên bố không đúng；phủ nhận</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">否定</td><td class=\"pyc\">fǒu dìng</td><td class=\"hv\">phủ định</td><td>phủ định；phủ nhận</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">考验</td><td class=\"pyc\">kǎo yàn</td><td class=\"hv\">khảo nghiệm</td><td>thử thách；đưa vào thử thách</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">克服</td><td class=\"pyc\">kè fú</td><td class=\"hv\">khắc phục</td><td>(cố gắng) khắc phục；chinh phục</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">争取</td><td class=\"pyc\">zhēng qǔ</td><td class=\"hv\">tranh thủ</td><td>đấu tranh giành；nỗ lực giành</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">坚持</td><td class=\"pyc\">jiān chí</td><td class=\"hv\">kiên trì</td><td>kiên trì；khăng khăng</td><td class=\"hint\">动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L45 心理动词 + 从句", id:"hsk3-l45", html:"<h1>L45 · 心理动词 + 从句</h1>\n<div class=\"lead\">掌握心理动词带小句宾语，能表达看法与感受</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>觉得 / 认为 / 希望 / 担心 + 小句（我认为他会来）</b></td></tr>\n<tr><td>教学目标</td><td>掌握心理动词带小句宾语，能表达看法与感受</td></tr>\n<tr><td>Tiếng Việt</td><td>Động từ tâm lý + mệnh đề</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「认为」偏正式判断、「觉得」偏主观感受；「希望」后接<b>未实现</b>的事、「觉得」后接<b>已判断</b>的事。学员会一律用「觉得」。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">敢</td><td class=\"pyc\">gǎn</td><td class=\"hv\">cảm</td><td>dám；cả gan</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">面对</td><td class=\"pyc\">miàn duì</td><td class=\"hv\">diện đối</td><td>đối mặt; đương đầu</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">失去</td><td class=\"pyc\">shī qù</td><td class=\"hv\">thất khứ</td><td>mất</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">值得</td><td class=\"pyc\">zhí de</td><td class=\"hv\">đắc</td><td>đáng；đáng để</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">需要</td><td class=\"pyc\">xū yào</td><td class=\"hv\">nhu yếu</td><td>cần; muốn; yêu cầu; đòi hỏi；nhu cầu</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">麻烦</td><td class=\"pyc\">má fan</td><td class=\"hv\">ma phiền</td><td>rắc rối; bất tiện；không tiện</td><td class=\"hint\">名形词 / 形容词</td></tr><tr><td class=\"hz\">美丽</td><td class=\"pyc\">měi lì</td><td class=\"hv\">mỹ lệ</td><td>đẹp</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">美</td><td class=\"pyc\">měi</td><td class=\"hv\">mỹ</td><td>đẹp；rất thỏa mãn; tốt</td><td class=\"hint\">区别词 / 形容词</td></tr><tr><td class=\"hz\">美好</td><td class=\"pyc\">měi hǎo</td><td class=\"hv\">mỹ hảo</td><td>đẹp；tốt đẹp</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">完美</td><td class=\"pyc\">wán měi</td><td class=\"hv\">hoàn mỹ</td><td>hoàn hảo</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">真实</td><td class=\"pyc\">zhēn shí</td><td class=\"hv\">chân thật</td><td>thật; chân thật</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">现实</td><td class=\"pyc\">xiàn shí</td><td class=\"hv\">hiện thật</td><td>thực tế; hiện thực；thật; thực</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">容易</td><td class=\"pyc\">róng yì</td><td class=\"hv\">dong dịch</td><td>dễ dàng; đơn giản；có khả năng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">困难</td><td class=\"pyc\">kùn nan</td><td class=\"hv\">khốn nan</td><td>khó khăn；thử thách</td><td class=\"hint\">形容词 / 名形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L46 「把…当…」「拿…当…」", id:"hsk3-l46", html:"<h1>L46 · 「把…当…」「拿…当…」</h1>\n<div class=\"lead\">掌握「当」字结构，能表达「把某物当作某物」</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>把 / 拿 + A + 当 + B（把他当朋友 / 拿他当朋友）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「当」字结构，能表达「把某物当作某物」</td></tr>\n<tr><td>Tiếng Việt</td><td>「把…当…」「拿…当…」: coi…là…</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「当」读 dàng（第四声），不是 dāng；「把…当…」与「拿…当…」意思相同但「拿」更口语。学员读音和用词都易错。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">简单</td><td class=\"pyc\">jiǎn dān</td><td class=\"hv\">giản đan</td><td>đơn giản; không phức tạp</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">显得</td><td class=\"pyc\">xiǎn de</td><td class=\"hv\">hiển đắc</td><td>dường như；trông</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">看上去</td><td class=\"pyc\">kàn shang qu</td><td class=\"hv\">khán thượng khứ</td><td>dường như；có vẻ (như)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">看起来</td><td class=\"pyc\">kàn qǐ lai</td><td class=\"hv\">khán khởi lai</td><td>hình như</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">果然</td><td class=\"pyc\">guǒ rán</td><td class=\"hv\">quả nhiên</td><td>thực sự；quả nhiên</td><td class=\"hint\">副词 / 连词</td></tr><tr><td class=\"hz\">对待</td><td class=\"pyc\">duì dài</td><td class=\"hv\">đối đãi</td><td>đối xử；sự đối xử</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">主意</td><td class=\"pyc\">zhǔ yi</td><td class=\"hv\">chủ ý</td><td>kế hoạch；ý tưởng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">具体</td><td class=\"pyc\">jù tǐ</td><td class=\"hv\">cụ thể</td><td>cụ thể; chi tiết; rõ ràng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">客观</td><td class=\"pyc\">kè guān</td><td class=\"hv\">khách quan</td><td>khách quan；công bằng</td><td class=\"hint\">形容词 / 名词</td></tr><tr><td class=\"hz\">毛病</td><td class=\"pyc\">máo bìng</td><td class=\"hv\">mao bệnh</td><td>lỗi；sai sót</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">双方</td><td class=\"pyc\">shuāng fāng</td><td class=\"hv\">song phương</td><td>song phương；hai bên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">对方</td><td class=\"pyc\">duì fāng</td><td class=\"hv\">đối phương</td><td>người kia; bên kia; phía bên kia</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">对象</td><td class=\"pyc\">duì xiàng</td><td class=\"hv\">đối tượng</td><td>mục tiêu; đối tượng；bạn đời; bạn trai; bạn gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">强大</td><td class=\"pyc\">qiáng dà</td><td class=\"hv\">cường đại</td><td>to lớn và mạnh mẽ</td><td class=\"hint\">形容词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L47 形容词重叠", id:"hsk3-l47", html:"<h1>L47 · 形容词重叠</h1>\n<div class=\"lead\">掌握形容词重叠形式，能表达程度加深</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>AA 的（红红的）｜ ABAB（高兴高兴）｜ AABB（高高兴兴）</b></td></tr>\n<tr><td>教学目标</td><td>掌握形容词重叠形式，能表达程度加深</td></tr>\n<tr><td>Tiếng Việt</td><td>Láy tính từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>14 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">单音节 AA 的、双音节 AABB 表程度<b>加深</b>；ABAB 只用于<b>短时尝试</b>且多为动词。越南语用 &quot;rất&quot; 表程度，没有重叠形式。</div>\n\n<h2>本课词表 14 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">深</td><td class=\"pyc\">shēn</td><td class=\"hv\">thâm</td><td>sâu (cả nghĩa đen và bóng)；biến thể cũ của 深</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">静</td><td class=\"pyc\">jìng</td><td class=\"hv\">tĩnh</td><td>yên；tĩnh</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">旧</td><td class=\"pyc\">jiù</td><td class=\"hv\">cựu</td><td>cũ；đối lập: mới 新</td><td class=\"hint\">形容词 / 语素</td></tr><tr><td class=\"hz\">女子</td><td class=\"pyc\">nǚ zǐ</td><td class=\"hv\">nữ tử</td><td>phụ nữ；nữ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">男子</td><td class=\"pyc\">nán zǐ</td><td class=\"hv\">nam tử</td><td>một người đàn ông; nam giới</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">争</td><td class=\"pyc\">zhēng</td><td class=\"hv\">tranh</td><td>cố gắng giành；đua tranh</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">亲</td><td class=\"pyc\">qīn</td><td class=\"hv\">thân</td><td>cha mẹ；người thân (ruột thịt)</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">仅</td><td class=\"pyc\">jǐn</td><td class=\"hv\">cận</td><td>hầu như；chỉ</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">仅仅</td><td class=\"pyc\">jǐn jǐn</td><td class=\"hv\">cận cận</td><td>hầu như không；chỉ</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">仍</td><td class=\"pyc\">réng</td><td class=\"hv\">nhưng</td><td>vẫn；duy trì</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">仍然</td><td class=\"pyc\">réng rán</td><td class=\"hv\">nhưng nhiên</td><td>vẫn; như trước</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">伟大</td><td class=\"pyc\">wěi dà</td><td class=\"hv\">vĩ đại</td><td>to lớn</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">传</td><td class=\"pyc\">chuán</td><td class=\"hv\">truyện</td><td>truyền đạt；lan truyền</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">内</td><td class=\"pyc\">nèi</td><td class=\"hv\">nội</td><td>bên trong；nội bộ</td><td class=\"hint\">方位词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L48 单元六综合：表达感受与态度", id:"hsk3-l48", html:"<h1>L48 · 单元六综合：表达感受与态度</h1>\n<div class=\"lead\">综合运用语气副词、让步句与心理动词，完整表达个人感受与态度</div>\n<table>\n<tr><td>所属单元</td><td>单元6 · 情感与性格（Tình cảm và tính cách）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>语气副词 ｜ 即使…也 ｜ 心理动词从句 ｜ 形容词重叠（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用语气副词、让步句与心理动词，完整表达个人感受与态度</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 6: Bày tỏ cảm nhận và thái độ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L41、L44、L45、L47</td></tr>\n<tr><td>词量 / 课时</td><td>13 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">表达主观态度时语气副词密度最高，学员会把「到底/难道/简直」当同义词换用。要按<b>语气强度</b>排序练。</div>\n\n<h2>本课词表 13 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">准</td><td class=\"pyc\">zhǔn</td><td class=\"hv\">chuẩn</td><td>cho phép；chấp thuận</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">哈哈</td><td class=\"pyc\">hā hā</td><td class=\"hv\">cáp cáp</td><td>(tượng thanh) cười to</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">干吗</td><td class=\"pyc\">gàn má</td><td class=\"hv\">can ma</td><td>bạn đang làm gì?；để làm gì?</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">某</td><td class=\"pyc\">mǒu</td><td class=\"hv\">mỗ</td><td>một vài；một cái nào đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">祝</td><td class=\"pyc\">zhù</td><td class=\"hv\">chúc</td><td>cầu nguyện；chúc</td><td class=\"hint\">动词 / 人名</td></tr><tr><td class=\"hz\">福</td><td class=\"pyc\">fú</td><td class=\"hv\">phúc</td><td>phúc lành；hạnh phúc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">胜利</td><td class=\"pyc\">shèng lì</td><td class=\"hv\">thắng lợi</td><td>chiến thắng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">重大</td><td class=\"pyc\">zhòng dà</td><td class=\"hv\">trọng đại</td><td>lớn；lao</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">错误</td><td class=\"pyc\">cuò wù</td><td class=\"hv\">thác ngộ</td><td>sai lầm; sai; không đúng；lỗi; sai sót</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">长城</td><td class=\"pyc\">Cháng chéng</td><td class=\"hv\">trường thành</td><td>Vạn Lý Trường Thành</td><td class=\"hint\">地名</td></tr><tr><td class=\"hz\">要是</td><td class=\"pyc\">yào shi</td><td class=\"hv\">yếu thị</td><td>(thông tục) nếu</td><td class=\"hint\">连词 / 动词</td></tr><tr><td class=\"hz\">谈</td><td class=\"pyc\">tán</td><td class=\"hv\">đàm</td><td>nói；trò chuyện</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">背后</td><td class=\"pyc\">bèi hòu</td><td class=\"hv\">bối hậu</td><td>phía sau；ở đằng sau</td><td class=\"hint\">方位词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"八、单元7 城市、交通与环境", id:"hsk3-g7", children:[
    {title:"L49 方位与处所：上面 / 下面 / 里面 / 外面 / 当中", id:"hsk3-l49", html:"<h1>L49 · 方位与处所：上面 / 下面 / 里面 / 外面 / 当中</h1>\n<div class=\"lead\">掌握方位词，能准确描述空间位置</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>名词 + 上面/下面/里面/外面/当中（桌子上 / 房间里 / 当中）</b></td></tr>\n<tr><td>教学目标</td><td>掌握方位词，能准确描述空间位置</td></tr>\n<tr><td>Tiếng Việt</td><td>Phương vị và nơi chốn</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">方位词是<b>后置</b>的（桌子上），越南语 &quot;trên bàn&quot; 是<b>前置</b>（trên + 名词）。这是越籍学员最顽固的语序错误之一，必须反复对比操练。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">城市</td><td class=\"pyc\">chéng shì</td><td class=\"hv\">thành thị</td><td>thành phố; thị trấn；LT:座</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">城</td><td class=\"pyc\">chéng</td><td class=\"hv\">thành</td><td>tường thành；thành phố</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">区</td><td class=\"pyc\">qū</td><td class=\"hv\">khu</td><td>khu vực；vùng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">地区</td><td class=\"pyc\">dì qū</td><td class=\"hv\">địa khu</td><td>địa phương；khu vực</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">农村</td><td class=\"pyc\">nóng cūn</td><td class=\"hv\">nông thôn</td><td>khu vực nông thôn；làng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">村</td><td class=\"pyc\">cūn</td><td class=\"hv\">thôn</td><td>ngôi làng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">家乡</td><td class=\"pyc\">jiā xiāng</td><td class=\"hv\">gia hương</td><td>quê hương；nơi sinh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">故乡</td><td class=\"pyc\">gù xiāng</td><td class=\"hv\">cố hương</td><td>quê hương；quê nhà</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">当地</td><td class=\"pyc\">dāng dì</td><td class=\"hv\">đương địa</td><td>địa phương</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">各地</td><td class=\"pyc\">gè dì</td><td class=\"hv\">các địa</td><td>ở khắp mọi nơi (của một quốc gia)；các vùng khác nhau</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">首都</td><td class=\"pyc\">shǒu dū</td><td class=\"hv\">thủ đô</td><td>thủ đô</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">中部</td><td class=\"pyc\">zhōng bù</td><td class=\"hv\">trung bộ</td><td>phần giữa；khu vực trung tâm</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">南部</td><td class=\"pyc\">nán bù</td><td class=\"hv\">nam bộ</td><td>phần phía nam</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">北部</td><td class=\"pyc\">běi bù</td><td class=\"hv\">bắc bộ</td><td>phần phía bắc</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">东部</td><td class=\"pyc\">dōng bù</td><td class=\"hv\">đông bộ</td><td>miền đông；phần phía đông</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">西部</td><td class=\"pyc\">xī bù</td><td class=\"hv\">tây bộ</td><td>phần phía tây</td><td class=\"hint\">方位词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L50 「往 / 朝 / 向 + 方位 + 动词」", id:"hsk3-l50", html:"<h1>L50 · 「往 / 朝 / 向 + 方位 + 动词」</h1>\n<div class=\"lead\">掌握方向介词，能描述动作方向</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>往 / 朝 / 向 + 方位/处所 + 动词（往前走 / 朝东走 / 向他点头）</b></td></tr>\n<tr><td>教学目标</td><td>掌握方向介词，能描述动作方向</td></tr>\n<tr><td>Tiếng Việt</td><td>「往/朝/向 + phương vị + động từ」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L49</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「往」后面接<b>方位或处所</b>、「朝/向」后面可接<b>人或物</b>（向他挥手）。越南语 &quot;về phía / hướng&quot; 区分不严，学员会一律用「往」。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">面积</td><td class=\"pyc\">miàn jī</td><td class=\"hv\">diện tích</td><td>diện tích；diện tích bề mặt</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">周围</td><td class=\"pyc\">zhōu wéi</td><td class=\"hv\">chu vi</td><td>vùng lân cận; xung quanh; ngoại vi</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">场所</td><td class=\"pyc\">chǎng suǒ</td><td class=\"hv\">tràng sở</td><td>địa điểm；nơi chốn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">上面</td><td class=\"pyc\">shàng miàn</td><td class=\"hv\">thượng diện</td><td>bên trên；đã đề cập</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">下面</td><td class=\"pyc\">xià miàn</td><td class=\"hv\">hạ diện</td><td>bên dưới；dưới</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">里面</td><td class=\"pyc\">lǐ miàn</td><td class=\"hv\">lý diện</td><td>bên trong；nội bộ</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">外面</td><td class=\"pyc\">wài miàn</td><td class=\"hv\">ngoại diện</td><td>bên ngoài；bề mặt</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">前面</td><td class=\"pyc\">qián miàn</td><td class=\"hv\">tiền diện</td><td>phía trước；ở trước</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">后面</td><td class=\"pyc\">hòu mian</td><td class=\"hv\">hậu diện</td><td>phía sau; phía đuôi; đoạn cuối；đằng sau; gần cuối; ở phía sau</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">当中</td><td class=\"pyc\">dāng zhōng</td><td class=\"hv\">đương trung</td><td>giữa；ở giữa</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">底下</td><td class=\"pyc\">dǐ xia</td><td class=\"hv\">để hạ</td><td>vị trí bên dưới cái gì；sau đó</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">前后</td><td class=\"pyc\">qián hòu</td><td class=\"hv\">tiền hậu</td><td>khoảng；từ đầu đến cuối</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">左右</td><td class=\"pyc\">zuǒ yòu</td><td class=\"hv\">tả hữu</td><td>trái phải；gần đây</td><td class=\"hint\">数词 / 方位词</td></tr><tr><td class=\"hz\">朝</td><td class=\"pyc\">cháo</td><td class=\"hv\">triêu</td><td>triều đình hoặc hoàng gia；chính phủ</td><td class=\"hint\">介词 / 时间语素</td></tr><tr><td class=\"hz\">室</td><td class=\"pyc\">shì</td><td class=\"hv\">thất</td><td>phòng；đơn vị công tác</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">顿</td><td class=\"pyc\">dùn</td><td class=\"hv\">đốn</td><td>dừng；tạm dừng</td><td class=\"hint\">量词 / 语素</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L51 距离与路线：离 / 到 / 从 / 经过", id:"hsk3-l51", html:"<h1>L51 · 距离与路线：离 / 到 / 从 / 经过</h1>\n<div class=\"lead\">掌握距离与路线表达，能说清「从哪儿到哪儿、离多远」</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>A 离 B + 距离 ｜ 从 + 起点 + 到 + 终点 ｜ 经过 + 处所</b></td></tr>\n<tr><td>教学目标</td><td>掌握距离与路线表达，能说清「从哪儿到哪儿、离多远」</td></tr>\n<tr><td>Tiếng Việt</td><td>Khoảng cách và lộ trình: 「离/到/从/经过」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>17 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「离」表<b>静态距离</b>（学校离这儿很近）、「从」表<b>起点</b>；越南语 &quot;cách / từ&quot; 分开，但学员会把「离」误用成「从」。</div>\n\n<h2>本课词表 17 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">铁路</td><td class=\"pyc\">tiě lù</td><td class=\"hv\">thiết lộ</td><td>đường sắt；đường ray</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">高速公路</td><td class=\"pyc\">gāo sù gōng lù</td><td class=\"hv\">cao tốc công lộ</td><td>đường cao tốc; xa lộ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">高速</td><td class=\"pyc\">gāo sù</td><td class=\"hv\">cao tốc</td><td>tốc độ cao；đường cao tốc</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">路线</td><td class=\"pyc\">lù xiàn</td><td class=\"hv\">lộ tuyến</td><td>hành trình；tuyến đường</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">桥</td><td class=\"pyc\">qiáo</td><td class=\"hv\">kiều</td><td>cầu；LT:座</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">飞行</td><td class=\"pyc\">fēi xíng</td><td class=\"hv\">phi hành</td><td>(máy bay,...) bay；đang bay</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">到达</td><td class=\"pyc\">dào dá</td><td class=\"hv\">đáo đạt</td><td>đạt đến; đến nơi</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">前往</td     {title:"L52 数量与范围：左右 / 大约 / 将近 / 超过", id:"hsk3-l52", html:"<h1>L52 · 数量与范围：左右 / 大约 / 将近 / 超过</h1>\n<div class=\"lead\">掌握约数与范围表达，能描述数量区间</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>数量 + 左右 ｜ 大约 + 数量 ｜ 将近 + 数量 ｜ 超过 + 数量</b></td></tr>\n<tr><td>教学目标</td><td>掌握约数与范围表达，能描述数量区间</td></tr>\n<tr><td>Tiếng Việt</td><td>Số lượng và phạm vi: 「左右/大约/将近/超过」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L19</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「左右」放在数量<b>后面</b>、「大约」放<b>前面</b>；「将近」表<b>接近但不到</b>、「超过」表<b>已经多于</b>。越南语 &quot;khoảng&quot; 全包且前置。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">旅行社</td><td class=\"pyc\">lǚ xíng shè</td><td class=\"hv\">lữ hành xã</td><td>công ty du lịch</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">沙发</td><td class=\"pyc\">shā fā</td><td class=\"hv\">sa phát</td><td>ghế sô pha (từ mượn)；(tiếng lóng Internet) người đầu ti</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">家具</td><td class=\"pyc\">jiā jù</td><td class=\"hv\">gia cụ</td><td>đồ nội thất；LT: 件 , 套</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">空调</td><td class=\"pyc\">kōng tiáo</td><td class=\"hv\">không điều</td><td>điều hòa không khí；máy điều hòa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">被子</td><td class=\"pyc\">bèi zi</td><td class=\"hv\">bị tử</td><td>chăn；LT:床</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">书架</td><td class=\"pyc\">shū jià</td><td class=\"hv\">thư giá</td><td>giá sách</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">衣架</td><td class=\"pyc\">yī jià</td><td class=\"hv\">y giá</td><td>móc treo quần áo；giá treo quần áo</td><td class=\"hint\">名词</td></tr><tr><td clas     {title:"L53 「一方面…另一方面」「既…又」", id:"hsk3-l53", html:"<h1>L53 · 「一方面…另一方面」「既…又」</h1>\n<div class=\"lead\">掌握并列复句，能表达「两个角度」或「两种性质并存」</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>一方面 + A，另一方面 + B ｜ 既 + A 又 + B</b></td></tr>\n<tr><td>教学目标</td><td>掌握并列复句，能表达「两个角度」或「两种性质并存」</td></tr>\n<tr><td>Tiếng Việt</td><td>「一方面…另一方面」「既…又」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L22</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「一方面…另一方面」多用于<b>对比或补充</b>（中性）；「既…又…」多用于<b>并存的性质</b>且都是褒义倾向。学员会混用。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">裙子</td><td class=\"pyc\">qún zi</td><td class=\"hv\">quần tử</td><td>váy</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">裤子</td><td class=\"pyc\">kù zi</td><td class=\"hv\">khố tử</td><td>quần tây；quần dài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">服装</td><td class=\"pyc\">fú zhuāng</td><td class=\"hv\">phục trang</td><td>trang phục；quần áo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">环境</td><td class=\"pyc\">huán jìng</td><td class=\"hv\">hoàn cảnh</td><td>môi trường；tình huống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">自然</td><td class=\"pyc\">zì rán</td><td class=\"hv\">tự nhiên</td><td>tự nhiên；một cách tự nhiên</td><td class=\"hint\">名词 / 副词</td></tr><tr><td class=\"hz\">环保</td><td class=\"pyc\">huán bǎo</td><td class=\"hv\">hoàn bảo</td><td>bảo vệ môi trường；thân thiện với môi trường</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">气候</td><td class=\"pyc\">qì hòu</td><td class=\"hv\">khí hậu</td><td>(khí tượng) khí hậu；(bóng) bầu không khí</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">阳光</td><td class=\"pyc\">yáng guāng</td><td class=\"hv\">dương quang</td><td>ánh nắng；(về tính cách) lạc quan; năng động</td><td class=\"hint\">名词 / 专名</td></tr><tr><td class=\"hz\">天空</td><td class=\"pyc\">tiān kōng</td><td class=\"hv\">thiên không</td><td>bầu trời</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">石头</td><td class=\"pyc\">shí tou</td><td class=\"hv\">thạch đầu</td><td>đá</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">沙子</td><td class=\"pyc\">shā zi</td><td class=\"hv\">sa tử</td><td>cát；sạn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">种子</td><td class=\"pyc\">zhǒng zi</td><td class=\"hv\">chủng tử</td><td>hạt giống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">一方面</td><td class=\"pyc\">yī fāng miàn</td><td class=\"hv\">nhất phương diện</td><td>một mặt</td><td class=\"hint\">连词 / 名词</td></tr><tr><td class=\"hz\">另一方面</td><td class=\"pyc\">lìng yī fāng miàn</td><td class=\"hv\">lánh nhất phương diện</td><td>mặt khác；một khía cạnh khác</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">牛</td><td class=\"pyc\">niú</td><td class=\"hv\">ngưu</td><td>con bò；(lóng) đỉnh, chất</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">马</td><td class=\"pyc\">mǎ</td><td class=\"hv\">mã</td><td>ngựa；Lượng từ: 匹</td><td class=\"hint\">名词 / 人名</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L54 「由于…所以」「因为…因此」", id:"hsk3-l54", html:"<h1>L54 · 「由于…所以」「因为…因此」</h1>\n<div class=\"lead\">掌握书面因果表达，区分「因为/由于」「所以/因此」</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>由于 + 原因，所以 / 因此 + 结果（书面）｜ 因为 + 原因，所以 + 结果（口语）</b></td></tr>\n<tr><td>教学目标</td><td>掌握书面因果表达，区分「因为/由于」「所以/因此」</td></tr>\n<tr><td>Tiếng Việt</td><td>Nguyên nhân văn viết: 「由于…所以」「因为…因此」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L23</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「由于」是<b>书面语</b>且后面常跟「因此」；「因为」是口语且后面常跟「所以」。越南语 &quot;vì / do&quot; 无此分工。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">猪</td><td class=\"pyc\">zhū</td><td class=\"hv\">trư</td><td>lợn；heo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">羊</td><td class=\"pyc\">yáng</td><td class=\"hv\">dương</td><td>cừu; dê</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">龙</td><td class=\"pyc\">lóng</td><td class=\"hv\">long</td><td>rồng；hoàng gia</td><td class=\"hint\">名词 / 人名</td></tr><tr><td class=\"hz\">土</td><td class=\"pyc\">tǔ</td><td class=\"hv\">thổ</td><td>đất；bụi</td><td class=\"hint\">名词 / 区别词</td></tr><tr><td class=\"hz\">火</td><td class=\"pyc\">huǒ</td><td class=\"hv\">hỏa</td><td>lửa；khẩn cấp</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">烟</td><td class=\"pyc\">yān</td><td class=\"hv\">yên</td><td>thuốc lá hoặc thuốc lào；khói</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">光</td><td class=\"pyc\">guāng</td><td class=\"hv\">quang</td><td>ánh sáng; tia；sáng; bóng loáng</td><td class=\"hint\">名词 / 副词</td></tr><tr><td class=\"hz\">香</td><td class=\"pyc\">xiāng</td><td class=\"hv\">hương</td><td>thơm；ngửi thơm</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">咖啡</td><td class=\"pyc\">kā fēi</td><td class=\"hv\">già phê</td><td>cà phê (từ mượn)；LT:杯</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">苹果</td><td class=\"pyc\">píng guǒ</td><td class=\"hv\">bình quả</td><td>quả táo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">香蕉</td><td class=\"pyc\">xiāng jiāo</td><td class=\"hv\">hương tiêu</td><td>quả chuối</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">布</td><td class=\"pyc\">bù</td><td class=\"hv\">bố</td><td>thông báo；lan truyền</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">环</td><td class=\"pyc\">huán</td><td class=\"hv\">hoàn</td><td>nhẫn；vòng</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">景色</td><td class=\"pyc\">jǐng sè</td><td class=\"hv\">cảnh sắc</td><td>phong cảnh；cảnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">架</td><td class=\"pyc\">jià</td><td class=\"hv\">giá</td><td>chống đỡ；khung</td><td class=\"hint\">量词 / 动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L55 天气与环境表达", id:"hsk3-l55", html:"<h1>L55 · 天气与环境表达</h1>\n<div class=\"lead\">掌握天气、气候与环境话题的高频表达</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>天气 / 气候 + 怎么样 ｜ 越来越 + 形容词 ｜ 环保 相关搭配</b></td></tr>\n<tr><td>教学目标</td><td>掌握天气、气候与环境话题的高频表达</td></tr>\n<tr><td>Tiếng Việt</td><td>Diễn đạt thời tiết và môi trường</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L18</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">描述气候要用「气候」而非「天气」（气候指长期、天气指当下）。越南语 &quot;thời tiết / khí hậu&quot; 区分与汉语一致，好接受。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">预报</td><td class=\"pyc\">yù bào</td><td class=\"hv\">dự báo</td><td>dự báo</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">暖和</td><td class=\"pyc\">nuǎn huo</td><td class=\"hv\">noãn hòa</td><td>ấm；ấm áp</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">比赛</td><td class=\"pyc\">bǐ sài</td><td class=\"hv\">bỉ tái</td><td>cuộc thi (thể thao, v.v.)；trận đấu</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">选手</td><td class=\"pyc\">xuǎn shǒu</td><td class=\"hv\">tuyển thủ</td><td>vận động viên；thí sinh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">输</td><td class=\"pyc\">shū</td><td class=\"hv\">thâu</td><td>thua; bị đánh bại；(dạng kết hợp) vận chuyển</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">赢</td><td class=\"pyc\">yíng</td><td class=\"hv\">doanh</td><td>thắng；chiến thắng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">胜</td><td class=\"pyc\">shèng</td><td class=\"hv\">thắng</td><td>chiến thắng；thành công</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">决赛</td><td class=\"pyc\">jué sài</td><td class=\"hv\">quyết tái</td><td>chung kết (của một cuộc thi)</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">全场</td><td class=\"pyc\">quán chǎng</td><td class=\"hv\">toàn tràng</td><td>mọi người có mặt；toàn bộ khán giả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">得分</td><td class=\"pyc\">dé fēn</td><td class=\"hv\">đắc phân</td><td>ghi điểm</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">纪录</td><td class=\"pyc\">jì lù</td><td class=\"hv\">kỉ lục</td><td>ghi chép；bản ghi chép</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">金牌</td><td class=\"pyc\">jīn pái</td><td class=\"hv\">kim bài</td><td>huy chương vàng；LT:枚</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">银牌</td><td class=\"pyc\">yín pái</td><td class=\"hv\">ngân bài</td><td>huy chương bạc；LT: 枚</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">球迷</td><td class=\"pyc\">qiú mí</td><td class=\"hv\">cầu mê</td><td>người hâm mộ (thể thao bóng)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">世界杯</td><td class=\"pyc\">Shì jiè bēi</td><td class=\"hv\">thế giới bôi</td><td>World Cup</td><td class=\"hint\">名词 / 专名</td></tr><tr><td class=\"hz\">足球</td><td class=\"pyc\">zú qiú</td><td class=\"hv\">túc cầu</td><td>quả bóng đá；một quả bóng đá</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L56 单元七综合：城市生活与出行", id:"hsk3-l56", html:"<h1>L56 · 单元七综合：城市生活与出行</h1>\n<div class=\"lead\">综合运用方位、方向、距离与并列复句，完成城市生活与出行任务</div>\n<table>\n<tr><td>所属单元</td><td>单元7 · 城市、交通与环境（Thành phố, giao thông và môi trường）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>方位词 ｜ 往/朝/向 ｜ 离/从/到 ｜ 左右/大约 ｜ 一方面…另一方面（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用方位、方向、距离与并列复句，完成城市生活与出行任务</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 7: Cuộc sống đô thị và đi lại</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L49、L50、L51、L52</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">指路场景里方位词 + 方向介词 + 距离表达会连续出现，语序错一个就整句不通。要练「从A 往B 走 N 米」的固定框架。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">游泳</td><td class=\"pyc\">yóu yǒng</td><td class=\"hv\">du vịnh</td><td>bơi lội；bơi</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">跳</td><td class=\"pyc\">tiào</td><td class=\"hv\">khiêu</td><td>nhảy；nhảy lò cò</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">跳高</td><td class=\"pyc\">tiào gāo</td><td class=\"hv\">khiêu cao</td><td>nhảy cao (điền kinh)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">跳远</td><td class=\"pyc\">tiào yuǎn</td><td class=\"hv\">khiêu viễn</td><td>nhảy xa (điền kinh)</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">划船</td><td class=\"pyc\">huá chuán</td><td class=\"hv\">hoa thuyền</td><td>chèo thuyền；môn chèo thuyền</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">游</td><td class=\"pyc\">yóu</td><td class=\"hv\">du</td><td>bơi；đi</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">邮票</td><td class=\"pyc\">yóu piào</td><td class=\"hv\">bưu phiếu</td><td>tem (bưu chính)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">信封</td><td class=\"pyc\">xìn fēng</td><td class=\"hv\">tín phong</td><td>phong bì</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">理发</td><td class=\"pyc\">lǐ fà</td><td class=\"hv\">lý phát</td><td>cắt tóc; làm tóc；cắt tóc (cho ai đó)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">做客</td><td class=\"pyc\">zuò kè</td><td class=\"hv\">tố khách</td><td>làm khách hoặc thăm viếng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">迷</td><td class=\"pyc\">mí</td><td class=\"hv\">mê</td><td>làm bối rối；mê mẩn</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">追</td><td class=\"pyc\">zhuī</td><td class=\"hv\">truy</td><td>đuổi；theo đuổi</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">危险</td><td class=\"pyc\">wēi xiǎn</td><td class=\"hv\">nguy hiểm</td><td>nguy hiểm</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">台</td><td class=\"pyc\">tái</td><td class=\"hv\">thai</td><td>(văn cổ) ông (trong thư từ)；bàn; cái bàn; quầy</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">线</td><td class=\"pyc\">xiàn</td><td class=\"hv\">tuyến</td><td>chỉ；sợi</td><td class=\"hint\">名词 / 量词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"九、单元8 文化、教育与艺术", id:"hsk3-g8", children:[
    {title:"L57 名词化后缀（一）：性 / 化", id:"hsk3-l57", html:"<h1>L57 · 名词化后缀（一）：性 / 化</h1>\n<div class=\"lead\">掌握「性」「化」构词，能理解和生成抽象名词</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>形容词/名词 + 性（积极性 / 可能性）｜ 名词/形容词 + 化（现代化 / 绿化）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「性」「化」构词，能理解和生成抽象名词</td></tr>\n<tr><td>Tiếng Việt</td><td>Hậu tố danh từ hóa (1): 「性」「化」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「性」把形容词变成<b>抽象名词</b>（积极→积极性）、「化」表示<b>转变过程</b>（现代→现代化）。越南语 &quot;tính / hóa&quot; 有对应，但搭配不自由。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">性</td><td class=\"pyc\">xìng</td><td class=\"hv\">tính</td><td>bản chất；tính cách</td><td class=\"hint\">语素 / 名词</td></tr><tr><td class=\"hz\">化</td><td class=\"pyc\">huà</td><td class=\"hv\">hóa</td><td>làm thành；thay đổi thành</td><td class=\"hint\">动词 / 后缀</td></tr><tr><td class=\"hz\">意义</td><td class=\"pyc\">yì yì</td><td class=\"hv\">ý nghĩa</td><td>ý nghĩa；tầm quan trọng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">价值</td><td class=\"pyc\">jià zhí</td><td class=\"hv\">giới</td><td>giá trị；đáng giá</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">概念</td><td class=\"pyc\">gài niàn</td><td class=\"hv\">khái niệm</td><td>khái niệm；ý tưởng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">理论</td><td class=\"pyc\">lǐ lùn</td><td class=\"hv\">lý luận</td><td>lý thuyết；tranh luận</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">观念</td><td class=\"pyc\">guān niàn</td><td class=\"hv\">quan niệm</td><td>khái niệm；suy nghĩ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">思想</td><td class=\"pyc\">sī xiǎng</td><td class=\"hv\">tư tưởng</td><td>suy nghĩ；tư duy</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">精神</td><td class=\"pyc\">jīng shén</td><td class=\"hv\">tinh thần</td><td>tinh thần；tâm trí</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">基础</td><td class=\"pyc\">jī chǔ</td><td class=\"hv\">cơ sở</td><td>nền; nền tảng; cơ sở；căn bản; cơ bản</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">程度</td><td class=\"pyc\">chéng dù</td><td class=\"hv\">trình độ</td><td>mức độ; trình độ; phạm vi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">范围</td><td class=\"pyc\">fàn wéi</td><td class=\"hv\">phạm vi</td><td>phạm vi；quy mô</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">过程</td><td class=\"pyc\">guò chéng</td><td class=\"hv\">quá trình</td><td>quá trình sự kiện；quá trình</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">方式</td><td class=\"pyc\">fāng shì</td><td class=\"hv\">phương thức</td><td>cách thức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">形式</td><td class=\"pyc\">xíng shì</td><td class=\"hv\">hình thức</td><td>bề ngoài；hình thức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">内容</td><td class=\"pyc\">nèi róng</td><td class=\"hv\">nội dong</td><td>nội dung；bản chất</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L58 名词化后缀（二）：者 / 员 / 度", id:"hsk3-l58", html:"<h1>L58 · 名词化后缀（二）：者 / 员 / 度</h1>\n<div class=\"lead\">掌握「者」「员」「度」构词，能理解职业与人称名词</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 者（读者 / 作者 / 志愿者）｜ 名词/动词 + 员（服务员 / 演员）｜ 形容词 + 度（难度）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「者」「员」「度」构词，能理解职业与人称名词</td></tr>\n<tr><td>Tiếng Việt</td><td>Hậu tố danh từ hóa (2): 「者」「员」「度」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L57</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「者」偏书面（读者/作者）、「员」指<b>职业身份</b>（服务员/演员）。越南语 &quot;giả / viên&quot; 有对应（tác giả / phục vụ viên），可借力。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">者</td><td class=\"pyc\">zhě</td><td class=\"hv\">giả</td><td>(sau động từ hoặc tính từ) người m；(sau danh từ) người liên quan đến</td><td class=\"hint\">后缀 / 代词</td></tr><tr><td class=\"hz\">员</td><td class=\"pyc\">yuán</td><td class=\"hv\">viên</td><td>(hình thức kết hợp) người tham gia；(hình thức kết hợp) thành viên</td><td class=\"hint\">语素 / 量词</td></tr><tr><td class=\"hz\">整体</td><td class=\"pyc\">zhěng tǐ</td><td class=\"hv\">chỉnh thể</td><td>thực thể toàn bộ；toàn thân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">并</td><td class=\"pyc\">bìng</td><td class=\"hv\">tịnh</td><td>và；hơn nữa</td><td class=\"hint\">副词 / 连词</td></tr><tr><td class=\"hz\">并且</td><td class=\"pyc\">bìng qiě</td><td class=\"hv\">tịnh thả</td><td>và</td><td class=\"hint\">连词</td></tr><tr><td class=\"hz\">另外</td><td class=\"pyc\">lìng wài</td><td class=\"hv\">lánh ngoại</td><td>bổ sung；thêm vào</td><td class=\"hint\">代词 / 连词</td></tr><tr><td class=\"hz\">由于</td><td class=\"pyc\">yóu yú</td><td class=\"hv\">do vu</td><td>do；bởi vì</td><td class=\"hint\">介词 / 连词</td></tr><tr><td class=\"hz\">属于</td><td class=\"pyc\">shǔ yú</td><td class=\"hv\">chúc vu</td><td>được phân loại là；thuộc về</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">具有</td><td class=\"pyc\">jù yǒu</td><td class=\"hv\">cụ hữu</td><td>có; sở hữu</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">体现</td><td class=\"pyc\">tǐ xiàn</td><td class=\"hv\">thể hiện</td><td>thể hiện；phản ánh</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">称为</td><td class=\"pyc\">chēng wéi</td><td class=\"hv\">xưng vi</td><td>được gọi là</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">表明</td><td class=\"pyc\">biǎo míng</td><td class=\"hv\">biểu minh</td><td>làm rõ；cho biết</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">适用</td><td class=\"pyc\">shì yòng</td><td class=\"hv\">quát dụng</td><td>có thể áp dụng</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">适合</td><td class=\"pyc\">shì hé</td><td class=\"hv\">quát hợp</td><td>phù hợp; thích hợp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">相关</td><td class=\"pyc\">xiāng guān</td><td class=\"hv\">tương quan</td><td>liên quan；tương ứng</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">有效</td><td class=\"pyc\">yǒu xiào</td><td class=\"hv\">hữu hiệu</td><td>hiệu quả；có hiệu lực</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L59 「所」字结构", id:"hsk3-l59", html:"<h1>L59 · 「所」字结构</h1>\n<div class=\"lead\">掌握「所」字结构，能理解书面语的「所+动词」</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>所 + 动词（所说 / 所学 / 所谓）｜ 为…所…（见 L29）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「所」字结构，能理解书面语的「所+动词」</td></tr>\n<tr><td>Tiếng Việt</td><td>Kết cấu chữ 「所」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L29</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「所+动词」整体相当于一个名词（所说 = 说的话）。越南语没有对应形式，学员会逐字理解成「地方」。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">所</td><td class=\"pyc\">suǒ</td><td class=\"hv\">sở</td><td>thực ra；nơi</td><td class=\"hint\">助词 / 量词</td></tr><tr><td class=\"hz\">属</td><td class=\"pyc\">shǔ</td><td class=\"hv\">chúc</td><td>phân loại；chi (phân loại học)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">确保</td><td class=\"pyc\">què bǎo</td><td class=\"hv\">xác bảo</td><td>đảm bảo; bảo đảm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">结合</td><td class=\"pyc\">jié hé</td><td class=\"hv\">kết hợp</td><td>kết hợp；liên kết</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">组合</td><td class=\"pyc\">zǔ hé</td><td class=\"hv\">tổ hợp</td><td>lắp ráp; kết hợp; cấu thành；kết hợp; liên kết; bộ; biên soạn</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">时</td><td class=\"pyc\">shí</td><td class=\"hv\">thì</td><td>giờ；thời gian</td><td class=\"hint\">语素 / 时间词</td></tr><tr><td class=\"hz\">时代</td><td class=\"pyc\">shí dài</td><td class=\"hv\">thì đại (5 n)</td><td>thời đại；kỷ nguyên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">年代</td><td class=\"pyc\">nián dài</td><td class=\"hv\">niên đại (5 n)</td><td>thập kỷ của một thế kỷ；thời đại</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">世纪</td><td class=\"pyc\">shì jì</td><td class=\"hv\">thế kỉ</td><td>thế kỷ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">现代</td><td class=\"pyc\">xiàn dài</td><td class=\"hv\">hiện đại (5 n)</td><td>thời hiện đại；kỷ nguyên hiện đại</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">古代</td><td class=\"pyc\">gǔ dài</td><td class=\"hv\">cổ đại (5 n)</td><td>thời cổ đại</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">现代化</td><td class=\"pyc\">xiàn dài huà</td><td class=\"hv\">hiện đại (5 n) hóa</td><td>hiện đại hóa</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">以来</td><td class=\"pyc\">yǐ lái</td><td class=\"hv\">dĩ lai</td><td>kể từ (một sự kiện trước)</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">自从</td><td class=\"pyc\">zì cóng</td><td class=\"hv\">tự tòng</td><td>kể từ khi；từ khi</td><td class=\"hint\">介词</td></tr><tr><td class=\"hz\">直到</td><td class=\"pyc\">zhí dào</td><td class=\"hv\">trực đáo</td><td>cho đến</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">至今</td><td class=\"pyc\">zhì jīn</td><td class=\"hv\">chí kim</td><td>cho đến nay；đến ngày hôm nay</td><td class=\"hint\">副词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L60 介词结构：对于 / 关于 / 由于 / 为了", id:"hsk3-l60", html:"<h1>L60 · 介词结构：对于 / 关于 / 由于 / 为了</h1>\n<div class=\"lead\">掌握四个书面介词，能准确引出对象、范围、原因、目的</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>对于 + 对象 ｜ 关于 + 范围 ｜ 由于 + 原因 ｜ 为了 + 目的</b></td></tr>\n<tr><td>教学目标</td><td>掌握四个书面介词，能准确引出对象、范围、原因、目的</td></tr>\n<tr><td>Tiếng Việt</td><td>Giới từ: 「对于/关于/由于/为了」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L54</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「对于」引出<b>受影响的对象</b>、「关于」引出<b>谈论的范围</b>；越南语 &quot;đối với / về&quot; 区分不严，学员会混。四个词都有「于」，更易混。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">早已</td><td class=\"pyc\">zǎo yǐ</td><td class=\"hv\">tảo dĩ</td><td>đã từ lâu; từ lâu；(tiếng địa phương) trước đây</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">从前</td><td class=\"pyc\">cóng qián</td><td class=\"hv\">tòng tiền</td><td>trước đây；ngày xưa</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">当初</td><td class=\"pyc\">dāng chū</td><td class=\"hv\">đương sơ</td><td>lúc đó；ban đầu</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">将来</td><td class=\"pyc\">jiāng lái</td><td class=\"hv\">tương lai</td><td>trong tương lai；tương lai</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">近期</td><td class=\"pyc\">jìn qī</td><td class=\"hv\">cận kỳ</td><td>gần về mặt thời gian；gần đây</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">长期</td><td class=\"pyc\">cháng qī</td><td class=\"hv\">trường kỳ</td><td>dài hạn；thời gian dài</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">短期</td><td class=\"pyc\">duǎn qī</td><td class=\"hv\">đoản kỳ</td><td>ngắn hạn</td><td class=\"hint\">区别词 / 副词</td></tr><tr><td class=\"hz\">定期</td><td class=\"pyc\">dìng qī</td><td class=\"hv\">định kỳ</td><td>vào các ngày cố định；định kỳ</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">期</td><td class=\"pyc\">qī</td><td class=\"hv\">kỳ</td><td>thời kỳ；chu kỳ</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">初步</td><td class=\"pyc\">chū bù</td><td class=\"hv\">sơ bộ</td><td>ban đầu；sơ bộ</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">初级</td><td class=\"pyc\">chū jí</td><td class=\"hv\">sơ cấp</td><td>sơ cấp；cơ bản</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">初中</td><td class=\"pyc\">chū zhōng</td><td class=\"hv\">sơ trung</td><td>—</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">初一</td><td class=\"pyc\">chū yī</td><td class=\"hv\">sơ nhất</td><td>ngày mùng một tháng âm lịch；Tết Nguyên Đán</td><td class=\"hint\">名词 / 时间词</td></tr><tr><td class=\"hz\">年初</td><td class=\"pyc\">nián chū</td><td class=\"hv\">niên sơ</td><td>đầu năm</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">年底</td><td class=\"pyc\">nián dǐ</td><td class=\"hv\">niên để</td><td>cuối năm</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">后年</td><td class=\"pyc\">hòu nián</td><td class=\"hv\">hậu niên</td><td>năm sau nữa</td><td class=\"hint\">时间词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L61 「于」的书面用法", id:"hsk3-l61", html:"<h1>L61 · 「于」的书面用法</h1>\n<div class=\"lead\">掌握「于」作介词的书面用法，能读懂正式文本</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>属于 / 在于 / 有利于 / 在于 / 相当于 / 对于（书面）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「于」作介词的书面用法，能读懂正式文本</td></tr>\n<tr><td>Tiếng Việt</td><td>Cách dùng văn viết của 「于」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L60</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「于」在书面语里相当于「在/对/比/给」，但<b>不能</b>用于口语。学员会把书面「有利于」说成口语「对他有好处」，要分清语体。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">整整</td><td class=\"pyc\">zhěng zhěng</td><td class=\"hv\">chỉnh chỉnh</td><td>toàn bộ；đầy đủ</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">整天</td><td class=\"pyc\">zhěng tiān</td><td class=\"hv\">chỉnh thiên</td><td>cả ngày；suốt ngày</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">持续</td><td class=\"pyc\">chí xù</td><td class=\"hv\">trì tục</td><td>tiếp tục；kiên trì</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">不断</td><td class=\"pyc\">bù duàn</td><td class=\"hv\">bất đoạn</td><td>không ngừng；không gián đoạn</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">连续</td><td class=\"pyc\">lián xù</td><td class=\"hv\">liên tục</td><td>liên tục；liền một mạch</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">反复</td><td class=\"pyc\">fǎn fù</td><td class=\"hv\">phản phục</td><td>lặp đi lặp lại；làm đi làm lại</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">文化</td><td class=\"pyc\">wén huà</td><td class=\"hv\">văn hóa</td><td>văn hóa；nền văn minh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">文学</td><td class=\"pyc\">wén xué</td><td class=\"hv\">văn học</td><td>văn học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">艺术</td><td class=\"pyc\">yì shù</td><td class=\"hv\">nghệ thuật</td><td>nghệ thuật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">作品</td><td class=\"pyc\">zuò pǐn</td><td class=\"hv\">tác phẩm</td><td>tác phẩm；tác phẩm nghệ thuật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">创作</td><td class=\"pyc\">chuàng zuò</td><td class=\"hv\">sang tác</td><td>sáng tác; sản xuất; viết；một tác phẩm sáng tạo</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">作者</td><td class=\"pyc\">zuò zhě</td><td class=\"hv\">tác giả</td><td>tác giả; nhà văn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">读者</td><td class=\"pyc\">dú zhě</td><td class=\"hv\">độc giả</td><td>độc giả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">文字</td><td class=\"pyc\">wén zì</td><td class=\"hv\">văn tự</td><td>chữ viết；kịch bản</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">文章</td><td class=\"pyc\">wén zhāng</td><td class=\"hv\">văn chương</td><td>bài viết；bài luận</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L62 时间表达：自从 / 直到 / 以来", id:"hsk3-l62", html:"<h1>L62 · 时间表达：自从 / 直到 / 以来</h1>\n<div class=\"lead\">掌握书面时间表达，能描述时间跨度</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>自从 + 起点 ｜ 直到 + 终点 ｜ 从…以来 / …以来（到现在）</b></td></tr>\n<tr><td>教学目标</td><td>掌握书面时间表达，能描述时间跨度</td></tr>\n<tr><td>Tiếng Việt</td><td>Diễn đạt thời gian: 「自从/直到/以来」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L35</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「以来」表示<b>从过去某时到现在</b>，后面常跟「一直/都」；越南语 &quot;từ…đến nay&quot; 结构不同，学员会漏掉「以来」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">课程</td><td class=\"pyc\">kè chéng</td><td class=\"hv\">khóa trình</td><td>khóa học；chương trình học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">留学</td><td class=\"pyc\">liú xué</td><td class=\"hv\">lưu học</td><td>du học</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">学费</td><td class=\"pyc\">xué fèi</td><td class=\"hv\">học phí</td><td>học phí；tiền học</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">班级</td><td class=\"pyc\">bān jí</td><td class=\"hv\">ban cấp</td><td>lớp học (nhóm học sinh)；khối lớp (trong trường)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">听力</td><td class=\"pyc\">tīng lì</td><td class=\"hv\">thính lực</td><td>thính giác；khả năng nghe</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">外文</td><td class=\"pyc\">wài wén</td><td class=\"hv\">ngoại văn</td><td>ngoại ngữ (viết)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">话剧</td><td class=\"pyc\">huà jù</td><td class=\"hv\">thoại kịch</td><td>vở kịch sân khấu；kịch hiện đại</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">京剧</td><td class=\"pyc\">Jīng jù</td><td class=\"hv\">kinh kịch</td><td>Kinh kịch</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">美术</td><td class=\"pyc\">měi shù</td><td class=\"hv\">mỹ thuật</td><td>nghệ thuật；mỹ thuật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">影视</td><td class=\"pyc\">yǐng shì</td><td class=\"hv\">ảnh thị</td><td>phim và truyền hình</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">电视剧</td><td class=\"pyc\">diàn shì jù</td><td class=\"hv\">điện thị kịch</td><td>phim truyền hình；phim bộ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">连续剧</td><td class=\"pyc\">lián xù jù</td><td class=\"hv\">liên tục kịch</td><td>phim truyền hình nhiều tập；phim bộ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">演出</td><td class=\"pyc\">yǎn chū</td><td class=\"hv\">diễn xuất</td><td>diễn (trong một vở kịch)；biểu diễn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">演唱</td><td class=\"pyc\">yǎn chàng</td><td class=\"hv\">diễn xướng</td><td>hát (trước khán giả)；biểu diễn thanh nhạc</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">演唱会</td><td class=\"pyc\">yǎn chàng huì</td><td class=\"hv\">diễn xướng hội</td><td>buổi hòa nhạc hoặc buổi biểu diễn</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L63 书面连接：并 / 并且 / 此外 / 另外", id:"hsk3-l63", html:"<h1>L63 · 书面连接：并 / 并且 / 此外 / 另外</h1>\n<div class=\"lead\">掌握书面连接词，能组织正式段落</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>并 / 并且 + 动词（连接动词性成分）｜ 此外 / 另外 + 句子</b></td></tr>\n<tr><td>教学目标</td><td>掌握书面连接词，能组织正式段落</td></tr>\n<tr><td>Tiếng Việt</td><td>Liên từ văn viết: 「并/并且/此外/另外」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L22</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「并/并且」只能连接<b>动词性成分</b>（× 我喜欢苹果并且香蕉）；「此外/另外」连接<b>句子</b>。越南语 &quot;và / ngoài ra&quot; 没有这个限制。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">乐队</td><td class=\"pyc\">yuè duì</td><td class=\"hv\">nhạc đội</td><td>ban nhạc；nhóm nhạc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">观众</td><td class=\"pyc\">guān zhòng</td><td class=\"hv\">quan chúng</td><td>khán giả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">表演</td><td class=\"pyc\">biǎo yǎn</td><td class=\"hv\">biểu diễn</td><td>vở kịch；buổi biểu diễn</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">舞台</td><td class=\"pyc\">wǔ tái</td><td class=\"hv\">vũ thai</td><td>(nghĩa đen và bóng) sân khấu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">直播</td><td class=\"pyc\">zhí bō</td><td class=\"hv\">trực bá</td><td>(TV, radio) phát sóng trực tiếp；phát trực tiếp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">图画</td><td class=\"pyc\">tú huà</td><td class=\"hv\">đồ hoạch</td><td>tranh；hình ảnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">教材</td><td class=\"pyc\">jiào cái</td><td class=\"hv\">giáo tài</td><td>tài liệu giảng dạy；LT:本</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">预习</td><td class=\"pyc\">yù xí</td><td class=\"hv\">dự tập</td><td>chuẩn bị bài</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">功课</td><td class=\"pyc\">gōng kè</td><td class=\"hv\">công khóa</td><td>bài tập；giao bài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">试题</td><td class=\"pyc\">shì tí</td><td class=\"hv\">thí đề</td><td>câu hỏi thi；chủ đề kiểm tra</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">写作</td><td class=\"pyc\">xiě zuò</td><td class=\"hv\">tả tác</td><td>viết；sáng tác</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">类</td><td class=\"pyc\">lèi</td><td class=\"hv\">loại</td><td>loại；kiểu</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">群</td><td class=\"pyc\">qún</td><td class=\"hv\">quần</td><td>nhóm；đám</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">双</td><td class=\"pyc\">shuāng</td><td class=\"hv\">song</td><td>hai；cặp</td><td class=\"hint\">数词 / 量词</td></tr><tr><td class=\"hz\">整</td><td class=\"pyc\">zhěng</td><td class=\"hv\">chỉnh</td><td>(hình thức liên kết) toàn bộ；(hình thức liên kết) gọn gàng</td><td class=\"hint\">数词 / 动词</td></tr><tr><td class=\"hz\">完整</td><td class=\"pyc\">wán zhěng</td><td class=\"hv\">hoàn chỉnh</td><td>hoàn chỉnh；nguyên vẹn</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L64 结课总复习：三级语言点串讲", id:"hsk3-l64", html:"<h1>L64 · 结课总复习：三级语言点串讲</h1>\n<div class=\"lead\">串联三级全部语法点，完成结课综合训练</div>\n<table>\n<tr><td>所属单元</td><td>单元8 · 文化、教育与艺术（Văn hóa, giáo dục và nghệ thuật）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>把字句 ｜ 被字句 ｜ 补语系统 ｜ 复句系统 ｜ 书面语体（总复习）</b></td></tr>\n<tr><td>教学目标</td><td>串联三级全部语法点，完成结课综合训练</td></tr>\n<tr><td>Tiếng Việt</td><td>Ôn tập tổng kết: hệ thống ngữ pháp cấp 3</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L08、L16、L24、L32、L40、L48、L56</td></tr>\n<tr><td>词量 / 课时</td><td>17 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">结课阶段要按<b>句式系统</b>横向串讲（把/被/兼语/存现），而不是按课次复习。学员单课都会、混在一起就乱。</div>\n\n<h2>本课词表 17 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">全面</td><td class=\"pyc\">quán miàn</td><td class=\"hv\">toàn diện</td><td>toàn diện；toàn bộ</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">正式</td><td class=\"pyc\">zhèng shì</td><td class=\"hv\">chánh thức</td><td>trang trọng; chính thức</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">通常</td><td class=\"pyc\">tōng cháng</td><td class=\"hv\">thông thường</td><td>thông thường; bình thường；thường xuyên; thường thường</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">基本</td><td class=\"pyc\">jī běn</td><td class=\"hv\">cơ bổn</td><td>cơ bản；nền tảng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">基本上</td><td class=\"pyc\">jī běn shang</td><td class=\"hv\">cơ bổn thượng</td><td>về cơ bản；nhìn chung</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">实际上</td><td class=\"pyc\">shí jì shàng</td><td class=\"hv\">thật tế thượng</td><td>thực ra；trên thực tế</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">事实上</td><td class=\"pyc\">shì shí shàng</td><td class=\"hv\">sự thật thượng</td><td>thực tế；trong thực tế</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">显然</td><td class=\"pyc\">xiǎn rán</td><td class=\"hv\">hiển nhiên</td><td>rõ ràng; hiển nhiên</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">必然</td><td class=\"pyc\">bì rán</td><td class=\"hv\">tất nhiên</td><td>không thể tránh khỏi；chắc chắn</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">应当</td><td class=\"pyc\">yīng dāng</td><td class=\"hv\">ứng đương</td><td>nên; cần phải</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">能不能</td><td class=\"pyc\">néng bùnéng</td><td class=\"hv\">năng bất năng</td><td>có thể ... không</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">齐</td><td class=\"pyc\">qí</td><td class=\"hv\">tề</td><td>gọn gàng；đồng đều</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">光明</td><td class=\"pyc\">guāng míng</td><td class=\"hv\">quang minh</td><td>ánh sáng；rực rỡ</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">丰富</td><td class=\"pyc\">fēng fù</td><td class=\"hv\">phong phú</td><td>làm phong phú；giàu có</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">突出</td><td class=\"pyc\">tū chū</td><td class=\"hv\">đột xuất</td><td>nổi bật；xuất sắc</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">特色</td><td class=\"pyc\">tè sè</td><td class=\"hv\">đặc sắc</td><td>đặc trưng；nét đặc biệt hoặc chất lượng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">单元</td><td class=\"pyc\">dān yuán</td><td class=\"hv\">đan nguyên</td><td>đơn vị (hình thành một thể)；thành phần</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
