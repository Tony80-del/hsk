    {title:"L28 上、下、里、外", id:"l28", html:"<h1>L28 · 上、下、里、外</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Trên, dưới, trong, ngoài</p>\n<div class=\"lead\"><b>本课目标：</b>会用方位词描述位置</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">上</td><td class=\"pyc\">shàng</td><td class=\"hv\">thượng</td><td>(hình thức kết hợp) trên；đầu tiên (của nhiều phần)</td><td class=\"hint\">方位词 / 动词</td></tr><tr><td class=\"hz\">下</td><td class=\"pyc\">xià</td><td class=\"hv\">hạ</td><td>xuống；hướng xuống</td><td class=\"hint\">动词 / 方位词</td></tr><tr><td class=\"hz\">里</td><td class=\"pyc\">lǐ</td><td class=\"hv\">lý</td><td>lót；bên trong</td><td class=\"hint\">方位词 / 量词</td></tr><tr><td class=\"hz\">外</td><td class=\"pyc\">wài</td><td class=\"hv\">ngoại</td><td>bên ngoài；thêm vào</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">前</td><td class=\"pyc\">qián</td><td class=\"hv\">tiền</td><td>trước；phía trước</td><td class=\"hint\">方位词 / 动词</td></tr><tr><td class=\"hz\">后</td><td class=\"pyc\">hòu</td><td class=\"hv\">hậu</td><td>hoàng hậu；nữ hoàng</td><td class=\"hint\">方位词 / 语素</td></tr><tr><td class=\"hz\">左</td><td class=\"pyc\">zuǒ</td><td class=\"hv\">tả</td><td>trái；cánh tả (chính trị)</td><td class=\"hint\">方位词 / 形容词</td></tr><tr><td class=\"hz\">右</td><td class=\"pyc\">yòu</td><td class=\"hv\">hữu</td><td>(hình thức kết hợp) bên phải；(hình thức kết hợp) (chính trị) hữ</td><td class=\"hint\">方位词 / 形容词</td></tr><tr><td class=\"hz\">中</td><td class=\"pyc\">zhōng</td><td class=\"hv\">trung</td><td>bên trong; ở giữa; trong；giữa; trung tâm</td><td class=\"hint\">方位词 / 区别词</td></tr><tr><td class=\"hz\">中间</td><td class=\"pyc\">zhōng jiān</td><td class=\"hv\">trung gian</td><td>ở giữa; bên trong；ở giữa; trong; giữa; trong số</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">旁边</td><td class=\"pyc\">páng biān</td><td class=\"hv\">bàng biên</td><td>bên; nơi liền kề</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">里边</td><td class=\"pyc\">lǐ bian</td><td class=\"hv\">lý biên</td><td>bên trong</td><td class=\"hint\">方位词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 名词 + 方位词</p><p class=\"gfm\">名词 + 上 / 下 / 里 / 外 / 前 / 后 / 左 / 右</p><p class=\"gnote\">方位词放在名词后面，构成方位短语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">书在桌子上。</p><p class=\"py\">shū zài zhuō zi shàng。</p><p class=\"vi\">Sách ở trên bàn.</p></div><div class=\"gex\"><p class=\"zh\">钱在书包里。</p><p class=\"py\">qián zài shū bāo lǐ。</p><p class=\"vi\">Tiền ở trong cặp.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「中间 / 旁边」可直接用</p><p class=\"gfm\">在 + 名词 + 中间 / 旁边</p><p class=\"gnote\">这两个词本身就是方位词，不需要再加「边」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在我们中间。</p><p class=\"py\">tā zài wǒ men zhōng jiān。</p><p class=\"vi\">Anh ấy ở giữa chúng tôi.</p></div><div class=\"gex\"><p class=\"zh\">商店在学校旁边。</p><p class=\"py\">shāng diàn zài xué xiào páng biān。</p><p class=\"vi\">Cửa hàng ở cạnh trường.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">书在桌子上。</p><p class=\"py\">shū zài zhuō zi shàng。</p><p class=\"vi\">Sách ở trên bàn.</p></div><div class=\"sent\"><p class=\"zh\">钱在书包里。</p><p class=\"py\">qián zài shū bāo lǐ。</p><p class=\"vi\">Tiền ở trong cặp.</p></div><div class=\"sent\"><p class=\"zh\">商店在学校的旁边。</p><p class=\"py\">shāng diàn zài xué xiào de páng biān。</p><p class=\"vi\">Cửa hàng ở cạnh trường học.</p></div><div class=\"sent\"><p class=\"zh\">他在我们中间。</p><p class=\"py\">tā zài wǒ men zhōng jiān。</p><p class=\"vi\">Anh ấy ở giữa chúng tôi.</p></div><div class=\"sent\"><p class=\"zh\">图书馆在中间。</p><p class=\"py\">tú shū guǎn zài zhōng jiān。</p><p class=\"vi\">Thư viện ở chính giữa.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我的书在哪儿？</p><p class=\"py\">wǒ de shū zài nǎr？</p><p class=\"vi\">Sách của tôi ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在桌子上。</p><p class=\"py\">zài zhuō zi shàng。</p><p class=\"vi\">Ở trên bàn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我的钱呢？</p><p class=\"py\">wǒ de qián ne？</p><p class=\"vi\">Còn tiền của tôi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在你的书包里。</p><p class=\"py\">zài nǐ de shū bāo lǐ。</p><p class=\"vi\">Ở trong cặp của bạn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">洗手间在哪儿？</p><p class=\"py\">xǐ shǒu jiān zài nǎr？</p><p class=\"vi\">Nhà vệ sinh ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在左边。</p><p class=\"py\">zài zuǒ bian。</p><p class=\"vi\">Ở bên trái.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">商店在哪儿？</p><p class=\"py\">shāng diàn zài nǎr？</p><p class=\"vi\">Cửa hàng ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在学校旁边。</p><p class=\"py\">zài xué xiào páng biān。</p><p class=\"vi\">Ở cạnh trường.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>方位词卡：上 / 下 / 里 / 外 / 前 / 后 / 左 / 右 / 中</li><li>藏东西猜位置：一人藏、一人用方位词猜</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>方位词必须放在名词后面：书包里，不说「里书包」</li><li>「中间」指两者或多人之间；「中」多用于书面</li><li>「外边」和「外面」同义</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用方位词描述自己房间里五样东西的位置</li><li>在 App 上完成 L28 测验</li></ul>"},
    {title:"L29 边", id:"l29", html:"<h1>L29 · 边</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Các phía</p>\n<div class=\"lead\"><b>本课目标：</b>会用「边」构成方位词</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">外边</td><td class=\"pyc\">wài bian</td><td class=\"hv\">ngoại biên</td><td>bên ngoài；bề mặt ngoài</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">上边</td><td class=\"pyc\">shàng bian</td><td class=\"hv\">thượng biên</td><td>phía trên；bên trên</td><td class=\"hint\">方位词 / 名词</td></tr><tr><td class=\"hz\">下边</td><td class=\"pyc\">xià bian</td><td class=\"hv\">hạ biên</td><td>ở dưới；mặt dưới</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">前边</td><td class=\"pyc\">qián bian</td><td class=\"hv\">tiền biên</td><td>phía trước；mặt trước</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">后边</td><td class=\"pyc\">hòu bian</td><td class=\"hv\">hậu biên</td><td>phía sau; đằng sau; phần cuối；đằng sau; gần cuối; ở phía sau</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">左边</td><td class=\"pyc\">zuǒ bian</td><td class=\"hv\">tả biên</td><td>bên trái；phía trái</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">右边</td><td class=\"pyc\">yòu bian</td><td class=\"hv\">hữu biên</td><td>bên phải；phải, về bên phải</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">东边</td><td class=\"pyc\">dōng bian</td><td class=\"hv\">đông biên</td><td>hướng đông；phía đông</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">西边</td><td class=\"pyc\">xī biān</td><td class=\"hv\">tây biên</td><td>phía tây；bên phía tây</td><td class=\"hint\">方位词 / 人名</td></tr><tr><td class=\"hz\">南边</td><td class=\"pyc\">nán bian</td><td class=\"hv\">nam biên</td><td>phía nam；mặt nam</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">北边</td><td class=\"pyc\">běi biān</td><td class=\"hv\">bắc biên</td><td>phía bắc；mặt bắc</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">东</td><td class=\"pyc\">dōng</td><td class=\"hv\">đông</td><td>phía đông；chủ nhà</td><td class=\"hint\">方位词 / 区别词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 方位词 + 边</p><p class=\"gfm\">上边 / 下边 / 前边 / 后边 / 左边 / 右边</p><p class=\"gnote\">加「边」后更口语，意思和单用一样。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在我前边。</p><p class=\"py\">tā zài wǒ qián bian。</p><p class=\"vi\">Anh ấy ở phía trước tôi.</p></div><div class=\"gex\"><p class=\"zh\">洗手间在左边。</p><p class=\"py\">xǐ shǒu jiān zài zuǒ bian。</p><p class=\"vi\">Nhà vệ sinh ở bên trái.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 方向词 + 边</p><p class=\"gfm\">东边 / 西边 / 南边 / 北边</p><p class=\"gnote\">表示某个方向的一侧。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">商店在东边。</p><p class=\"py\">shāng diàn zài dōng bian。</p><p class=\"vi\">Cửa hàng ở phía đông.</p></div><div class=\"gex\"><p class=\"zh\">学校在北边。</p><p class=\"py\">xué xiào zài běi biān。</p><p class=\"vi\">Trường ở phía bắc.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他在我前边。</p><p class=\"py\">tā zài wǒ qián bian。</p><p class=\"vi\">Anh ấy ở phía trước tôi.</p></div><div class=\"sent\"><p class=\"zh\">我的书在书包里边。</p><p class=\"py\">wǒ de shū zài shū bāo lǐ bian。</p><p class=\"vi\">Sách của tôi ở trong cặp.</p></div><div class=\"sent\"><p class=\"zh\">洗手间在左边。</p><p class=\"py\">xǐ shǒu jiān zài zuǒ bian。</p><p class=\"vi\">Nhà vệ sinh ở bên trái.</p></div><div class=\"sent\"><p class=\"zh\">商店在右边。</p><p class=\"py\">shāng diàn zài yòu bian。</p><p class=\"vi\">Cửa hàng ở bên phải.</p></div><div class=\"sent\"><p class=\"zh\">我坐在你后边。</p><p class=\"py\">wǒ zuò zài nǐ hòu bian。</p><p class=\"vi\">Tôi ngồi sau bạn.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">洗手间在哪儿？</p><p class=\"py\">xǐ shǒu jiān zài nǎr？</p><p class=\"vi\">Nhà vệ sinh ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在左边。</p><p class=\"py\">zài zuǒ bian。</p><p class=\"vi\">Ở bên trái.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个商店呢？</p><p class=\"py\">nà ge shāng diàn ne？</p><p class=\"vi\">Còn cửa hàng kia?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在右边，学校前边。</p><p class=\"py\">zài yòu bian， xué xiào qián bian。</p><p class=\"vi\">Ở bên phải, phía trước trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你坐在我前边还是后边？</p><p class=\"py\">nǐ zuò zài wǒ qián bian hái shi hòu bian？</p><p class=\"vi\">Bạn ngồi trước hay sau tôi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我坐在你后边。</p><p class=\"py\">wǒ zuò zài nǐ hòu bian。</p><p class=\"vi\">Tôi ngồi sau bạn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，我们走吧。</p><p class=\"py\">hǎo， wǒ men zǒu ba。</p><p class=\"vi\">Được, chúng ta đi thôi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好！</p><p class=\"py\">hǎo！</p><p class=\"vi\">Được!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>方位词接龙：上边 → 下边 → 前边 → 后边 → 左边 → 右边</li><li>教室方位描述：说出教室里每位同学的位置</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「前边」和「前面」同义，前边更口语</li><li>「里边」比「里」更强调位置</li><li>「东边」这类方位词后面不加「的」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>画出自己座位周围三位同学的位置并说明</li><li>在 App 上完成 L29 测验</li></ul>"},
    {title:"L30 东南西北", id:"l30", html:"<h1>L30 · 东南西北</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Bốn phương</p>\n<div class=\"lead\"><b>本课目标：</b>会说方向和地点</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">西</td><td class=\"pyc\">xī</td><td class=\"hv\">tây</td><td>tây</td><td class=\"hint\">方位词 / 区别词</td></tr><tr><td class=\"hz\">南</td><td class=\"pyc\">nán</td><td class=\"hv\">nam</td><td>phía nam</td><td class=\"hint\">区别词 / 方位词</td></tr><tr><td class=\"hz\">北</td><td class=\"pyc\">běi</td><td class=\"hv\">bắc</td><td>phía bắc；(văn cổ) bị đánh bại</td><td class=\"hint\">方位词</td></tr><tr><td class=\"hz\">国</td><td class=\"pyc\">guó</td><td class=\"hv\">quốc</td><td>(hình thức kết hợp) quốc gia</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">中国</td><td class=\"pyc\">Zhōng guó</td><td class=\"hv\">trung quốc</td><td>Trung Quốc</td><td class=\"hint\">地名</td></tr><tr><td class=\"hz\">北京</td><td class=\"pyc\">Běi jīng</td><td class=\"hv\">bắc kinh</td><td>Bắc Kinh</td><td class=\"hint\">地名</td></tr><tr><td class=\"hz\">国家</td><td class=\"pyc\">guó jiā</td><td class=\"hv\">quốc gia</td><td>quốc gia; dân tộc; nhà nước</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">国外</td><td class=\"pyc\">guó wài</td><td class=\"hv\">quốc ngoại</td><td>ở nước ngoài；ngoại (sự vụ)</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">外国</td><td class=\"pyc\">wài guó</td><td class=\"hv\">ngoại quốc</td><td>(quốc gia) nước ngoài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">地方</td><td class=\"pyc\">dì fāng</td><td class=\"hv\">địa phương</td><td>khu vực；mang tính khu vực</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">地点</td><td class=\"pyc\">dì diǎn</td><td class=\"hv\">địa điểm</td><td>nơi；chỗ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">路</td><td class=\"pyc\">lù</td><td class=\"hv\">lộ</td><td>hành trình；tuyến</td><td class=\"hint\">名词 / 量词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 四个基本方向</p><p class=\"gfm\">东 / 西 / 南 / 北（+ 边）</p><p class=\"gnote\">说方向时一般要加「边」或「方」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">北京在中国北边。</p><p class=\"py\">Běi jīng zài Zhōng guó běi biān。</p><p class=\"vi\">Bắc Kinh ở phía bắc Trung Quốc.</p></div><div class=\"gex\"><p class=\"zh\">商店在东边。</p><p class=\"py\">shāng diàn zài dōng bian。</p><p class=\"vi\">Cửa hàng ở phía đông.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「地方」和「地点」</p><p class=\"gfm\">地方（泛指空间）　｜　地点（具体位置）</p><p class=\"gnote\">「地方」更口语、更常用。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个地方很好。</p><p class=\"py\">zhè ge dì fāng hěn hǎo。</p><p class=\"vi\">Nơi này rất tốt.</p></div><div class=\"gex\"><p class=\"zh\">我们去那个地方。</p><p class=\"py\">wǒ men qù nà ge dì fāng。</p><p class=\"vi\">Chúng ta đi đến nơi kia.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">北京在中国北边。</p><p class=\"py\">Běi jīng zài Zhōng guó běi biān。</p><p class=\"vi\">Bắc Kinh ở phía bắc Trung Quốc.</p></div><div class=\"sent\"><p class=\"zh\">他是外国人。</p><p class=\"py\">tā shì wài guó rén。</p><p class=\"vi\">Anh ấy là người nước ngoài.</p></div><div class=\"sent\"><p class=\"zh\">这个地方很好。</p><p class=\"py\">zhè ge dì fāng hěn hǎo。</p><p class=\"vi\">Nơi này rất tốt.</p></div><div class=\"sent\"><p class=\"zh\">我们去那个地方。</p><p class=\"py\">wǒ men qù nà ge dì fāng。</p><p class=\"vi\">Chúng ta đi đến nơi kia.</p></div><div class=\"sent\"><p class=\"zh\">路上有很多人。</p><p class=\"py\">lù shang yǒu hěn duō rén。</p><p class=\"vi\">Trên đường có rất nhiều người.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你是外国人吗？</p><p class=\"py\">nǐ shì wài guó rén ma？</p><p class=\"vi\">Bạn là người nước ngoài à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不是，我是中国人。</p><p class=\"py\">bù shì， wǒ shì zhōng guó rén。</p><p class=\"vi\">Không, tôi là người Trung Quốc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">北京在哪儿？</p><p class=\"py\">Běi jīng zài nǎr？</p><p class=\"vi\">Bắc Kinh ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在中国北边。</p><p class=\"py\">zài Zhōng guó běi biān。</p><p class=\"vi\">Ở phía bắc Trung Quốc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个地方远吗？</p><p class=\"py\">nà ge dì fāng yuǎn ma？</p><p class=\"vi\">Nơi đó xa không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不远，我们走这里。</p><p class=\"py\">bù yuǎn， wǒ men zǒu zhè lǐ。</p><p class=\"vi\">Không xa, chúng ta đi lối này.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>方向卡：东 / 西 / 南 / 北 + 边</li><li>地图练习：在地图上指出自己所在位置和学校的位置</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「国」单独用较少，常说「国家」</li><li>「国外」指本国以外；「外国」在中文语境指中国以外的国家</li><li>「地方」口语里也可指空间：这个地方很大</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文说出自己城市在中国的方位</li><li>在 App 上完成 L30 测验</li></ul>"},
    {title:"L31 商店与建筑", id:"l31", html:"<h1>L31 · 商店与建筑</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Cửa hàng và tòa nhà</p>\n<div class=\"lead\"><b>本课目标：</b>会指认城市建筑和场所</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">商店</td><td class=\"pyc\">shāng diàn</td><td class=\"hv\">thương điếm</td><td>cửa hàng; tiệm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">商场</td><td class=\"pyc\">shāng chǎng</td><td class=\"hv\">thương tràng</td><td>trung tâm mua sắm；trung tâm thương mại</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">书店</td><td class=\"pyc\">shū diàn</td><td class=\"hv\">thư điếm</td><td>nhà sách；LT:家</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电影院</td><td class=\"pyc\">diàn yǐng yuàn</td><td class=\"hv\">điện ảnh viện</td><td>rạp chiếu phim; rạp phim；LT:家,座</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">门口</td><td class=\"pyc\">mén kǒu</td><td class=\"hv\">môn khẩu</td><td>cửa ra vào；cổng</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">路口</td><td class=\"pyc\">lù kǒu</td><td class=\"hv\">lộ khẩu</td><td>giao lộ；ngã tư (của đường)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">站</td><td class=\"pyc\">zhàn</td><td class=\"hv\">trạm</td><td>trạm；đứng</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">车站</td><td class=\"pyc\">chē zhàn</td><td class=\"hv\">xa trạm</td><td>ga tàu；dừng xe buýt</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">机场</td><td class=\"pyc\">jī chǎng</td><td class=\"hv\">cơ tràng</td><td>sân bay; phi trường；(tiếng lóng) nhà cung cấp dịch vụ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">楼上</td><td class=\"pyc\">lóu shàng</td><td class=\"hv\">lâu thượng</td><td>tầng trên；(tiếng lóng Internet) người đăng t</td><td class=\"hint\">处所词 / 方位词</td></tr><tr><td class=\"hz\">楼下</td><td class=\"pyc\">lóu xià</td><td class=\"hv\">lâu hạ</td><td>tầng dưới</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">楼</td><td class=\"pyc\">lóu</td><td class=\"hv\">lâu</td><td>nhà có hơn 1 tầng；toà nhà nhiều tầng</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「楼上 / 楼下」指同一栋楼</p><p class=\"gfm\">在 + 楼上 / 楼下</p><p class=\"gnote\">指同一建筑内的不同楼层。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">电影院在商场楼上。</p><p class=\"py\">diàn yǐng yuàn zài shāng chǎng lóu shàng。</p><p class=\"vi\">Rạp chiếu phim ở tầng trên của trung tâm thương mại.</p></div><div class=\"gex\"><p class=\"zh\">我在楼下等你。</p><p class=\"py\">wǒ zài lóu xià děng nǐ。</p><p class=\"vi\">Tôi đợi bạn ở dưới nhà.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「在 + 地点 + 方位」</p><p class=\"gfm\">在 + 地点 + 门口 / 路口 / 旁边</p><p class=\"gnote\">两个地点词叠加表示更精确的位置。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">书店在学校门口。</p><p class=\"py\">shū diàn zài xué xiào mén kǒu。</p><p class=\"vi\">Hiệu sách ở cổng trường.</p></div><div class=\"gex\"><p class=\"zh\">车站在路口。</p><p class=\"py\">chē zhàn zài lù kǒu。</p><p class=\"vi\">Bến xe ở ngã tư.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我去商店买东西。</p><p class=\"py\">wǒ qù shāng diàn mǎi dōng xi。</p><p class=\"vi\">Tôi đi cửa hàng mua đồ.</p></div><div class=\"sent\"><p class=\"zh\">书店在学校门口。</p><p class=\"py\">shū diàn zài xué xiào mén kǒu。</p><p class=\"vi\">Hiệu sách ở cổng trường.</p></div><div class=\"sent\"><p class=\"zh\">电影院在商场楼上。</p><p class=\"py\">diàn yǐng yuàn zài shāng chǎng lóu shàng。</p><p class=\"vi\">Rạp chiếu phim ở tầng trên trung tâm thương mại.</p></div><div class=\"sent\"><p class=\"zh\">车站在路口。</p><p class=\"py\">chē zhàn zài lù kǒu。</p><p class=\"vi\">Bến xe ở ngã tư.</p></div><div class=\"sent\"><p class=\"zh\">机场很远。</p><p class=\"py\">jī chǎng hěn yuǎn。</p><p class=\"vi\">Sân bay rất xa.</p></div><div class=\"sent\"><p class=\"zh\">我在楼下等你。</p><p class=\"py\">wǒ zài lóu xià děng nǐ。</p><p class=\"vi\">Tôi đợi bạn ở dưới nhà.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">书店在哪儿？</p><p class=\"py\">shū diàn zài nǎr？</p><p class=\"vi\">Hiệu sách ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在学校门口。</p><p class=\"py\">zài xué xiào mén kǒu。</p><p class=\"vi\">Ở cổng trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">电影院呢？</p><p class=\"py\">diàn yǐng yuàn ne？</p><p class=\"vi\">Còn rạp chiếu phim?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在商场楼上。</p><p class=\"py\">zài shāng chǎng lóu shàng。</p><p class=\"vi\">Ở tầng trên trung tâm thương mại.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">车站在哪儿？</p><p class=\"py\">chē zhàn zài nǎr？</p><p class=\"vi\">Bến xe ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在前边路口。</p><p class=\"py\">zài qián bian lù kǒu。</p><p class=\"vi\">Ở ngã tư phía trước.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">机场远吗？</p><p class=\"py\">jī chǎng yuǎn ma？</p><p class=\"vi\">Sân bay xa không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很远。我们在楼下等你。</p><p class=\"py\">hěn yuǎn。 wǒ men zài lóu xià děng nǐ。</p><p class=\"vi\">Rất xa. Chúng tôi đợi bạn ở dưới nhà.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>场所卡：商店 / 商场 / 书店 / 电影院 / 车站 / 机场</li><li>画一张学校周边地图并标注五个地点</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「楼上 / 楼下」指同一建筑内；不同建筑用「前边 / 后边」</li><li>「站」单独用指车站，也可作动词表示站立</li><li>「商场」是购物中心，「商店」是单个店铺</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出从家到学校的路线上的三个地点</li><li>在 App 上完成 L31 测验</li></ul>"},
    {title:"L32 车与票", id:"l32", html:"<h1>L32 · 车与票</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Xe và vé</p>\n<div class=\"lead\"><b>本课目标：</b>会说交通方式和票务</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">车</td><td class=\"pyc\">chē</td><td class=\"hv\">xa</td><td>xe；phương tiện giao thông</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">汽车</td><td class=\"pyc\">qì chē</td><td class=\"hv\">khí xa</td><td>xe hơi；xe ô tô</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">火车</td><td class=\"pyc\">huǒ chē</td><td class=\"hv\">hỏa xa</td><td>tàu hỏa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">飞机</td><td class=\"pyc\">fēi jī</td><td class=\"hv\">phi cơ</td><td>máy bay；LT:架</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">票</td><td class=\"pyc\">piào</td><td class=\"hv\">phiếu</td><td>vé；phiếu</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">机票</td><td class=\"pyc\">jī piào</td><td class=\"hv\">cơ phiếu</td><td>vé máy bay；vé hành khách</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">车票</td><td class=\"pyc\">chē piào</td><td class=\"hv\">xa phiếu</td><td>vé (xe buýt hoặc tàu hỏa)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">门票</td><td class=\"pyc\">mén piào</td><td class=\"hv\">môn phiếu</td><td>vé</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">打车</td><td class=\"pyc\">dǎ chē</td><td class=\"hv\">đả xa</td><td>bắt taxi (trong thành phố)；đón xe</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">开车</td><td class=\"pyc\">kāi chē</td><td class=\"hv\">khai xa</td><td>lái xe</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">上车</td><td class=\"pyc\">shàng chē</td><td class=\"hv\">thượng xa</td><td>lên (xe buýt, tàu, ô tô, v.v.)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">下车</td><td class=\"pyc\">xià chē</td><td class=\"hv\">hạ xa</td><td>xuống (xe buýt, tàu, ô tô,...)</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「坐 / 开 + 交通工具」</p><p class=\"gfm\">坐 + 汽车 / 火车 / 飞机　｜　开 + 汽车</p><p class=\"gnote\">乘客用「坐」，司机用「开」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我坐汽车去学校。</p><p class=\"py\">wǒ zuò qì chē qù xué xiào。</p><p class=\"vi\">Tôi đi xe ô tô đến trường.</p></div><div class=\"gex\"><p class=\"zh\">他开汽车上班。</p><p class=\"py\">tā kāi qì chē shàng bān。</p><p class=\"vi\">Anh ấy lái xe đi làm.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「上 / 下 + 车」</p><p class=\"gfm\">上车 / 下车</p><p class=\"gnote\">是动宾结构，中间可以插「了」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我们上车吧。</p><p class=\"py\">wǒ men shàng chē ba。</p><p class=\"vi\">Chúng ta lên xe đi.</p></div><div class=\"gex\"><p class=\"zh\">我在前边下车。</p><p class=\"py\">wǒ zài qián bian xià chē。</p><p class=\"vi\">Tôi xuống xe ở phía trước.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我坐汽车去学校。</p><p class=\"py\">wǒ zuò qì chē qù xué xiào。</p><p class=\"vi\">Tôi đi xe ô tô đến trường.</p></div><div class=\"sent\"><p class=\"zh\">他开汽车上班。</p><p class=\"py\">tā kāi qì chē shàng bān。</p><p class=\"vi\">Anh ấy lái xe đi làm.</p></div><div class=\"sent\"><p class=\"zh\">我买了机票。</p><p class=\"py\">wǒ mǎi le jī piào。</p><p class=\"vi\">Tôi đã mua vé máy bay.</p></div><div class=\"sent\"><p class=\"zh\">我们上车吧。</p><p class=\"py\">wǒ men shàng chē ba。</p><p class=\"vi\">Chúng ta lên xe đi.</p></div><div class=\"sent\"><p class=\"zh\">火车票在哪儿？</p><p class=\"py\">huǒ chē piào zài nǎr？</p><p class=\"vi\">Vé tàu ở đâu?</p></div><div class=\"sent\"><p class=\"zh\">门票多少钱？</p><p class=\"py\">mén piào duō shǎo qián？</p><p class=\"vi\">Vé vào cửa bao nhiêu tiền?</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你怎么去北京？</p><p class=\"py\">nǐ zěn me qù Běi jīng？</p><p class=\"vi\">Bạn đi Bắc Kinh bằng gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我坐飞机去。</p><p class=\"py\">wǒ zuò fēi jī qù。</p><p class=\"vi\">Tôi đi máy bay.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">机票贵吗？</p><p class=\"py\">jī piào guì ma？</p><p class=\"vi\">Vé máy bay đắt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很贵。</p><p class=\"py\">hěn guì。</p><p class=\"vi\">Rất đắt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我坐火车去。</p><p class=\"py\">wǒ zuò huǒ chē qù。</p><p class=\"vi\">Tôi đi tàu.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">火车票多少钱？</p><p class=\"py\">huǒ chē piào duō shǎo qián？</p><p class=\"vi\">Vé tàu bao nhiêu tiền?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">一百多块。</p><p class=\"py\">yī bǎi duō kuài。</p><p class=\"vi\">Hơn một trăm tệ.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好。我们上车吧。</p><p class=\"py\">hǎo。 wǒ men shàng chē ba。</p><p class=\"vi\">Được. Chúng ta lên xe đi.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>交通工具卡：汽车 / 火车 / 飞机</li><li>票务卡：机票 / 车票 / 门票</li><li>情景练习：打电话订票</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「打车」是叫出租车，不是「打人」</li><li>「开车」的主语是司机；乘客说「坐车」</li><li>「上车 / 下车」是动宾结构，中间可插「了」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文说出自己每天上学或上班的交通方式</li><li>在 App 上完成 L32 测验</li></ul>"},
    {title:"L33 来和去", id:"l33", html:"<h1>L33 · 来和去</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Đến và đi</p>\n<div class=\"lead\"><b>本课目标：</b>会用趋向动词表达移动方向</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">来</td><td class=\"pyc\">lái</td><td class=\"hv\">lai</td><td>đến；(dùng thay cho động từ cụ thể hơn)</td><td class=\"hint\">动词 / 方位词</td></tr><tr><td class=\"hz\">去</td><td class=\"pyc\">qù</td><td class=\"hv\">khứ</td><td>đi；đi đến (một nơi)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">回</td><td class=\"pyc\">huí</td><td class=\"hv\">hồi</td><td>xoay vòng；quay lại</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">回家</td><td class=\"pyc\">huí jiā</td><td class=\"hv\">hồi gia</td><td>trở về nhà</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">回来</td><td class=\"pyc\">huí lai</td><td class=\"hv\">hồi lai</td><td>trở về; quay lại</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">回去</td><td class=\"pyc\">huí qu</td><td class=\"hv\">hồi khứ</td><td>trở về；quay lại</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">回到</td><td class=\"pyc\">huí dào</td><td class=\"hv\">hồi đáo</td><td>trở về</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">进</td><td class=\"pyc\">jìn</td><td class=\"hv\">tiến</td><td>tiến lên；tiến bộ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">进去</td><td class=\"pyc\">jìn qù</td><td class=\"hv\">tiến khứ</td><td>đi vào</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">进来</td><td class=\"pyc\">jìn lái</td><td class=\"hv\">tiến lai</td><td>đến；vào</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">出</td><td class=\"pyc\">chū</td><td class=\"hv\">xuất</td><td>đi ra; đi ra ngoài；phát sinh; xảy ra</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">出去</td><td class=\"pyc\">chū qù</td><td class=\"hv\">xuất khứ</td><td>đi ra ngoài</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「来」和「去」的方向</p><p class=\"gfm\">来 = 朝说话人方向　｜　去 = 背离说话人方向</p><p class=\"gnote\">选择哪个，取决于说话人在哪儿。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你什么时候来？</p><p class=\"py\">nǐ shén me shí hòu lái？</p><p class=\"vi\">Bạn đến lúc nào?</p></div><div class=\"gex\"><p class=\"zh\">我去商店。</p><p class=\"py\">wǒ qù shāng diàn。</p><p class=\"vi\">Tôi đi cửa hàng.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「进 / 出」+「来 / 去」</p><p class=\"gfm\">进来 / 进去　｜　出来 / 出去</p><p class=\"gnote\">「来」向说话人，「去」背离说话人。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">请进来。</p><p class=\"py\">qǐng jìn lái。</p><p class=\"vi\">Mời vào.</p></div><div class=\"gex\"><p class=\"zh\">他出去了。</p><p class=\"py\">tā chū qù le。</p><p class=\"vi\">Anh ấy ra ngoài rồi.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">你什么时候来？</p><p class=\"py\">nǐ shén me shí hòu lái？</p><p class=\"vi\">Bạn đến lúc nào?</p></div><div class=\"sent\"><p class=\"zh\">我去商店。</p><p class=\"py\">wǒ qù shāng diàn。</p><p class=\"vi\">Tôi đi cửa hàng.</p></div><div class=\"sent\"><p class=\"zh\">他回家了。</p><p class=\"py\">tā huí jiā le。</p><p class=\"vi\">Anh ấy về nhà rồi.</p></div><div class=\"sent\"><p class=\"zh\">请进来。</p><p class=\"py\">qǐng jìn lái。</p><p class=\"vi\">Mời vào.</p></div><div class=\"sent\"><p class=\"zh\">他出去了。</p><p class=\"py\">tā chū qù le。</p><p class=\"vi\">Anh ấy ra ngoài rồi.</p></div><div class=\"sent\"><p class=\"zh\">我明天回来。</p><p class=\"py\">wǒ míng tiān huí lai。</p><p class=\"vi\">Mai tôi về.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在家吗？</p><p class=\"py\">nǐ zài jiā ma？</p><p class=\"vi\">Bạn ở nhà không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不在，我出去了。</p><p class=\"py\">bù zài， wǒ chū qù le。</p><p class=\"vi\">Không, tôi ra ngoài rồi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你什么时候回来？</p><p class=\"py\">nǐ shén me shí hòu huí lai？</p><p class=\"vi\">Bạn về lúc nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">一会儿就回来。</p><p class=\"py\">yī huìr jiù huí lai。</p><p class=\"vi\">Một lát là về.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，我在家等你。</p><p class=\"py\">hǎo， wǒ zài jiā děng nǐ。</p><p class=\"vi\">Được, tôi đợi bạn ở nhà.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">你想吃什么？</p><p class=\"py\">nǐ xiǎng chī shén me？</p><p class=\"vi\">Bạn muốn ăn gì?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我想吃面条儿。</p><p class=\"py\">wǒ xiǎng chī miàn tiáor。</p><p class=\"vi\">Tôi muốn ăn mì.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我马上回去。</p><p class=\"py\">hǎo， wǒ mǎ shàng huí qu。</p><p class=\"vi\">Được, tôi về ngay.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「来 / 去」方向练习：老师站在门口说「进来 / 出去」</li><li>「回 / 回来 / 回去」辨析</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「来」和「去」的选择取决于说话人的位置</li><li>「回家」是固定搭配，不说「回去家」</li><li>「进」后面必须接「来 / 去」才能单用：进来 / 进去</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「来 / 去 / 进 / 出」各写一句</li><li>在 App 上完成 L33 测验</li></ul>"},
    {title:"L34 走和跑", id:"l34", html:"<h1>L34 · 走和跑</h1>\n<p class=\"sub\">第四阶段 · 出行与地点　|　Đi bộ và chạy</p>\n<div class=\"lead\"><b>本课目标：</b>会说移动方式，会表达到达</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">出来</td><td class=\"pyc\">chū lái</td><td class=\"hv\">xuất lai</td><td>đi ra；xuất hiện</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">到</td><td class=\"pyc\">dào</td><td class=\"hv\">đáo</td><td>đến; tới；rời đi đến; đi đến</td><td class=\"hint\">动词 / 介词</td></tr><tr><td class=\"hz\">来到</td><td class=\"pyc\">lái dào</td><td class=\"hv\">lai đáo</td><td>đến; tới</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">走</td><td class=\"pyc\">zǒu</td><td class=\"hv\">tẩu</td><td>đi；bước</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">走路</td><td class=\"pyc\">zǒu lù</td><td class=\"hv\">tẩu lộ</td><td>đi bộ；đi bằng chân</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">跑</td><td class=\"pyc\">pǎo</td><td class=\"hv\">bào</td><td>chạy；chạy trốn</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">坐</td><td class=\"pyc\">zuò</td><td class=\"hv\">tọa</td><td>ngồi；ngồi xuống</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">坐下</td><td class=\"pyc\">zuò xia</td><td class=\"hv\">tọa hạ</td><td>ngồi xuống</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">飞</td><td class=\"pyc\">fēi</td><td class=\"hv\">phi</td><td>bay</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">送</td><td class=\"pyc\">sòng</td><td class=\"hv\">tống</td><td>gửi; giao; truyền；tặng (như một món quà)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">住</td><td class=\"pyc\">zhù</td><td class=\"hv\">trụ</td><td>sống；ở</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">起来</td><td class=\"pyc\">qǐ lai</td><td class=\"hv\">khởi lai</td><td>đứng lên; thức dậy；cũng đọc là</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「到」表示到达</p><p class=\"gfm\">到 + 地点（+ 了）</p><p class=\"gnote\">「到」后面直接接地点。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我到学校了。</p><p class=\"py\">wǒ dào xué xiào le。</p><p class=\"vi\">Tôi đến trường rồi.</p></div><div class=\"gex\"><p class=\"zh\">一会儿就到。</p><p class=\"py\">yī huìr jiù dào。</p><p class=\"vi\">Một lát là đến.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「坐 / 住 / 送」的常见搭配</p><p class=\"gfm\">坐下　｜　住在 + 地点　｜　送 + 人 + 回家</p><p class=\"gnote\">「坐」可指坐下，也可指乘车。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">请坐下。</p><p class=\"py\">qǐng zuò xià。</p><p class=\"vi\">Mời ngồi xuống.</p></div><div class=\"gex\"><p class=\"zh\">我住在学校。</p><p class=\"py\">wǒ zhù zài xué xiào。</p><p class=\"vi\">Tôi sống ở trường.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我走路去学校。</p><p class=\"py\">wǒ zǒu lù qù xué xiào。</p><p class=\"vi\">Tôi đi bộ đến trường.</p></div><div class=\"sent\"><p class=\"zh\">他在跑。</p><p class=\"py\">tā zài pǎo。</p><p class=\"vi\">Anh ấy đang chạy.</p></div><div class=\"sent\"><p class=\"zh\">我坐在这儿。</p><p class=\"py\">wǒ zuò zài zhèr。</p><p class=\"vi\">Tôi ngồi ở đây.</p></div><div class=\"sent\"><p class=\"zh\">请坐下。</p><p class=\"py\">qǐng zuò xià。</p><p class=\"vi\">Mời ngồi xuống.</p></div><div class=\"sent\"><p class=\"zh\">他住在学校。</p><p class=\"py\">tā zhù zài xué xiào。</p><p class=\"vi\">Anh ấy sống ở trường.</p></div><div class=\"sent\"><p class=\"zh\">我送你回家。</p><p class=\"py\">wǒ sòng nǐ huí jiā。</p><p class=\"vi\">Tôi đưa bạn về nhà.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你怎么去学校？</p><p class=\"py\">nǐ zěn me qù xué xiào？</p><p class=\"vi\">Bạn đến trường bằng gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我走路去。</p><p class=\"py\">wǒ zǒu lù qù。</p><p class=\"vi\">Tôi đi bộ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">远吗？</p><p class=\"py\">yuǎn ma？</p><p class=\"vi\">Xa không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不远，一会儿就到。</p><p class=\"py\">bù yuǎn， yī huìr jiù dào。</p><p class=\"vi\">Không xa, một lát là đến.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你住在哪儿？</p><p class=\"py\">nǐ zhù zài nǎr？</p><p class=\"vi\">Bạn sống ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我住在学校里边。</p><p class=\"py\">wǒ zhù zài xué xiào lǐ bian。</p><p class=\"vi\">Tôi sống trong trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我送你回家吧。</p><p class=\"py\">wǒ sòng nǐ huí jiā ba。</p><p class=\"vi\">Tôi đưa bạn về nhà nhé.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>移动动词卡：走 / 走路 / 跑 / 坐 / 飞 / 送</li><li>「到」的用法：我到学校了 / 一会儿就到</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「走路」是动词，不能说「走一个路」</li><li>「坐」既指坐下，也指乘车（坐车）</li><li>「住」后面接地点：住在学校</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出从家到学校的方式和所需时间</li><li>在 App 上完成 L34 测验</li></ul>"}
  ]},
  {title:"六、第五阶段 · 动作与表达", id:"g5", children:[
    {title:"L35 看和听", id:"l35", html:"<h1>L35 · 看和听</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Nhìn và nghe</p>\n<div class=\"lead\"><b>本课目标：</b>会表达视听动作和感受</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">看</td><td class=\"pyc\">kàn</td><td class=\"hv\">khán</td><td>nhìn; xem；đọc</td><td class=\"hint\">动词 / 助词</td></tr><tr><td class=\"hz\">看见</td><td class=\"pyc\">kàn jiàn</td><td class=\"hv\">khán kiến</td><td>nhìn thấy；bắt gặp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">看到</td><td class=\"pyc\">kàn dào</td><td class=\"hv\">khán đáo</td><td>nhìn thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">好看</td><td class=\"pyc\">hǎo kàn</td><td class=\"hv\">hảo khán</td><td>ưa nhìn；xinh đẹp</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">听</td><td class=\"pyc\">tīng</td><td class=\"hv\">thính</td><td>nghe；nghe theo; tuân theo</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">听见</td><td class=\"pyc\">tīng jiàn</td><td class=\"hv\">thính kiến</td><td>nghe thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">听到</td><td class=\"pyc\">tīng dào</td><td class=\"hv\">thính đáo</td><td>nghe thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">好听</td><td class=\"pyc\">hǎo tīng</td><td class=\"hv\">hảo thính</td><td>nghe hay</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">电影</td><td class=\"pyc\">diàn yǐng</td><td class=\"hv\">điện ảnh</td><td>phim; điện ảnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电视</td><td class=\"pyc\">diàn shì</td><td class=\"hv\">điện thị</td><td>truyền hình; TV</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电视机</td><td class=\"pyc\">diàn shì jī</td><td class=\"hv\">điện thị cơ</td><td>máy thu hình</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电脑</td><td class=\"pyc\">diàn nǎo</td><td class=\"hv\">điện não</td><td>máy tính</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「看」是动作，「看见 / 看到」是结果</p><p class=\"gfm\">看（动作）→ 看见 / 看到（结果）</p><p class=\"gnote\">「看见」强调无意中看到，「看到」强调看到了目标。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我看电影。</p><p class=\"py\">wǒ kàn diàn yǐng。</p><p class=\"vi\">Tôi xem phim.</p></div><div class=\"gex\"><p class=\"zh\">我看见他了。</p><p class=\"py\">wǒ kàn jiàn tā le。</p><p class=\"vi\">Tôi nhìn thấy anh ấy rồi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「好看 / 好听」作谓语</p><p class=\"gfm\">名词 + 很好看 / 很好听</p><p class=\"gnote\">好看指视觉，好听指听觉。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个电影很好看。</p><p class=\"py\">zhè ge diàn yǐng hěn hǎo kàn。</p><p class=\"vi\">Phim này rất hay.</p></div><div class=\"gex\"><p class=\"zh\">他唱歌很好听。</p><p class=\"py\">tā chàng gē hěn hǎo tīng。</p><p class=\"vi\">Anh ấy hát rất hay.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我看电影。</p><p class=\"py\">wǒ kàn diàn yǐng。</p><p class=\"vi\">Tôi xem phim.</p></div><div class=\"sent\"><p class=\"zh\">我看见他了。</p><p class=\"py\">wǒ kàn jiàn tā le。</p><p class=\"vi\">Tôi nhìn thấy anh ấy rồi.</p></div><div class=\"sent\"><p class=\"zh\">这个电影很好看。</p><p class=\"py\">zhè ge diàn yǐng hěn hǎo kàn。</p><p class=\"vi\">Phim này rất hay.</p></div><div class=\"sent\"><p class=\"zh\">我听歌。</p><p class=\"py\">wǒ tīng gē。</p><p class=\"vi\">Tôi nghe nhạc.</p></div><div class=\"sent\"><p class=\"zh\">我听见了。</p><p class=\"py\">wǒ tīng jiàn le。</p><p class=\"vi\">Tôi nghe thấy rồi.</p></div><div class=\"sent\"><p class=\"zh\">他唱歌很好听。</p><p class=\"py\">tā chàng gē hěn hǎo tīng。</p><p class=\"vi\">Anh ấy hát rất hay.</p></div><div class=\"sent\"><p class=\"zh\">我看电视。</p><p class=\"py\">wǒ kàn diàn shì。</p><p class=\"vi\">Tôi xem ti vi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在看什么？</p><p class=\"py\">nǐ zài kàn shén me？</p><p class=\"vi\">Bạn đang xem gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我在看电影。</p><p class=\"py\">wǒ zài kàn diàn yǐng。</p><p class=\"vi\">Tôi đang xem phim.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好看吗？</p><p class=\"py\">hǎo kàn ma？</p><p class=\"vi\">Có hay không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很好看。</p><p class=\"py\">hěn hǎo kàn。</p><p class=\"vi\">Rất hay.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在听什么？</p><p class=\"py\">nǐ zài tīng shén me？</p><p class=\"vi\">Bạn đang nghe gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我在听歌，很好听。</p><p class=\"py\">wǒ zài tīng gē， hěn hǎo tīng。</p><p class=\"vi\">Tôi đang nghe nhạc, rất hay.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你用电脑听吗？</p><p class=\"py\">nǐ yòng diàn nǎo tīng ma？</p><p class=\"vi\">Bạn nghe bằng máy tính à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不是，我用手机听。</p><p class=\"py\">bù shì， wǒ yòng shǒu jī tīng。</p><p class=\"vi\">Không, tôi nghe bằng điện thoại.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「看 / 看见 / 看到」辨析练习</li><li>「好看 / 好听」搭配卡</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「看」是动作，「看见 / 看到」是结果，不能混用</li><li>「好看」指视觉，「好听」指听觉</li><li>「电视机」是设备，「电视」可指设备也可指节目</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「看 / 看见 / 听 / 听见」各写一句</li><li>在 App 上完成 L35 测验</li></ul>"},
    {title:"L36 说和问", id:"l36", html:"<h1>L36 · 说和问</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Nói và hỏi</p>\n<div class=\"lead\"><b>本课目标：</b>会说沟通动作，会用电话和网络</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">说</td><td class=\"pyc\">shuō</td><td class=\"hv\">thuyết</td><td>nói; trò chuyện; nói ra；giải thích; bình luận</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">说话</td><td class=\"pyc\">shuō huà</td><td class=\"hv\">thuyết thoại</td><td>nói；trò chuyện</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">问</td><td class=\"pyc\">wèn</td><td class=\"hv\">vấn</td><td>hỏi; thắc mắc</td><td class=\"hint\">动词 / 语素</td></tr><tr><td class=\"hz\">回答</td><td class=\"pyc\">huí dá</td><td class=\"hv\">hồi đáp</td><td>trả lời; đáp；trả lời; đáp án</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">告诉</td><td class=\"pyc\">gào su</td><td class=\"hv\">cáo tố</td><td>nói; thông báo; cho biết</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">叫</td><td class=\"pyc\">jiào</td><td class=\"hv\">khiếu</td><td>kêu；gọi</td><td class=\"hint\">动词 / 介词</td></tr><tr><td class=\"hz\">介绍</td><td class=\"pyc\">jiè shào</td><td class=\"hv\">giới thiệu</td><td>giới thiệu (ai với ai)；thuyết trình</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">电话</td><td class=\"pyc\">diàn huà</td><td class=\"hv\">điện thoại</td><td>điện thoại；cuộc gọi điện thoại</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">打电话</td><td class=\"pyc\">dǎ diàn huà</td><td class=\"hv\">đả điện thoại</td><td>gọi điện thoại</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">手机</td><td class=\"pyc\">shǒu jī</td><td class=\"hv\">thủ cơ</td><td>điện thoại di động；LT:部,支</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">上网</td><td class=\"pyc\">shàng wǎng</td><td class=\"hv\">thượng võng</td><td>lên mạng；kết nối Internet</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">网上</td><td class=\"pyc\">wǎng shàng</td><td class=\"hv\">võng thượng</td><td>trực tuyến</td><td class=\"hint\">处所词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「说 + 语言」</p><p class=\"gfm\">说 + 汉语 / 中文</p><p class=\"gnote\">语言名称直接跟在「说」后面，不加「的」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他说汉语。</p><p class=\"py\">tā shuō Hàn yǔ。</p><p class=\"vi\">Anh ấy nói tiếng Hán.</p></div><div class=\"gex\"><p class=\"zh\">我会说中文。</p><p class=\"py\">wǒ huì shuō Zhōng wén。</p><p class=\"vi\">Tôi biết nói tiếng Trung.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「告诉 + 人 + 事」</p><p class=\"gfm\">告诉 + 人 + 事</p><p class=\"gnote\">顺序是先人后事，不能反。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他告诉我时间。</p><p class=\"py\">tā gào su wǒ shí jiān。</p><p class=\"vi\">Anh ấy nói cho tôi thời gian.</p></div><div class=\"gex\"><p class=\"zh\">我告诉他了。</p><p class=\"py\">wǒ gào su tā le。</p><p class=\"vi\">Tôi đã nói cho anh ấy rồi.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">他说汉语。</p><p class=\"py\">tā shuō Hàn yǔ。</p><p class=\"vi\">Anh ấy nói tiếng Hán.</p></div><div class=\"sent\"><p class=\"zh\">我问老师。</p><p class=\"py\">wǒ wèn lǎo shī。</p><p class=\"vi\">Tôi hỏi giáo viên.</p></div><div class=\"sent\"><p class=\"zh\">老师回答我。</p><p class=\"py\">lǎo shī huí dá wǒ。</p><p class=\"vi\">Giáo viên trả lời tôi.</p></div><div class=\"sent\"><p class=\"zh\">他告诉我时间。</p><p class=\"py\">tā gào su wǒ shí jiān。</p><p class=\"vi\">Anh ấy nói cho tôi thời gian.</p></div><div class=\"sent\"><p class=\"zh\">我给你打电话。</p><p class=\"py\">wǒ gěi nǐ dǎ diàn huà。</p><p class=\"vi\">Tôi gọi điện cho bạn.</p></div><div class=\"sent\"><p class=\"zh\">我在网上买东西。</p><p class=\"py\">wǒ zài wǎng shàng mǎi dōng xi。</p><p class=\"vi\">Tôi mua đồ trên mạng.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你会说汉语吗？</p><p class=\"py\">nǐ huì shuō Hàn yǔ ma？</p><p class=\"vi\">Bạn biết nói tiếng Hán không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">会。我说汉语很慢。</p><p class=\"py\">huì。 wǒ shuō Hàn yǔ hěn màn。</p><p class=\"vi\">Biết. Tôi nói tiếng Hán rất chậm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你给他打电话了吗？</p><p class=\"py\">nǐ gěi tā dǎ diàn huà le ma？</p><p class=\"vi\">Bạn gọi điện cho anh ấy chưa?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">打了。我告诉他了。</p><p class=\"py\">dǎ le。 wǒ gào su tā le。</p><p class=\"vi\">Gọi rồi. Tôi đã nói cho anh ấy.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他说什么？</p><p class=\"py\">tā shuō shén me？</p><p class=\"vi\">Anh ấy nói gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他说他明天来。</p><p class=\"py\">tā shuō tā míng tiān lái。</p><p class=\"vi\">Anh ấy nói mai sẽ đến.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，谢谢你告诉我。</p><p class=\"py\">hǎo， xiè xie nǐ gào su wǒ。</p><p class=\"vi\">Được, cảm ơn bạn đã nói cho tôi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>沟通动词卡：说 / 问 / 回答 / 告诉 / 介绍</li><li>情景练习：打电话约时间</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「告诉」后面先接人再接事：告诉他时间</li><li>「说话」是动词，不能说「说一个话」</li><li>「打电话」是动宾结构，中间可插「了」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「打电话 / 上网 / 网上」各写一句</li><li>在 App 上完成 L36 测验</li></ul>"},
    {title:"L37 唱和玩", id:"l37", html:"<h1>L37 · 唱和玩</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Hát và chơi</p>\n<div class=\"lead\"><b>本课目标：</b>会谈论娱乐活动</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">唱</td><td class=\"pyc\">chàng</td><td class=\"hv\">xướng</td><td>hát；gọi to</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">唱歌</td><td class=\"pyc\">chàng gē</td><td class=\"hv\">xướng ca</td><td>hát một bài hát</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">歌</td><td class=\"pyc\">gē</td><td class=\"hv\">ca</td><td>bài hát；hát</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">玩儿</td><td class=\"pyc\">wán r</td><td class=\"hv\">ngoạn nhi</td><td>chơi；vui chơi</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">好玩儿</td><td class=\"pyc\">hǎo wán r</td><td class=\"hv\">hảo ngoạn nhi</td><td>vui vẻ；thú vị</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">笑</td><td class=\"pyc\">xiào</td><td class=\"hv\">tiếu</td><td>cười; mỉm cười；cười nhạo</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">球</td><td class=\"pyc\">qiú</td><td class=\"hv\">cầu</td><td>quả bóng；hình cầu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">打球</td><td class=\"pyc\">dǎ qiú</td><td class=\"hv\">đả cầu</td><td>chơi bóng；chơi với bóng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">见面</td><td class=\"pyc\">jiàn miàn</td><td class=\"hv\">kiến diện</td><td>gặp mặt; gặp nhau；LT:次</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">开玩笑</td><td class=\"pyc\">kāi wán xiào</td><td class=\"hv\">khai ngoạn tiếu</td><td>đùa giỡn; chế nhạo; nói đùa</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">打</td><td class=\"pyc\">dǎ</td><td class=\"hv\">đả</td><td>đánh；đập</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">动作</td><td class=\"pyc\">dòng zuò</td><td class=\"hv\">động tác</td><td>diễn; di chuyển</td><td class=\"hint\">名词 / 动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「唱 / 打 / 玩」+ 名词</p><p class=\"gfm\">唱歌　｜　打球　｜　玩儿</p><p class=\"gnote\">这些是动宾结构，中间可以插其他成分。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我喜欢唱歌。</p><p class=\"py\">wǒ xǐ huan chàng gē。</p><p class=\"vi\">Tôi thích hát.</p></div><div class=\"gex\"><p class=\"zh\">我们打球吧。</p><p class=\"py\">wǒ men dǎ qiú ba。</p><p class=\"vi\">Chúng ta chơi bóng đi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「好玩儿」作谓语</p><p class=\"gfm\">名词 + 很好玩儿</p><p class=\"gnote\">形容有趣、有意思。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个地方很好玩儿。</p><p class=\"py\">zhè ge dì fāng hěn hǎo wánr。</p><p class=\"vi\">Nơi này rất thú vị.</p></div><div class=\"gex\"><p class=\"zh\">打球很好玩儿。</p><p class=\"py\">dǎ qiú hěn hǎo wánr。</p><p class=\"vi\">Chơi bóng rất vui.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我喜欢唱歌。</p><p class=\"py\">wǒ xǐ huan chàng gē。</p><p class=\"vi\">Tôi thích hát.</p></div><div class=\"sent\"><p class=\"zh\">他唱歌很好。</p><p class=\"py\">tā chàng gē hěn hǎo。</p><p class=\"vi\">Anh ấy hát rất hay.</p></div><div class=\"sent\"><p class=\"zh\">我们明天去玩儿。</p><p class=\"py\">wǒ men míng tiān qù wánr。</p><p class=\"vi\">Mai chúng ta đi chơi.</p></div><div class=\"sent\"><p class=\"zh\">这个地方很好玩儿。</p><p class=\"py\">zhè ge dì fāng hěn hǎo wánr。</p><p class=\"vi\">Nơi này rất thú vị.</p></div><div class=\"sent\"><p class=\"zh\">我们打球吧。</p><p class=\"py\">wǒ men dǎ qiú ba。</p><p class=\"vi\">Chúng ta chơi bóng đi.</p></div><div class=\"sent\"><p class=\"zh\">我们什么时候见面？</p><p class=\"py\">wǒ men shén me shí hòu jiàn miàn？</p><p class=\"vi\">Chúng ta gặp nhau lúc nào?</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你会唱歌吗？</p><p class=\"py\">nǐ huì chàng gē ma？</p><p class=\"vi\">Bạn biết hát không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">会一点儿。</p><p class=\"py\">huì yī diǎnr。</p><p class=\"vi\">Biết một chút.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们明天去玩儿，好不好？</p><p class=\"py\">wǒ men míng tiān qù wánr， hǎo bù hǎo？</p><p class=\"vi\">Mai chúng ta đi chơi, được không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好！去哪儿？</p><p class=\"py\">hǎo！ qù nǎr？</p><p class=\"vi\">Được! Đi đâu?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">去打球？</p><p class=\"py\">qù dǎ qiú？</p><p class=\"vi\">Đi chơi bóng?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好！我喜欢打球。</p><p class=\"py\">hǎo！ wǒ xǐ huan dǎ qiú。</p><p class=\"vi\">Được! Tôi thích chơi bóng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们几点见面？</p><p class=\"py\">wǒ men jǐ diǎn jiàn miàn？</p><p class=\"vi\">Chúng ta gặp nhau lúc mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">下午三点，学校门口。</p><p class=\"py\">xià wǔ sān diǎn， xué xiào mén kǒu。</p><p class=\"vi\">Ba giờ chiều, cổng trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，一会儿见！</p><p class=\"py\">hǎo， yī huìr jiàn！</p><p class=\"vi\">Được, lát nữa gặp!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>娱乐活动卡：唱歌 / 打球 / 玩儿 / 笑</li><li>「好玩儿」造句：说出三件好玩儿的事</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「见面」是动宾结构，中间可插「了」：见了面</li><li>「玩儿」必须儿化，读 wánr</li><li>「开玩笑」是逗人笑，不是真的生气</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出自己最喜欢的三个娱乐活动</li><li>在 App 上完成 L37 测验</li></ul>"},
    {title:"L38 买东西", id:"l38", html:"<h1>L38 · 买东西</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Mua đồ</p>\n<div class=\"lead\"><b>本课目标：</b>会购物，会表达寻找和放置</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">买</td><td class=\"pyc\">mǎi</td><td class=\"hv\">mãi</td><td>mua；mua sắm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">钱</td><td class=\"pyc\">qián</td><td class=\"hv\">tiền</td><td>tiền xu；tiền</td><td class=\"hint\">名词 / 人名</td></tr><tr><td class=\"hz\">钱包</td><td class=\"pyc\">qián bāo</td><td class=\"hv\">tiền bao</td><td>ví；bóp tiền</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">贵</td><td class=\"pyc\">guì</td><td class=\"hv\">quý</td><td>đắt；(hình thức kết hợp) được coi trọng</td><td class=\"hint\">形容词 / 代词</td></tr><tr><td class=\"hz\">找</td><td class=\"pyc\">zhǎo</td><td class=\"hv\">trảo</td><td>cố gắng tìm；tìm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">找到</td><td class=\"pyc\">zhǎo dào</td><td class=\"hv\">trảo đáo</td><td>tìm thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">拿</td><td class=\"pyc\">ná</td><td class=\"hv\">nã</td><td>cầm；nắm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">放</td><td class=\"pyc\">fàng</td><td class=\"hv\">phóng</td><td>đặt；để</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">打开</td><td class=\"pyc\">dǎ kāi</td><td class=\"hv\">đả khai</td><td>mở；cho xem (vé)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">关上</td><td class=\"pyc\">guān shàng</td><td class=\"hv\">quan thượng</td><td>đóng (cửa)；tắt (đèn, thiết bị điện, v.v.)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">东西</td><td class=\"pyc\">dōng xi</td><td class=\"hv\">đông tây</td><td>đồ vật；thứ</td><td class=\"hint\">名词 / 方位词</td></tr><tr><td class=\"hz\">得到</td><td class=\"pyc\">dé dào</td><td class=\"hv\">đắc đáo</td><td>được; đạt được; nhận được</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「找」和「找到」</p><p class=\"gfm\">找（动作）→ 找到（结果）</p><p class=\"gnote\">「找不到」表示找了但没找到。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我找钱包。</p><p class=\"py\">wǒ zhǎo qián bāo。</p><p class=\"vi\">Tôi tìm ví.</p></div><div class=\"gex\"><p class=\"zh\">我找到了。</p><p class=\"py\">wǒ zhǎo dào le。</p><p class=\"vi\">Tôi tìm thấy rồi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「打开 / 关上」是一对反义</p><p class=\"gfm\">打开 + 名词　｜　关上 + 名词</p><p class=\"gnote\">用于门、窗、书、电脑等。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">请打开书。</p><p class=\"py\">qǐng dǎ kāi shū。</p><p class=\"vi\">Mời mở sách ra.</p></div><div class=\"gex\"><p class=\"zh\">请关上门。</p><p class=\"py\">qǐng guān shàng mén。</p><p class=\"vi\">Mời đóng cửa lại.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我买东西。</p><p class=\"py\">wǒ mǎi dōng xi。</p><p class=\"vi\">Tôi mua đồ.</p></div><div class=\"sent\"><p class=\"zh\">我的钱包在哪儿？</p><p class=\"py\">wǒ de qián bāo zài nǎr？</p><p class=\"vi\">Ví của tôi ở đâu?</p></div><div class=\"sent\"><p class=\"zh\">这个很贵。</p><p class=\"py\">zhè ge hěn guì。</p><p class=\"vi\">Cái này rất đắt.</p></div><div class=\"sent\"><p class=\"zh\">我找到了。</p><p class=\"py\">wǒ zhǎo dào le。</p><p class=\"vi\">Tôi tìm thấy rồi.</p></div><div class=\"sent\"><p class=\"zh\">请打开书。</p><p class=\"py\">qǐng dǎ kāi shū。</p><p class=\"vi\">Mời mở sách ra.</p></div><div class=\"sent\"><p class=\"zh\">书放在桌子上。</p><p class=\"py\">shū fàng zài zhuō zi shàng。</p><p class=\"vi\">Sách đặt trên bàn.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你要买什么？</p><p class=\"py\">nǐ yào mǎi shén me？</p><p class=\"vi\">Bạn muốn mua gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我要买书。</p><p class=\"py\">wǒ yào mǎi shū。</p><p class=\"vi\">Tôi muốn mua sách.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这个贵吗？</p><p class=\"py\">zhè ge guì ma？</p><p class=\"vi\">Cái này đắt không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不贵，十块。</p><p class=\"py\">bù guì， shí kuài。</p><p class=\"vi\">Không đắt, mười tệ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的钱包在哪儿？</p><p class=\"py\">nǐ de qián bāo zài nǎr？</p><p class=\"vi\">Ví của bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我找不到了。</p><p class=\"py\">wǒ zhǎo bù dào le。</p><p class=\"vi\">Tôi tìm không thấy.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">在桌子上！</p><p class=\"py\">zài zhuō zi shàng！</p><p class=\"vi\">Ở trên bàn!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我看见了。谢谢！</p><p class=\"py\">wǒ kàn jiàn le。 xiè xie！</p><p class=\"vi\">Tôi thấy rồi. Cảm ơn!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>购物情景：一问一答完成一次买卖</li><li>「找 / 找到 / 找不到」对比练习</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「贵」形容价格高，「不贵」就是便宜的意思</li><li>「找」还有「找钱」的意思：找你十块</li><li>「打开 / 关上」是一对反义动词</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写一次购物对话，至少六句</li><li>在 App 上完成 L38 测验</li></ul>"},
    {title:"L39 做和用", id:"l39", html:"<h1>L39 · 做和用</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Làm và dùng</p>\n<div class=\"lead\"><b>本课目标：</b>会表达日常动作，会请人帮忙</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">做</td><td class=\"pyc\">zuò</td><td class=\"hv\">tố</td><td>làm; sản xuất；viết; sáng tác</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">干</td><td class=\"pyc\">gàn</td><td class=\"hv\">can</td><td>thân cây；phần chính của cái gì</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">用</td><td class=\"pyc\">yòng</td><td class=\"hv\">dụng</td><td>sử dụng；tận dụng</td><td class=\"hint\">动词 / 介词</td></tr><tr><td class=\"hz\">开</td><td class=\"pyc\">kāi</td><td class=\"hv\">khai</td><td>mở；bật; vận hành; hoạt động; chạy</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">关</td><td class=\"pyc\">guān</td><td class=\"hv\">quan</td><td>ải núi；đóng; khép; tắt</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">帮</td><td class=\"pyc\">bāng</td><td class=\"hv\">bang</td><td>giúp；hỗ trợ</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">帮忙</td><td class=\"pyc\">bāng máng</td><td class=\"hv\">bang mang</td><td>giúp；giúp đỡ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">穿</td><td class=\"pyc\">chuān</td><td class=\"hv\">xuyên</td><td>mặc；mang</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">衣服</td><td class=\"pyc\">yī fu</td><td class=\"hv\">y phục</td><td>quần áo；LT:件,套</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">杯子</td><td class=\"pyc\">bēi zi</td><td class=\"hv\">bôi tử</td><td>cốc；ly</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">杯</td><td class=\"pyc\">bēi</td><td class=\"hv\">bôi</td><td>cái cúp；cúp vô địch</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">地图</td><td class=\"pyc\">dì tú</td><td class=\"hv\">địa đồ</td><td>bản đồ</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「帮」和「帮忙」</p><p class=\"gfm\">帮 + 人　｜　帮忙（不带宾语）</p><p class=\"gnote\">「帮忙」是动宾结构，后面不能直接接人。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我帮你。</p><p class=\"py\">wǒ bāng nǐ。</p><p class=\"vi\">Tôi giúp bạn.</p></div><div class=\"gex\"><p class=\"zh\">他给我帮忙。</p><p class=\"py\">tā gěi wǒ bāng máng。</p><p class=\"vi\">Anh ấy giúp tôi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「开 / 关」</p><p class=\"gfm\">开 / 关 + 门 / 电脑</p><p class=\"gnote\">表示开关电器或门窗。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">请开门。</p><p class=\"py\">qǐng kāi mén。</p><p class=\"vi\">Mời mở cửa.</p></div><div class=\"gex\"><p class=\"zh\">我开电脑。</p><p class=\"py\">wǒ kāi diàn nǎo。</p><p class=\"vi\">Tôi mở máy tính.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我做饭。</p><p class=\"py\">wǒ zuò fàn。</p><p class=\"vi\">Tôi nấu cơm.</p></div><div class=\"sent\"><p class=\"zh\">你在做什么？</p><p class=\"py\">nǐ zài zuò shén me？</p><p class=\"vi\">Bạn đang làm gì?</p></div><div class=\"sent\"><p class=\"zh\">我用杯子喝水。</p><p class=\"py\">wǒ yòng bēi zi hē shuǐ。</p><p class=\"vi\">Tôi dùng cốc uống nước.</p></div><div class=\"sent\"><p class=\"zh\">我帮你。</p><p class=\"py\">wǒ bāng nǐ。</p><p class=\"vi\">Tôi giúp bạn.</p></div><div class=\"sent\"><p class=\"zh\">他给我帮忙。</p><p class=\"py\">tā gěi wǒ bāng máng。</p><p class=\"vi\">Anh ấy giúp tôi.</p></div><div class=\"sent\"><p class=\"zh\">今天很冷，多穿衣服。</p><p class=\"py\">jīn tiān hěn lěng， duō chuān yī fú。</p><p class=\"vi\">Hôm nay lạnh, mặc thêm áo.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在做什么？</p><p class=\"py\">nǐ zài zuò shén me？</p><p class=\"vi\">Bạn đang làm gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我做饭。</p><p class=\"py\">wǒ zuò fàn。</p><p class=\"vi\">Tôi nấu cơm.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我帮你。</p><p class=\"py\">wǒ bāng nǐ。</p><p class=\"vi\">Tôi giúp bạn.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">杯子在哪儿？</p><p class=\"py\">bēi zi zài nǎr？</p><p class=\"vi\">Cốc ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在桌子上。你用那个杯子。</p><p class=\"py\">zài zhuō zi shàng。 nǐ yòng nà ge bēi zi。</p><p class=\"vi\">Ở trên bàn. Bạn dùng cái cốc kia.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好。今天很冷，你要多穿衣服。</p><p class=\"py\">hǎo。 jīn tiān hěn lěng， nǐ yào duō chuān yī fú。</p><p class=\"vi\">Được. Hôm nay lạnh, bạn phải mặc thêm áo.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>日常动作卡：做 / 干 / 用 / 穿 / 开 / 关</li><li>情景练习：请人帮忙做一件事</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「帮忙」后面不能直接接人：不说「帮忙我」，要说「帮我」</li><li>「做」和「干」都可表示做事情，「干」更口语</li><li>「穿」用于衣服鞋袜</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「做 / 用 / 穿 / 帮」各写一句</li><li>在 App 上完成 L39 测验</li></ul>"},
    {title:"L40 心情与评价", id:"l40", html:"<h1>L40 · 心情与评价</h1>\n<p class=\"sub\">第五阶段 · 动作与表达　|　Cảm xúc và đánh giá</p>\n<div class=\"lead\"><b>本课目标：</b>会表达心情和评价</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">高兴</td><td class=\"pyc\">gāo xìng</td><td class=\"hv\">cao hưng</td><td>vui；vui vẻ</td><td class=\"hint\">形容词 / 名形词</td></tr><tr><td class=\"hz\">生气</td><td class=\"pyc\">shēng qì</td><td class=\"hv\">sinh khí</td><td>nổi giận; tức giận；sinh khí; sức sống</td><td class=\"hint\">形容词 / 名词</td></tr><tr><td class=\"hz\">错</td><td class=\"pyc\">cuò</td><td class=\"hv\">thác</td><td>lỗi；sai</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">难</td><td class=\"pyc\">nán</td><td class=\"hv\">nan</td><td>khó (để...)；vấn đề</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">最好</td><td class=\"pyc\">zuì hǎo</td><td class=\"hv\">tối hảo</td><td>tốt nhất；nên ...; tốt hơn hết nên</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">有名</td><td class=\"pyc\">yǒu míng</td><td class=\"hv\">hữu danh</td><td>nổi tiếng；được biết đến</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">坏</td><td class=\"pyc\">huài</td><td class=\"hv\">hoại</td><td>xấu；bị hỏng</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">起</td><td class=\"pyc\">qǐ</td><td class=\"hv\">khởi</td><td>dậy；nâng lên</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">动</td><td class=\"pyc\">dòng</td><td class=\"hv\">động</td><td>(cái gì đó) di chuyển；bắt đầu chuyển động</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">子</td><td class=\"pyc\">zi</td><td class=\"hv\">tử</td><td>(hậu tố danh từ)</td><td class=\"hint\">语素 / 量词</td></tr><tr><td class=\"hz\">第二</td><td class=\"pyc\">dì èr</td><td class=\"hv\">đệ nhị</td><td>thứ hai；số hai</td><td class=\"hint\">数词</td></tr><tr><td class=\"hz\">门</td><td class=\"pyc\">mén</td><td class=\"hv\">môn</td><td>cổng；cửa</td><td class=\"hint\">名词 / 量词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「高兴 / 生气」是心理形容词</p><p class=\"gfm\">主语 + 很 + 高兴 / 生气</p><p class=\"gnote\">直接作谓语，前面加程度副词。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">今天我很高兴。</p><p class=\"py\">jīn tiān wǒ hěn gāo xìng。</p><p class=\"vi\">Hôm nay tôi rất vui.</p></div><div class=\"gex\"><p class=\"zh\">他很生气。</p><p class=\"py\">tā hěn shēng qì。</p><p class=\"vi\">Anh ấy rất tức giận.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「最好」表示建议</p><p class=\"gfm\">你最好 + 动词</p><p class=\"gnote\">不是「最好」的「最」+「好」，而是一个固定说法，表示建议。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你最好休息一下儿。</p><p class=\"py\">nǐ zuì hǎo xiū xi yī xiàr。</p><p class=\"vi\">Bạn nên nghỉ một chút.</p></div><div class=\"gex\"><p class=\"zh\">你最好先吃饭。</p><p class=\"py\">nǐ zuì hǎo xiān chī fàn。</p><p class=\"vi\">Bạn nên ăn cơm trước.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">今天我很高兴。</p><p class=\"py\">jīn tiān wǒ hěn gāo xìng。</p><p class=\"vi\">Hôm nay tôi rất vui.</p></div><div class=\"sent\"><p class=\"zh\">他很生气。</p><p class=\"py\">tā hěn shēng qì。</p><p class=\"vi\">Anh ấy rất tức giận.</p></div><div class=\"sent\"><p class=\"zh\">这个不难。</p><p class=\"py\">zhè ge bù nán。</p><p class=\"vi\">Cái này không khó.</p></div><div class=\"sent\"><p class=\"zh\">这是我的第二本书。</p><p class=\"py\">zhè shì wǒ de dì èr běn shū。</p><p class=\"vi\">Đây là cuốn sách thứ hai của tôi.</p></div><div class=\"sent\"><p class=\"zh\">这个地方很有名。</p><p class=\"py\">zhè ge dì fāng hěn yǒu míng。</p><p class=\"vi\">Nơi này rất nổi tiếng.</p></div><div class=\"sent\"><p class=\"zh\">请开门。</p><p class=\"py\">qǐng kāi mén。</p><p class=\"vi\">Mời mở cửa.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你今天高兴吗？</p><p class=\"py\">nǐ jīn tiān gāo xìng ma？</p><p class=\"vi\">Hôm nay bạn vui không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很高兴！我考试考好了。</p><p class=\"py\">hěn gāo xìng！ wǒ kǎo shì kǎo hǎo le。</p><p class=\"vi\">Rất vui! Tôi thi tốt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">真好！</p><p class=\"py\">zhēn hǎo！</p><p class=\"vi\">Tốt quá!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">你呢？</p><p class=\"py\">nǐ ne？</p><p class=\"vi\">Còn bạn?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我不太好。今天的课很难。</p><p class=\"py\">wǒ bù tài hǎo。 jīn tiān de kè hěn nán。</p><p class=\"vi\">Tôi không được tốt lắm. Bài hôm nay rất khó.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">别生气。</p><p class=\"py\">bié shēng qì。</p><p class=\"vi\">Đừng giận.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我不生气，我有一点儿累。</p><p class=\"py\">wǒ bù shēng qì， wǒ yǒu yī diǎnr lèi。</p><p class=\"vi\">Tôi không giận, tôi hơi mệt.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">你最好休息一下儿。</p><p class=\"py\">nǐ zuì hǎo xiū xi yī xiàr。</p><p class=\"vi\">Bạn nên nghỉ một chút.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>心情卡：高兴 / 生气 / 累 / 好 / 坏</li><li>评价练习：对三件事各说一句评价</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「高兴」是形容词，可说「我很高兴」</li><li>「生气」是动宾结构，中间可插「了」：生了气</li><li>「第二」是序数，注意「二」不变「两」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「高兴 / 生气 / 难 / 有名」各写一句</li><li>在 App 上完成 L40 测验</li></ul>"}
  ]},

    {title:"L41 程度与频率", id:"l41", html:"<h1>L41 · 程度与频率</h1>\n<p class=\"sub\">第六阶段 · 虚词与语法　|　Mức độ và tần suất</p>\n<div class=\"lead\"><b>本课目标：</b>会用程度副词和频率副词，会表示禁止和重复</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">很</td><td class=\"pyc\">hěn</td><td class=\"hv\">ngận</td><td>(phó từ mức độ)；khá</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">太</td><td class=\"pyc\">tài</td><td class=\"hv\">thái</td><td>quá; rất (thường hàm ý phàn nàn)；quá ... để</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">最</td><td class=\"pyc\">zuì</td><td class=\"hv\">tối</td><td>nhất；tính từ so sánh nhất</td><td class=\"hint\">副词 / 语素</td></tr><tr><td class=\"hz\">非常</td><td class=\"pyc\">fēi cháng</td><td class=\"hv\">phi thường</td><td>rất; thực sự；khác thường; phi thường</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">就</td><td class=\"pyc\">jiù</td><td class=\"hv\">tựu</td><td>thì; liền; ngay；(sau mệnh đề giả định) thì</td><td class=\"hint\">副词 / 介词</td></tr><tr><td class=\"hz\">再</td><td class=\"pyc\">zài</td><td class=\"hv\">tái</td><td>lại; một lần nữa; tái-；lần thứ hai; cái khác</td><td class=\"hint\">副词 / 语素</td></tr><tr><td class=\"hz\">正</td><td class=\"pyc\">zhèng</td><td class=\"hv\">chánh</td><td>thẳng；nghiêm túc</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">正在</td><td class=\"pyc\">zhèng zài</td><td class=\"hv\">chánh tại</td><td>đang ở (thời điểm đó)；ngay tại (nơi đó)</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">有时</td><td class=\"pyc\">yǒu shí</td><td class=\"hv\">hữu thì</td><td>đôi khi；thỉnh thoảng</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">不用</td><td class=\"pyc\">bù yòng</td><td class=\"hv\">bất dụng</td><td>không cần</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">别</td><td class=\"pyc\">bié</td><td class=\"hv\">biệt</td><td>đừng; chớ；khác; phân biệt</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">路上</td><td class=\"pyc\">lù shang</td><td class=\"hv\">lộ thượng</td><td>trên đường；trên đường; đang đi</td><td class=\"hint\">处所词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 程度副词阶梯</p><p class=\"gfm\">很 &lt; 非常 &lt; 太 &lt; 最</p><p class=\"gnote\">「太」后面一般要加「了」：太好了。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个很好。</p><p class=\"py\">zhè ge hěn hǎo。</p><p class=\"vi\">Cái này tốt.</p></div><div class=\"gex\"><p class=\"zh\">这个非常好。</p><p class=\"py\">zhè ge fēi cháng hǎo。</p><p class=\"vi\">Cái này rất tốt.</p></div><div class=\"gex\"><p class=\"zh\">这个太好了！</p><p class=\"py\">zhè ge tài hǎo le！</p><p class=\"vi\">Cái này tuyệt quá!</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「正在 / 正」表示进行</p><p class=\"gfm\">正在 + 动词</p><p class=\"gnote\">比单用「在」更强调动作正在进行。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他正在看书。</p><p class=\"py\">tā zhèng zài kàn shū。</p><p class=\"vi\">Anh ấy đang đọc sách.</p></div><div class=\"gex\"><p class=\"zh\">我正在吃饭。</p><p class=\"py\">wǒ zhèng zài chī fàn。</p><p class=\"vi\">Tôi đang ăn cơm.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 「别」表示禁止，「再」表示重复</p><p class=\"gfm\">别 + 动词　｜　再 + 动词 + 数量</p><p class=\"gnote\">「别」语气比「不要」缓和。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">别生气。</p><p class=\"py\">bié shēng qì。</p><p class=\"vi\">Đừng giận.</p></div><div class=\"gex\"><p class=\"zh\">我们再读一次。</p><p class=\"py\">wǒ men zài dú yī cì。</p><p class=\"vi\">Chúng ta đọc lại một lần nữa.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这个很好。</p><p class=\"py\">zhè ge hěn hǎo。</p><p class=\"vi\">Cái này tốt.</p></div><div class=\"sent\"><p class=\"zh\">这个非常好。</p><p class=\"py\">zhè ge fēi cháng hǎo。</p><p class=\"vi\">Cái này rất tốt.</p></div><div class=\"sent\"><p class=\"zh\">这个太好了！</p><p class=\"py\">zhè ge tài hǎo le！</p><p class=\"vi\">Cái này tuyệt quá!</p></div><div class=\"sent\"><p class=\"zh\">他正在看书。</p><p class=\"py\">tā zhèng zài kàn shū。</p><p class=\"vi\">Anh ấy đang đọc sách.</p></div><div class=\"sent\"><p class=\"zh\">我不用去。</p><p class=\"py\">wǒ bù yòng qù。</p><p class=\"vi\">Tôi không cần đi.</p></div><div class=\"sent\"><p class=\"zh\">别生气。</p><p class=\"py\">bié shēng qì。</p><p class=\"vi\">Đừng giận.</p></div><div class=\"sent\"><p class=\"zh\">我们再读一次。</p><p class=\"py\">wǒ men zài dú yī cì。</p><p class=\"vi\">Chúng ta đọc lại một lần nữa.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你在做什么？</p><p class=\"py\">nǐ zài zuò shén me？</p><p class=\"vi\">Bạn đang làm gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我正在看书。</p><p class=\"py\">wǒ zhèng zài kàn shū。</p><p class=\"vi\">Tôi đang đọc sách.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这本书好吗？</p><p class=\"py\">zhè běn shū hǎo ma？</p><p class=\"vi\">Cuốn sách này hay không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">非常好。</p><p class=\"py\">fēi cháng hǎo。</p><p class=\"vi\">Rất hay.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">太贵了吧？</p><p class=\"py\">tài guì le ba？</p><p class=\"vi\">Đắt quá nhỉ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不贵。</p><p class=\"py\">bù guì。</p><p class=\"vi\">Không đắt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">别看了，我们去吃饭。</p><p class=\"py\">bié kàn le， wǒ men qù chī fàn。</p><p class=\"vi\">Đừng đọc nữa, chúng ta đi ăn cơm.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我再读一会儿。</p><p class=\"py\">hǎo， wǒ zài dú yī huìr。</p><p class=\"vi\">Được, tôi đọc thêm một lát.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，我在门口等你。</p><p class=\"py\">hǎo， wǒ zài mén kǒu děng nǐ。</p><p class=\"vi\">Được, tôi đợi bạn ở cửa.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>程度阶梯：很 &lt; 非常 &lt; 太 &lt; 最，用同一件事说四级</li><li>「别」造句：说出三条禁止</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「太」后面一般加「了」：太好了</li><li>「正在」和「在」都表示进行，「正在」更强调</li><li>「别」是口语禁止，语气比「不要」缓和</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「很 / 非常 / 太 / 最」各写一句</li><li>在 App 上完成 L41 测验</li></ul>"},
