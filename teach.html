<!DOCTYPE html>
<html lang="zh-CN" data-skin="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文课 · 教课体系（HSK1 / HSK2 / HSK3）</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --card:#171b21; --line:rgba(255,255,255,.13);
    --text:#e6e9ed; --muted:#9aa2ad; --hint:#6e7681;
    --acc:#4fd1c5; --accb:#0f3f3c; --onacc:#08110f;
    --ok:#6ee7a8; --okb:#0f3d28;
    --warn:#f5c86a; --warnb:#46330d;
    --bad:#f08080; --badb:#46191c;
    --side:272px;
  }
  /* 皮肤固定为「午夜」——近黑青调，高对比。
     如需换皮肤，把 <html data-skin="..."> 改成下面任一值即可（其余四套已内置）： */
  [data-skin="light"]{
    --bg:#ffffff; --panel:#f6f6f5; --card:#ffffff; --line:rgba(0,0,0,.12);
    --text:#1a1a1a; --muted:#666666; --hint:#999999;
    --acc:#0C447C; --accb:#E6F1FB; --onacc:#ffffff;
    --ok:#0F6E56; --okb:#E1F5EE; --warn:#854F0B; --warnb:#FAEEDA;
    --bad:#A32D2D; --badb:#FCEBEB;
  }
  [data-skin="paper"]{
    --bg:#faf7f0; --panel:#f1ebdf; --card:#fffdf8; --line:rgba(70,52,24,.16);
    --text:#2e2a22; --muted:#6b6355; --hint:#9c9384;
    --acc:#8a5a1e; --accb:#f4e5cd; --onacc:#fffdf8;
    --ok:#4a6b2a; --okb:#e9f1dc; --warn:#96650f; --warnb:#f8e9c9;
    --bad:#a03528; --badb:#f8e1dd;
  }
  [data-skin="forest"]{
    --bg:#eef4ea; --panel:#e3eddd; --card:#f8fbf5; --line:rgba(34,64,28,.16);
    --text:#1e2a1c; --muted:#55654f; --hint:#8a9a84;
    --acc:#2f6b32; --accb:#dbead6; --onacc:#f8fbf5;
    --ok:#256b3f; --okb:#d6ebdd; --warn:#86620f; --warnb:#f2e6c6;
    --bad:#9c3628; --badb:#f5dfdb;
  }
  [data-skin="night"]{
    --bg:#1a1d24; --panel:#21252e; --card:#262b35; --line:rgba(255,255,255,.14);
    --text:#e8eaee; --muted:#a0a6b2; --hint:#767d8a;
    --acc:#7fb3f0; --accb:#1e3a5c; --onacc:#101620;
    --ok:#5dcfa0; --okb:#12463a; --warn:#f0c26a; --warnb:#4a3410;
    --bad:#f09090; --badb:#4a1f1f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.65; overflow:hidden;
  }
  .top{height:52px; display:flex; align-items:center; gap:14px; padding:0 18px;
    border-bottom:1px solid var(--line); background:var(--panel);}
  .logo{font-size:14px; font-weight:500; white-space:nowrap;}
  .search{flex:1; max-width:280px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--text); padding:0 10px; font-size:12px; outline:none;}
  .search:focus{border-color:var(--acc);}
  .tgl{margin-left:auto; font-size:12px; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer;}
  .tgl:hover{color:var(--text);}
  /* 主内容切换条（HSK1 / HSK2 / HSK3） */
  .lvrow{height:44px; display:flex; align-items:center; gap:9px; padding:0 18px;
    background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto;}
  .lvlabel{font-size:11.5px; color:var(--hint); white-space:nowrap; margin-right:2px;}
  .lvbtn{font:inherit; font-size:12.5px; white-space:nowrap; cursor:pointer;
    padding:5px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); display:inline-flex; align-items:center; gap:6px;}
  .lvbtn:hover{border-color:var(--acc); color:var(--acc);}
  .lvbtn.on{background:var(--acc); border-color:var(--acc); color:var(--onacc); font-weight:600;}
  .lvbtn.on .badge{background:var(--onacc); color:var(--acc);}
  .badge{font-size:10.5px; padding:1px 6px; border-radius:999px;
    background:var(--warnb); color:var(--warn);}
  .lvmeta{font-size:11.5px; color:var(--hint); white-space:nowrap; margin-left:auto;}
  .shell{display:flex; height:calc(100% - 96px);}
  .side{width:var(--side); flex:0 0 var(--side); overflow-y:auto; padding:12px 8px 40px;
    border-right:1px solid var(--line); background:var(--panel);}
  .side::-webkit-scrollbar{width:8px;}
  .side::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .main{flex:1; overflow-y:auto; padding:26px 34px 80px;}
  .main::-webkit-scrollbar{width:10px;}
  .main::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
  .grpbtn{width:100%; text-align:left; background:none; border:0; cursor:pointer; color:var(--text);
    font-family:inherit; display:flex; align-items:center; gap:6px; border-radius:8px; padding:7px 8px;}
  .grpbtn:hover{background:var(--card);}
  .grpbtn .caret{font-size:9px; color:var(--hint); transition:transform .15s; display:inline-block;}
  .grp.open > .grpbtn .caret{transform:rotate(90deg);}
  .grpbtn.d0{font-size:13px; font-weight:500;}
  .kids{display:none;}
  .grp.open > .kids{display:block;}
  .leaf{width:100%; text-align:left; background:none; border:0; cursor:pointer; color:var(--muted);
    font-family:inherit; border-radius:8px; padding:5px 8px; font-size:12.5px; display:block;}
  .leaf:hover{background:var(--card); color:var(--text);}
  .leaf.d1{padding-left:22px; font-size:12.5px;}
  .leaf.active{background:var(--accb); color:var(--acc); font-weight:500;}
  h1{font-size:22px; font-weight:500; margin:0 0 6px; letter-spacing:-.2px;}
  h2{font-size:15px; font-weight:500; margin:28px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  .sub{font-size:12px; color:var(--hint); margin:0 0 20px;}
  .lead{font-size:13px; color:var(--muted); background:var(--panel); border-radius:12px; padding:14px 16px; margin:0 0 20px;}
  .lead b{color:var(--text); font-weight:500;}
  table{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; margin:8px 0;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  th{color:var(--muted); font-weight:500;}
  .hint{color:var(--hint);}
  .note{font-size:12px; color:var(--muted); background:var(--panel); border-radius:10px; padding:12px 14px; margin:12px 0;}
  .note b{color:var(--text); font-weight:500;}
  code{font-size:11.5px; background:var(--panel); padding:1px 5px; border-radius:4px;}
  .layer,.stage{display:flex; gap:11px; align-items:flex-start; background:var(--panel); border-radius:11px; padding:11px 13px; margin-bottom:7px;}
  .lno,.sno{width:32px; height:32px; flex:0 0 32px; border-radius:8px; background:var(--accb); color:var(--acc);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500;}
  .lno.ok{background:var(--okb); color:var(--ok);}
  .lt{font-size:12.5px; font-weight:500; margin:0 0 2px;}
  .ls{font-size:11.5px; color:var(--muted); margin:0;}
  .flow{display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:12px 0;}
  .step{font-size:11.5px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 11px;}
  .arrow{color:var(--hint);}
  .todo{background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:22px;
    text-align:center; color:var(--hint); font-size:12.5px; margin:16px 0;}
  /* ---------- 教课内容 ---------- */
  table.words td.hz{font-size:16px; font-weight:500; color:var(--text);}
  table.words td.pyc{color:var(--acc);}
  table.words td.hv{color:var(--muted);}
  .g{background:var(--panel); border-radius:12px; padding:14px 16px; margin:10px 0;}
  .gpt{font-size:13.5px; font-weight:500; margin:0 0 4px;}
  .gfm{font-size:12.5px; color:var(--acc); background:var(--accb); display:inline-block;
    border-radius:6px; padding:3px 10px; margin:0 0 8px;}
  .gnote{font-size:12px; color:var(--muted); margin:0 0 10px;}
  .gwrap{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px;}
  .gex,.sent{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:9px 12px;}
  .exwrap{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px;}
  .zh{font-size:15px; font-weight:500; margin:0 0 2px;}
  .py{font-size:12px; color:var(--acc); margin:0 0 2px;}
  .vi{font-size:11.5px; color:var(--muted); margin:0;}
  .dlg{background:var(--panel); border-radius:12px; padding:6px 14px;}
  .line{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line);}
  .line:last-child{border-bottom:0;}
  .who{width:24px; height:24px; flex:0 0 24px; border-radius:50%; background:var(--accb); color:var(--acc);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; margin-top:3px;}
  ul.plain{margin:8px 0; padding-left:18px;}
  ul.plain li{font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  ul.pit{margin:8px 0; padding-left:18px;}
  ul.pit li{font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  ul.pit li::marker{color:var(--warn);}
  .hamb{display:none;}
  @media (max-width:860px){
    .side{position:absolute; left:0; top:96px; bottom:0; z-index:20; transform:translateX(-100%); transition:transform .2s;}
    .side.open{transform:none;}
    .hamb{display:inline-block; font-size:12px; background:none; border:1px solid var(--line);
      border-radius:8px; padding:4px 9px; cursor:pointer; color:var(--muted);}
    .main{padding:20px 16px 60px;}
    .exwrap,.gwrap{grid-template-columns:1fr;}
    .search{max-width:120px;}
  }
  @media print{
    .top,.lvrow,.side,.hamb{display:none!important;}
    .shell{height:auto;} .main{overflow:visible; padding:0;}
    body{overflow:visible; background:#fff; color:#000;}
    .g,.sent,.gex,.dlg{break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="top">
  <button class="hamb" onclick="document.getElementById('side').classList.toggle('open')">目录</button>
  <span class="logo">中文课 · 教课体系</span>
  <input class="search" id="q" placeholder="搜索课程、语法点…" oninput="filterTree(this.value)">
  <button class="tgl" onclick="window.print()">打印</button>
</div>

<div class="lvrow">
  <span class="lvlabel">主内容</span>
  <button class="lvbtn" data-lv="hsk1">HSK1 教课体系</button>
  <button class="lvbtn" data-lv="hsk2">HSK2 教课体系<span class="badge">教案 8/50</span></button>
  <button class="lvbtn" data-lv="hsk3">HSK3 教课体系<span class="badge">教案 0/64</span></button>
  <span class="lvmeta" id="lvmeta"></span>
</div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const DATA = {
  hsk1: [
  {title:"一、总览", id:"g0", children:[
    {title:"1.1 教课体系说明", id:"ov1", html:"\n<h1>HSK1 教课体系 · 说明</h1>\n<p class=\"sub\">把「中文教科体系」变成可以按程序去教的一套东西</p>\n<div class=\"lead\"><b>这套体系解决什么问题：</b>让任何一个新助教培训一周就能上岗，\n且不同班级教出来的质量基本一致。<b>做法是把「教什么」和「怎么教」都写死。</b></div>\n\n<h2>三层结构</h2>\n<div class=\"layer\"><div class=\"lno ok\">1</div><div>\n  <p class=\"lt\">教什么 · 课程内容</p>\n  <p class=\"ls\">42 课 / 6 阶段 / 506 词。每课有固定的 12 个生词 + 语法点 + 例句 + 对话。<br>\n  <b>这是地基</b>——没有它，教案和测验都是空的。</p></div></div>\n<div class=\"layer\"><div class=\"lno ok\">2</div><div>\n  <p class=\"lt\">怎么教 · 课堂交付</p>\n  <p class=\"ls\">每课一份可执行教案：语法点怎么讲、例句怎么带、对话怎么练、易错点在哪。<br>\n  与《教务与排课体系》的 45 分钟六步 SOP 配套使用。</p></div></div>\n<div class=\"layer\"><div class=\"lno\">3</div><div>\n  <p class=\"lt\">用什么教 · 工具系统</p>\n  <p class=\"ls\">学员端 App（逐课学 → 测验 → FSRS 复习 → 离线可用）。<br>\n  本文件是<b>教师端</b>的教课依据。</p></div></div>\n\n<h2>本文件包含什么</h2>\n<table>\n  <tr><th style=\"width:30%\">部分</th><th style=\"width:70%\">内容</th></tr>\n  <tr><td><b>一、总览</b></td><td>体系说明、课程地图、一课的标准结构、已知问题</td></tr>\n  <tr><td><b>二～七、六个阶段</b></td><td>42 课完整教案，按阶段分组</td></tr>\n  <tr><td><b>八、语法点索引</b></td><td>全部语法点按课次汇总，便于备课和复习</td></tr>\n  <tr><td><b>九、测验与题库</b></td><td>分级测试、阶段测验、结课测验的设计（题库待建）</td></tr>\n  <tr><td><b>十、教师使用说明</b></td><td>怎么用这份文件备课、上课、交接</td></tr>\n</table>\n\n<div class=\"note\"><b>和《中文语言学习运营系统》的关系：</b>\n那份文件管「组织怎么运转、怎么排课、怎么管人」；<b>这份文件管「这节课具体教什么、怎么教」</b>。\n两份配合使用：排课体系决定<b>谁在什么时候上哪一课</b>，教课体系决定<b>那一课怎么上</b>。</div>\n"},
    {title:"1.2 课程地图", id:"ov2", html:"\n<h1>课程地图</h1>\n<p class=\"sub\">6 个阶段 · 42 课 · 506 词</p>\n<div class=\"lead\">课程按<b>主题</b>编排，不按词频。每个课次 = 12 个词 + 1～2 个语法点，时长 45 分钟。</div>\n<table>\n  <tr><th style=\"width:30%\">阶段</th><th style=\"width:16%\">课次</th><th style=\"width:12%\">课数</th>\n  <th style=\"width:12%\">词汇</th><th style=\"width:30%\">越南语</th></tr>\n  <tr><td><b>第一阶段 · 发音与基础</b></td><td>L01–L12</td><td>12 课</td><td>144 词</td><td>Giai đoạn 1 · Phát âm và nền tảng</td></tr><tr><td><b>第二阶段 · 日常生活</b></td><td>L13–L21</td><td>9 课</td><td>110 词</td><td>Giai đoạn 2 · Sinh hoạt hằng ngày</td></tr><tr><td><b>第三阶段 · 学习与工作</b></td><td>L22–L27</td><td>6 课</td><td>72 词</td><td>Giai đoạn 3 · Học tập và công việc</td></tr><tr><td><b>第四阶段 · 出行与地点</b></td><td>L28–L34</td><td>7 课</td><td>84 词</td><td>Giai đoạn 4 · Đi lại và địa điểm</td></tr><tr><td><b>第五阶段 · 动作与表达</b></td><td>L35–L40</td><td>6 课</td><td>72 词</td><td>Giai đoạn 5 · Hành động và diễn đạt</td></tr><tr><td><b>第六阶段 · 虚词与语法</b></td><td>L41–L42</td><td>2 课</td><td>24 词</td><td>Giai đoạn 6 · Hư từ và ngữ pháp</td></tr>\n  <tr><td><b>合计</b></td><td>L01–L42</td><td><b>42 课</b></td><td><b>506 词</b></td><td>—</td></tr>\n</table>\n\n<h2>课次与周期</h2>\n<table>\n  <tr><th style=\"width:26%\">项目</th><th style=\"width:24%\">数值</th><th style=\"width:50%\">说明</th></tr>\n  <tr><td>单课次时长</td><td>45 分钟</td><td>六步 SOP，见《教务与排课体系》6.6</td></tr>\n  <tr><td>每周课次</td><td>2 课次</td><td>周一 / 三 / 五 任选两个时段，或周末连上</td></tr>\n  <tr><td>单级周期</td><td>约 21 周（5 个月）</td><td>42 课 ÷ 每周 2 课次</td></tr>\n  <tr><td>阶段测验</td><td>每 10 课次一次</td><td>共 4 次，作为升级判定依据</td></tr>\n</table>\n"},
    {title:"1.3 一课的标准结构", id:"ov3", html:"\n<h1>一课的标准结构</h1>\n<p class=\"sub\">每份教案都是同一个骨架，教师不用重新适应</p>\n<div class=\"lead\">骨架固定 = 备课成本低、交接成本低、教学质量稳定。<b>换老师时只需交接进度，不需要重新讲一遍怎么教。</b></div>\n<table>\n  <tr><th style=\"width:8%\">序</th><th style=\"width:22%\">板块</th><th style=\"width:70%\">内容与用途</th></tr>\n  <tr><td><b>一</b></td><td>生词表</td><td>12 个词：汉字 / 拼音 / 汉越音 / 越南语释义 / 词性。<b>学员用越南语理解，用汉越音建立记忆钩子。</b></td></tr>\n  <tr><td><b>二</b></td><td>语法点</td><td>每课 1～3 个，含<b>公式</b>（可直接抄板书）+ 说明 + 例句。<b>这是课堂讲解的骨架。</b></td></tr>\n  <tr><td><b>三</b></td><td>例句</td><td>5～7 句，全部注拼音 + 越南语。<b>用词严格限制在 HSK1 506 词内</b>，学员不会遇到生词。</td></tr>\n  <tr><td><b>四</b></td><td>对话</td><td>7～9 轮问答，可直接两人一组演练。<b>课堂第 5 步「互动练习」直接用这段。</b></td></tr>\n  <tr><td><b>五</b></td><td>课堂操练</td><td>2～3 条具体活动 + <b>纠音重点</b>（针对越南学员的发音难点）。</td></tr>\n  <tr><td><b>六</b></td><td>易错点</td><td>2～3 条越南学员的典型错误及正确说法。<b>提前打预防针，比事后纠正有效。</b></td></tr>\n  <tr><td><b>七</b></td><td>作业</td><td>App 作业 + 生活实践作业各一条。<b>把课堂输入转成长期记忆。</b></td></tr>\n</table>\n\n<h2>与六步 SOP 的对应关系</h2>\n<table>\n  <tr><th style=\"width:22%\">课堂步骤</th><th style=\"width:14%\">时长</th><th style=\"width:64%\">用教案的哪一部分</th></tr>\n  <tr><td>1 签到</td><td>2 分钟</td><td>—</td></tr>\n  <tr><td>2 复习</td><td>5 分钟</td><td>上一课的<b>生词表</b>快问快答</td></tr>\n  <tr><td>3 新词导入</td><td>12 分钟</td><td>本课<b>生词表</b>（发音 → 汉越音 → 越南语释义）</td></tr>\n  <tr><td>4 句型操练</td><td>12 分钟</td><td>本课<b>语法点 + 例句</b>（领读 → 轮读 → 纠音）</td></tr>\n  <tr><td>5 互动练习</td><td>10 分钟</td><td>本课<b>对话</b>（角色扮演）</td></tr>\n  <tr><td>6 小结与作业</td><td>4 分钟</td><td>本课<b>易错点 + 作业</b></td></tr>\n</table>\n<div class=\"note\"><b>注意：</b>「课堂操练」和「易错点」不是单独的环节，\n而是<b>贯穿在第 3、4、5 步里的教师提示</b>——讲解时顺手做掉。</div>\n"},
    {title:"1.4 已知问题与处理", id:"ov4", html:"\n<h1>已知问题与处理</h1>\n<p class=\"sub\">这套内容在编写过程中发现的三个真实问题，以及处理方式</p>\n\n<h2>问题一：虚词被编在最后一课</h2>\n<div class=\"note\"><b>现象：</b>「的、了、着、过、吗、呢、吧、们」这些中文里最高频的虚词，\n全部被编排在 <b>L42</b>（最后一课）。但「这是我的书」从第 2 课就需要用「的」。</div>\n<p class=\"lead\"><b>如果严格按课次顺序教，前 41 课写不出自然句子。</b></p>\n<table>\n  <tr><th style=\"width:26%\">处理方式</th><th style=\"width:74%\">说明</th></tr>\n  <tr><td><b>把虚词当语法点提前教</b></td><td>从 L01 起就在例句和对话里自然使用「的 / 了 / 吗」，\n  作为<b>句型</b>教，不要求学员掌握虚词本身的用法。</td></tr>\n  <tr><td><b>L42 作为系统整理课</b></td><td>L42 不再是「第一次见」，而是<b>把已经用了 41 课的东西系统讲一遍</b>。\n  这是正规教材的通行做法。</td></tr>\n</table>\n\n<h2>问题二：词表按主题编排，不是按词频</h2>\n<div class=\"note\"><b>现象：</b>HSK1 词表按主题分组（问候 / 代词 / 数字 / 家庭……），\n不是按使用频率排序。结果是<b>早期课次词汇量极有限</b>——L01 只有 12 个礼貌用语。</div>\n<p class=\"lead\"><b>影响：</b>无法做到「严格只用已学词写句子」。</p>\n<table>\n  <tr><th style=\"width:26%\">处理方式</th><th style=\"width:74%\">说明</th></tr>\n  <tr><td><b>放宽到 HSK1 全级词表</b></td><td>本文件的例句和对话，用词限制在 <b>HSK1 全部 506 词</b>内，\n  而不是「截至本课已学的词」。这样句子才自然。</td></tr>\n  <tr><td><b>用脚本强制校验</b></td><td>每句话都经过分词校验，确保不出现 506 词以外的词。\n  <b>学员在任何一课都不会遇到 HSK1 之外的生词。</b></td></tr>\n</table>\n\n<h2>问题三：没有现成的例句可复用</h2>\n<div class=\"note\"><b>现象：</b>项目里的词典数据（CVDICT 12.2 万条）是 CC-CEDICT 格式的释义词典，\n<b>不含结构化例句</b>；词表数据也只有词条本身。</div>\n<table>\n  <tr><th style=\"width:26%\">处理方式</th><th style=\"width:74%\">说明</th></tr>\n  <tr><td><b>例句与对话全部新写</b></td><td>770 句学员文本全部为本项目编写，越南语译文同步编写。</td></tr>\n  <tr><td><b>拼音自动生成 + 权威覆盖</b></td><td>拼音由脚本生成，并用词表里的<b>权威拼音覆盖</b>，\n  修掉轻声错误（妈妈 mā ma、认识 rèn shi、东西 dōng xi）。</td></tr>\n  <tr><td><b>一 / 不 用本调</b></td><td>与生词表保持一致（yī / bù），变调规则作为语法点单独讲，\n  避免「生词表 yī、例句 yí」让学员困惑。</td></tr>\n</table>\n\n<h2>问题四：词表释义来自词典，个别词不贴合 HSK1 语境</h2>\n<div class=\"note\"><b>现象：</b>生词表的越南语释义直接取自 CVDICT 词典（12.2 万条，CC BY-SA 4.0）。\n词典按<b>义项全集</b>给释义，不区分 HSK1 常用义。例如「没事儿」被译成「có thời gian rảnh」（有空），\n但 HSK1 里它的意思是「không có gì / không sao」（没关系）。</div>\n<table>\n  <tr><th style=\"width:26%\">处理方式</th><th style=\"width:74%\">说明</th></tr>\n  <tr><td><b>以教案为准</b></td><td><b>上课时以本文件的例句和对话里的用法为准</b>，不要照念词典释义。\n  例句和对话都是按 HSK1 语境写的，用法是准的。</td></tr>\n  <tr><td><b>已做的清理</b></td><td>脚本已自动去除：拼音残留标注（如 <code>[zhe4 li3]</code>）、\n  交叉引用条目、英文引号、超长罗列（截断至 34 字符、最多 2 条）。</td></tr>\n  <tr><td><b>待做的清理</b></td><td>504 条释义<b>逐条人工校订</b>是独立的一步工作，本次未做。\n  优先校订「礼貌用语、家庭称谓、方位词」这三类容易出错的词。</td></tr>\n</table>\n\n<div class=\"note\"><b>尚未完成的部分：</b>① 测验题库（见第九章）目前只有设计，题目本身待建；\n② 生词表释义的人工校订（见问题四）。这两项都需要单独安排。</div>\n"}
  ]},
  {title:"二、第一阶段 · 发音与基础", id:"g1", children:[
    {title:"L01 问候与礼貌", id:"l01", html:"<h1>L01 · 问候与礼貌</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Chào hỏi và lịch sự</p>\n<div class=\"lead\"><b>本课目标：</b>会用「请」发出礼貌邀请，会道谢、道歉并正确应答</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">谢谢</td><td class=\"pyc\">xiè xie</td><td class=\"hv\">tạ tạ</td><td>cảm ơn；cảm ơn bạn</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">再见</td><td class=\"pyc\">zài jiàn</td><td class=\"hv\">tái kiến</td><td>tạm biệt；gặp lại sau</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">对不起</td><td class=\"pyc\">duì bu qǐ</td><td class=\"hv\">đối bất khởi</td><td>Tôi xin lỗi；làm (ai đó) thất vọng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">不客气</td><td class=\"pyc\">bù kè qi</td><td class=\"hv\">bất khách khí</td><td>không có chi；đừng nhắc đến</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">请</td><td class=\"pyc\">qǐng</td><td class=\"hv\">thỉnh</td><td>mời；mời mọc</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">请问</td><td class=\"pyc\">qǐng wèn</td><td class=\"hv\">thỉnh vấn</td><td>xin lỗi, cho tôi hỏi...?</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">请进</td><td class=\"pyc\">qǐng jìn</td><td class=\"hv\">thỉnh tiến</td><td>mời vào</td><td class=\"hint\">动词短语</td></tr><tr><td class=\"hz\">请坐</td><td class=\"pyc\">qǐng zuò</td><td class=\"hv\">thỉnh tọa</td><td>xin mời ngồi</td><td class=\"hint\">动词短语</td></tr><tr><td class=\"hz\">没关系</td><td class=\"pyc\">méi guān xi</td><td class=\"hv\">một quan hệ</td><td>không sao đâu</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">没什么</td><td class=\"pyc\">méi shén me</td><td class=\"hv\">một thập ma</td><td>không sao；nghĩ không có gì</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">没事儿</td><td class=\"pyc\">méi shì r</td><td class=\"hv\">một sự nhi</td><td>có thời gian rảnh；rảnh rỗi</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">您</td><td class=\"pyc\">nín</td><td class=\"hv\">nâm</td><td>bạn</td><td class=\"hint\">代词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「请」+ 动词</p><p class=\"gfm\">请 + V</p><p class=\"gnote\">「请」放在动词前表示礼貌的邀请。「请问」是固定说法，用于向人提问，后面直接接问题。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">请进！</p><p class=\"py\">qǐng jìn！</p><p class=\"vi\">Mời vào!</p></div><div class=\"gex\"><p class=\"zh\">请坐。</p><p class=\"py\">qǐng zuò。</p><p class=\"vi\">Mời ngồi.</p></div><div class=\"gex\"><p class=\"zh\">请问，您是谁？</p><p class=\"py\">qǐng wèn， nín shì shéi？</p><p class=\"vi\">Xin hỏi, ông/bà là ai ạ?</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 礼貌用语必须成对记</p><p class=\"gfm\">谢谢 → 不客气　｜　对不起 → 没关系</p><p class=\"gnote\">应答错配会失礼。这两组要一起记、一起练。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">谢谢您！——不客气。</p><p class=\"py\">xiè xie nín！—— bù kè qi。</p><p class=\"vi\">Cảm ơn ông/bà! —— Đừng khách sáo.</p></div><div class=\"gex\"><p class=\"zh\">对不起！——没关系。</p><p class=\"py\">duì bu qǐ！—— méi guān xi。</p><p class=\"vi\">Xin lỗi! —— Không sao đâu.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">谢谢您！</p><p class=\"py\">xiè xie nín！</p><p class=\"vi\">Cảm ơn ông/bà ạ!</p></div><div class=\"sent\"><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div><div class=\"sent\"><p class=\"zh\">对不起！</p><p class=\"py\">duì bu qǐ！</p><p class=\"vi\">Xin lỗi!</p></div><div class=\"sent\"><p class=\"zh\">没关系。</p><p class=\"py\">méi guān xi。</p><p class=\"vi\">Không sao đâu.</p></div><div class=\"sent\"><p class=\"zh\">请进，请坐。</p><p class=\"py\">qǐng jìn， qǐng zuò。</p><p class=\"vi\">Mời vào, mời ngồi.</p></div><div class=\"sent\"><p class=\"zh\">请问，您是谁？</p><p class=\"py\">qǐng wèn， nín shì shéi？</p><p class=\"vi\">Xin hỏi, ông/bà là ai ạ?</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">请进！请坐。</p><p class=\"py\">qǐng jìn！ qǐng zuò。</p><p class=\"vi\">Mời vào! Mời ngồi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">谢谢您！</p><p class=\"py\">xiè xie nín！</p><p class=\"vi\">Cảm ơn ông/bà!</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对不起，我有事。</p><p class=\"py\">duì bu qǐ， wǒ yǒu shì。</p><p class=\"vi\">Xin lỗi, tôi có việc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">没关系。</p><p class=\"py\">méi guān xi。</p><p class=\"vi\">Không sao đâu.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">再见！</p><p class=\"py\">zài jiàn！</p><p class=\"vi\">Tạm biệt!</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">再见！</p><p class=\"py\">zài jiàn！</p><p class=\"vi\">Tạm biệt!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>两人一组交替说「谢谢」与「不客气」，要求看着对方、句尾语调下沉</li><li>「请」的组合快速反应：请进 / 请坐 / 请问 / 请</li><li>纠音重点：谢 xiè 的 x 是舌面音，越南学员易读成 s；对 duì 的 ui 要读满</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>越南学员常把「谢谢」读成 sè sè —— x 是舌面音，舌尖不要顶上齿</li><li>「没关系」只应答「对不起」；应答「谢谢」要用「不客气」，配错会失礼</li><li>「您」用于长辈或上级；平辈、朋友之间用「你」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>在 App 上听 L01 十二个词各 3 遍，跟读并录一遍音</li><li>对家人用中文说一次「谢谢」和一次「对不起」</li></ul>"},
    {title:"L02 我、你、他", id:"l02", html:"<h1>L02 · 我、你、他</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Tôi, bạn, anh ấy</p>\n<div class=\"lead\"><b>本课目标：</b>会用单复数人称代词指人，会用「谁」提问</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">我</td><td class=\"pyc\">wǒ</td><td class=\"hv\">ngã</td><td>tôi; mình; của tôi</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">你</td><td class=\"pyc\">nǐ</td><td class=\"hv\">nhĩ</td><td>bạn</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">他</td><td class=\"pyc\">tā</td><td class=\"hv\">tha</td><td>anh ấy；(văn học) khác</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">她</td><td class=\"pyc\">tā</td><td class=\"hv\">tha</td><td>cô ấy</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">我们</td><td class=\"pyc\">wǒ men</td><td class=\"hv\">ngã môn</td><td>chúng tôi</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">你们</td><td class=\"pyc\">nǐ men</td><td class=\"hv\">nhĩ môn</td><td>các bạn (số nhiều)</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">他们</td><td class=\"pyc\">tā men</td><td class=\"hv\">tha môn</td><td>họ; bọn họ</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">她们</td><td class=\"pyc\">tā men</td><td class=\"hv\">tha môn</td><td>họ; các cô ấy (nữ)</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">谁</td><td class=\"pyc\">shéi</td><td class=\"hv\">thùy</td><td>ai；cũng đọc là</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">别人</td><td class=\"pyc\">bié ren</td><td class=\"hv\">biệt nhân</td><td>người khác; những người khác</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">别的</td><td class=\"pyc\">bié de</td><td class=\"hv\">biệt đích</td><td>khác</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">人</td><td class=\"pyc\">rén</td><td class=\"hv\">nhân</td><td>người; mọi người</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 复数加「们」</p><p class=\"gfm\">我 → 我们　｜　你 → 你们　｜　他/她 → 他们/她们</p><p class=\"gnote\">「他们」可以指全男，也可以指男女都有；「她们」只指全是女性。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我们都是学生。</p><p class=\"py\">wǒ men dōu shì xué sheng。</p><p class=\"vi\">Chúng tôi đều là học sinh.</p></div><div class=\"gex\"><p class=\"zh\">她们是我的朋友。</p><p class=\"py\">tā men shì wǒ de péng you。</p><p class=\"vi\">Họ là bạn của tôi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「谁」提问人</p><p class=\"gfm\">主语 + 是谁？　｜　谁 + 是 + 名词？</p><p class=\"gnote\">疑问词放在要问的位置，句序不变。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他是谁？</p><p class=\"py\">tā shì shéi？</p><p class=\"vi\">Anh ấy là ai?</p></div><div class=\"gex\"><p class=\"zh\">谁是你朋友？</p><p class=\"py\">shéi shì nǐ péng you？</p><p class=\"vi\">Ai là bạn của bạn?</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我是学生。</p><p class=\"py\">wǒ shì xué sheng。</p><p class=\"vi\">Tôi là học sinh.</p></div><div class=\"sent\"><p class=\"zh\">他是我朋友。</p><p class=\"py\">tā shì wǒ péng you。</p><p class=\"vi\">Anh ấy là bạn của tôi.</p></div><div class=\"sent\"><p class=\"zh\">我们都是学生。</p><p class=\"py\">wǒ men dōu shì xué sheng。</p><p class=\"vi\">Chúng tôi đều là học sinh.</p></div><div class=\"sent\"><p class=\"zh\">你们是谁？</p><p class=\"py\">nǐ men shì shéi？</p><p class=\"vi\">Các bạn là ai?</p></div><div class=\"sent\"><p class=\"zh\">他们不认识我。</p><p class=\"py\">tā men bù rèn shi wǒ。</p><p class=\"vi\">Họ không biết tôi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他是谁？</p><p class=\"py\">tā shì shéi？</p><p class=\"vi\">Anh ấy là ai?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他是我朋友。</p><p class=\"py\">tā shì wǒ péng you。</p><p class=\"vi\">Anh ấy là bạn của tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">她呢？</p><p class=\"py\">tā ne？</p><p class=\"vi\">Còn cô ấy?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">她也是我朋友。</p><p class=\"py\">tā yě shì wǒ péng you。</p><p class=\"vi\">Cô ấy cũng là bạn của tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他们都是学生吗？</p><p class=\"py\">tā men dōu shì xué sheng ma？</p><p class=\"vi\">Họ đều là học sinh à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">是，他们都是学生。</p><p class=\"py\">shì， tā men dōu shì xué sheng。</p><p class=\"vi\">Vâng, họ đều là học sinh.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我也是学生。</p><p class=\"py\">wǒ yě shì xué sheng。</p><p class=\"vi\">Tôi cũng là học sinh.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我们都是学生。</p><p class=\"py\">hǎo， wǒ men dōu shì xué sheng。</p><p class=\"vi\">Tốt, chúng ta đều là học sinh.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>人称代词接龙：每人换一个「我/你/他/她/我们/你们/他们/她们」说一句话</li><li>「谁」提问练习：指人物图轮流问「他/她是谁？」</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「他们」和「她们」读音相同（tā men），只能靠上下文区分，书写不能混</li><li>「谁」口语读 shéi，书面读 shuí，两种都对；初学先记 shéi</li><li>「别人」= 其他人，是泛指，不能用来指某个具体的人</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文介绍三位家人或朋友，每人一句「这是我……」</li><li>在 App 上完成 L02 测验</li></ul>"},
    {title:"L03 数字 0 到 10", id:"l03", html:"<h1>L03 · 数字 0 到 10</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Số từ 0 đến 10</p>\n<div class=\"lead\"><b>本课目标：</b>会数 0–10，会报数量、年龄和人数</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">一</td><td class=\"pyc\">yī</td><td class=\"hv\">nhất</td><td>một；đơn</td><td class=\"hint\">数词 / 副词</td></tr><tr><td class=\"hz\">二</td><td class=\"pyc\">èr</td><td class=\"hv\">nhị</td><td>hai；2</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">三</td><td class=\"pyc\">sān</td><td class=\"hv\">tam</td><td>ba；3</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">四</td><td class=\"pyc\">sì</td><td class=\"hv\">tứ</td><td>bốn；4</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">五</td><td class=\"pyc\">wǔ</td><td class=\"hv\">ngũ</td><td>năm；5</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">六</td><td class=\"pyc\">liù</td><td class=\"hv\">lục</td><td>sáu；6</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">七</td><td class=\"pyc\">qī</td><td class=\"hv\">thất</td><td>bảy；7</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">八</td><td class=\"pyc\">bā</td><td class=\"hv\">bát</td><td>tám; 8</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">九</td><td class=\"pyc\">jiǔ</td><td class=\"hv\">cửu</td><td>chín；9</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">十</td><td class=\"pyc\">shí</td><td class=\"hv\">thập</td><td>mười；10</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">零</td><td class=\"pyc\">líng</td><td class=\"hv\">linh</td><td>không；số không</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">两</td><td class=\"pyc\">liǎng</td><td class=\"hv\">lưỡng</td><td>hai；cả hai</td><td class=\"hint\">数词 / 时间词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 数词直接修饰名词</p><p class=\"gfm\">数词 + 名词（人 / 岁）</p><p class=\"gnote\">「人」「岁」这类词可以不加量词，直接跟数词。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">三个人。</p><p class=\"py\">sān gè rén。</p><p class=\"vi\">Ba người.</p></div><div class=\"gex\"><p class=\"zh\">他八岁。</p><p class=\"py\">tā bā suì。</p><p class=\"vi\">Cậu ấy tám tuổi.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「二」和「两」分工</p><p class=\"gfm\">数数用「二」　｜　量词前用「两」</p><p class=\"gnote\">十二、二十、二十二 用「二」；两个、两天 用「两」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">十二个人。</p><p class=\"py\">shí èr gè rén。</p><p class=\"vi\">Mười hai người.</p></div><div class=\"gex\"><p class=\"zh\">我有两个朋友。</p><p class=\"py\">wǒ yǒu liǎng gè péng you。</p><p class=\"vi\">Tôi có hai người bạn.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">一、二、三、四、五、六、七、八、九、十。</p><p class=\"py\">yī、 èr、 sān、 sì、 wǔ、 liù、 qī、 bā、 jiǔ、 shí。</p><p class=\"vi\">Một, hai, ba, bốn, năm, sáu, bảy, tám, chín, mười.</p></div><div class=\"sent\"><p class=\"zh\">我有三个朋友。</p><p class=\"py\">wǒ yǒu sān gè péng you。</p><p class=\"vi\">Tôi có ba người bạn.</p></div><div class=\"sent\"><p class=\"zh\">他八岁。</p><p class=\"py\">tā bā suì。</p><p class=\"vi\">Cậu ấy tám tuổi.</p></div><div class=\"sent\"><p class=\"zh\">我们班有十二个人。</p><p class=\"py\">wǒ men bān yǒu shí èr gè rén。</p><p class=\"vi\">Lớp chúng tôi có mười hai người.</p></div><div class=\"sent\"><p class=\"zh\">这是零。</p><p class=\"py\">zhè shì líng。</p><p class=\"vi\">Đây là số không.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你有几个朋友？</p><p class=\"py\">nǐ yǒu jǐ gè péng you？</p><p class=\"vi\">Bạn có mấy người bạn?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我有五个朋友。</p><p class=\"py\">wǒ yǒu wǔ gè péng you。</p><p class=\"vi\">Tôi có năm người bạn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他们几岁？</p><p class=\"py\">tā men jǐ suì？</p><p class=\"vi\">Họ mấy tuổi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">一个八岁，四个九岁。</p><p class=\"py\">yī gè bā suì， sì gè jiǔ suì。</p><p class=\"vi\">Một người tám tuổi, bốn người chín tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你有几个哥哥？</p><p class=\"py\">nǐ yǒu jǐ gè gē ge？</p><p class=\"vi\">Bạn có mấy anh trai?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我有两个哥哥，一个妹妹。</p><p class=\"py\">wǒ yǒu liǎng gè gē ge， yī gè mèi mei。</p><p class=\"vi\">Tôi có hai anh trai, một em gái.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你家有几个人？</p><p class=\"py\">nǐ jiā yǒu jǐ gè rén？</p><p class=\"vi\">Nhà bạn có mấy người?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我家有五个人。</p><p class=\"py\">wǒ jiā yǒu wǔ gè rén。</p><p class=\"vi\">Nhà tôi có năm người.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>0–10 正序、倒序、跳数（1/3/5/7/9）快速朗读</li><li>听写练习：老师报数字，学员写下阿拉伯数字再读出来</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「二」不能直接接量词，要说「两个」不说「二个」</li><li>十 是 shí（卷舌），越南学员易读成 sí</li><li>一 本调读 yī，在第四声前会变调读 yí（如 一个 yí ge）；本课先记本调，变调规则后面单独讲</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>在 App 上完成 L03 十二个数字词的听读</li><li>用中文报出自己和两位家人的年龄</li></ul>"},
    {title:"L04 百、半与序数", id:"l04", html:"<h1>L04 · 百、半与序数</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Trăm, nửa và số thứ tự</p>\n<div class=\"lead\"><b>本课目标：</b>会说 100 以上的数、序数「第」，会用「几」提问小数量</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">百</td><td class=\"pyc\">bǎi</td><td class=\"hv\">bách</td><td>một trăm；nhiều</td><td class=\"hint\">数词 / 时间词</td></tr><tr><td class=\"hz\">半</td><td class=\"pyc\">bàn</td><td class=\"hv\">bán</td><td>một nửa；bán-</td><td class=\"hint\">数词</td></tr><tr><td class=\"hz\">第</td><td class=\"pyc\">dì</td><td class=\"hv\">đệ</td><td>(văn học) thứ hạng mà thí sinh đỗ；(cũ) nơi ở của quan chức cao cấp</td><td class=\"hint\">数词</td></tr><tr><td class=\"hz\">几</td><td class=\"pyc\">jǐ</td><td class=\"hv\">kỷ</td><td>bao nhiêu；mấy</td><td class=\"hint\">数词 / 副词</td></tr><tr><td class=\"hz\">一些</td><td class=\"pyc\">yī xiē</td><td class=\"hv\">nhất ta</td><td>một số；một vài</td><td class=\"hint\">数量词</td></tr><tr><td class=\"hz\">一半</td><td class=\"pyc\">yī bàn</td><td class=\"hv\">nhất bán</td><td>một nửa</td><td class=\"hint\">数词</td></tr><tr><td class=\"hz\">一点儿</td><td class=\"pyc\">yī diǎn r</td><td class=\"hv\">nhất điểm nhi</td><td>một chút；một ít</td><td class=\"hint\">数量词</td></tr><tr><td class=\"hz\">一下儿</td><td class=\"pyc\">yī xià r</td><td class=\"hv\">nhất hạ nhi</td><td>(dùng sau động từ) thử xem；làm (gì đó một chút để thử)</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">一会儿</td><td class=\"pyc\">yī huì r</td><td class=\"hv\">nhất hội nhi</td><td>một lúc；một thời gian</td><td class=\"hint\">数量词</td></tr><tr><td class=\"hz\">一块儿</td><td class=\"pyc\">yī kuài r</td><td class=\"hv\">nhất khối nhi</td><td>một khối；một miếng</td><td class=\"hint\">副词 / 处所词</td></tr><tr><td class=\"hz\">等</td><td class=\"pyc\">děng</td><td class=\"hv\">đẳng</td><td>đợi; chờ đợi；đến lúc; khi; tới</td><td class=\"hint\">动词 / 助词</td></tr><tr><td class=\"hz\">号</td><td class=\"pyc\">hào</td><td class=\"hv\">hiệu</td><td>số thứ tự；ngày trong tháng</td><td class=\"hint\">量词 / 名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「第」+ 数词 = 序数</p><p class=\"gfm\">第 + 数词</p><p class=\"gnote\">加「第」就把基数变序数：三 → 第三。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这是第一百。</p><p class=\"py\">zhè shì dì yī bǎi。</p><p class=\"vi\">Đây là cái thứ một trăm.</p></div><div class=\"gex\"><p class=\"zh\">他是第三个人。</p><p class=\"py\">tā shì dì sān gè rén。</p><p class=\"vi\">Anh ấy là người thứ ba.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「几」提问小数量</p><p class=\"gfm\">几 + 量词 + 名词？</p><p class=\"gnote\">「几」预期答案在十以内；问大数量要用「多少」（L10 讲）。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你有几个本子？</p><p class=\"py\">nǐ yǒu jǐ gè běn zi？</p><p class=\"vi\">Bạn có mấy quyển vở?</p></div><div class=\"gex\"><p class=\"zh\">现在几点？</p><p class=\"py\">xiàn zài jǐ diǎn？</p><p class=\"vi\">Bây giờ là mấy giờ?</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我们班有二十个学生。</p><p class=\"py\">wǒ men bān yǒu èr shí gè xué sheng。</p><p class=\"vi\">Lớp chúng tôi có hai mươi học sinh.</p></div><div class=\"sent\"><p class=\"zh\">这是第一百。</p><p class=\"py\">zhè shì dì yī bǎi。</p><p class=\"vi\">Đây là cái thứ một trăm.</p></div><div class=\"sent\"><p class=\"zh\">你等一会儿。</p><p class=\"py\">nǐ děng yī huìr。</p><p class=\"vi\">Bạn đợi một lát.</p></div><div class=\"sent\"><p class=\"zh\">我们一块儿去。</p><p class=\"py\">wǒ men yī kuàir qù。</p><p class=\"vi\">Chúng ta cùng đi.</p></div><div class=\"sent\"><p class=\"zh\">我一点儿也不累。</p><p class=\"py\">wǒ yī diǎnr yě bù lèi。</p><p class=\"vi\">Tôi không mệt chút nào.</p></div><div class=\"sent\"><p class=\"zh\">他有一半的时间。</p><p class=\"py\">tā yǒu yī bàn de shí jiān。</p><p class=\"vi\">Anh ấy có một nửa thời gian.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">请问，这是几号？</p><p class=\"py\">qǐng wèn， zhè shì jǐ hào？</p><p class=\"vi\">Xin hỏi, đây là ngày mấy?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这是三号。</p><p class=\"py\">zhè shì sān hào。</p><p class=\"vi\">Đây là ngày mùng ba.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你等一会儿，我一下儿就来。</p><p class=\"py\">nǐ děng yī huìr， wǒ yī xiàr jiù lái。</p><p class=\"vi\">Bạn đợi một lát, tôi đến ngay.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我等你。</p><p class=\"py\">hǎo， wǒ děng nǐ。</p><p class=\"vi\">Được, tôi đợi bạn.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们一块儿去，好不好？</p><p class=\"py\">wǒ men yī kuàir qù， hǎo bù hǎo？</p><p class=\"vi\">Chúng ta cùng đi, được không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，我一点儿也不忙。</p><p class=\"py\">hǎo， wǒ yī diǎnr yě bù máng。</p><p class=\"vi\">Được, tôi không bận chút nào.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">一会儿见！</p><p class=\"py\">yī huìr jiàn！</p><p class=\"vi\">Hẹn gặp lại một lát nữa!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">一会儿见！</p><p class=\"py\">yī huìr jiàn！</p><p class=\"vi\">Hẹn gặp lại một lát nữa!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「第」序数接龙：第一到第十，轮流报数</li><li>数数 1–100，逢十进位，重点练 21、22 的「二十一、二十二」</li><li>儿化音专练：一点儿 / 一下儿 / 一会儿 / 一块儿</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「二」与「两」分工：数数用二，量词前用两</li><li>「几」的答案一般在十以内；问大数量要用「多少」</li><li>儿化音的「儿」不单独成音节，要卷舌粘在上一音节：一点儿 yī diǎnr</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>从 1 数到 100，录音发给助教</li><li>用「第」说出自己在本周课程中的排序</li></ul>"},
    {title:"L05 量词", id:"l05", html:"<h1>L05 · 量词</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Lượng từ</p>\n<div class=\"lead\"><b>本课目标：</b>会用量词搭配名词，会报时间（点/分）和价格（元/块）</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">个</td><td class=\"pyc\">gè</td><td class=\"hv\">cá</td><td>(dạng kết hợp) cá nhân</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">本</td><td class=\"pyc\">běn</td><td class=\"hv\">bổn</td><td>quyển (lượng từ cho sách)；vốn; gốc</td><td class=\"hint\">代词 / 量词</td></tr><tr><td class=\"hz\">块</td><td class=\"pyc\">kuài</td><td class=\"hv\">khối</td><td>cục; tảng; miếng；lượng từ cho miếng vải</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">次</td><td class=\"pyc\">cì</td><td class=\"hv\">thứ</td><td>tiếp theo；thứ hai</td><td class=\"hint\">量词 / 形容词</td></tr><tr><td class=\"hz\">岁</td><td class=\"pyc\">suì</td><td class=\"hv\">tuế</td><td>tuổi；lượng từ cho năm (tuổi)</td><td class=\"hint\">量词</td></tr><tr><td class=\"hz\">间</td><td class=\"pyc\">jiān</td><td class=\"hv\">gian</td><td>giữa；trong số</td><td class=\"hint\">量词 / 方位词</td></tr><tr><td class=\"hz\">口</td><td class=\"pyc\">kǒu</td><td class=\"hv\">khẩu</td><td>miệng；lượng từ cho những thứ có miệng</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">点</td><td class=\"pyc\">diǎn</td><td class=\"hv\">điểm</td><td>điểm；chấm</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">分</td><td class=\"pyc\">fēn</td><td class=\"hv\">phân</td><td>chia; tách；phân phối; phân bổ</td><td class=\"hint\">时间词 / 量词</td></tr><tr><td class=\"hz\">元</td><td class=\"pyc\">yuán</td><td class=\"hv\">nguyên</td><td>đơn vị tiền tệ；(hình vị liên kết) đầu tiên</td><td class=\"hint\">量词 / 时间语素</td></tr><tr><td class=\"hz\">页</td><td class=\"pyc\">yè</td><td class=\"hv\">hiệt</td><td>trang；lá</td><td class=\"hint\">量词 / 语素</td></tr><tr><td class=\"hz\">包</td><td class=\"pyc\">bāo</td><td class=\"hv\">bao</td><td>che phủ；gói</td><td class=\"hint\">动词 / 名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 数词 + 量词 + 名词</p><p class=\"gfm\">数词 + 量词 + 名词</p><p class=\"gnote\">中文名词计数必须带量词，不能直接说「三书」，要说「三本书」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我有一个本子。</p><p class=\"py\">wǒ yǒu yī gè běn zi。</p><p class=\"vi\">Tôi có một quyển vở.</p></div><div class=\"gex\"><p class=\"zh\">这本书一百页。</p><p class=\"py\">zhè běn shū yī bǎi yè。</p><p class=\"vi\">Cuốn sách này một trăm trang.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 报时间与报钱</p><p class=\"gfm\">几点几分　｜　多少元 / 多少块</p><p class=\"gnote\">时间说「七点十分」，不加「分钟」；价格「元」是书面，「块」是口语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">现在七点十分。</p><p class=\"py\">xiàn zài qī diǎn shí fēn。</p><p class=\"vi\">Bây giờ là bảy giờ mười phút.</p></div><div class=\"gex\"><p class=\"zh\">这包东西十块钱。</p><p class=\"py\">zhè bāo dōng xi shí kuài qián。</p><p class=\"vi\">Gói đồ này mười tệ.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我有一个本子。</p><p class=\"py\">wǒ yǒu yī gè běn zi。</p><p class=\"vi\">Tôi có một quyển vở.</p></div><div class=\"sent\"><p class=\"zh\">这包东西十块钱。</p><p class=\"py\">zhè bāo dōng xi shí kuài qián。</p><p class=\"vi\">Gói đồ này mười tệ.</p></div><div class=\"sent\"><p class=\"zh\">现在七点十分。</p><p class=\"py\">xiàn zài qī diǎn shí fēn。</p><p class=\"vi\">Bây giờ là bảy giờ mười phút.</p></div><div class=\"sent\"><p class=\"zh\">我家有五口人。</p><p class=\"py\">wǒ jiā yǒu wǔ kǒu rén。</p><p class=\"vi\">Nhà tôi có năm người.</p></div><div class=\"sent\"><p class=\"zh\">这本书一百页。</p><p class=\"py\">zhè běn shū yī bǎi yè。</p><p class=\"vi\">Cuốn sách này một trăm trang.</p></div><div class=\"sent\"><p class=\"zh\">我去过三次。</p><p class=\"py\">wǒ qù guò sān cì。</p><p class=\"vi\">Tôi đã đi ba lần.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">现在几点？</p><p class=\"py\">xiàn zài jǐ diǎn？</p><p class=\"vi\">Bây giờ là mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">七点十分。</p><p class=\"py\">qī diǎn shí fēn。</p><p class=\"vi\">Bảy giờ mười phút.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这本书多少钱？</p><p class=\"py\">zhè běn shū duō shǎo qián？</p><p class=\"vi\">Cuốn sách này bao nhiêu tiền?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">十块钱。</p><p class=\"py\">shí kuài qián。</p><p class=\"vi\">Mười tệ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我要两本。</p><p class=\"py\">wǒ yào liǎng běn。</p><p class=\"vi\">Tôi muốn hai quyển.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，二十块。</p><p class=\"py\">hǎo， èr shí kuài。</p><p class=\"vi\">Được, hai mươi tệ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">谢谢，给你钱。</p><p class=\"py\">xiè xie， gěi nǐ qián。</p><p class=\"vi\">Cảm ơn, gửi bạn tiền.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">找你十块。</p><p class=\"py\">zhǎo nǐ shí kuài。</p><p class=\"vi\">Trả lại bạn mười tệ.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>量词配对卡：个 / 本 / 块 / 次 / 岁 / 间 / 口 / 点 / 分 / 元 / 页 / 包 + 名词</li><li>报时练习：看钟面说「几点几分」</li><li>价格听写：老师报价，学员写数字</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「个」是最通用的量词，不确定时用「个」不会大错</li><li>时间只说「七点十分」，不说「七点十分钟」</li><li>「元」和「块」都指人民币单位，「块」是口语说法</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文报出今天的三个时间点</li><li>在 App 上完成 L05 量词测验</li></ul>"},
    {title:"L06 爸爸和妈妈", id:"l06", html:"<h1>L06 · 爸爸和妈妈</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Bố và mẹ</p>\n<div class=\"lead\"><b>本课目标：</b>会用叠音称呼家人，会介绍家庭构成</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">爸</td><td class=\"pyc\">bà</td><td class=\"hv\">bà</td><td>cha；ba</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">爸爸</td><td class=\"pyc\">bà ba</td><td class=\"hv\">bà bà</td><td>(thông tục) cha; ba</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">妈</td><td class=\"pyc\">mā</td><td class=\"hv\">ma</td><td>mẹ；má</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">妈妈</td><td class=\"pyc\">mā ma</td><td class=\"hv\">ma ma</td><td>mẹ；má</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">哥</td><td class=\"pyc\">gē</td><td class=\"hv\">ca</td><td>anh trai</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">哥哥</td><td class=\"pyc\">gē ge</td><td class=\"hv\">ca ca</td><td>anh trai</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">姐</td><td class=\"pyc\">jiě</td><td class=\"hv\">tỉ</td><td>chị gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">姐姐</td><td class=\"pyc\">jiě jie</td><td class=\"hv\">tỉ tỉ</td><td>chị gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">妹</td><td class=\"pyc\">mèi</td><td class=\"hv\">muội</td><td>em gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">妹妹</td><td class=\"pyc\">mèi mei</td><td class=\"hv\">muội muội</td><td>em gái；phụ nữ trẻ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">弟</td><td class=\"pyc\">dì</td><td class=\"hv\">đệ</td><td>em trai；nam nhỏ tuổi hơn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">弟弟</td><td class=\"pyc\">dì di</td><td class=\"hv\">đệ đệ</td><td>em trai</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 单音节 + 重叠 = 称呼</p><p class=\"gfm\">爸 → 爸爸　｜　哥 → 哥哥　｜　妹 → 妹妹</p><p class=\"gnote\">重叠式更口语、更亲昵，第二音节读轻声。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这是我爸爸。</p><p class=\"py\">zhè shì wǒ bà ba。</p><p class=\"vi\">Đây là bố tôi.</p></div><div class=\"gex\"><p class=\"zh\">我有一个妹妹。</p><p class=\"py\">wǒ yǒu yī gè mèi mei。</p><p class=\"vi\">Tôi có một em gái.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 介绍家庭构成</p><p class=\"gfm\">我 + 有 + 数词 + 量词 + 家人</p><p class=\"gnote\">问家庭人数用「几口人」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我有两个哥哥。</p><p class=\"py\">wǒ yǒu liǎng gè gē ge。</p><p class=\"vi\">Tôi có hai anh trai.</p></div><div class=\"gex\"><p class=\"zh\">我家有五口人。</p><p class=\"py\">wǒ jiā yǒu wǔ kǒu rén。</p><p class=\"vi\">Nhà tôi có năm người.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我爸爸，这是我妈妈。</p><p class=\"py\">zhè shì wǒ bà ba， zhè shì wǒ mā ma。</p><p class=\"vi\">Đây là bố tôi, đây là mẹ tôi.</p></div><div class=\"sent\"><p class=\"zh\">我有一个哥哥，两个妹妹。</p><p class=\"py\">wǒ yǒu yī gè gē ge， liǎng gè mèi mei。</p><p class=\"vi\">Tôi có một anh trai, hai em gái.</p></div><div class=\"sent\"><p class=\"zh\">我姐姐是学生。</p><p class=\"py\">wǒ jiě jie shì xué sheng。</p><p class=\"vi\">Chị tôi là học sinh.</p></div><div class=\"sent\"><p class=\"zh\">我们家有五口人。</p><p class=\"py\">wǒ men jiā yǒu wǔ kǒu rén。</p><p class=\"vi\">Nhà chúng tôi có năm người.</p></div><div class=\"sent\"><p class=\"zh\">弟弟八岁。</p><p class=\"py\">dì di bā suì。</p><p class=\"vi\">Em trai tôi tám tuổi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你家有几口人？</p><p class=\"py\">nǐ jiā yǒu jǐ kǒu rén？</p><p class=\"vi\">Nhà bạn có mấy người?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">五口人。爸爸、妈妈、哥哥、妹妹和我。</p><p class=\"py\">wǔ kǒu rén。 bà ba、 mā ma、 gē ge、 mèi mei hé wǒ。</p><p class=\"vi\">Năm người. Bố, mẹ, anh trai, em gái và tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你有姐姐吗？</p><p class=\"py\">nǐ yǒu jiě jie ma？</p><p class=\"vi\">Bạn có chị gái không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">没有。我有一个妹妹。</p><p class=\"py\">méi yǒu。 wǒ yǒu yī gè mèi mei。</p><p class=\"vi\">Không có. Tôi có một em gái.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">妹妹几岁？</p><p class=\"py\">mèi mei jǐ suì？</p><p class=\"vi\">Em gái bạn mấy tuổi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">她八岁。我哥哥二十岁。</p><p class=\"py\">tā bā suì。 wǒ gē ge èr shí suì。</p><p class=\"vi\">Em ấy tám tuổi. Anh tôi hai mươi tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你们家真好！</p><p class=\"py\">nǐ men jiā zhēn hǎo！</p><p class=\"vi\">Gia đình bạn thật tốt!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">谢谢！</p><p class=\"py\">xiè xie！</p><p class=\"vi\">Cảm ơn!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>家人称呼卡快速认读，强调重叠式第二音节读轻声（爸爸 bà ba）</li><li>带家庭照片用中文介绍三个人</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>重叠式的第二音节读轻声：爸爸 bà ba，不是 bà bà</li><li>问家庭人数用「几口人」；问班级人数用「几个人」</li><li>「姐姐」和「妹妹」都指女性，姐姐年长、妹妹年幼</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>画一张家庭树，用中文标注每个称呼</li><li>对家人用中文称呼一次</li></ul>"},
    {title:"L07 孩子与长辈", id:"l07", html:"<h1>L07 · 孩子与长辈</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Con cái và người lớn tuổi</p>\n<div class=\"lead\"><b>本课目标：</b>会称呼长辈与孩子，会介绍家人</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">儿子</td><td class=\"pyc\">ér zi</td><td class=\"hv\">nhi tử</td><td>con trai</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">女儿</td><td class=\"pyc\">nǚ ér</td><td class=\"hv\">nữ nhi</td><td>con gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">孩子</td><td class=\"pyc\">hái zi</td><td class=\"hv\">hài tử</td><td>trẻ em</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">家人</td><td class=\"pyc\">jiā rén</td><td class=\"hv\">gia nhân</td><td>thành viên gia đình；(cũ) người hầu</td><td class=\"hint\">名词 / 人名</td></tr><tr><td class=\"hz\">爷爷</td><td class=\"pyc\">yé ye</td><td class=\"hv\">gia gia</td><td>(thân mật) ông nội；ông bên nội</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">奶奶</td><td class=\"pyc\">nǎi nai</td><td class=\"hv\">nãi nãi</td><td>(thân mật) bà (bà nội)；(kính trọng) bà chủ nhà</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">老人</td><td class=\"pyc\">lǎo rén</td><td class=\"hv\">lão nhân</td><td>ông già hoặc bà già；người cao tuổi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">先生</td><td class=\"pyc\">xiān sheng</td><td class=\"hv\">tiên sinh</td><td>giáo viên；quý ông; ngài; ông (Mr.)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小姐</td><td class=\"pyc\">xiǎo jie</td><td class=\"hv\">tiểu tỉ</td><td>cô gái；cô</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">朋友</td><td class=\"pyc\">péng you</td><td class=\"hv\">bằng hữu</td><td>bạn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小朋友</td><td class=\"pyc\">xiǎo péng yǒu</td><td class=\"hv\">tiểu bằng hữu</td><td>trẻ em</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小孩儿</td><td class=\"pyc\">xiǎo hái r</td><td class=\"hv\">tiểu hài nhi</td><td>đứa trẻ</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 指人名词 + 们 = 复数</p><p class=\"gfm\">朋友 → 朋友们</p><p class=\"gnote\">「家人」本身是集体名词，通常不加「们」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">朋友们，你们好！</p><p class=\"py\">péng you men， nǐ men hǎo！</p><p class=\"vi\">Các bạn, xin chào!</p></div><div class=\"gex\"><p class=\"zh\">我家人都在家。</p><p class=\"py\">wǒ jiā rén dōu zài jiā。</p><p class=\"vi\">Gia đình tôi đều ở nhà.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「先生 / 小姐」称呼陌生人</p><p class=\"gfm\">先生 / 小姐 + 姓（可省略）</p><p class=\"gnote\">「先生」也可以指丈夫（我先生），要看上下文。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">先生，请问……</p><p class=\"py\">xiān sheng， qǐng wèn……</p><p class=\"vi\">Thưa ông, xin hỏi……</p></div><div class=\"gex\"><p class=\"zh\">我先生是医生。</p><p class=\"py\">wǒ xiān sheng shì yī shēng。</p><p class=\"vi\">Chồng tôi là bác sĩ.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我儿子，那是我女儿。</p><p class=\"py\">zhè shì wǒ ér zi， nà shì wǒ nǚ ér。</p><p class=\"vi\">Đây là con trai tôi, kia là con gái tôi.</p></div><div class=\"sent\"><p class=\"zh\">我爷爷和奶奶都很好。</p><p class=\"py\">wǒ yé ye hé nǎi nai dōu hěn hǎo。</p><p class=\"vi\">Ông và bà tôi đều khỏe.</p></div><div class=\"sent\"><p class=\"zh\">他是我朋友。</p><p class=\"py\">tā shì wǒ péng you。</p><p class=\"vi\">Anh ấy là bạn tôi.</p></div><div class=\"sent\"><p class=\"zh\">这个小孩儿很好。</p><p class=\"py\">zhè ge xiǎo háir hěn hǎo。</p><p class=\"vi\">Đứa trẻ này rất ngoan.</p></div><div class=\"sent\"><p class=\"zh\">那个老人是我奶奶。</p><p class=\"py\">nà ge lǎo rén shì wǒ nǎi nai。</p><p class=\"vi\">Người già kia là bà tôi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这是你儿子吗？</p><p class=\"py\">zhè shì nǐ ér zi ma？</p><p class=\"vi\">Đây là con trai bạn à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">是，他五岁。</p><p class=\"py\">shì， tā wǔ suì。</p><p class=\"vi\">Vâng, cháu năm tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你有女儿吗？</p><p class=\"py\">nǐ yǒu nǚ ér ma？</p><p class=\"vi\">Bạn có con gái không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">有，我女儿八岁。</p><p class=\"py\">yǒu， wǒ nǚ ér bā suì。</p><p class=\"vi\">Có, con gái tôi tám tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你家人多吗？</p><p class=\"py\">nǐ jiā rén duō ma？</p><p class=\"vi\">Gia đình bạn đông không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不多。我、我先生和两个孩子。</p><p class=\"py\">bù duō。 wǒ、 wǒ xiān sheng hé liǎng gè hái zi。</p><p class=\"vi\">Không đông. Tôi, chồng tôi và hai đứa con.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你爷爷、奶奶呢？</p><p class=\"py\">nǐ yé ye、 nǎi nai ne？</p><p class=\"vi\">Ông bà bạn thì sao?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他们在家。</p><p class=\"py\">tā men zài jiā。</p><p class=\"vi\">Họ ở nhà.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>称呼卡：爷爷 / 奶奶 / 先生 / 小姐 / 儿子 / 女儿 / 朋友 / 小朋友</li><li>用「这是我……，那是……」连续介绍三个人</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「小孩儿」和「小朋友」都指儿童，小朋友更亲切</li><li>「先生」可指丈夫，也可指称呼陌生男性，看上下文</li><li>「家人」是集体名词，一般不加「们」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文介绍自己的长辈各一位</li><li>在 App 上完成 L07 测验</li></ul>"},
    {title:"L08 男人和女人", id:"l08", html:"<h1>L08 · 男人和女人</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Nam và nữ</p>\n<div class=\"lead\"><b>本课目标：</b>会区分性别称谓，会介绍关系与姓名</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">女</td><td class=\"pyc\">nǚ</td><td class=\"hv\">nữ</td><td>nữ；phụ nữ</td><td class=\"hint\">区别词 / 语素</td></tr><tr><td class=\"hz\">男</td><td class=\"pyc\">nán</td><td class=\"hv\">nam</td><td>nam；Nam tước</td><td class=\"hint\">区别词 / 语素</td></tr><tr><td class=\"hz\">女人</td><td class=\"pyc\">nǚ rén</td><td class=\"hv\">nữ nhân</td><td>phụ nữ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">男人</td><td class=\"pyc\">nán rén</td><td class=\"hv\">nam nhân</td><td>một người đàn ông；một nam giới</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">女生</td><td class=\"pyc\">nǚ shēng</td><td class=\"hv\">nữ sinh</td><td>nữ sinh；học sinh nữ</td><td class=\"hint\">名词 / 人名</td></tr><tr><td class=\"hz\">男生</td><td class=\"pyc\">nán shēng</td><td class=\"hv\">nam sinh</td><td>nam sinh；học sinh nam</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">女孩儿</td><td class=\"pyc\">nǚ hái r</td><td class=\"hv\">nữ hài nhi</td><td>cô gái; cô bé</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">男孩儿</td><td class=\"pyc\">nán hái r</td><td class=\"hv\">nam hài nhi</td><td>cậu bé</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">男朋友</td><td class=\"pyc\">nán péng you</td><td class=\"hv\">nam bằng hữu</td><td>bạn trai</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">女朋友</td><td class=\"pyc\">nǚ péng you</td><td class=\"hv\">nữ bằng hữu</td><td>bạn gái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">名字</td><td class=\"pyc\">míng zi</td><td class=\"hv\">danh tự</td><td>tên (của người hoặc vật)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">网友</td><td class=\"pyc\">wǎng yǒu</td><td class=\"hv\">võng hữu</td><td>bạn online；người dùng Internet</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「男 / 女」作定语</p><p class=\"gfm\">男/女 + 名词</p><p class=\"gnote\">男 / 女 直接放在名词前，不加「的」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他是男生。</p><p class=\"py\">tā shì nán shēng。</p><p class=\"vi\">Cậu ấy là nam.</p></div><div class=\"gex\"><p class=\"zh\">她是女生。</p><p class=\"py\">tā shì nǚ shēng。</p><p class=\"vi\">Cô ấy là nữ.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 问姓名</p><p class=\"gfm\">你叫什么名字？</p><p class=\"gnote\">回答直接说「我叫 + 名字」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你叫什么名字？</p><p class=\"py\">nǐ jiào shén me míng zi？</p><p class=\"vi\">Bạn tên là gì?</p></div><div class=\"gex\"><p class=\"zh\">我名字在这儿。</p><p class=\"py\">wǒ míng zi zài zhèr。</p><p class=\"vi\">Tên tôi ở đây.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">你叫什么名字？</p><p class=\"py\">nǐ jiào shén me míng zi？</p><p class=\"vi\">Bạn tên là gì?</p></div><div class=\"sent\"><p class=\"zh\">他是我男朋友。</p><p class=\"py\">tā shì wǒ nán péng you。</p><p class=\"vi\">Anh ấy là bạn trai tôi.</p></div><div class=\"sent\"><p class=\"zh\">她是我的女朋友。</p><p class=\"py\">tā shì wǒ de nǚ péng you。</p><p class=\"vi\">Cô ấy là bạn gái tôi.</p></div><div class=\"sent\"><p class=\"zh\">我们班有十个男生，八个女生。</p><p class=\"py\">wǒ men bān yǒu shí gè nán shēng， bā gè nǚ shēng。</p><p class=\"vi\">Lớp chúng tôi có mười nam, tám nữ.</p></div><div class=\"sent\"><p class=\"zh\">那个女孩儿是我妹妹。</p><p class=\"py\">nà ge nǚ háir shì wǒ mèi mei。</p><p class=\"vi\">Cô bé kia là em gái tôi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个人是谁？</p><p class=\"py\">nà ge rén shì shéi？</p><p class=\"vi\">Người kia là ai?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他是我朋友，是男生。</p><p class=\"py\">tā shì wǒ péng you， shì nán shēng。</p><p class=\"vi\">Anh ấy là bạn tôi, là nam.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个女孩儿呢？</p><p class=\"py\">nà ge nǚ háir ne？</p><p class=\"vi\">Còn cô bé kia?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">她是我女朋友。我们都是学生。</p><p class=\"py\">tā shì wǒ nǚ péng you。 wǒ men dōu shì xué sheng。</p><p class=\"vi\">Cô ấy là bạn gái tôi. Chúng tôi đều là học sinh.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你们班男生多还是女生多？</p><p class=\"py\">nǐ men bān nán shēng duō hái shi nǚ shēng duō？</p><p class=\"vi\">Lớp bạn nam nhiều hay nữ nhiều?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">女生多。有十个女生，八个男生。</p><p class=\"py\">nǚ shēng duō。 yǒu shí gè nǚ shēng， bā gè nán shēng。</p><p class=\"vi\">Nữ nhiều hơn. Có mười nữ, tám nam.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「男/女」+ 名词 组合练习：男人 / 女人 / 男生 / 女生 / 男孩儿 / 女孩儿 / 男朋友 / 女朋友</li><li>听句子选性别：老师说句子，学员举「他」或「她」的卡</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「男朋友 / 女朋友」在中文里指恋爱对象，不只是「男性朋友」</li><li>汉字「他 / 她」读音相同，写作时必须区分</li><li>「网友」= 网上的朋友，不是所有上网的人</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出自己班里男生、女生的人数</li><li>在 App 上完成 L08 测验</li></ul>"},
    {title:"L09 这个、那个", id:"l09", html:"<h1>L09 · 这个、那个</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Cái này, cái kia</p>\n<div class=\"lead\"><b>本课目标：</b>会用指示代词指认远近，会问地点</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">这</td><td class=\"pyc\">zhè</td><td class=\"hv\">giá</td><td>(đại từ) này; những...này；(hình thức kết hợp) này</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">那</td><td class=\"pyc\">nà</td><td class=\"hv\">na</td><td>(chỉ định) đó；(đại từ) đó</td><td class=\"hint\">代词 / 连词</td></tr><tr><td class=\"hz\">这些</td><td class=\"pyc\">zhè xiē</td><td class=\"hv\">giá ta</td><td>những... này</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">那些</td><td class=\"pyc\">nà xiē</td><td class=\"hv\">na ta</td><td>những cái đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">这里</td><td class=\"pyc\">zhè lǐ</td><td class=\"hv\">giá lý</td><td>ở đây</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">那里</td><td class=\"pyc\">nà li</td><td class=\"hv\">na lý</td><td>ở đó; nơi đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">这儿</td><td class=\"pyc\">zhè r</td><td class=\"hv\">giá nhi</td><td>ở đây</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">那儿</td><td class=\"pyc\">nà r</td><td class=\"hv\">na nhi</td><td>ở đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">这边</td><td class=\"pyc\">zhè biān</td><td class=\"hv\">giá biên</td><td>bên này；ở đây</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">那边</td><td class=\"pyc\">nà bian</td><td class=\"hv\">na biên</td><td>đằng kia；ở đằng đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">哪</td><td class=\"pyc\">nǎ</td><td class=\"hv\">ná</td><td>như thế nào；cái nào</td><td class=\"hint\">代词 / 语气词</td></tr><tr><td class=\"hz\">哪里</td><td class=\"pyc\">nǎ lǐ</td><td class=\"hv\">ná lý</td><td>ở đâu?；một nơi nào đó</td><td class=\"hint\">代词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「这 / 那」+ 量词 + 名词</p><p class=\"gfm\">这 + 量词 + 名词（近）　｜　那 + 量词 + 名词（远）</p><p class=\"gnote\">指示代词不能直接修饰名词，必须带量词：不说「这书」，要说「这本书」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个人是我朋友。</p><p class=\"py\">zhè ge rén shì wǒ péng you。</p><p class=\"vi\">Người này là bạn tôi.</p></div><div class=\"gex\"><p class=\"zh\">那本书是他的。</p><p class=\"py\">nà běn shū shì tā de。</p><p class=\"vi\">Cuốn sách kia là của anh ấy.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 这里 / 那里 / 哪里</p><p class=\"gfm\">这儿（近）／ 那儿（远）／ 哪儿（疑问）</p><p class=\"gnote\">「这儿 / 那儿 / 哪儿」是口语，「这里 / 那里 / 哪里」是书面，意思相同。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在这里。</p><p class=\"py\">tā zài zhè lǐ。</p><p class=\"vi\">Anh ấy ở đây.</p></div><div class=\"gex\"><p class=\"zh\">你住在哪里？</p><p class=\"py\">nǐ zhù zài nǎ lǐ？</p><p class=\"vi\">Bạn sống ở đâu?</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是我的书，那是你的书。</p><p class=\"py\">zhè shì wǒ de shū， nà shì nǐ de shū。</p><p class=\"vi\">Đây là sách của tôi, kia là sách của bạn.</p></div><div class=\"sent\"><p class=\"zh\">这些是我的朋友，那些是他的朋友。</p><p class=\"py\">zhè xiē shì wǒ de péng you， nà xiē shì tā de péng you。</p><p class=\"vi\">Đây là bạn của tôi, kia là bạn của anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">你住在哪里？</p><p class=\"py\">nǐ zhù zài nǎ lǐ？</p><p class=\"vi\">Bạn sống ở đâu?</p></div><div class=\"sent\"><p class=\"zh\">他在这里。</p><p class=\"py\">tā zài zhè lǐ。</p><p class=\"vi\">Anh ấy ở đây.</p></div><div class=\"sent\"><p class=\"zh\">那是哪儿？</p><p class=\"py\">nà shì nǎr？</p><p class=\"vi\">Kia là đâu?</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这是哪儿？</p><p class=\"py\">zhè shì nǎr？</p><p class=\"vi\">Đây là đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这里是我的学校。</p><p class=\"py\">zhè lǐ shì wǒ de xué xiào。</p><p class=\"vi\">Đây là trường của tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那些是什么？</p><p class=\"py\">nà xiē shì shén me？</p><p class=\"vi\">Những cái kia là gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">那些是教学楼。</p><p class=\"py\">nà xiē shì jiào xué lóu。</p><p class=\"vi\">Kia là các tòa nhà giảng đường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你的班在哪儿？</p><p class=\"py\">nǐ de bān zài nǎr？</p><p class=\"vi\">Lớp bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">在那边，三楼。</p><p class=\"py\">zài nà bian， sān lóu。</p><p class=\"vi\">Ở đằng kia, tầng ba.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，谢谢！</p><p class=\"py\">hǎo， xiè xie！</p><p class=\"vi\">Được, cảm ơn!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不客气。</p><p class=\"py\">bù kè qi。</p><p class=\"vi\">Đừng khách sáo.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>手指练习：指着近处说「这是……」，指着远处说「那是……」</li><li>儿化音对比：这儿 zhèr / 那儿 nàr / 哪儿 nǎr</li><li>「这 / 那」+ 量词 快速替换</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「哪」和「那」只差一个「口」字旁，读音不同：nǎ / nà</li><li>「这儿」和「这里」意思相同，口语多用「这儿」</li><li>指示代词后面必须接量词才能修饰名词</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「这 / 那」各说三句，介绍身边的东西</li><li>在 App 上完成 L09 测验</li></ul>"},
    {title:"L10 提问", id:"l10", html:"<h1>L10 · 提问</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Đặt câu hỏi</p>\n<div class=\"lead\"><b>本课目标：</b>会用疑问词提问，会用「还是」做选择问</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">什么</td><td class=\"pyc\">shén me</td><td class=\"hv\">thập ma</td><td>gì?；điều gì đó; bất kỳ điều gì</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">怎么</td><td class=\"pyc\">zěn me</td><td class=\"hv\">chẩm ma</td><td>như thế nào?；cái gì?</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">多少</td><td class=\"pyc\">duō shǎo</td><td class=\"hv\">đa thiểu</td><td>số lượng; mức độ；phần nào</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">哪儿</td><td class=\"pyc\">nǎ r</td><td class=\"hv\">ná nhi</td><td>ở đâu?；bất cứ đâu; nơi nào đó</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">哪些</td><td class=\"pyc\">nǎ xiē</td><td class=\"hv\">ná ta</td><td>những cái nào?；ai?</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">是不是</td><td class=\"pyc\">shì bù shì</td><td class=\"hv\">thị bất thị</td><td>có phải hay không；phải hoặc không</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">干什么</td><td class=\"pyc\">gàn shén me</td><td class=\"hv\">can thập ma</td><td>bạn đang làm gì?；anh ấy đang định làm gì?</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">有的</td><td class=\"pyc\">yǒu de</td><td class=\"hv\">hữu đích</td><td>(có) một số (người...)；một số (tồn tại)</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">有些</td><td class=\"pyc\">yǒu xiē</td><td class=\"hv\">hữu ta</td><td>một số；hơi</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">有一些</td><td class=\"pyc\">yǒu yī xiē</td><td class=\"hv\">hữu nhất ta</td><td>một chút；khá</td><td class=\"hint\">动词短语</td></tr><tr><td class=\"hz\">话</td><td class=\"pyc\">huà</td><td class=\"hv\">thoại</td><td>phương ngữ；ngôn ngữ</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">还是</td><td class=\"pyc\">hái shi</td><td class=\"hv\">hoàn thị</td><td>vẫn (như trước)；nên (tốt hơn)</td><td class=\"hint\">连词 / 副词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 疑问词就位，句序不变</p><p class=\"gfm\">什么 / 谁 / 哪儿 / 多少 / 怎么 放在要问的位置</p><p class=\"gnote\">中文不像越南语把疑问词提前，问什么就把疑问词放在那个位置。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这是什么？</p><p class=\"py\">zhè shì shén me？</p><p class=\"vi\">Đây là cái gì?</p></div><div class=\"gex\"><p class=\"zh\">你家在哪儿？</p><p class=\"py\">nǐ jiā zài nǎr？</p><p class=\"vi\">Nhà bạn ở đâu?</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「A 还是 B？」选择问</p><p class=\"gfm\">A 还是 B？</p><p class=\"gnote\">回答直接选一个，不用「是」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你是学生还是老师？</p><p class=\"py\">nǐ shì xué sheng hái shi lǎo shī？</p><p class=\"vi\">Bạn là học sinh hay giáo viên?</p></div><div class=\"gex\"><p class=\"zh\">你喝茶还是喝水？</p><p class=\"py\">nǐ hē chá hái shi hē shuǐ？</p><p class=\"vi\">Bạn uống trà hay uống nước?</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 正反问</p><p class=\"gfm\">是不是 / 有没有 / 好不好</p><p class=\"gnote\">把肯定和否定叠在一起提问，回答用「是 / 不是」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">你是不是学生？</p><p class=\"py\">nǐ shì bù shì xué sheng？</p><p class=\"vi\">Bạn có phải là học sinh không?</p></div><div class=\"gex\"><p class=\"zh\">我们一块儿去，好不好？</p><p class=\"py\">wǒ men yī kuàir qù， hǎo bù hǎo？</p><p class=\"vi\">Chúng ta cùng đi, được không?</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这是什么？</p><p class=\"py\">zhè shì shén me？</p><p class=\"vi\">Đây là cái gì?</p></div><div class=\"sent\"><p class=\"zh\">你叫什么名字？</p><p class=\"py\">nǐ jiào shén me míng zi？</p><p class=\"vi\">Bạn tên là gì?</p></div><div class=\"sent\"><p class=\"zh\">你有多少朋友？</p><p class=\"py\">nǐ yǒu duō shǎo péng you？</p><p class=\"vi\">Bạn có bao nhiêu bạn?</p></div><div class=\"sent\"><p class=\"zh\">你家在哪儿？</p><p class=\"py\">nǐ jiā zài nǎr？</p><p class=\"vi\">Nhà bạn ở đâu?</p></div><div class=\"sent\"><p class=\"zh\">这些书哪些是你的？</p><p class=\"py\">zhè xiē shū nǎ xiē shì nǐ de？</p><p class=\"vi\">Những cuốn sách này, cuốn nào là của bạn?</p></div><div class=\"sent\"><p class=\"zh\">你是学生还是老师？</p><p class=\"py\">nǐ shì xué sheng hái shi lǎo shī？</p><p class=\"vi\">Bạn là học sinh hay giáo viên?</p></div><div class=\"sent\"><p class=\"zh\">他去不去？</p><p class=\"py\">tā qù bù qù？</p><p class=\"vi\">Anh ấy có đi không?</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这是什么？</p><p class=\"py\">zhè shì shén me？</p><p class=\"vi\">Đây là cái gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这是茶。</p><p class=\"py\">zhè shì chá。</p><p class=\"vi\">Đây là trà.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你喝什么？</p><p class=\"py\">nǐ hē shén me？</p><p class=\"vi\">Bạn uống gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我喝茶。你呢？</p><p class=\"py\">wǒ hē chá。 nǐ ne？</p><p class=\"vi\">Tôi uống trà. Còn bạn?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我喝水。</p><p class=\"py\">wǒ hē shuǐ。</p><p class=\"vi\">Tôi uống nước.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">你晚上干什么？</p><p class=\"py\">nǐ wǎn shang gàn shén me？</p><p class=\"vi\">Buổi tối bạn làm gì?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我看书，有时候听歌。</p><p class=\"py\">wǒ kàn shū， yǒu shí hou tīng gē。</p><p class=\"vi\">Tôi đọc sách, có khi nghe nhạc.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，是不是很累？</p><p class=\"py\">hǎo， shì bù shì hěn lèi？</p><p class=\"vi\">Được, có mệt lắm không?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">不累。</p><p class=\"py\">bù lèi。</p><p class=\"vi\">Không mệt.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>疑问词替换：把「什么 / 谁 / 哪儿 / 多少 / 怎么」塞进同一句型</li><li>「A 还是 B」二选一快问快答</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>中文疑问句句序不变，不像越南语把疑问词提前</li><li>「几」问小数量，「多少」问大数量</li><li>「有的」「有些」都可作定语，后面要接名词</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用五个疑问词各造一句，写在 App 里</li><li>在 App 上完成 L10 测验</li></ul>"},
    {title:"L11 是、有、在", id:"l11", html:"<h1>L11 · 是、有、在</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Là, có, ở</p>\n<div class=\"lead\"><b>本课目标：</b>掌握「是 / 有 / 在」三个核心动词，会用「不」和「没」否定</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">是</td><td class=\"pyc\">shì</td><td class=\"hv\">thị</td><td>là (chỉ theo sau bởi danh từ)；đúng; phải; thật</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">有</td><td class=\"pyc\">yǒu</td><td class=\"hv\">hữu</td><td>có; có (gì đó)；(dạng kết hợp) có</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">在</td><td class=\"pyc\">zài</td><td class=\"hv\">tại</td><td>ở; tại；đang (đang làm gì)</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">没有</td><td class=\"pyc\">méi yǒu</td><td class=\"hv\">một hữu</td><td>không có；không tồn tại</td><td class=\"hint\">动词 / 副词</td></tr><tr><td class=\"hz\">没</td><td class=\"pyc\">méi</td><td class=\"hv\">một</td><td>(tiền tố phủ định cho động từ) chư</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">不</td><td class=\"pyc\">bù</td><td class=\"hv\">bất</td><td>không; không phải；(hình thức kết hợp) không; bất-</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">对</td><td class=\"pyc\">duì</td><td class=\"hv\">đối</td><td>đúng; chính xác；hướng đến; tại; vì</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">不对</td><td class=\"pyc\">bù duì</td><td class=\"hv\">bất đối</td><td>không chính xác；sai</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">不大</td><td class=\"pyc\">bù dà</td><td class=\"hv\">bất đại</td><td>không quá；không nhiều</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">一样</td><td class=\"pyc\">yī yàng</td><td class=\"hv\">nhất dạng</td><td>giống；như</td><td class=\"hint\">助词 / 形容词</td></tr><tr><td class=\"hz\">真的</td><td class=\"pyc\">zhēn de</td><td class=\"hv\">chân đích</td><td>thực sự; thật sự; quả thật；thật; đúng; chính xác</td><td class=\"hint\">副词 / 形容词</td></tr><tr><td class=\"hz\">真</td><td class=\"pyc\">zhēn</td><td class=\"hv\">chân</td><td>thật；sự thật</td><td class=\"hint\">副词 / 形容词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「是」表判断</p><p class=\"gfm\">A 是 B　｜　否定：A 不是 B</p><p class=\"gnote\">「是」连接两个名词。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我是老师。</p><p class=\"py\">wǒ shì lǎo shī。</p><p class=\"vi\">Tôi là giáo viên.</p></div><div class=\"gex\"><p class=\"zh\">他不是学生。</p><p class=\"py\">tā bù shì xué sheng。</p><p class=\"vi\">Anh ấy không phải học sinh.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「有」表拥有／存在</p><p class=\"gfm\">A 有 B　｜　否定：A 没有 B</p><p class=\"gnote\">「有」的否定只能用「没有」，绝不说「不有」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他有一个哥哥。</p><p class=\"py\">tā yǒu yī gè gē ge。</p><p class=\"vi\">Anh ấy có một anh trai.</p></div><div class=\"gex\"><p class=\"zh\">我没有钱。</p><p class=\"py\">wǒ méi yǒu qián。</p><p class=\"vi\">Tôi không có tiền.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 「在」表位置</p><p class=\"gfm\">A 在 + 地点　｜　否定：A 不在 + 地点</p><p class=\"gnote\">「在」后面接地点词。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在家。</p><p class=\"py\">tā zài jiā。</p><p class=\"vi\">Anh ấy ở nhà.</p></div><div class=\"gex\"><p class=\"zh\">他不在学校。</p><p class=\"py\">tā bù zài xué xiào。</p><p class=\"vi\">Anh ấy không ở trường.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我是老师。</p><p class=\"py\">wǒ shì lǎo shī。</p><p class=\"vi\">Tôi là giáo viên.</p></div><div class=\"sent\"><p class=\"zh\">他有一个哥哥。</p><p class=\"py\">tā yǒu yī gè gē ge。</p><p class=\"vi\">Anh ấy có một anh trai.</p></div><div class=\"sent\"><p class=\"zh\">我没有钱。</p><p class=\"py\">wǒ méi yǒu qián。</p><p class=\"vi\">Tôi không có tiền.</p></div><div class=\"sent\"><p class=\"zh\">他在家。</p><p class=\"py\">tā zài
