  {title:"九、测验与题库", id:"hsk2-g9", children:[
    {title:"9.1 分级测试（HSK1 → HSK2 定级）", id:"hsk2-qz1", html:"<h1>分级测试（HSK1 → HSK2 定级）</h1>\n<div class=\"lead\">入班前 10 分钟，确定学员能不能直接进二级。目的不是打分，是<b>决定从哪一课开始</b>。</div>\n<table>\n<tr><td>对象</td><td>已学完 HSK1（506 词）的学员</td></tr><tr><td>时长</td><td>10 分钟</td></tr><tr><td>构成</td><td>一级核心词汇 20 题（听音选义）+ 一级基础句型 10 题（连词成句）</td></tr><tr><td>及格</td><td>≥ 80%：直接进 L01</td></tr><tr><td>60–80%</td><td>先补 2 次一级复习课，再进 L01</td></tr><tr><td>&lt; 60%</td><td>回一级重学后 3 个阶段</td></tr>\n</table>\n<div class=\"note\">为什么用一级内容定级：二级的全部语法点都建立在一级词汇之上，一级不牢的话，二级从第一课（比字句）就会卡住。</div>"},
    {title:"9.2 单元测验（6 次）", id:"hsk2-qz2", html:"<h1>单元测验（6 次）</h1>\n<div class=\"lead\">每个单元结束后一次，45 分钟，覆盖该单元全部课次。插在单元最后一课之后，\n所以整级共 6 次单元测验。</div>\n<table>\n<tr><td>单元</td><td>名称</td><td>课次范围</td><td>词量</td><td>时长</td><td>重点语法点</td></tr>\n<tr><td><b>单元一</b></td><td>比较与程度</td><td class='mono'>L01–L08</td><td>120 词</td><td>45 分钟</td><td>A 比 B + 形容词、比字句扩展：数量、一点儿、得多、还/更、A 没有 B + 形容词（否定比较）…</td></tr><tr><td><b>单元二</b></td><td>结果、完成与经历</td><td class='mono'>L09–L16</td><td>120 词</td><td>45 分钟</td><td>结果补语：完 / 好、结果补语：到 / 见、结果补语：懂 / 会 / 错…</td></tr><tr><td><b>单元三</b></td><td>时间、顺序与频率</td><td class='mono'>L17–L24</td><td>120 词</td><td>45 分钟</td><td>时间点与时段（几点 / 多长时间）、从…到… / 从…开始、「第」表示顺序与序数表达…</td></tr><tr><td><b>单元四</b></td><td>因果、转折与条件</td><td class='mono'>L25–L32</td><td>120 词</td><td>45 分钟</td><td>因为…所以…、虽然…但是…、但是 / 可是 / 不过（转折三兄弟）…</td></tr><tr><td><b>单元五</b></td><td>存在、方位与移动</td><td class='mono'>L33–L40</td><td>120 词</td><td>45 分钟</td><td>存现句：处所 + 有 / 是、方位词与「在 / 有」、介词：从 / 往 / 向…</td></tr><tr><td><b>单元六</b></td><td>职场与生活场景综合</td><td class='mono'>L41–L50</td><td>150 词</td><td>45 分钟</td><td>兼语句：让 / 请 / 叫 / 使、双宾语句：给 / 送 / 教 / 问、连动句：去…买… / 来…帮助……</td></tr>\n</table>\n<h2>单次单元测验的结构（45 分钟）</h2>\n<table>\n<tr><td>部分</td><td>时长</td><td>题型</td><td>分值</td></tr>\n<tr><td>听力</td><td>10 分钟</td><td>听句子选图 / 听对话答问（本单元词与句型）</td><td>30</td></tr>\n<tr><td>语法</td><td>15 分钟</td><td>连词成句、选词填空（本单元语法点）</td><td>30</td></tr>\n<tr><td>阅读</td><td>10 分钟</td><td>短文理解（用累计词表 1,257 词出题）</td><td>20</td></tr>\n<tr><td>口语</td><td>10 分钟</td><td>看图说话 / 情景对话（本单元任务）</td><td>20</td></tr>\n</table>\n<div class=\"note\"><b>规则：</b>每个单元结束后一次，45 分钟，覆盖该单元全部课次（约 120–150 词）。<br>\n<b>及格线：</b>单元测验 70 分及格；低于 60 分需补课后再测。\n补课内容按「语法点索引」的「前置」列倒推。</div>"},
    {title:"9.3 结课测验与升级", id:"hsk2-qz3", html:"<h1>结课测验与升级</h1>\n<table>\n<tr><td>结课测验</td><td>结课后一次，90 分钟，覆盖全级 750 词</td></tr>\n<tr><td>及格线</td><td>单元测验 70 分及格；低于 60 分需补课后再测</td></tr>\n<tr><td>升级条件</td><td><b>50 课次全部完成 + 出勤 ≥80% + 单元测验平均 ≥75 分 + 结课测验 ≥70 分 → 升 HSK3</b></td></tr>\n</table>\n\n<h2>结课测验结构（90 分钟，按两次课次计）</h2>\n<table>\n<tr><td>部分</td><td>时长</td><td>内容</td><td>分值</td></tr>\n<tr><td>听力</td><td>20 分钟</td><td>覆盖全级 751 词与二级全部语法点</td><td>30</td></tr>\n<tr><td>阅读</td><td>25 分钟</td><td>短文理解（累计词表 1,257 词）</td><td>25</td></tr>\n<tr><td>语法</td><td>20 分钟</td><td>复句关联词、补语、特殊句式综合</td><td>25</td></tr>\n<tr><td>口语</td><td>15 分钟</td><td>情景任务：职场 / 工厂 / 购物 / 看病</td><td>20</td></tr>\n<tr><td>写作</td><td>10 分钟</td><td>写 5～8 句的短文（介绍一天的工作）</td><td>—</td></tr>\n</table>\n<div class=\"note\">升级判定：50 课次全部完成 + 出勤 ≥80% + 单元测验平均 ≥75 分\n+ 结课测验 ≥70 分 → 升 HSK3。</div>"}
  ]},
  {title:"十、教师使用说明", id:"hsk2-g10", children:[
    {title:"10.1 备课与交接流程", id:"hsk2-tc1", html:"<h1>教师使用说明（HSK2）</h1>\n<div class=\"lead\">这一页是给接手的老师看的：怎么备课、怎么用这套体系、换老师怎么交接。</div>\n\n<h2>一、备课流程</h2>\n<table>\n<tr><td>1</td><td>打开本课备课卡</td><td>看<b>结构公式</b>——这一课就教这一个句型</td></tr>\n<tr><td>2</td><td>看<b>前置课次</b></td><td>确认学员已掌握；有缺课的学员先补前置</td></tr>\n<tr><td>3</td><td>看<b>越南学员易错点</b></td><td>这是本课的纠错重点，操练环节必须专门练</td></tr>\n<tr><td>4</td><td>按 45 分钟六步写教案</td><td>骨架见 1.3「一课的标准结构」</td></tr>\n<tr><td>5</td><td>例句用词必须在累计词表内</td><td>HSK1 506 + HSK2 751 = 1,257 词</td></tr>\n</table>\n\n<h2>二、课堂节奏（45 分钟）</h2>\n<table>\n<tr><td>环节</td><td>时长</td><td>负责人</td><td>关键动作</td></tr>\n<tr><td>签到</td><td>2′</td><td>越籍助教</td><td>点名、复习上节课作业</td></tr><tr><td>复习</td><td>5′</td><td>越籍助教</td><td>上节课 15 词快速问答 + 1 个句型操练</td></tr><tr><td>新词导入</td><td>12′</td><td>中方讲师</td><td>本课 15 个新词：读音、释义、搭配</td></tr><tr><td>句型操练</td><td>12′</td><td>中方讲师</td><td>本课语法点：公式 → 例句 → 替换练习</td></tr><tr><td>互动练习</td><td>10′</td><td>双方</td><td>两人对话 / 情景任务，用本课词与句型</td></tr><tr><td>小结作业</td><td>4′</td><td>中方讲师</td><td>总结语法点、布置 App 作业与预习</td></tr>\n</table>\n\n<h2>三、换老师怎么交接</h2>\n<table>\n<tr><td>交接内容</td><td>在哪</td></tr>\n<tr><td>上到哪一课、哪一课没讲透</td><td>备课卡「教案状态」</td></tr>\n<tr><td>学员卡在哪个语法点</td><td>「语法点索引」的「前置」列</td></tr>\n<tr><td>本班特殊问题</td><td>本页第四节手写补充</td></tr>\n</table>\n\n<h2>四、本班记录（老师手写区）</h2>\n<div class=\"todo\">在这里记：本班进度、反复出错的语法点、需要放慢的课次。\n（打印出来后手写即可，电子版保持空白。）</div>\n\n<h2>五、这套体系与其他级别的关系</h2>\n<table>\n<tr><td>HSK1</td><td>按主题编排，42 课，506 词</td></tr><tr><td>HSK2</td><td>按语法功能编排，50 课，751 词，6 个单元</td></tr><tr><td>为什么变</td><td>二级新词主体是虚词与抽象动词，按主题排不出可教的课（详见 1.2）</td></tr>\n<tr><td>不变的部分</td><td>45 分钟六步结构、分级测试、单元测验、升级标准</td></tr>\n</table>"}
  ]}
  ],
  hsk3: [
  {title:"一、总览", id:"hsk3-g0", children:[
    {title:"1.1 大纲总览", id:"hsk3-ov1", html:"<h1>HSK3 教学大纲 · 总览</h1>\n<div class=\"lead\">基准：<b>《国际中文教育中文水平等级标准》GF 0025—2021</b>（HSK 3.0）。\n标准用「音节 / 汉字 / 词汇 / 语法」四种语言基本要素构成<b>四维基准</b>，\n再用「言语交际能力 / 话题任务内容 / 语言量化指标」三个维度评价，\n技能上覆盖听、说、读、写、译五项。</div>\n<table>\n<tr><td>本级新词</td><td><b>953</b> 词（不含前级已学的词）</td></tr>\n<tr><td>累计词表</td><td><b>2,210</b> 词（HSK1 506 + HSK2 751 + HSK3 953）——学员文本用词上限</td></tr>\n<tr><td>课数</td><td><b>64</b> 课，每课 <b>13~17</b> 词</td></tr>\n<tr><td>教学单元</td><td><b>8</b> 个单元（划分依据见 1.2）</td></tr>\n<tr><td>每课课时</td><td><b>45 分钟</b>（六步固定结构，见 1.3）</td></tr>\n<tr><td>课次总数</td><td><b>73</b> 次 = 教学 64 + 单元测验 8 + 结课测验 1</td></tr>\n<tr><td>课堂总时数</td><td><b>54.75</b> 小时（48.0 小时授课 + 测验）</td></tr>\n<tr><td>周期</td><td>每周 2 次 → <b>36.5 周</b>（约 8.5 个月）</td></tr>\n<tr><td>自学时数</td><td>每课次课前预习 10 分钟 + 课后 App 复习 15 分钟 → 共约 <b>26.7</b> 小时</td></tr>\n</table>\n<div class=\"note\"><b>词量口径说明：</b>64 课，每课 13~17 词：953 词按<b>单元主题</b>分到 8 个单元，单元内再按课数均分，所以每课词数在 13~17 之间浮动。官方口径 973 是<b>词条数</b>（= 966 字形 + 7 个同形分列），见「与官方口径对齐」页。</div>\n\n<h2>词汇量口径对照</h2>\n<table>\n<tr><td>等级</td><td>官方新增</td><td>官方累计</td><td>本系统语料</td></tr>\n<tr><td><b>HSK1</b></td><td>500 词</td><td>500 词</td><td>506 词 / 42 课</td></tr><tr><td><b>HSK2</b></td><td>772 词</td><td>1,272 词</td><td>751 词 / 50 课</td></tr><tr><td><b>HSK3</b></td><td>973 词</td><td>2,245 词</td><td>953 词 / 64 课</td></tr>\n</table>\n<div class=\"note\"><b>对照：HSK 2.0（旧标准，2009）</b><br>\n旧 HSK（2009）三级为 600 词，与本标准不是同一体系，不可比。<br>\n我们以 HSK 3.0 为基准；旧标准的词汇表只在讨论历史教材时作参考。</div>"},
    {title:"1.2 单元划分", id:"hsk3-ov2", html:"<h1>单元划分</h1>\n<div class=\"lead\">8 个单元按<b>主题场景</b>划分（工作与职业 / 社会与公共事务 / 经济与商业 / 生产科技与网络 / 健康与身体 / 情感与性格 / 城市交通与环境 / 文化教育与艺术）。理由：三级的新词 91% 是实词（名词 465 / 动词 317 / 形容词 137），实词天然按语义场成组；6 个主题装不下 953 个实词，会逼出「硬凑」的单元。每个主题 ~120 词、正好 8 课，也正好 4 周（每周 2 次）。</div>\n<table>\n<tr><td>单元</td><td>单元名称</td><td>课数</td><td>词量</td><td>课时</td><td>单元目标</td></tr>\n<tr><td><b>1</b></td><td><b>工作与职业</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Công việc và nghề nghiệp</span></td><td>8 课</td><td>129 词</td><td>360 分钟</td><td>掌握三级最核心的三种特殊句式——把字句、被字句、兼语句，以及结果/可能补语，能在职场场景里说清「谁把什么怎么样了、谁被怎么样了、让谁做什么」。</td></tr><tr><td><b>2</b></td><td><b>社会与公共事务</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Xã hội và công việc công cộng</span></td><td>8 课</td><td>120 词</td><td>360 分钟</td><td>掌握「是…的」强调句、由字句、双宾语句、存现句和让步/条件复句，能就社会话题做基本陈述与讨论。</td></tr><tr><td><b>3</b></td><td><b>经济与商业</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Kinh tế và thương mại</span></td><td>8 课</td><td>114 词</td><td>360 分钟</td><td>掌握比较句进阶、数量表达、时量/动量补语与递进复句，能在商业场景里报数据、讲价格、谈条件。</td></tr><tr><td><b>4</b></td><td><b>生产、科技与网络</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Sản xuất, công nghệ và internet</span></td><td>8 课</td><td>111 词</td><td>360 分钟</td><td>掌握趋向补语（含引申义）、书面被动式与「进行/加以」类虚化动词，能描述生产流程、技术操作与网络行为。</td></tr><tr><td><b>5</b></td><td><b>健康与身体</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Sức khỏe và cơ thể</span></td><td>8 课</td><td>115 词</td><td>360 分钟</td><td>掌握程度补语、使役表达、时间与频率副词，以及离合词用法，能描述身体状况、生活习惯与就医场景。</td></tr><tr><td><b>6</b></td><td><b>情感与性格</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Tình cảm và tính cách</span></td><td>8 课</td><td>111 词</td><td>360 分钟</td><td>掌握语气副词、让步复句与心理动词从句，能准确表达推测、反问、让步等主观语气。</td></tr><tr><td><b>7</b></td><td><b>城市、交通与环境</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Thành phố, giao thông và môi trường</span></td><td>8 课</td><td>126 词</td><td>360 分钟</td><td>掌握方位处所、方向介词、距离路线表达与范围数量词，能描述城市空间、出行路线与环境状况。</td></tr><tr><td><b>8</b></td><td><b>文化、教育与艺术</b><br><span style=\"font-size:11.5px;color:var(--muted)\">Văn hóa, giáo dục và nghệ thuật</span></td><td>8 课</td><td>127 词</td><td>360 分钟</td><td>掌握名词化后缀、所字结构、书面介词与时间表达，能读懂并写出正式的书面语段落，完成三级结课。</td></tr>\n</table>\n<div class=\"note\">合计：64 课 · 953 词。\n每个单元结束安排一次 45 分钟的单元测验。</div>\n\n<h2>单元与语法主线</h2>\n<table>\n<tr><td>单元</td><td>课次范围</td><td>语法主线（由浅入深）</td></tr>\n<tr><td><b>1</b></td><td class='mono'>L01–L08</td><td>把字句（一）：把 + 宾语 + 动词 + 补语 → 把字句（二）：把 + 宾语 + 动词 + 在/到/给 → 被字句：被 + 施事 + 动词 → 兼语句：让 / 叫 / 请 / 派 / 使 + 人 + 动词 → 结果补语（一）：动词 + 完 / 好 / 到 / 见 → 结果补语（二）：动词 + 懂 / 成 / 住 / 掉 / 光 → 可能补语：动词 + 得 / 不 + 结果补语 → 单元一综合：职场沟通</td></tr><tr><td><b>2</b></td><td class='mono'>L09–L16</td><td>「是…的」强调句 → 「由」引出责任者 → 双宾语句 → 「对 / 向 / 跟 / 给」引介对象 → 存现句 → 「除了…以外」 → 「无论…都」「不管…都」 → 单元二综合：社会话题讨论</td></tr><tr><td><b>3</b></td><td class='mono'>L17–L24</td><td>比较：不如 / 没有…这么 → 「越来越」「越…越…」 → 数量表达：倍数 / 分数 / 百分比 / 大约 → 时量补语 → 动量补语 → 「不仅…而且」「不但…还」 → 「既然…就」「只要…就」 → 单元三综合：商业汇报</td></tr><tr><td><b>4</b></td><td class='mono'>L25–L32</td><td>趋向补语（一）：动词 + 来 / 去 → 趋向补语（二）：动词 + 上来 / 下去 / 出来 / 起来 → 趋向补语的引申义：「起来」「下去」 → 「进行 / 加以 / 予以」+ 双音节动词 → 「为…所…」「被…所…」 → 被动意义的其他表达：受 / 挨 / 给 → 定语进阶：动词短语 + 的 + 名词 → 单元四综合：科技与网络</td></tr><tr><td><b>5</b></td><td class='mono'>L33–L40</td><td>程度补语：动词 + 得 + 很 / 不得了 → 「使 / 让 / 令」使役表达 → 时间副词：已经 / 曾经 / 刚刚 / 立刻 → 频率副词：总是 / 经常 / 往往 / 从来 → 离合词 → 「越…越…」与「越来越」辨析 → 形容词 + 得 + 不得了 / 极了 → 单元五综合：健康与生活习惯</td></tr><tr><td><b>6</b></td><td class='mono'>L41–L48</td><td>语气副词（一）：到底 / 究竟 / 简直 → 语气副词（二）：难道 / 千万 / 反正 → 副词：恐怕 / 只好 / 当然 / 其实 → 「即使…也」「哪怕…也」 → 心理动词 + 从句 → 「把…当…」「拿…当…」 → 形容词重叠 → 单元六综合：表达感受与态度</td></tr><tr><td><b>7</b></td><td class='mono'>L49–L56</td><td>方位与处所：上面 / 下面 / 里面 / 外面 / 当中 → 「往 / 朝 / 向 + 方位 + 动词」 → 距离与路线：离 / 到 / 从 / 经过 → 数量与范围：左右 / 大约 / 将近 / 超过 → 「一方面…另一方面」「既…又」 → 「由于…所以」「因为…因此」 → 天气与环境表达 → 单元七综合：城市生活与出行</td></tr><tr><td><b>8</b></td><td class='mono'>L57–L64</td><td>名词化后缀（一）：性 / 化 → 名词化后缀（二）：者 / 员 / 度 → 「所」字结构 → 介词结构：对于 / 关于 / 由于 / 为了 → 「于」的书面用法 → 时间表达：自从 / 直到 / 以来 → 书面连接：并 / 并且 / 此外 / 另外 → 结课总复习：三级语言点串讲</td></tr>\n</table>"},
    {title:"1.3 一课的标准结构", id:"hsk3-ov3", html:"<h1>一课的标准结构（课时安排）</h1>\n<div class=\"lead\">每课 45 分钟固定六步（与 HSK1 相同）——骨架固定 = 备课成本低、\n换老师只需交接进度。每课 <b>1 个语法点 + 13~17 个配套词</b>，\n语法点决定教什么句型，配套词专门练这个句型。</div>\n<table>\n<tr><td>环节</td><td>时长</td><td>内容</td><td>负责人</td></tr>\n<tr><td><b>签到</b></td><td>2 分钟</td><td>点名、复习上节课作业</td><td>越籍助教</td></tr><tr><td><b>复习</b></td><td>5 分钟</td><td>上节课 15 词快速问答 + 1 个句型操练</td><td>越籍助教</td></tr><tr><td><b>新词导入</b></td><td>12 分钟</td><td>本课 15 个新词：读音、释义、搭配</td><td>中方讲师</td></tr><tr><td><b>句型操练</b></td><td>12 分钟</td><td>本课语法点：公式 → 例句 → 替换练习</td><td>中方讲师</td></tr><tr><td><b>互动练习</b></td><td>10 分钟</td><td>两人对话 / 情景任务，用本课词与句型</td><td>双方</td></tr><tr><td><b>小结作业</b></td><td>4 分钟</td><td>总结语法点、布置 App 作业与预习</td><td>中方讲师</td></tr>\n</table>\n\n<h2>一次完整课次的投入</h2>\n<table>\n<tr><td>课前预习（App）</td><td>10 分钟</td><td>学员自学：听音频、认生词</td></tr>\n<tr><td>课堂教学</td><td>45 分钟</td><td>上面六步</td></tr>\n<tr><td>课后复习（App）</td><td>15 分钟</td><td>FSRS 间隔重复 + 作业</td></tr>\n<tr><td><b>合计</b></td><td><b>70 分钟</b></td><td>每课次</td></tr>\n</table>\n<div class=\"note\">整级投入：73 课次 × 70 分钟 ≈ <b>81 小时</b>\n（课堂 54.75 小时 + 自学 26.7 小时）。</div>\n\n<h2>每课备课四要素</h2>\n<table>\n<tr><td>要素</td><td>说明</td><td>在哪看</td></tr>\n<tr><td>结构公式</td><td>这一课教的句型，写成可替换的公式</td><td>每课备课卡首行</td></tr>\n<tr><td>教学目标</td><td>学完能做什么（听 / 说 / 读）</td><td>每课备课卡</td></tr>\n<tr><td>前置课次</td><td>学本课之前必须先掌握哪几课</td><td>每课备课卡</td></tr>\n<tr><td>越南学员易错点</td><td>汉越对比下的高频错误</td><td>每课备课卡</td></tr>\n</table>"},
    {title:"1.4 与官方口径对齐", id:"hsk3-ov4", html:"<h1>与官方口径对齐（973 词到底差在哪）</h1>\n<div class=\"lead\">官方「973 词」是<b>词条数</b>，不是不同字的个数。官方原表把「词汇」写作 Vocabulary (Words and Phrases)，即词与短语合计。973 拆开是：966 个不同字形 + 7 个同形分列词条（为/任/初/把/精神/背/调 各占 2 条）。966 个字形里又有 17 个是前两级已经学过的字、在三级新增了词性（兼类），所以三级<b>真正要新学的字是 949 个</b>。</div>\n<table>\n<tr><td>官方词条数</td><td><b>973</b></td></tr>\n<tr><td>官方不同字形</td><td><b>966</b></td></tr>\n<tr><td>同形分列词条</td><td><b>7</b> 个（为、任、初、把、精神、背、调 各占 2 条）</td></tr>\n<tr><td>其中前两级已学的字形</td><td><b>17</b> 个（三级新增词性，即「兼类用法」）</td></tr>\n<tr><td>三级真正新字形</td><td><b>949</b> 个</td></tr>\n<tr><td>本系统收录</td><td><b>953</b> 词，覆盖 <b>948/949</b></td></tr>\n</table>\n<div class=\"note\"><b>结论：</b>本系统三级现有 953 词，覆盖官方 949 个真新字形中的 948 个（99.9%）。差的 1 个是官方写作「…极了」、本系统作「极了」——同一词条，仅省略号记法不同，不是缺口。</div>\n\n<h2>这 17 个「旧字新用法」必须单独教</h2>\n<div class=\"lead\">这些字学员在前两级已经学过，三级不是重新学这个字，而是学它的<b>新词性</b>（官方三级表把这些字按新词性重新收录）。不专门讲，学员会拿旧词性硬套。</div>\n<table>\n<tr><td>字</td><td>已学级别·词性</td><td>已学义</td><td>三级新词性</td><td>三级读音</td><td>例词</td></tr>\n<tr><td><b>为</b></td><td class='mono'>二级·介词、动词</td><td>bởi vì</td><td class='mono'><b>介词、动词</b></td><td>wéi</td><td class='mono'>为了</td></tr><tr><td><b>了</b></td><td class='mono'>一级·语气词、助词</td><td>(trợ từ chỉ hành động đã</td><td class='mono'><b>动词</b></td><td>liǎo</td><td class='mono'>为了</td></tr><tr><td><b>信</b></td><td class='mono'>二级·名词、动词</td><td>thư</td><td class='mono'><b>动词</b></td><td>xìn</td><td class='mono'>信任</td></tr><tr><td><b>只</b></td><td class='mono'>二级·副词、量词</td><td>chỉ</td><td class='mono'><b>量词</b></td><td>zhī</td><td class='mono'>只是</td></tr><tr><td><b>叫</b></td><td class='mono'>一级·动词、介词</td><td>kêu</td><td class='mono'><b>介词</b></td><td>jiào</td><td class='mono'>—</td></tr><tr><td><b>头</b></td><td class='mono'>二级·名词、量词</td><td>đầu</td><td class='mono'><b>形容词</b></td><td>tóu</td><td class='mono'>石头</td></tr><tr><td><b>怕</b></td><td class='mono'>二级·动词</td><td>sợ</td><td class='mono'><b>副词</b></td><td>pà</td><td class='mono'>害怕</td></tr><tr><td><b>排</b></td><td class='mono'>二级·动词、量词</td><td>một hàng</td><td class='mono'><b>动词</b></td><td>pái</td><td class='mono'>安排</td></tr><tr><td><b>正</b></td><td class='mono'>一级·副词、区别词</td><td>thẳng</td><td class='mono'><b>形容词</b></td><td>zhèng</td><td class='mono'>正式</td></tr><tr><td><b>毛</b></td><td class='mono'>一级·人名、名词</td><td>tóc</td><td class='mono'><b>名词</b></td><td>máo</td><td class='mono'>毛病</td></tr><tr><td><b>生</b></td><td class='mono'>二级·动词、语素</td><td>được sinh</td><td class='mono'><b>形容词</b></td><td>shēng</td><td class='mono'>发生</td></tr><tr><td><b>白</b></td><td class='mono'>一级·形容词、人名</td><td>trắng</td><td class='mono'><b>副词</b></td><td>bái</td><td class='mono'>白菜</td></tr><tr><td><b>米</b></td><td class='mono'>二级·名词、量词</td><td>gạo</td><td class='mono'><b>名词</b></td><td>mǐ</td><td class='mono'>—</td></tr><tr><td><b>背</b></td><td class='mono'>二级·动词、名词</td><td>lưng của cơ thể hoặc vật</td><td class='mono'><b>动词、名词</b></td><td>bēi / bèi</td><td class='mono'>背后</td></tr><tr><td><b>行</b></td><td class='mono'>一级·动词、语素</td><td>đi</td><td class='mono'><b>量词</b></td><td>háng</td><td class='mono'>飞行</td></tr><tr><td><b>过去</b></td><td class='mono'>二级·动词、时间词</td><td>(trong quá khứ); trước đ</td><td class='mono'><b>名词</b></td><td>guòqù</td><td class='mono'>—</td></tr><tr><td><b>重</b></td><td class='mono'>一级·形容词、副词</td><td>nặng</td><td class='mono'><b>副词</b></td><td>chóng</td><td class='mono'>重大</td></tr>\n</table>\n\n<h2>其余差异（官方记法 vs 本系统）</h2>\n<table>\n<tr><td>官方写法</td><td>本系统写法</td><td>性质</td></tr>\n<tr><td class='mono'>…极了</td><td class='mono'>极了</td><td>官方带省略号前缀，本系统去掉前缀，同一词条</td></tr>\n<tr><td>—</td><td class=\"mono\">初一、服务员、极了、现代化 等 5 个</td>\n<td>本系统多出，多为社区整理版增补，不影响教学</td></tr>\n</table>\n<div class=\"note\">核对数据：<b>build/official-hsk3.json</b>（官方一至三级词表）；\n核对脚本：<b>build/17_sync_official_vocab.py</b>。随时可重跑复核。</div>"},
    {title:"1.5 待办与风险", id:"hsk3-ov5", html:"<h1>待办与风险</h1>\n<h2>待办清单</h2>\n<table><tr><td>事项</td><td>内容</td><td>状态</td></tr><tr><td>定语法点主线</td><td>64 课的语法点序列（每课 1 个）</td><td>已完成</td></tr><tr><td>挑配套词</td><td>从 953 词里按单元主题为每课挑 13~17 个同语义簇词</td><td>词表已分配 64/64</td></tr><tr><td>写教案</td><td>每课 7 段：本课目标 / 语法点 / 例句 / 对话 / 课堂操练 / 易错点 / 作业</td><td>教案已写 0/64</td></tr><tr><td>校订越南语</td><td>该课生词的释义逐条改对（词典原值常有错）</td><td>未开始</td></tr><tr><td>校验</td><td>学员文本用词必须落在累计词表（506+751+953=2,210）内</td><td>未开始</td></tr><tr><td>生成</td><td>重跑生成脚本，教课体系左侧长出 64 课</td><td>未开始</td></tr></table>\n<h2>风险与需要确认的事</h2>\n<table><tr><td>事项</td><td>说明</td></tr><tr><td><b>词表按主题分单元，可能出现「本课句型用不到本课词」</b></td><td>写教案时逐课核覆盖率（06 校验脚本已支持），低于 90% 就换词</td></tr><tr><td><b>64 课体量大，写教案周期长</b></td><td>按单元分批交付，一单元（8 课）做完生成一次给 Tony 确认风格</td></tr><tr><td><b>三级实词多，例句容易超纲</b></td><td>累计词表口径校验（2,210 词），越界即报错</td></tr><tr><td><b>越南语释义质量（词典噪声已结构性修过，但逐词细校未完）</b></td><td>写教案时顺手改本课词，另出 CSV 交母语者复核</td></tr></table>"}

  {title:"二、单元1 工作与职业", id:"hsk3-g1", children:[
    {title:"L01 把字句（一）：把 + 宾语 + 动词 + 补语", id:"hsk3-l01", html:"<h1>L01 · 把字句（一）：把 + 宾语 + 动词 + 补语</h1>\n<div class=\"lead\">掌握把字句基本结构，能说清「把什么怎么样」</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 把 + 宾语 + 动词 + 补语（把报告写完）</b></td></tr>\n<tr><td>教学目标</td><td>掌握把字句基本结构，能说清「把什么怎么样」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu chữ 把 (1): 把 + tân ngữ + động từ + bổ ngữ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语没有把字句，学员会说「写完报告」而不是「把报告写完」。要讲清「把」把宾语<b>提到动词前</b>，且动词后<b>必须有</b>补语或其他成分。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">把</td><td class=\"pyc\">bǎ</td><td class=\"hv\">bả</td><td>(giới từ) đem；cầm; nắm</td><td class=\"hint\">介词 / 量词</td></tr><tr><td class=\"hz\">文件</td><td class=\"pyc\">wén jiàn</td><td class=\"hv\">văn kiện</td><td>tài liệu；tệp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">报告</td><td class=\"pyc\">bào gào</td><td class=\"hv\">báo cáo</td><td>thông báo；báo cáo</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">表格</td><td class=\"pyc\">biǎo gé</td><td class=\"hv\">biểu cách</td><td>biểu mẫu；bảng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">标题</td><td class=\"pyc\">biāo tí</td><td class=\"hv\">tiêu đề</td><td>tiêu đề；đề mục</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">专题</td><td class=\"pyc\">zhuān tí</td><td class=\"hv\">đề</td><td>chủ đề cụ thể；bài viết</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">题目</td><td class=\"pyc\">tí mù</td><td class=\"hv\">đề mục</td><td>câu hỏi bài tập hoặc thi cử</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">会议</td><td class=\"pyc\">huì yì</td><td class=\"hv\">hội nghị</td><td>cuộc họp；hội nghị</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">任务</td><td class=\"pyc\">rèn wu</td><td class=\"hv\">nhâm vụ</td><td>nhiệm vụ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">目标</td><td class=\"pyc\">mù biāo</td><td class=\"hv\">mục tiêu</td><td>mục tiêu；mục đích</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">安排</td><td class=\"pyc\">ān pái</td><td class=\"hv\">an bài</td><td>sắp xếp；lên kế hoạch</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">责任</td><td class=\"pyc\">zé rèn</td><td class=\"hv\">trách nhâm</td><td>trách nhiệm；lỗi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">负责</td><td class=\"pyc\">fù zé</td><td class=\"hv\">phụ trách</td><td>chịu trách nhiệm về；tận tâm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">记录</td><td class=\"pyc\">jì lù</td><td class=\"hv\">kí lục</td><td>ghi chép；bản ghi chép</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">复印</td><td class=\"pyc\">fù yìn</td><td class=\"hv\">phục ấn</td><td>sao chép；tạo bản sao tài liệu</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">处理</td><td class=\"pyc\">chǔ lǐ</td><td class=\"hv\">xứ lý</td><td>xử lý; đối phó；xử phạt</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L02 把字句（二）：把 + 宾语 + 动词 + 在/到/给", id:"hsk3-l02", html:"<h1>L02 · 把字句（二）：把 + 宾语 + 动词 + 在/到/给</h1>\n<div class=\"lead\">掌握把字句带介词短语的形式，能说清「把什么放在哪儿 / 交给谁」</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 把 + 宾语 + 动词 + 在/到/给 + 处所/对象（把文件放在桌上）</b></td></tr>\n<tr><td>教学目标</td><td>掌握把字句带介词短语的形式，能说清「把什么放在哪儿 / 交给谁」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu chữ 把 (2): 把 + tân ngữ + động từ + 在/到/给</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「在/到/给」是<b>动词后</b>的介词短语，学员容易说成「把文件在桌上放」。另外「把」字句的动词不能是光杆动词，必须带补语、了、或介词短语。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">解决</td><td class=\"pyc\">jiě jué</td><td class=\"hv\">giải quyết</td><td>giải quyết；loại bỏ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">支持</td><td class=\"pyc\">zhī chí</td><td class=\"hv\">chi trì</td><td>tán thành；hỗ trợ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">配合</td><td class=\"pyc\">pèi hé</td><td class=\"hv\">phối hợp</td><td>phù hợp；phối hợp với</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">分组</td><td class=\"pyc\">fēn zǔ</td><td class=\"hv\">phân tổ</td><td>chia thành nhóm；nhóm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">建议</td><td class=\"pyc\">jiàn yì</td><td class=\"hv\">kiến nghị</td><td>đề xuất; đề nghị; kiến nghị</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">认可</td><td class=\"pyc\">rèn kě</td><td class=\"hv\">nhận khả</td><td>phê duyệt；chấp thuận</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">评价</td><td class=\"pyc\">píng jià</td><td class=\"hv\">bình giới</td><td>đánh giá</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">指出</td><td class=\"pyc\">zhǐ chū</td><td class=\"hv\">chỉ xuất</td><td>chỉ ra；nêu ra</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">强调</td><td class=\"pyc\">qiáng diào</td><td class=\"hv\">cường điều</td><td>nhấn mạnh (một tuyên bố)；nhấn mạnh</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">总结</td><td class=\"pyc\">zǒng jié</td><td class=\"hv\">tổng kết</td><td>tóm tắt；kết luận</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">保存</td><td class=\"pyc\">bǎo cún</td><td class=\"hv\">bảo tồn</td><td>bảo tồn；bảo quản</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">整理</td><td class=\"pyc\">zhěng lǐ</td><td class=\"hv\">chỉnh lý</td><td>sắp xếp；dọn dẹp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">调整</td><td class=\"pyc\">tiáo zhěng</td><td class=\"hv\">điều chỉnh</td><td>điều chỉnh；sự điều chỉnh</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">修改</td><td class=\"pyc\">xiū gǎi</td><td class=\"hv\">tu cải</td><td>sửa đổi；thay đổi</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">补充</td><td class=\"pyc\">bǔ chōng</td><td class=\"hv\">bổ sung</td><td>bổ sung；bổ trợ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">分配</td><td class=\"pyc\">fēn pèi</td><td class=\"hv\">phân phối</td><td>phân phối；giao</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L03 被字句：被 + 施事 + 动词", id:"hsk3-l03", html:"<h1>L03 · 被字句：被 + 施事 + 动词</h1>\n<div class=\"lead\">掌握被字句，能叙述「谁被怎么样了」</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 被 + 施事 + 动词 + 其他成分（杯子被他打破了）</b></td></tr>\n<tr><td>教学目标</td><td>掌握被字句，能叙述「谁被怎么样了」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu chữ 被: 被 + tác nhân + động từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01</td></tr>\n<tr><td>词量 / 课时</td><td>17 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">越南语被动用 &quot;bị / được&quot;，学员会把「被」直接当 &quot;bị&quot; 用，漏掉后面的补语（× 杯子被他打破）。「被」字句多用于<b>不如意</b>的事。</div>\n\n<h2>本课词表 17 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">被</td><td class=\"pyc\">bèi</td><td class=\"hv\">bị</td><td>(giới từ) bị；chăn; mền</td><td class=\"hint\">介词 / 语素</td></tr><tr><td class=\"hz\">表现</td><td class=\"pyc\">biǎo xiàn</td><td class=\"hv\">biểu hiện</td><td>thể hiện；phô diễn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">能力</td><td class=\"pyc\">néng lì</td><td class=\"hv\">năng lực</td><td>năng lực；khả năng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">才能</td><td class=\"pyc\">cái néng</td><td class=\"hv\">tài năng</td><td>tài năng；khả năng</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">实力</td><td class=\"pyc\">shí lì</td><td class=\"hv\">thật lực</td><td>sức mạnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">经历</td><td class=\"pyc\">jīng lì</td><td class=\"hv\">kinh lịch</td><td>kinh nghiệm；trải qua</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">经验</td><td class=\"pyc\">jīng yàn</td><td class=\"hv\">kinh nghiệm</td><td>kinh nghiệm；trải nghiệm</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">标准</td><td class=\"pyc\">biāo zhǔn</td><td class=\"hv\">tiêu chuẩn</td><td>tiêu chuẩn; chuẩn mực; tiêu chí；(tính từ) chuẩn</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">主动</td><td class=\"pyc\">zhǔ dòng</td><td class=\"hv\">chủ động</td><td>chủ động；tự làm gì đó</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">明确</td><td class=\"pyc\">míng què</td><td class=\"hv\">minh xác</td><td>rõ ràng; dứt khoát; rõ rệt；làm rõ; chỉ rõ; làm cho rõ ràng</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">合理</td><td class=\"pyc\">hé lǐ</td><td class=\"hv\">hợp lý</td><td>hợp lý; có lý; công bằng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">合格</td><td class=\"pyc\">hé gé</td><td class=\"hv\">hợp cách</td><td>đáp ứng tiêu chuẩn yêu cầu；đủ tiêu chuẩn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">进步</td><td class=\"pyc\">jìn bù</td><td class=\"hv\">tiến bộ</td><td>tiến bộ; cải thiện；cải thiện; tiến bộ</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">进展</td><td class=\"pyc\">jìn zhǎn</td><td class=\"hv\">tiến triển</td><td>tiến triển; đạt tiến bộ</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">优势</td><td class=\"pyc\">yōu shì</td><td class=\"hv\">ưu thế</td><td>sự vượt trội；sự thống trị</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">优点</td><td class=\"pyc\">yōu diǎn</td><td class=\"hv\">ưu điểm</td><td>ưu điểm；lợi ích</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">缺点</td><td class=\"pyc\">quē diǎn</td><td class=\"hv\">khuyết điểm</td><td>điểm yếu；lỗi</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L04 兼语句：让 / 叫 / 请 / 派 / 使 + 人 + 动词", id:"hsk3-l04", html:"<h1>L04 · 兼语句：让 / 叫 / 请 / 派 / 使 + 人 + 动词</h1>\n<div class=\"lead\">掌握兼语句，能表达「让某人做某事」</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 让/叫/请/派/使 + 人 + 动词短语（老板让我加班）</b></td></tr>\n<tr><td>教学目标</td><td>掌握兼语句，能表达「让某人做某事」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu kiêm ngữ: 让/叫/请/派/使 + người + động từ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「使」偏书面且后面<b>不能</b>跟单个名词（× 使我做）；越南语 &quot;cho / để / khiến&quot; 的用法比汉语宽，学员会滥用「使」。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">领导</td><td class=\"pyc\">lǐng dǎo</td><td class=\"hv\">lĩnh đạo</td><td>dẫn dắt；dẫn đầu</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">老板</td><td class=\"pyc\">lǎo bǎn</td><td class=\"hv\">lão bản</td><td>sếp；chủ doanh nghiệp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">派</td><td class=\"pyc\">pài</td><td class=\"hv\">phái</td><td>bè phái；trường phái</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">使</td><td class=\"pyc\">shǐ</td><td class=\"hv\">sử</td><td>khiến；làm cho</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">员工</td><td class=\"pyc\">yuán gōng</td><td class=\"hv\">viên công</td><td>nhân viên; nhân sự; nhân công</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">部门</td><td class=\"pyc\">bù mén</td><td class=\"hv\">bộ môn</td><td>phòng；ban</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">部长</td><td class=\"pyc\">bù zhǎng</td><td class=\"hv\">bộ trường</td><td>người đứng đầu một bộ；trưởng phòng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">主任</td><td class=\"pyc\">zhǔ rèn</td><td class=\"hv\">chủ nhâm</td><td>giám đốc；trưởng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">所长</td><td class=\"pyc\">suǒ zhǎng</td><td class=\"hv\">sở trường</td><td>người đứng đầu một viện, v.v</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">人员</td><td class=\"pyc\">rén yuán</td><td class=\"hv\">nhân viên</td><td>nhân viên；đội ngũ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">职工</td><td class=\"pyc\">zhí gōng</td><td class=\"hv\">chức công</td><td>nhân viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">公务员</td><td class=\"pyc\">gōng wù yuán</td><td class=\"hv\">công vụ viên</td><td>công chức；người làm việc văn phòng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">工程师</td><td class=\"pyc\">gōng chéng shī</td><td class=\"hv\">công trình sư</td><td>kỹ sư</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">教练</td><td class=\"pyc\">jiào liàn</td><td class=\"hv\">giáo luyện</td><td>người hướng dẫn；huấn luyện viên thể thao</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">导演</td><td class=\"pyc\">dǎo yǎn</td><td class=\"hv\">đạo diễn</td><td>đạo diễn；đạo diễn (phim, v.v.)</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">演员</td><td class=\"pyc\">yǎn yuán</td><td class=\"hv\">diễn viên</td><td>diễn viên</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L05 结果补语（一）：动词 + 完 / 好 / 到 / 见", id:"hsk3-l05", html:"<h1>L05 · 结果补语（一）：动词 + 完 / 好 / 到 / 见</h1>\n<div class=\"lead\">掌握结果补语「完/好/到/见」，能说清动作的结果</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 完 / 好 / 到 / 见 +（宾语）（写完 / 做好 / 看到 / 听见）</b></td></tr>\n<tr><td>教学目标</td><td>掌握结果补语「完/好/到/见」，能说清动作的结果</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ kết quả (1): động từ + 完/好/到/见</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「完」表动作结束、「好」表完成且结果令人满意（做好了）；越南语 &quot;xong&quot; 只对应前者。有宾语时补语紧贴动词：「看完书」不能说成「看书完」。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">歌手</td><td class=\"pyc\">gē shǒu</td><td class=\"hv\">ca thủ</td><td>ca sĩ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">记者</td><td class=\"pyc\">jì zhě</td><td class=\"hv\">kí giả</td><td>phóng viên; nhà báo</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">服务员</td><td class=\"pyc\">fú wù yuán</td><td class=\"hv\">phục vụ viên</td><td>bồi bàn；nhân viên phục vụ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">志愿者</td><td class=\"pyc\">zhì yuàn zhě</td><td class=\"hv\">chí nguyện giả</td><td>tình nguyện viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">队员</td><td class=\"pyc\">duì yuán</td><td class=\"hv\">đội viên</td><td>thành viên đội</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">成员</td><td class=\"pyc\">chéng yuán</td><td class=\"hv\">thành viên</td><td>thành viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">专家</td><td class=\"pyc\">zhuān jiā</td><td class=\"hv\">gia</td><td>chuyên gia; chuyên viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">人才</td><td class=\"pyc\">rén cái</td><td class=\"hv\">nhân tài</td><td>tài năng；người tài năng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">代表</td><td class=\"pyc\">dài biǎo</td><td class=\"hv\">đại (5 n) biểu</td><td>đại diện；đại biểu</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">保安</td><td class=\"pyc\">bǎo ān</td><td class=\"hv\">bảo an</td><td>bảo đảm an ninh công cộng；bảo đảm an toàn</td><td class=\"hint\">区别词 / 名词</td></tr><tr><td class=\"hz\">代表团</td><td class=\"pyc\">dài biǎo tuán</td><td class=\"hv\">đại (5 n) biểu đoàn</td><td>đoàn đại biểu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">代</td><td class=\"pyc\">dài</td><td class=\"hv\">đại (5 n)</td><td>thay thế；làm thay cho người khác</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">任</td><td class=\"pyc\">rèn</td><td class=\"hv\">nhâm</td><td>bổ nhiệm；chỉ định</td><td class=\"hint\">动词 / 量词</td></tr><tr><td class=\"hz\">职业</td><td class=\"pyc\">zhí yè</td><td class=\"hv\">chức nghiệp</td><td>nghề nghiệp；chuyên nghiệp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">事业</td><td class=\"pyc\">shì yè</td><td class=\"hv\">sự nghiệp</td><td>công việc；dự án</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">就业</td><td class=\"pyc\">jiù yè</td><td class=\"hv\">tựu nghiệp</td><td>tìm được việc làm；việc làm</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L06 结果补语（二）：动词 + 懂 / 成 / 住 / 掉 / 光", id:"hsk3-l06", html:"<h1>L06 · 结果补语（二）：动词 + 懂 / 成 / 住 / 掉 / 光</h1>\n<div class=\"lead\">扩展结果补语，掌握「懂/成/住/掉/光」的引申义</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 懂 / 成 / 住 / 掉 / 光（听懂 / 变成 / 记住 / 卖掉 / 花光）</b></td></tr>\n<tr><td>教学目标</td><td>扩展结果补语，掌握「懂/成/住/掉/光」的引申义</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ kết quả (2): động từ + 懂/成/住/掉/光</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L05</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">这几个补语多是<b>引申义</b>，越南语没有对应词：「记住」的「住」不表居住、「花光」的「光」不表光线。必须整词教，不要逐字翻译。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">创业</td><td class=\"pyc\">chuàng yè</td><td class=\"hv\">sang nghiệp</td><td>bắt đầu sự nghiệp; khởi nghiệp；tinh thần khởi nghiệp</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">退休</td><td class=\"pyc\">tuì xiū</td><td class=\"hv\">thối hưu</td><td>nghỉ hưu (khỏi lực lượng lao động)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">工资</td><td class=\"pyc\">gōng zī</td><td class=\"hv\">công tư</td><td>tiền lương; lương</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">资格</td><td class=\"pyc\">zī gé</td><td class=\"hv\">tư cách</td><td>trình độ；người có thâm niên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">专业</td><td class=\"pyc\">zhuān yè</td><td class=\"hv\">nghiệp</td><td>chuyên môn；lĩnh vực chuyên ngành</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">专门</td><td class=\"pyc\">zhuān mén</td><td class=\"hv\">môn</td><td>chuyên gia；chuyên môn</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">志愿</td><td class=\"pyc\">zhì yuàn</td><td class=\"hv\">chí nguyện</td><td>nguyện vọng；tham vọng</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">报到</td><td class=\"pyc\">bào dào</td><td class=\"hv\">báo đáo</td><td>báo cáo có mặt；đăng ký</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">手续</td><td class=\"pyc\">shǒu xù</td><td class=\"hv\">thủ tục</td><td>thủ tục</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">证件</td><td class=\"pyc\">zhèng jiàn</td><td class=\"hv\">chứng kiện</td><td>giấy chứng nhận</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">身份证</td><td class=\"pyc\">shēn fèn zhèng</td><td class=\"hv\">thân phân chứng</td><td>thẻ căn cước；chứng minh thư</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">训练</td><td class=\"pyc\">xùn liàn</td><td class=\"hv\">huấn luyện</td><td>huấn luyện；diễn tập</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">本领</td><td class=\"pyc\">běn lǐng</td><td class=\"hv\">bổn lĩnh</td><td>kỹ năng；khả năng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">本事</td><td class=\"pyc\">běn shì</td><td class=\"hv\">bổn sự</td><td>tài liệu gốc；câu chuyện gốc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">工夫</td><td class=\"pyc\">gōng fu</td><td class=\"hv\">công phu</td><td>khoảng thời gian；thời gian rảnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">保留</td><td class=\"pyc\">bǎo liú</td><td class=\"hv\">bảo lưu</td><td>giữ；lưu giữ</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L07 可能补语：动词 + 得 / 不 + 结果补语", id:"hsk3-l07", html:"<h1>L07 · 可能补语：动词 + 得 / 不 + 结果补语</h1>\n<div class=\"lead\">掌握可能补语，能表达「能不能做到」</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 得 / 不 + 结果补语（看得懂 / 看不懂）</b></td></tr>\n<tr><td>教学目标</td><td>掌握可能补语，能表达「能不能做到」</td></tr>\n<tr><td>Tiếng Việt</td><td>Bổ ngữ khả năng: động từ + 得/不 + bổ ngữ kết quả</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L05、L06</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">可能补语与「能 + 动词」不同：可能补语谈<b>客观能否实现</b>（看不完），「能」谈<b>主观能力或条件允许</b>。越南语 &quot;có thể&quot; 混在一起，是最难的一对。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">经营</td><td class=\"pyc\">jīng yíng</td><td class=\"hv\">kinh doanh</td><td>tham gia</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">管理</td><td class=\"pyc\">guǎn lǐ</td><td class=\"hv\">quản lý</td><td>giám sát；quản lý</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">合作</td><td class=\"pyc\">hé zuò</td><td class=\"hv\">hợp tác</td><td>hợp tác</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">谈判</td><td class=\"pyc\">tán pàn</td><td class=\"hv\">đàm phán</td><td>đàm phán；thương lượng</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">交易</td><td class=\"pyc\">jiāo yì</td><td class=\"hv\">giao dịch</td><td>giao dịch；giao dịch; thỏa thuận</td><td class=\"hint\">名词 / 动名词</td></tr><tr><td class=\"hz\">生意</td><td class=\"pyc\">shēng yì</td><td class=\"hv\">sinh ý</td><td>sinh lực；sức sống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">商业</td><td class=\"pyc\">shāng yè</td><td class=\"hv\">thương nghiệp</td><td>kinh doanh；thương mại</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">建立</td><td class=\"pyc\">jiàn lì</td><td class=\"hv\">kiến lập</td><td>thiết lập；thành lập</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">成立</td><td class=\"pyc\">chéng lì</td><td class=\"hv\">thành lập</td><td>thiết lập；lập nên</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">设立</td><td class=\"pyc\">shè lì</td><td class=\"hv\">thiết lập</td><td>thiết lập; thành lập</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">开展</td><td class=\"pyc\">kāi zhǎn</td><td class=\"hv\">khai triển</td><td>khai mạc；phát triển</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">举办</td><td class=\"pyc\">jǔ bàn</td><td class=\"hv\">cử bạn</td><td>tổ chức；tiến hành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">主持</td><td class=\"pyc\">zhǔ chí</td><td class=\"hv\">chủ trì</td><td>phụ trách；quản lý hoặc điều hành</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">团体</td><td class=\"pyc\">tuán tǐ</td><td class=\"hv\">đoàn thể</td><td>nhóm；tổ chức</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">集体</td><td class=\"pyc\">jí tǐ</td><td class=\"hv\">tập thể</td><td>tập thể (quyết định)；nỗ lực chung</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">制度</td><td class=\"pyc\">zhì dù</td><td class=\"hv\">chế độ</td><td>hệ thống；thiết chế</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L08 单元一综合：职场沟通", id:"hsk3-l08", html:"<h1>L08 · 单元一综合：职场沟通</h1>\n<div class=\"lead\">综合运用把字句、被字句、兼语句与补语，完成职场沟通任务</div>\n<table>\n<tr><td>所属单元</td><td>单元1 · 工作与职业（Công việc và nghề nghiệp）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>把字句 ｜ 被字句 ｜ 兼语句 ｜ 结果补语 ｜ 可能补语（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用把字句、被字句、兼语句与补语，完成职场沟通任务</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 1: Giao tiếp nơi công sở</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L01、L03、L04、L07</td></tr>\n<tr><td>词量 / 课时</td><td>16 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">四种句式混用时会互相干扰（「我把报告被写完」）。要按「谁对谁做了什么」先定句式，再填内容。</div>\n\n<h2>本课词表 16 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">规定</td><td class=\"pyc\">guī dìng</td><td class=\"hv\">quy định</td><td>quy định；quy tắc</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">规范</td><td class=\"pyc\">guī fàn</td><td class=\"hv\">quy phạm</td><td>chuẩn mực；tiêu chuẩn</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">办理</td><td class=\"pyc\">bàn lǐ</td><td class=\"hv\">bạn lý</td><td>xử lý; tiến hành; thực hiện</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">批准</td><td class=\"pyc\">pī zhǔn</td><td class=\"hv\">phê chuẩn</td><td>phê duyệt; phê chuẩn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">宣布</td><td class=\"pyc\">xuān bù</td><td class=\"hv\">tuyên bố</td><td>tuyên bố；thông báo</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">公布</td><td class=\"pyc\">gōng bù</td><td class=\"hv\">công bố</td><td>công bố; công khai; xuất bản</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">声明</td><td class=\"pyc\">shēng míng</td><td class=\"hv\">thanh minh</td><td>phát biểu；tuyên bố</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">决定</td><td class=\"pyc\">jué dìng</td><td class=\"hv\">quyết định</td><td>quyết định (làm gì đó)；quyết tâm</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">确定</td><td class=\"pyc\">què dìng</td><td class=\"hv\">xác định</td><td>rõ ràng；chắc chắn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">交流</td><td class=\"pyc\">jiāo liú</td><td class=\"hv\">giao lưu</td><td>trao đổi；sự trao đổi</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">谈话</td><td class=\"pyc\">tán huà</td><td class=\"hv\">đàm thoại</td><td>nói chuyện (với ai đó)；có cuộc trò chuyện</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">发言</td><td class=\"pyc\">fā yán</td><td class=\"hv\">phát ngôn</td><td>phát biểu；tuyên bố</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">提问</td><td class=\"pyc\">tí wèn</td><td class=\"hv\">đề vấn</td><td>đặt câu hỏi; kiểm tra; chất vấn</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">请教</td><td class=\"pyc\">qǐng jiào</td><td class=\"hv\">thỉnh giáo</td><td>hỏi để được hướng dẫn；tham khảo</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">指导</td><td class=\"pyc\">zhǐ dǎo</td><td class=\"hv\">chỉ đạo</td><td>hướng dẫn；đưa ra chỉ đạo</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">动力</td><td class=\"pyc\">dòng lì</td><td class=\"hv\">động lực</td><td>động lực (vật lý)；lực</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}

  {title:"三、单元2 社会与公共事务", id:"hsk3-g2", children:[
    {title:"L09 「是…的」强调句", id:"hsk3-l09", html:"<h1>L09 · 「是…的」强调句</h1>\n<div class=\"lead\">掌握「是…的」句，能强调时间、地点、方式</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 是 +（时间/地点/方式）+ 动词 + 的（我是昨天来的）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「是…的」句，能强调时间、地点、方式</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu nhấn mạnh 「是…的」</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「是…的」强调<b>已发生</b>动作的时间/地点/方式，不能用于将来的事。越南语没有对应结构，学员会说「我昨天来」而漏掉「是…的」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">社会</td><td class=\"pyc\">shè huì</td><td class=\"hv\">xã hội</td><td>xã hội</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">人民</td><td class=\"pyc\">rén mín</td><td class=\"hv\">nhân dân</td><td>nhân dân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">公民</td><td class=\"pyc\">gōng mín</td><td class=\"hv\">công dân</td><td>công dân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">老百姓</td><td class=\"pyc\">lǎo bǎi xìng</td><td class=\"hv\">lão bách tính</td><td>người dân thường；người bình thường</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">人群</td><td class=\"pyc\">rén qún</td><td class=\"hv\">nhân quần</td><td>đám đông</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">民族</td><td class=\"pyc\">mín zú</td><td class=\"hv\">dân tộc</td><td>quốc tịch; dân tộc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">中华民族</td><td class=\"pyc\">Zhōng huá mín zú</td><td class=\"hv\">trung hoa dân tộc</td><td>dân tộc Trung Hoa；nhân dân Trung Hoa</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">人类</td><td class=\"pyc\">rén lèi</td><td class=\"hv\">nhân loại</td><td>nhân loại；chủng tộc loài người</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">世界</td><td class=\"pyc\">shì jiè</td><td class=\"hv\">thế giới</td><td>—</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">和平</td><td class=\"pyc\">hé píng</td><td class=\"hv\">hòa bình</td><td>hòa bình</td><td class=\"hint\">名词 / 副形词</td></tr><tr><td class=\"hz\">联合国</td><td class=\"pyc\">Lián hé guó</td><td class=\"hv\">liên hợp quốc</td><td>Liên Hợp Quốc</td><td class=\"hint\"></td></tr><tr><td class=\"hz\">华人</td><td class=\"pyc\">Huá rén</td><td class=\"hv\">hoa nhân</td><td>người Hoa hoặc người gốc Hoa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">国内</td><td class=\"pyc\">guó nèi</td><td class=\"hv\">quốc nội</td><td>nội địa；bên trong (một quốc gia)</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">全球</td><td class=\"pyc\">quán qiú</td><td class=\"hv\">toàn cầu</td><td>toàn thế giới；toàn cầu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">个人</td><td class=\"pyc\">gè rén</td><td class=\"hv\">cá nhân</td><td>cá nhân；riêng tư</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L10 「由」引出责任者", id:"hsk3-l10", html:"<h1>L10 · 「由」引出责任者</h1>\n<div class=\"lead\">掌握「由」字句，能说明某事由谁负责</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>主语 + 由 + 施事 + 动词（这件事由他负责）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「由」字句，能说明某事由谁负责</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu chữ 由: nêu người chịu trách nhiệm</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「由」只引出<b>施事</b>，不表原因（原因用「由于」）。越南语 &quot;do&quot; 兼表原因和施事，学员会混用「由」和「由于」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">由</td><td class=\"pyc\">yóu</td><td class=\"hv\">do</td><td>theo；từ</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">警察</td><td class=\"pyc\">jǐng chá</td><td class=\"hv\">cảnh sát</td><td>cảnh sát; sĩ quan cảnh sát</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">交警</td><td class=\"pyc\">jiāo jǐng</td><td class=\"hv\">giao cảnh</td><td>cảnh sát giao thông</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">合法</td><td class=\"pyc\">hé fǎ</td><td class=\"hv\">hợp pháp</td><td>hợp pháp；chính đáng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">公共</td><td class=\"pyc\">gōng gòng</td><td class=\"hv\">công cộng</td><td>công cộng; chung; công</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">实行</td><td class=\"pyc\">shí xíng</td><td class=\"hv\">thật hành</td><td>thực hiện；tiến hành</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">制定</td><td class=\"pyc\">zhì dìng</td><td class=\"hv\">chế định</td><td>soạn thảo; xây dựng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">按照</td><td class=\"pyc\">àn zhào</td><td class=\"hv\">án chiếu</td><td>theo；dựa theo</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">反对</td><td class=\"pyc\">fǎn duì</td><td class=\"hv\">phản đối</td><td>phản đối; chống lại</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">取消</td><td class=\"pyc\">qǔ xiāo</td><td class=\"hv\">thủ tiêu</td><td>hủy；bãi bỏ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">公开</td><td class=\"pyc\">gōng kāi</td><td class=\"hv\">công khai</td><td>mở; công khai; công cộng；công bố; phát hành</td><td class=\"hint\">动词 / 副形词</td></tr><tr><td class=\"hz\">武器</td><td class=\"pyc\">wǔ qì</td><td class=\"hv\">vũ khí</td><td>vũ khí；đồ quân dụng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">事故</td><td class=\"pyc\">shì gù</td><td class=\"hv\">sự cố</td><td>tai nạn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">危害</td><td class=\"pyc\">wēi hài</td><td class=\"hv\">nguy hại</td><td>gây nguy hại；làm hại</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">海关</td><td class=\"pyc\">hǎi guān</td><td class=\"hv\">hải quan</td><td>hải quan (tức kiểm tra cửa khẩu)</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L11 双宾语句", id:"hsk3-l11", html:"<h1>L11 · 双宾语句</h1>\n<div class=\"lead\">掌握双宾语句，能表达「给谁什么」</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>动词 + 人 + 物（给我一本书）｜ 动词 + 物 + 给 + 人（送一本书给我）</b></td></tr>\n<tr><td>教学目标</td><td>掌握双宾语句，能表达「给谁什么」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu hai tân ngữ</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">双宾语的语序是「人先物后」；越南语 &quot;cho ai cái gì&quot; 也是人先，但「送…给…」这种<b>物先人后</b>的变式是汉语特有，学员不会用。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">媒体</td><td class=\"pyc\">méi tǐ</td><td class=\"hv\">môi thể</td><td>truyền thông</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">报道</td><td class=\"pyc\">bào dào</td><td class=\"hv\">báo đạo</td><td>đưa tin (tin tức)；bản tin</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">广播</td><td class=\"pyc\">guǎng bō</td><td class=\"hv\">nghiễm bá</td><td>phát sóng；phát thanh</td><td class=\"hint\">动名词 / 名词</td></tr><tr><td class=\"hz\">电视台</td><td class=\"pyc\">diàn shì tái</td><td class=\"hv\">điện thị thai</td><td>đài truyền hình</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">电台</td><td class=\"pyc\">diàn tái</td><td class=\"hv\">điện thai</td><td>máy phát thu；trạm phát sóng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">播放</td><td class=\"pyc\">bō fàng</td><td class=\"hv\">bá phóng</td><td>phát sóng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">播出</td><td class=\"pyc\">bō chū</td><td class=\"hv\">bá xuất</td><td>phát sóng；phát (chương trình TV, v.v.)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">收听</td><td class=\"pyc\">shōu tīng</td><td class=\"hv\">thu thính</td><td>nghe (chương trình phát thanh)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">收看</td><td class=\"pyc\">shōu kàn</td><td class=\"hv\">thu khán</td><td>xem (chương trình TV)</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">杂志</td><td class=\"pyc\">zá zhì</td><td class=\"hv\">tạp chí</td><td>tạp chí；LT:本,份,期</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">消息</td><td class=\"pyc\">xiāo xi</td><td class=\"hv\">tiêu tức</td><td>tin tức；thông tin</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">事件</td><td class=\"pyc\">shì jiàn</td><td class=\"hv\">sự kiện</td><td>sự kiện；sự việc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">调查</td><td class=\"pyc\">diào chá</td><td class=\"hv\">điều tra</td><td>điều tra；cuộc điều tra</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">发表</td><td class=\"pyc\">fā biǎo</td><td class=\"hv\">phát biểu</td><td>phát hành；công bố</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">宣传</td><td class=\"pyc\">xuān chuán</td><td class=\"hv\">tuyên truyện</td><td>truyền bá；quảng cáo</td><td class=\"hint\">动名词 / 动词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L12 「对 / 向 / 跟 / 给」引介对象", id:"hsk3-l12", html:"<h1>L12 · 「对 / 向 / 跟 / 给」引介对象</h1>\n<div class=\"lead\">掌握四个引介介词的区别，能说清「对谁、向谁、跟谁、给谁」</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>对 + 人 + 态度/看法 ｜ 向 + 人 + 动作 ｜ 跟 + 人 + 互动 ｜ 给 + 人 + 动作</b></td></tr>\n<tr><td>教学目标</td><td>掌握四个引介介词的区别，能说清「对谁、向谁、跟谁、给谁」</td></tr>\n<tr><td>Tiếng Việt</td><td>Giới từ 「对/向/跟/给」dẫn đối tượng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">四个词都译成越南语的 &quot;với / cho&quot;，学员会随便挑一个。要按<b>语义场</b>记：对（态度）、向（方向）、跟（互动）、给（给予）。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">证明</td><td class=\"pyc\">zhèng míng</td><td class=\"hv\">chứng minh</td><td>bằng chứng；chứng chỉ</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">证据</td><td class=\"pyc\">zhèng jù</td><td class=\"hv\">chứng cư</td><td>bằng chứng；chứng cứ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">事实</td><td class=\"pyc\">shì shí</td><td class=\"hv\">sự thật</td><td>sự thật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">现场</td><td class=\"pyc\">xiàn chǎng</td><td class=\"hv\">hiện tràng</td><td>hiện trường；tại chỗ</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">情况</td><td class=\"pyc\">qíng kuàng</td><td class=\"hv\">tình huống</td><td>hoàn cảnh; tình hình; tình huống</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">话题</td><td class=\"pyc\">huà tí</td><td class=\"hv\">thoại đề</td><td>chủ đề (của cuộc nói chuyện)；đề tài</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">传说</td><td class=\"pyc\">chuán shuō</td><td class=\"hv\">truyện thuyết</td><td>truyền thuyết; câu chuyện dân gian；thuật lại từ người này sang người</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">发生</td><td class=\"pyc\">fā shēng</td><td class=\"hv\">phát sinh</td><td>xảy ra</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">造成</td><td class=\"pyc\">zào chéng</td><td class=\"hv\">tạo thành</td><td>gây ra; tạo ra; khiến</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">产生</td><td class=\"pyc\">chǎn shēng</td><td class=\"hv\">sản sinh</td><td>phát sinh; hình thành; xảy ra；tạo ra</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">关注</td><td class=\"pyc\">guān zhù</td><td class=\"hv\">quan chú</td><td>chú ý đến；quan tâm; hứng thú; chú ý</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">关系</td><td class=\"pyc\">guān xi</td><td class=\"hv\">quan hệ</td><td>quan hệ；mối quan hệ</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">联系</td><td class=\"pyc\">lián xì</td><td class=\"hv\">liên hệ</td><td>kết nối；liên hệ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">迎接</td><td class=\"pyc\">yíng jiē</td><td class=\"hv\">nghênh tiếp</td><td>chào đón; đón tiếp</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">接待</td><td class=\"pyc\">jiē dài</td><td class=\"hv\">tiếp đãi</td><td>tiếp đón</td><td class=\"hint\">动词 / 动名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L13 存现句", id:"hsk3-l13", html:"<h1>L13 · 存现句</h1>\n<div class=\"lead\">掌握存现句，能描述「某处有/是/存在什么」</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>处所 + 有 / 是 + 名词 ｜ 处所 + 动词 + 着 + 名词（桌上放着一本书）</b></td></tr>\n<tr><td>教学目标</td><td>掌握存现句，能描述「某处有/是/存在什么」</td></tr>\n<tr><td>Tiếng Việt</td><td>Câu tồn hiện</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">存现句的主语是<b>处所</b>，宾语才是事物；学员会说「一本书在桌上放着」，语序相反。越南语 &quot;trên bàn có…&quot; 语序与汉语一致，这一条反而好接受。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">访问</td><td class=\"pyc\">fǎng wèn</td><td class=\"hv\">phóng vấn</td><td>thăm；ghé thăm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">采取</td><td class=\"pyc\">cǎi qǔ</td><td class=\"hv\">thải thủ</td><td>áp dụng hoặc tiến hành；thực hiện</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">采用</td><td class=\"pyc\">cǎi yòng</td><td class=\"hv\">thải dụng</td><td>áp dụng；sử dụng</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">联合</td><td class=\"pyc\">lián hé</td><td class=\"hv\">liên hợp</td><td>kết hợp；gia nhập</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">团结</td><td class=\"pyc\">tuán jié</td><td class=\"hv\">đoàn kết</td><td>đoàn kết；sự đoàn kết; tinh thần đoàn kết</td><td class=\"hint\">动词 / 名形词</td></tr><tr><td class=\"hz\">普遍</td><td class=\"pyc\">pǔ biàn</td><td class=\"hv\">phổ biến</td><td>phổ quát；chung chung</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">广大</td><td class=\"pyc\">guǎng dà</td><td class=\"hv\">nghiễm đại</td><td>(về diện tích) rộng hoặc bao la；quy mô lớn</td><td class=\"hint\">区别词</td></tr><tr><td class=\"hz\">民间</td><td class=\"pyc\">mín jiān</td><td class=\"hv\">dân gian</td><td>trong nhân dân；dân gian</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">外交</td><td class=\"pyc\">wài jiāo</td><td class=\"hv\">ngoại giao</td><td>ngoại giao；thuộc ngoại giao</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">大使馆</td><td class=\"pyc\">dà shǐ guǎn</td><td class=\"hv\">đại sử quán</td><td>đại sứ quán</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">国庆</td><td class=\"pyc\">Guó qìng</td><td class=\"hv\">quốc khánh</td><td>Quốc khánh</td><td class=\"hint\">时间词 / 名词</td></tr><tr><td class=\"hz\">爱心</td><td class=\"pyc\">ài xīn</td><td class=\"hv\">ái tâm</td><td>lòng trắc ẩn；nhân ái</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">会员</td><td class=\"pyc\">huì yuán</td><td class=\"hv\">hội viên</td><td>thành viên</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">开放</td><td class=\"pyc\">kāi fàng</td><td class=\"hv\">khai phóng</td><td>nở hoa；mở</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">现象</td><td class=\"pyc\">xiàn xiàng</td><td class=\"hv\">hiện tượng</td><td>hiện tượng；bề ngoài</td><td class=\"hint\">名词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L14 「除了…以外」", id:"hsk3-l14", html:"<h1>L14 · 「除了…以外」</h1>\n<div class=\"lead\">掌握「除了…以外」的两种含义，能表达「排除」与「追加」</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>除了 + A + 以外，都/也 + B（排除）｜ 除了 + A + 以外，还 + B（追加）</b></td></tr>\n<tr><td>教学目标</td><td>掌握「除了…以外」的两种含义，能表达「排除」与「追加」</td></tr>\n<tr><td>Tiếng Việt</td><td>「除了…以外」: ngoài ra / trừ ra</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">无（本级第一课）</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「都/也」表排除、「还/也」表追加，学员分不清，会说出意思相反的句子。要配两组固定例句对比教。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">庆祝</td><td class=\"pyc\">qìng zhù</td><td class=\"hv\">khánh chúc</td><td>ăn mừng</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">纪念</td><td class=\"pyc\">jì niàn</td><td class=\"hv\">kỉ niệm</td><td>tưởng niệm; tôn vinh ký ức của；quà lưu niệm; kỷ vật; đồ lưu niệm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">文明</td><td class=\"pyc\">wén míng</td><td class=\"hv\">văn minh</td><td>văn minh；nền văn minh</td><td class=\"hint\">名词 / 形容词</td></tr><tr><td class=\"hz\">破坏</td><td class=\"pyc\">pò huài</td><td class=\"hv\">phá hoại</td><td>sự phá hủy；hư hại</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">保护</td><td class=\"pyc\">bǎo hù</td><td class=\"hv\">bảo hộ</td><td>bảo vệ；phòng thủ</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">农民</td><td class=\"pyc\">nóng mín</td><td class=\"hv\">nông dân</td><td>nông dân; nông phu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">姑娘</td><td class=\"pyc\">gū niang</td><td class=\"hv\">cô nương</td><td>cô gái；người phụ nữ trẻ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">各位</td><td class=\"pyc\">gè wèi</td><td class=\"hv\">các vị</td><td>mọi người；tất cả (khách, đồng nghiệp, v.v.)</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">听众</td><td class=\"pyc\">tīng zhòng</td><td class=\"hv\">thính chúng</td><td>khán giả；thính giả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">命运</td><td class=\"pyc\">mìng yùn</td><td class=\"hv\">mệnh vận</td><td>số phận; định mệnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">人生</td><td class=\"pyc\">rén shēng</td><td class=\"hv\">nhân sinh</td><td>đời người</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">内心</td><td class=\"pyc\">nèi xīn</td><td class=\"hv\">nội tâm</td><td>trái tim; tận sâu trong lòng；(toán) tâm nội tiếp</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">感受</td><td class=\"pyc\">gǎn shòu</td><td class=\"hv\">cảm thụ</td><td>cảm nhận；nhận thức</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">愿望</td><td class=\"pyc\">yuàn wàng</td><td class=\"hv\">nguyện vọng</td><td>khát vọng；ước muốn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">幸运</td><td class=\"pyc\">xìng yùn</td><td class=\"hv\">hạnh vận</td><td>may mắn；phúc lành; vận may</td><td class=\"hint\">形容词 / 名形词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L15 「无论…都」「不管…都」", id:"hsk3-l15", html:"<h1>L15 · 「无论…都」「不管…都」</h1>\n<div class=\"lead\">掌握无条件让步句，能表达「不管什么情况结果都一样」</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>无论 / 不管 + 疑问代词 / 正反疑问 + 都 + 结果（无论多难都要做）</b></td></tr>\n<tr><td>教学目标</td><td>掌握无条件让步句，能表达「不管什么情况结果都一样」</td></tr>\n<tr><td>Tiếng Việt</td><td>「无论…都」「不管…都」: dù…thế nào cũng</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L14</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">「无论」后面<b>必须</b>有疑问代词或正反疑问形式（无论谁 / 无论去不去），不能直接跟名词（× 无论困难）。越南语 &quot;dù&quot; 没有这个限制，学员常错。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">交往</td><td class=\"pyc\">jiāo wǎng</td><td class=\"hv\">giao vãng</td><td>giao thiệp (với)；có liên hệ (với)</td><td class=\"hint\">动名词 / 动词</td></tr><tr><td class=\"hz\">互相</td><td class=\"pyc\">hù xiāng</td><td class=\"hv\">hỗ tương</td><td>lẫn nhau；tương hỗ</td><td class=\"hint\">副词 / 区别词</td></tr><tr><td class=\"hz\">亲自</td><td class=\"pyc\">qīn zì</td><td class=\"hv\">thân tự</td><td>đích thân；tự mình</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">体验</td><td class=\"pyc\">tǐ yàn</td><td class=\"hv\">thể nghiệm</td><td>trải nghiệm</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">存在</td><td class=\"pyc\">cún zài</td><td class=\"hv\">tồn tại</td><td>tồn tại；là</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">生存</td><td class=\"pyc\">shēng cún</td><td class=\"hv\">sinh tồn</td><td>tồn tại；sống sót</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">自主</td><td class=\"pyc\">zì zhǔ</td><td class=\"hv\">tự chủ</td><td>độc lập；tự mình quyết định</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">自觉</td><td class=\"pyc\">zì jué</td><td class=\"hv\">tự giác</td><td>có ý thức；nhận thức</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">自身</td><td class=\"pyc\">zì shēn</td><td class=\"hv\">tự thân</td><td>bản thân；tự mình</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">积极性</td><td class=\"pyc\">jī jí xìng</td><td class=\"hv\">tích cực tính</td><td>nhiệt huyết；sáng kiến</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">长处</td><td class=\"pyc\">cháng chù</td><td class=\"hv\">trường xứ</td><td>điểm tốt；điểm mạnh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">短处</td><td class=\"pyc\">duǎn chù</td><td class=\"hv\">đoản xứ</td><td>khuyết điểm；thiếu sót</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">据说</td><td class=\"pyc\">jù shuō</td><td class=\"hv\">cư thuyết</td><td>nghe nói rằng; theo báo cáo</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">每</td><td class=\"pyc\">měi</td><td class=\"hv\">mỗi</td><td>mỗi；mọi</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">各</td><td class=\"pyc\">gè</td><td class=\"hv\">các</td><td>mỗi；từng</td><td class=\"hint\">代词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"},
    {title:"L16 单元二综合：社会话题讨论", id:"hsk3-l16", html:"<h1>L16 · 单元二综合：社会话题讨论</h1>\n<div class=\"lead\">综合运用强调句、由字句、存现句与让步句，讨论社会话题</div>\n<table>\n<tr><td>所属单元</td><td>单元2 · 社会与公共事务（Xã hội và công việc công cộng）</td></tr>\n<tr><td>结构公式</td><td class=\"mono\"><b>是…的 ｜ 由 ｜ 双宾语 ｜ 存现句 ｜ 除了…以外 ｜ 无论…都（综合）</b></td></tr>\n<tr><td>教学目标</td><td>综合运用强调句、由字句、存现句与让步句，讨论社会话题</td></tr>\n<tr><td>Tiếng Việt</td><td>Tổng hợp đơn vị 2: Thảo luận chủ đề xã hội</td></tr>\n<tr><td>前置课次</td><td class=\"mono\">L09、L10、L13、L15</td></tr>\n<tr><td>词量 / 课时</td><td>15 词 / 45 分钟</td></tr>\n</table>\n\n<h2>越南学员易错点</h2>\n<div class=\"note\">综合表达时学员会堆叠句式（「无论是由他负责的事都被…」）。要练「一句话一个核心句式」。</div>\n\n<h2>本课词表 15 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">各种</td><td class=\"pyc\">gè zhǒng</td><td class=\"hv\">các chủng</td><td>mỗi loại</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">各自</td><td class=\"pyc\">gè zì</td><td class=\"hv\">các tự</td><td>mỗi；tương ứng</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">一切</td><td class=\"pyc\">yī qiè</td><td class=\"hv\">nhất thiết</td><td>mọi thứ；mọi</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">任何</td><td class=\"pyc\">rèn hé</td><td class=\"hv\">nhâm hà</td><td>bất kỳ; bất cứ; nào cũng được</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">只有</td><td class=\"pyc\">zhǐ yǒu</td><td class=\"hv\">chỉ hữu</td><td>chỉ có；chỉ có ... (mới ...)</td><td class=\"hint\">连词 / 副词</td></tr><tr><td class=\"hz\">如何</td><td class=\"pyc\">rú hé</td><td class=\"hv\">như hà</td><td>như thế nào；cách gì</td><td class=\"hint\">代词</td></tr><tr><td class=\"hz\">首先</td><td class=\"pyc\">shǒu xiān</td><td class=\"hv\">thủ tiên</td><td>trước tiên；điều đầu tiên</td><td class=\"hint\">副词 / 连词</td></tr><tr><td class=\"hz\">其次</td><td class=\"pyc\">qí cì</td><td class=\"hv\">kỳ thứ</td><td>tiếp theo；thứ hai</td><td class=\"hint\">连词 / 代词</td></tr><tr><td class=\"hz\">相似</td><td class=\"pyc\">xiāng sì</td><td class=\"hv\">tương tự</td><td>tương tự; giống nhau</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">类似</td><td class=\"pyc\">lèi sì</td><td class=\"hv\">loại tự</td><td>tương tự; tương đồng</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">区别</td><td class=\"pyc\">qū bié</td><td class=\"hv\">khu biệt</td><td>sự khác biệt；phân biệt</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">报</td><td class=\"pyc\">bào</td><td class=\"hv\">báo</td><td>thông báo；thông tin</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">传播</td><td class=\"pyc\">chuán bō</td><td class=\"hv\">truyện bá</td><td>truyền bá; phổ biến; lan truyền</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">传来</td><td class=\"pyc\">chuán lái</td><td class=\"hv\">truyện lai</td><td>(về âm thanh) truyền đến；được nghe thấy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">除了</td><td class=\"pyc\">chú le</td><td class=\"hv\">trừ liễu</td><td>ngoài ra；ngoài (... còn...)</td><td class=\"hint\">介词</td></tr></table>\n<h2>本课教案状态</h2>\n<div class=\"todo\">教案正文（例句 / 对话 / 课堂操练 / 作业）尚未写。\n写教案时按上面四项展开：结构公式 → 3～5 个替换例句 → 一段对话 → 课堂操练 → 针对易错点的纠错练习。</div>"}
