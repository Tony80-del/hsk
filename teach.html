  {title:"十、语法点索引", id:"hsk3-g10", children:[
    {title:"10.1 全部语法点（64 个）", id:"hsk3-gr1", html:"<h1>全部语法点（64 个）</h1>\n<div class=\"lead\">三级的课次顺序 = 语法难度递进顺序；单元主题决定「这 8 课的词从哪个语义场来」。这张表是备课与复习的总索引：\n左边单元、中间课次、右边结构公式。「前置」列是学该课前必须先掌握的课次，\n排课时如果学员缺课，照这一列补。「教案」列标出哪些课已经有完整教案正文。</div>\n<table>\n<tr><td>单元</td><td>课次</td><td>语法点</td><td>结构公式</td><td>前置</td><td>词量</td><td>教案</td></tr>\n<tr><td><b>1</b></td><td class='mono'>L01</td><td>把字句（一）：把 + 宾语 + 动词 + 补语</td><td class='mono'>主语 + 把 + 宾语 + 动词 + 补语（把报告写完）</td><td>—</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L02</td><td>把字句（二）：把 + 宾语 + 动词 + 在/到/给</td><td class='mono'>主语 + 把 + 宾语 + 动词 + 在/到/给 + 处所/对象（把文件放在桌上）</td><td>L01</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L03</td><td>被字句：被 + 施事 + 动词</td><td class='mono'>主语 + 被 + 施事 + 动词 + 其他成分（杯子被他打破了）</td><td>L01</td><td>17</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L04</td><td>兼语句：让 / 叫 / 请 / 派 / 使 + 人 + 动词</td><td class='mono'>主语 + 让/叫/请/派/使 + 人 + 动词短语（老板让我加班）</td><td>—</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L05</td><td>结果补语（一）：动词 + 完 / 好 / 到 / 见</td><td class='mono'>动词 + 完 / 好 / 到 / 见 +（宾语）（写完 / 做好 / 看到 / 听见）</td><td>—</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L06</td><td>结果补语（二）：动词 + 懂 / 成 / 住 / 掉 / 光</td><td class='mono'>动词 + 懂 / 成 / 住 / 掉 / 光（听懂 / 变成 / 记住 / 卖掉 / 花光）</td><td>L05</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L07</td><td>可能补语：动词 + 得 / 不 + 结果补语</td><td class='mono'>动词 + 得 / 不 + 结果补语（看得懂 / 看不懂）</td><td>L05、L06</td><td>16</td><td>待写</td></tr><tr><td><b>1</b></td><td class='mono'>L08</td><td>单元一综合：职场沟通</td><td class='mono'>把字句 ｜ 被字句 ｜ 兼语句 ｜ 结果补语 ｜ 可能补语（综合）</td><td>L01、L03、L04、L07</td><td>16</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L09</td><td>「是…的」强调句</td><td class='mono'>主语 + 是 +（时间/地点/方式）+ 动词 + 的（我是昨天来的）</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L10</td><td>「由」引出责任者</td><td class='mono'>主语 + 由 + 施事 + 动词（这件事由他负责）</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L11</td><td>双宾语句</td><td class='mono'>动词 + 人 + 物（给我一本书）｜ 动词 + 物 + 给 + 人（送一本书给我）</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L12</td><td>「对 / 向 / 跟 / 给」引介对象</td><td class='mono'>对 + 人 + 态度/看法 ｜ 向 + 人 + 动作 ｜ 跟 + 人 + 互动 ｜ 给 + 人 + 动作</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L13</td><td>存现句</td><td class='mono'>处所 + 有 / 是 + 名词 ｜ 处所 + 动词 + 着 + 名词（桌上放着一本书）</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L14</td><td>「除了…以外」</td><td class='mono'>除了 + A + 以外，都/也 + B（排除）｜ 除了 + A + 以外，还 + B（追加）</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L15</td><td>「无论…都」「不管…都」</td><td class='mono'>无论 / 不管 + 疑问代词 / 正反疑问 + 都 + 结果（无论多难都要做）</td><td>L14</td><td>15</td><td>待写</td></tr><tr><td><b>2</b></td><td class='mono'>L16</td><td>单元二综合：社会话题讨论</td><td class='mono'>是…的 ｜ 由 ｜ 双宾语 ｜ 存现句 ｜ 除了…以外 ｜ 无论…都（综合）</td><td>L09、L10、L13、L15</td><td>15</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L17</td><td>比较：不如 / 没有…这么</td><td class='mono'>A + 不如 + B +（形容词）｜ A + 没有 + B +（这么/那么）+ 形容词</td><td>—</td><td>15</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L18</td><td>「越来越」「越…越…」</td><td class='mono'>越来越 + 形容词 ｜ 越 + A + 越 + B（越来越热 / 越说越快）</td><td>L17</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L19</td><td>数量表达：倍数 / 分数 / 百分比 / 大约</td><td class='mono'>A 是 B 的 + 倍数 ｜ 几分之几 ｜ 百分之 + 数 ｜ 大约 / 左右 + 数量</td><td>—</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L20</td><td>时量补语</td><td class='mono'>动词 + 了 + 时量 +（宾语）（等了两小时）｜ 动词 + 时量 + 的 + 宾语</td><td>—</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L21</td><td>动量补语</td><td class='mono'>动词 + 数 + 次 / 遍 / 回 / 趟（去过三次 / 读了两遍）</td><td>L20</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L22</td><td>「不仅…而且」「不但…还」</td><td class='mono'>不仅 / 不但 + A，而且 / 还 / 也 + B</td><td>—</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L23</td><td>「既然…就」「只要…就」</td><td class='mono'>既然 + 已定事实，就 + 结论 ｜ 只要 + 条件，就 + 结果</td><td>L22</td><td>14</td><td>待写</td></tr><tr><td><b>3</b></td><td class='mono'>L24</td><td>单元三综合：商业汇报</td><td class='mono'>不如 ｜ 越来越 ｜ 倍数 ｜ 时量/动量补语 ｜ 不仅…而且（综合）</td><td>L17、L19、L21、L22</td><td>15</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L25</td><td>趋向补语（一）：动词 + 来 / 去</td><td class='mono'>动词 + 来 / 去（进来 / 出去 / 带来 / 拿去）</td><td>—</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L26</td><td>趋向补语（二）：动词 + 上来 / 下去 / 出来 / 起来</td><td class='mono'>动词 + 上/下/出/起 + 来/去（走上来 / 跑出去 / 拿出来）</td><td>L25</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L27</td><td>趋向补语的引申义：「起来」「下去」</td><td class='mono'>形容词/动词 + 起来（表开始并持续）｜ 动词 + 下去（表继续）</td><td>L26</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L28</td><td>「进行 / 加以 / 予以」+ 双音节动词</td><td class='mono'>进行 / 加以 / 予以 + 双音节动词（进行研究 / 加以解决）</td><td>—</td><td>13</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L29</td><td>「为…所…」「被…所…」</td><td class='mono'>为 / 被 + 施事 + 所 + 动词（为人们所喜爱）</td><td>L03</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L30</td><td>被动意义的其他表达：受 / 挨 / 给</td><td class='mono'>受 + 动作名词 ｜ 挨 + 打/骂/批评 ｜ 给 + 动词（表被动）</td><td>L03</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L31</td><td>定语进阶：动词短语 + 的 + 名词</td><td class='mono'>（主谓/动宾短语）+ 的 + 名词（他昨天买的那本书）</td><td>—</td><td>14</td><td>待写</td></tr><tr><td><b>4</b></td><td class='mono'>L32</td><td>单元四综合：科技与网络</td><td class='mono'>趋向补语 ｜ 为…所… ｜ 进行/加以 ｜ 复杂定语（综合）</td><td>L26、L28、L29、L31</td><td>14</td><td>待写</td></tr><tr><td><b>5</b></td><td class='mono'>L33</td><td>程度补语：动词 + 得 + 很 / 不得了</td><td class='mono'>动词/形容词 + 得 + 很 / 不得了 / 要命（累得很 / 高兴得不得了）</td><td>L07</td><td>14</td><td>待写</td></tr><tr><td><b>5</b></td><td class='mono'>L34</td><td>「使 / 让 / 令」使役表达</td><td class='mono'>使 / 让 / 令 + 人 + 心理动词（使人高兴 / 令人失望）   {title:"十一、测验与题库", id:"hsk3-g11", children:[
    {title:"11.1 分级测试（HSK2 → HSK3 定级）", id:"hsk3-qz1", html:"<h1>分级测试（HSK2 → HSK3 定级）</h1>\n<div class=\"lead\">入班前 15 分钟，确定学员能不能直接进三级。目的不是打分，是<b>决定从哪一课开始</b>。</div>\n<table>\n<tr><td>对象</td><td>已学完 HSK2（累计 1,257 词）的学员</td></tr><tr><td>时长</td><td>15 分钟</td></tr><tr><td>构成</td><td>二级核心词汇 20 题（听音选义）+ 二级语法点 15 题（连词成句 / 选词填空）</td></tr><tr><td>及格</td><td>≥ 80%：直接进 L01</td></tr><tr><td>60–80%</td><td>先补 2 次二级复习课（重点：基础复句关联词、简单补语），再进 L01</td></tr><tr><td>&lt; 60%</td><td>回二级重学后 3 个单元</td></tr>\n</table>\n<div class=\"note\">为什么用二级内容定级：三级全部语法点（把/被字句、补语系统、复句系统）都建立在二级的虚词与基础句型之上，二级不牢的话，三级第一课（把字句）就会卡住。</div>"},
    {title:"11.2 单元测验（8 次）", id:"hsk3-qz2", html:"<h1>单元测验（8 次）</h1>\n<div class=\"lead\">每个单元结束后一次，45 分钟，覆盖该单元全部课次。插在单元最后一课之后，\n所以整级共 8 次单元测验。</div>\n<table>\n<tr><td>单元</td><td>名称</td><td>课次范围</td><td>词量</td><td>时长</td><td>重点语法点</td></tr>\n<tr><td><b>单元1</b></td><td>工作与职业</td><td class='mono'>L01–L08</td><td>129 词</td><td>45 分钟</td><td>把字句（一）：把 + 宾语 + 动词 + 补语、把字句（二）：把 + 宾语 + 动词 + 在/到/给、被字句：被 + 施事 + 动词…</td></tr><tr><td><b>单元2</b></td><td>社会与公共事务</td><td class='mono'>L09–L16</td><td>120 词</td><td>45 分钟</td><td>「是…的」强调句、「由」引出责任者、双宾语句…</td></tr><tr><td><b>单元3</b></td><td>经济与商业</td><td class='mono'>L17–L24</td><td>114 词</td><td>45 分钟</td><td>比较：不如 / 没有…这么、「越来越」「越…越…」、数量表达：倍数 / 分数 / 百分比 / 大约…</td></tr><tr><td><b>单元4</b></td><td>生产、科技与网络</td><td class='mono'>L25–L32</td><td>111 词</td><td>45 分钟</td><td>趋向补语（一）：动词 + 来 / 去、趋向补语（二）：动词 + 上来 / 下去 / 出来 / 起来、趋向补语的引申义：「起来」「下去」…</td></tr><tr><td><b>单元5</b></td><td>健康与身体</td><td class='mono'>L33–L40</td><td>115 词</td><td>45 分钟</td><td>程度补语：动词 + 得 + 很 / 不得了、「使 / 让 / 令」使役表达、时间副词：已经 / 曾经 / 刚刚 / 立刻…</td></tr><tr><td><b>单元6</b></td><td>情感与性格</td><td class='mono'>L41–L48</td><td>111 词</td><td>45 分钟</td><td>语气副词（一）：到底 / 究竟 / 简直、语气副词（二）：难道 / 千万 / 反正、副词：恐怕 / 只好 / 当然 / 其实…</td></tr><tr><td><b>单元7</b></td><td>城市、交通与环境</td><td class='mono'>L49–L56</td><td>126 词</td><td>45 分钟</td><td>方位与处所：上面 / 下面 / 里面 / 外面 / 当中、「往 / 朝 / 向 + 方位 + 动词」、距离与路线：离 / 到 / 从 / 经过…</td></tr><tr><td><b>单元8</b></td><td>文化、教育与艺术</td><td class='mono'>L57–L64</td><td>127 词</td><td>45 分钟</td><td>名词化后缀（一）：性 / 化、名词化后缀（二）：者 / 员 / 度、「所」字结构…</td></tr>\n</table>\n<h2>单次单元测验的结构（45 分钟）</h2>\n<table>\n<tr><td>部分</td><td>时长</td><td>题型</td><td>分值</td></tr>\n<tr><td>听力</td><td>10 分钟</td><td>听句子选图 / 听对话答问（本单元词与句型）</td><td>30</td></tr>\n<tr><td>语法</td><td>15 分钟</td><td>连词成句、选词填空（本单元语法点）</td><td>30</td></tr>\n<tr><td>阅读</td><td>10 分钟</td><td>短文理解（用累计词表 2,210 词出题）</td><td>20</td></tr>\n<tr><td>口语</td><td>10 分钟</td><td>看图说话 / 情景对话（本单元任务）</td><td>20</td></tr>\n</table>\n<div class=\"note\"><b>规则：</b>每单元末 1 次，20 题（10 题本单元词汇 + 6 题语法点 + 4 题综合），45 分钟，60 分及格。<br>\n<b>及格线：</b>单元测验 60 分及格；结课测验 70 分及格。\n补课内容按「语法点索引」的「前置」列倒推。</div>"},
    {title:"11.3 结课测验与升级", id:"hsk3-qz3", html:"<h1>结课测验与升级</h1>\n<table>\n<tr><td>结课测验</td><td>三级结课 1 次，50 题（20 词汇 + 20 语法 + 10 综合），90 分钟</td></tr>\n<tr><td>及格线</td><td>单元测验 60 分及格；结课测验 70 分及格</td></tr>\n<tr><td>升级条件</td><td><b>64 课次全部完成 + 出勤 ≥80% + 单元测验平均 ≥75 分 + 结课测验 ≥70 分 → 升 HSK4</b></td></tr>\n</table>\n<h2>题型说明</h2><table><tr><td>词汇题</td><td>给出越南语释义选汉字 / 听音选词 / 汉字注音</td></tr><tr><td>语法题</td><td>填空（选正确句式）/ 改错（找出语序错误）/ 连词成句</td></tr><tr><td>综合题</td><td>情景对话补全 / 短文改写（把口语改成书面语）</td></tr></table>\n<h2>结课测验结构（90 分钟，按两次课次计）</h2>\n<table>\n<tr><td>部分</td><td>时长</td><td>内容</td><td>分值</td></tr>\n<tr><td>听力</td><td>20 分钟</td><td>覆盖全级 953 词与三级全部语法点</td><td>30</td></tr>\n<tr><td>阅读</td><td>25 分钟</td><td>短文理解（累计词表 2,210 词）</td><td>25</td></tr>\n<tr><td>语法</td><td>20 分钟</td><td>复句关联词、补语、特殊句式综合</td><td>25</td></tr>\n<tr><td>口语</td><td>15 分钟</td><td>情景任务：职场 / 工厂 / 购物 / 看病</td><td>20</td></tr>\n<tr><td>写作</td><td>10 分钟</td><td>写 5～8 句的短文（介绍一天的工作）</td><td>—</td></tr>\n</table>\n<div class=\"note\">升级判定：64 课次全部完成 + 出勤 ≥80% + 单元测验平均 ≥75 分\n+ 结课测验 ≥70 分 → 升 HSK4。</div>"}
  ]},
  {title:"十二、教师使用说明", id:"hsk3-g12", children:[
    {title:"12.1 备课与交接流程", id:"hsk3-tc1", html:"<h1>教师使用说明（HSK3）</h1>\n<div class=\"lead\">这一页是给接手的老师看的：怎么备课、怎么用这套体系、换老师怎么交接。</div>\n\n<h2>一、备课流程</h2>\n<table>\n<tr><td>1</td><td>打开本课备课卡</td><td>看<b>结构公式</b>——这一课就教这一个句型</td></tr>\n<tr><td>2</td><td>看<b>前置课次</b></td><td>确认学员已掌握；有缺课的学员先补前置</td></tr>\n<tr><td>3</td><td>看<b>越南学员易错点</b></td><td>这是本课的纠错重点，操练环节必须专门练</td></tr>\n<tr><td>4</td><td>按 45 分钟六步写教案</td><td>骨架见 1.3「一课的标准结构」</td></tr>\n<tr><td>5</td><td>例句用词必须在累计词表内</td><td>HSK1 506 + HSK2 751 + HSK3 953 = 2,210 词</td></tr>\n</table>\n\n<h2>二、课堂节奏（45 分钟）</h2>\n<table>\n<tr><td>环节</td><td>时长</td><td>负责人</td><td>关键动作</td></tr>\n<tr><td>签到</td><td>2′</td><td>越籍助教</td><td>点名、复习上节课作业</td></tr><tr><td>复习</td><td>5′</td><td>越籍助教</td><td>上节课 15 词快速问答 + 1 个句型操练</td></tr><tr><td>新词导入</td><td>12′</td><td>中方讲师</td><td>本课 15 个新词：读音、释义、搭配</td></tr><tr><td>句型操练</td><td>12′</td><td>中方讲师</td><td>本课语法点：公式 → 例句 → 替换练习</td></tr><tr><td>互动练习</td><td>10′</td><td>双方</td><td>两人对话 / 情景任务，用本课词与句型</td></tr><tr><td>小结作业</td><td>4′</td><td>中方讲师</td><td>总结语法点、布置 App 作业与预习</td></tr>\n</table>\n\n<h2>三、换老师怎么交接</h2>\n<table>\n<tr><td>交接内容</td><td>在哪</td></tr>\n<tr><td>上到哪一课、哪一课没讲透</td><td>备课卡「教案状态」</td></tr>\n<tr><td>学员卡在哪个语法点</td><td>「语法点索引」的「前置」列</td></tr>\n<tr><td>本班特殊问题</td><td>本页第四节手写补充</td></tr>\n</table>\n\n<h2>四、本班记录（老师手写区）</h2>\n<div class=\"todo\">在这里记：本班进度、反复出错的语法点、需要放慢的课次。\n（打印出来后手写即可，电子版保持空白。）</div>\n\n<h2>五、这套体系与其他级别的关系</h2>\n<table>\n<tr><td>HSK1</td><td>按主题编排，42 课，506 词</td></tr><tr><td>HSK2</td><td>按语法功能编排，50 课，751 词，6 个单元</td></tr><tr><td>HSK3</td><td>按主题场景编排，64 课，953 词，8 个单元，每课 1 个语法点</td></tr><tr><td>为什么变</td><td>三级新词主体是实词（91%），按语义场成组才教得动；语法点仍每课 1 个，作教学抓手</td></tr>\n<tr><td>不变的部分</td><td>45 分钟六步结构、分级测试、单元测验、升级标准</td></tr>\n</table>"}
  ]}
  ]
};
const META = {"hsk1": "42 课 · 506 词 · 已完成", "hsk2": "50 课 · 751 词 · 教案 8/50", "hsk3": "64 课 · 953 词 · 教案 0/64"};
var CUR = "hsk1";
var NAV = DATA[CUR];


function renderTree(nodes, depth){
  return nodes.map(n=>{
    if(n.children){
      return '<div class="grp'+(depth===0?' open':'')+'">'
        + '<button class="grpbtn d'+depth+'"><span class="caret">\u25b6</span><span>'+n.title+'</span></button>'
        + '<div class="kids">'+renderTree(n.children, depth+1)+'</div></div>';
    }
    return '<button class="leaf d'+depth+'" data-id="'+n.id+'">'+n.title+'</button>';
  }).join('');
}
function findLeaf(id, nodes){
  for(const n of nodes){
    if(n.id===id && n.html) return n;
    if(n.children){ const r = findLeaf(id, n.children); if(r) return r; }
  }
  return null;
}
function render(id, noHash){
  const leaf = findLeaf(id, NAV);
  if(!leaf) return;
  document.getElementById('main').innerHTML = leaf.html;
  document.querySelectorAll('.leaf').forEach(l=>l.classList.toggle('active', l.dataset.id===id));
  document.getElementById('main').scrollTop = 0;
  try{ localStorage.setItem('zhteach.last.'+CUR, id); }catch(e){}
  if(!noHash){
    const want = '#'+CUR+'/'+id;
    if(location.hash !== want) history.replaceState(null,'',want);
  }
}
function initNav(){
  document.getElementById('side').innerHTML = renderTree(NAV, 0);
  document.querySelectorAll('.grpbtn').forEach(b=>{
    b.onclick = () => b.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('.leaf').forEach(b=>{
    b.onclick = () => { render(b.dataset.id); if(window.innerWidth<=860) document.getElementById('side').classList.remove('open'); };
  });
}
function filterTree(q){
  q = (q||'').trim().toLowerCase();
  document.querySelectorAll('#side .grp').forEach(g=>{
    let any = false;
    g.querySelectorAll('.leaf').forEach(l=>{
      const hit = !q || l.textContent.toLowerCase().includes(q);
      l.style.display = hit ? '' : 'none';
      if(hit) any = true;
    });
    const own = g.querySelector(':scope > .grpbtn').textContent.toLowerCase().includes(q);
    g.style.display = (any || own) ? '' : 'none';
    if(q) g.classList.add('open');
  });
}
/* ── 主内容切换：HSK1 / HSK2 / HSK3 ── */
function firstLeaf(nodes){
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].html) return nodes[i].id;
    if(nodes[i].children){ const r = firstLeaf(nodes[i].children); if(r) return r; }
  }
  return null;
}
function markLv(){
  document.querySelectorAll('.lvbtn').forEach(b=>b.classList.toggle('on', b.dataset.lv===CUR));
  const m = document.getElementById('lvmeta');
  if(m) m.textContent = META[CUR] || '';
}
function useLevel(lv, pageId, noHash){
  if(!DATA[lv]) return;
  CUR = lv; NAV = DATA[lv];
  markLv(); initNav(); filterTree('');
  const q = document.getElementById('q'); if(q) q.value = '';
  render(pageId && findLeaf(pageId, NAV) ? pageId : firstLeaf(NAV), noHash);
}
document.querySelectorAll('.lvbtn').forEach(b=>{
  b.onclick = () => useLevel(b.dataset.lv, null, false);
});
/* hash 形如 #hsk1/ov1；旧的 #ov1 一律按 HSK1 处理，老链接不会失效 */
function parseHash(){
  const h = location.hash.replace('#','');
  const i = h.indexOf('/');
  if(i > 0 && DATA[h.slice(0,i)]) return {lv: h.slice(0,i), id: h.slice(i+1)};
  return {lv: 'hsk1', id: h};
}
var st = parseHash();
if(st.lv !== 'hsk1'){ CUR = st.lv; NAV = DATA[CUR]; }
else if(!st.id){ try{ st.id = localStorage.getItem('zhteach.last.hsk1') || ''; }catch(e){} }
markLv(); initNav();
render(findLeaf(st.id, NAV) ? st.id : firstLeaf(NAV), false);
window.addEventListener('hashchange', function(){
  var s = parseHash();
  if(s.lv !== CUR){ useLevel(s.lv, s.id, true); }
  else if(findLeaf(s.id, NAV)){ render(s.id, true); }
});

</script>
