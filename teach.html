jiā。</p><p class=\"vi\">Anh ấy ở nhà.</p></div><div class=\"sent\"><p class=\"zh\">这个和那个一样。</p><p class=\"py\">zhè ge hé nà ge yī yàng。</p><p class=\"vi\">Cái này và cái kia giống nhau.</p></div><div class=\"sent\"><p class=\"zh\">对不对？——对。</p><p class=\"py\">duì bù duì？—— duì。</p><p class=\"vi\">Đúng không? —— Đúng.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你是老师吗？</p><p class=\"py\">nǐ shì lǎo shī ma？</p><p class=\"vi\">Bạn là giáo viên à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不是，我是学生。</p><p class=\"py\">bù shì， wǒ shì xué sheng。</p><p class=\"vi\">Không, tôi là học sinh.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你有哥哥吗？</p><p class=\"py\">nǐ yǒu gē ge ma？</p><p class=\"vi\">Bạn có anh trai không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">有，我有一个哥哥，没有妹妹。</p><p class=\"py\">yǒu， wǒ yǒu yī gè gē ge， méi yǒu mèi mei。</p><p class=\"vi\">Có, tôi có một anh trai, không có em gái.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">他现在在家吗？</p><p class=\"py\">tā xiàn zài zài jiā ma？</p><p class=\"vi\">Bây giờ anh ấy ở nhà à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不在。他在学校。</p><p class=\"py\">bù zài。 tā zài xué xiào。</p><p class=\"vi\">Không. Anh ấy ở trường.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这个和那个一样吗？</p><p class=\"py\">zhè ge hé nà ge yī yàng ma？</p><p class=\"vi\">Cái này và cái kia giống nhau không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不一样。这个好，那个不好。</p><p class=\"py\">bù yī yàng。 zhè ge hǎo， nà ge bù hǎo。</p><p class=\"vi\">Không giống. Cái này tốt, cái kia không tốt.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「是 / 有 / 在」三个句型替换练习，每人各说三句</li><li>否定转换：把肯定句改成「不」或「没」的否定句</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「有」的否定是「没有」，绝不说「不有」</li><li>「是」的否定是「不是」，不说「没是」</li><li>「在」的否定用「不在」；普通话里「没在」不常用</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「是 / 有 / 在」各写三个句子</li><li>在 App 上完成 L11 测验</li></ul>"},
    {title:"L12 和、跟、给", id:"l12", html:"<h1>L12 · 和、跟、给</h1>\n<p class=\"sub\">第一阶段 · 发音与基础　|　Và, với, cho</p>\n<div class=\"lead\"><b>本课目标：</b>会用「和 / 跟」并列，会用「给 / 比 / 从」表达对象、比较和起点</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">和</td><td class=\"pyc\">hé</td><td class=\"hv\">hòa</td><td>(nối hai danh từ) và；(toán học) tổng</td><td class=\"hint\">连词 / 介词</td></tr><tr><td class=\"hz\">跟</td><td class=\"pyc\">gēn</td><td class=\"hv\">cân</td><td>với; cùng với；theo; đi theo</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">给</td><td class=\"pyc\">gěi</td><td class=\"hv\">cấp</td><td>cho；để</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">比</td><td class=\"pyc\">bǐ</td><td class=\"hv\">bỉ</td><td>so sánh；so với; tỉ lệ</td><td class=\"hint\">介词 / 动词</td></tr><tr><td class=\"hz\">从</td><td class=\"pyc\">cóng</td><td class=\"hv\">tòng</td><td>từ; thông qua; qua；(hình vị) theo</td><td class=\"hint\">介词 / 语素</td></tr><tr><td class=\"hz\">一起</td><td class=\"pyc\">yī qǐ</td><td class=\"hv\">nhất khởi</td><td>ở cùng một nơi；cùng nhau</td><td class=\"hint\">处所词 / 副词</td></tr><tr><td class=\"hz\">一边</td><td class=\"pyc\">yī biān</td><td class=\"hv\">nhất biên</td><td>một bên；mỗi bên</td><td class=\"hint\">副词 / 方位词</td></tr><tr><td class=\"hz\">还</td><td class=\"pyc\">hái</td><td class=\"hv\">hoàn</td><td>vẫn；còn đang</td><td class=\"hint\">副词 / 动词</td></tr><tr><td class=\"hz\">还有</td><td class=\"pyc\">hái yǒu</td><td class=\"hv\">hoàn hữu</td><td>vẫn còn; còn có；thêm vào đó</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">也</td><td class=\"pyc\">yě</td><td class=\"hv\">dã</td><td>(phó từ) cũng；(văn viết) trợ từ có chức năng giố</td><td class=\"hint\">副词 / 语气词</td></tr><tr><td class=\"hz\">都</td><td class=\"pyc\">dōu</td><td class=\"hv\">đô</td><td>tất cả; cả hai; hoàn toàn；(dùng để nhấn mạnh) thậm chí</td><td class=\"hint\">副词 / 语素</td></tr><tr><td class=\"hz\">先</td><td class=\"pyc\">xiān</td><td class=\"hv\">tiên</td><td>trước; đầu tiên; sớm hơn；lúc đầu; vốn dĩ</td><td class=\"hint\">副词 / 语素</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「和 / 跟」连接名词</p><p class=\"gfm\">A 和 B　｜　A 跟 B</p><p class=\"gnote\">只能连接名词或代词，不能连接两个句子。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我和你都是学生。</p><p class=\"py\">wǒ hé nǐ dōu shì xué sheng。</p><p class=\"vi\">Tôi và bạn đều là học sinh.</p></div><div class=\"gex\"><p class=\"zh\">我跟他一起吃饭。</p><p class=\"py\">wǒ gēn tā yī qǐ chī fàn。</p><p class=\"vi\">Tôi ăn cơm cùng anh ấy.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「给」引出对象</p><p class=\"gfm\">A 给 B + 东西</p><p class=\"gnote\">「给」后面接收到东西的人。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他给我一本书。</p><p class=\"py\">tā gěi wǒ yī běn shū。</p><p class=\"vi\">Anh ấy cho tôi một cuốn sách.</p></div><div class=\"gex\"><p class=\"zh\">我给你钱。</p><p class=\"py\">wǒ gěi nǐ qián。</p><p class=\"vi\">Tôi đưa tiền cho bạn.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">3. 「比」比较</p><p class=\"gfm\">A 比 B + 形容词</p><p class=\"gnote\">「比」后面直接接形容词，不加「很」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我比他高。</p><p class=\"py\">wǒ bǐ tā gāo。</p><p class=\"vi\">Tôi cao hơn anh ấy.</p></div><div class=\"gex\"><p class=\"zh\">今天比昨天热。</p><p class=\"py\">jīn tiān bǐ zuó tiān rè。</p><p class=\"vi\">Hôm nay nóng hơn hôm qua.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">4. 「从」引出起点</p><p class=\"gfm\">从 + 起点 + 到 + 终点</p><p class=\"gnote\">表示路线的起止。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我从这儿去那儿。</p><p class=\"py\">wǒ cóng zhèr qù nàr。</p><p class=\"vi\">Tôi từ đây đi đến kia.</p></div><div class=\"gex\"><p class=\"zh\">从这儿到那儿不远。</p><p class=\"py\">cóng zhèr dào nàr bù yuǎn。</p><p class=\"vi\">Từ đây đến kia không xa.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我和你都是学生。</p><p class=\"py\">wǒ hé nǐ dōu shì xué sheng。</p><p class=\"vi\">Tôi và bạn đều là học sinh.</p></div><div class=\"sent\"><p class=\"zh\">他给我一本书。</p><p class=\"py\">tā gěi wǒ yī běn shū。</p><p class=\"vi\">Anh ấy cho tôi một cuốn sách.</p></div><div class=\"sent\"><p class=\"zh\">我比他高。</p><p class=\"py\">wǒ bǐ tā gāo。</p><p class=\"vi\">Tôi cao hơn anh ấy.</p></div><div class=\"sent\"><p class=\"zh\">我从这儿去那儿。</p><p class=\"py\">wǒ cóng zhèr qù nàr。</p><p class=\"vi\">Tôi từ đây đi đến kia.</p></div><div class=\"sent\"><p class=\"zh\">我们先吃饭，再喝茶。</p><p class=\"py\">wǒ men xiān chī fàn， zài hē chá。</p><p class=\"vi\">Chúng ta ăn cơm trước, rồi uống trà.</p></div><div class=\"sent\"><p class=\"zh\">我们一边吃一边说。</p><p class=\"py\">wǒ men yī biān chī yī biān shuō。</p><p class=\"vi\">Chúng ta vừa ăn vừa nói.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你和他一起去吗？</p><p class=\"py\">nǐ hé tā yī qǐ qù ma？</p><p class=\"vi\">Bạn đi cùng anh ấy à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">去。我们先吃饭，再喝茶。</p><p class=\"py\">qù。 wǒ men xiān chī fàn， zài hē chá。</p><p class=\"vi\">Đi. Chúng tôi ăn cơm trước, rồi uống trà.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你比他高吗？</p><p class=\"py\">nǐ bǐ tā gāo ma？</p><p class=\"vi\">Bạn cao hơn anh ấy à?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不，他比我高。</p><p class=\"py\">bù， tā bǐ wǒ gāo。</p><p class=\"vi\">Không, anh ấy cao hơn tôi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">从这儿到那儿远吗？</p><p class=\"py\">cóng zhèr dào nàr yuǎn ma？</p><p class=\"vi\">Từ đây đến kia xa không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不远，一会儿就到。</p><p class=\"py\">bù yuǎn， yī huìr jiù dào。</p><p class=\"vi\">Không xa, một lát là đến.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">好，我给他打电话。</p><p class=\"py\">hǎo， wǒ gěi tā dǎ diàn huà。</p><p class=\"vi\">Được, tôi gọi điện cho anh ấy.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，一会儿见！</p><p class=\"py\">hǎo， yī huìr jiàn！</p><p class=\"vi\">Được, hẹn gặp lại!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>「和 / 跟」并列练习：把两个人或两样东西连起来说</li><li>「比」比较练习：两人一组互相比身高、年龄、数量</li><li>「从……到……」路线描述：描述从教室到校门的路</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「比」字句里不能加「很」：不说「我比他很高」</li><li>「和」不能连接两个句子，只连接名词或代词</li><li>「给」的位置：给 + 人 + 东西，顺序不能反</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「比」写三组比较句</li><li>在 App 上完成 L12 测验</li></ul>"}
  ]},

    {title:"L13 今天、明天、昨天", id:"l13", html:"<h1>L13 · 今天、明天、昨天</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Hôm nay, ngày mai, hôm qua</p>\n<div class=\"lead\"><b>本课目标：</b>会表达今天、明天、昨天，会约时间</div>\n<h2>一、生词 13 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">今天</td><td class=\"pyc\">jīn tiān</td><td class=\"hv\">kim thiên</td><td>hôm nay；thời điểm hiện tại; bây giờ</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">明天</td><td class=\"pyc\">míng tiān</td><td class=\"hv\">minh thiên</td><td>ngày mai</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">昨天</td><td class=\"pyc\">zuó tiān</td><td class=\"hv\">tạc thiên</td><td>hôm qua</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">前天</td><td class=\"pyc\">qián tiān</td><td class=\"hv\">tiền thiên</td><td>ngày hôm kia</td><td class=\"hint\">时间词 / 名词</td></tr><tr><td class=\"hz\">后天</td><td class=\"pyc\">hòu tiān</td><td class=\"hv\">hậu thiên</td><td>ngày mốt；cuộc sống sau khi sinh</td><td class=\"hint\">名词 / 时间词</td></tr><tr><td class=\"hz\">现在</td><td class=\"pyc\">xiàn zài</td><td class=\"hv\">hiện tại</td><td>bây giờ；hiện tại</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">时候</td><td class=\"pyc\">shí hou</td><td class=\"hv\">thì hậu</td><td>thời gian；khoảng thời gian</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">时间</td><td class=\"pyc\">shí jiān</td><td class=\"hv\">thì gian</td><td>(khái niệm) thời gian；(khoảng thời gian)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">小时</td><td class=\"pyc\">xiǎo shí</td><td class=\"hv\">tiểu thì</td><td>giờ</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">日期</td><td class=\"pyc\">rì qī</td><td class=\"hv\">nhật kỳ</td><td>ngày tháng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">生日</td><td class=\"pyc\">shēng rì</td><td class=\"hv\">sinh nhật</td><td>sinh nhật</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">下次</td><td class=\"pyc\">xià cì</td><td class=\"hv\">hạ thứ</td><td>lần tới</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">上次</td><td class=\"pyc\">shàng cì</td><td class=\"hv\">thượng thứ</td><td>lần trước</td><td class=\"hint\">时间词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 时间词的位置</p><p class=\"gfm\">主语 + 时间词 + 动词</p><p class=\"gnote\">时间词放在主语后、动词前，不能放句尾。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我今天有课。</p><p class=\"py\">wǒ jīn tiān yǒu kè。</p><p class=\"vi\">Hôm nay tôi có tiết.</p></div><div class=\"gex\"><p class=\"zh\">明天我们去商店。</p><p class=\"py\">míng tiān wǒ men qù shāng diàn。</p><p class=\"vi\">Ngày mai chúng tôi đi cửa hàng.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「时候」的用法</p><p class=\"gfm\">……的时候　｜　有的时候</p><p class=\"gnote\">「时候」不能单独用，必须跟「的」或「有」搭配。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我小的时候在家。</p><p class=\"py\">wǒ xiǎo de shí hou zài jiā。</p><p class=\"vi\">Hồi tôi còn nhỏ thì ở nhà.</p></div><div class=\"gex\"><p class=\"zh\">你什么时候来？</p><p class=\"py\">nǐ shén me shí hòu lái？</p><p class=\"vi\">Bạn đến lúc nào?</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">今天我有课。</p><p class=\"py\">jīn tiān wǒ yǒu kè。</p><p class=\"vi\">Hôm nay tôi có tiết.</p></div><div class=\"sent\"><p class=\"zh\">明天我们去商店。</p><p class=\"py\">míng tiān wǒ men qù shāng diàn。</p><p class=\"vi\">Ngày mai chúng tôi đi cửa hàng.</p></div><div class=\"sent\"><p class=\"zh\">昨天他在家。</p><p class=\"py\">zuó tiān tā zài jiā。</p><p class=\"vi\">Hôm qua anh ấy ở nhà.</p></div><div class=\"sent\"><p class=\"zh\">现在几点？</p><p class=\"py\">xiàn zài jǐ diǎn？</p><p class=\"vi\">Bây giờ là mấy giờ?</p></div><div class=\"sent\"><p class=\"zh\">你什么时候来？</p><p class=\"py\">nǐ shén me shí hòu lái？</p><p class=\"vi\">Bạn đến lúc nào?</p></div><div class=\"sent\"><p class=\"zh\">下次见！</p><p class=\"py\">xià cì jiàn！</p><p class=\"vi\">Hẹn gặp lần sau!</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你什么时候来？</p><p class=\"py\">nǐ shén me shí hòu lái？</p><p class=\"vi\">Bạn đến lúc nào?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我明天来。</p><p class=\"py\">wǒ míng tiān lái。</p><p class=\"vi\">Mai tôi đến.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">明天几点？</p><p class=\"py\">míng tiān jǐ diǎn？</p><p class=\"vi\">Mai mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">下午三点。</p><p class=\"py\">xià wǔ sān diǎn。</p><p class=\"vi\">Ba giờ chiều.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">昨天你怎么没来？</p><p class=\"py\">zuó tiān nǐ zěn me méi lái？</p><p class=\"vi\">Hôm qua sao bạn không đến?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">对不起，我有事。</p><p class=\"py\">duì bu qǐ， wǒ yǒu shì。</p><p class=\"vi\">Xin lỗi, tôi có việc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">没关系，下次见！</p><p class=\"py\">méi guān xi， xià cì jiàn！</p><p class=\"vi\">Không sao, hẹn lần sau!</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">下次见！</p><p class=\"py\">xià cì jiàn！</p><p class=\"vi\">Hẹn lần sau!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>时间词替换：今天 / 明天 / 昨天 / 前天 / 后天 换着说同一句</li><li>「什么时候」提问接龙，每人问下一位</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>时间词放在动词前，不说「我上课今天」</li><li>「小时」是时长（两个小时），「点」是时刻（两点）</li><li>「时候」必须放在「……的时候」里，不能单独作主语</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用「今天 / 明天 / 昨天」各写一句关于自己作息的句子</li><li>在 App 上完成 L13 测验</li></ul>"},
    {title:"L14 年、月、日", id:"l14", html:"<h1>L14 · 年、月、日</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Năm, tháng, ngày</p>\n<div class=\"lead\"><b>本课目标：</b>会说年月日和星期，会表达「马上」</div>\n<h2>一、生词 13 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">年</td><td class=\"pyc\">nián</td><td class=\"hv\">niên</td><td>năm；ngũ cốc</td><td class=\"hint\">量词 / 时间词</td></tr><tr><td class=\"hz\">月</td><td class=\"pyc\">yuè</td><td class=\"hv\">nguyệt</td><td>mặt trăng；tháng</td><td class=\"hint\">名词 / 时间词</td></tr><tr><td class=\"hz\">日</td><td class=\"pyc\">rì</td><td class=\"hv\">nhật</td><td>mặt trời；ngày</td><td class=\"hint\">时间词 / 语素</td></tr><tr><td class=\"hz\">今年</td><td class=\"pyc\">jīn nián</td><td class=\"hv\">kim niên</td><td>năm nay</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">明年</td><td class=\"pyc\">míng nián</td><td class=\"hv\">minh niên</td><td>năm sau</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">去年</td><td class=\"pyc\">qù nián</td><td class=\"hv\">khứ niên</td><td>năm ngoái</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">新年</td><td class=\"pyc\">xīn nián</td><td class=\"hv\">tân niên</td><td>Năm mới</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">半年</td><td class=\"pyc\">bàn nián</td><td class=\"hv\">bán niên</td><td>nửa năm</td><td class=\"hint\">人名</td></tr><tr><td class=\"hz\">半天</td><td class=\"pyc\">bàn tiān</td><td class=\"hv\">bán thiên</td><td>nửa ngày；một thời gian dài</td><td class=\"hint\">数量词 / 时间词</td></tr><tr><td class=\"hz\">星期</td><td class=\"pyc\">xīng qī</td><td class=\"hv\">tinh kỳ</td><td>tuần；ngày trong tuần</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">星期天</td><td class=\"pyc\">Xīng qī tiān</td><td class=\"hv\">tinh kỳ thiên</td><td>Chủ Nhật</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">星期日</td><td class=\"pyc\">Xīng qī rì</td><td class=\"hv\">tinh kỳ nhật</td><td>chủ nhật</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">马上</td><td class=\"pyc\">mǎ shàng</td><td class=\"hv\">mã thượng</td><td>ngay lập tức；ngay tức khắc</td><td class=\"hint\">副词 / 处所词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 年月日从大到小</p><p class=\"gfm\">年 + 月 + 日（号）</p><p class=\"gnote\">中文日期的顺序是大单位在前：2026 年 9 月 28 日。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">今天是九月二十八日。</p><p class=\"py\">jīn tiān shì jiǔ yuè èr shí bā rì。</p><p class=\"vi\">Hôm nay là ngày 28 tháng 9.</p></div><div class=\"gex\"><p class=\"zh\">今年我学中文。</p><p class=\"py\">jīn nián wǒ xué Zhōng wén。</p><p class=\"vi\">Năm nay tôi học tiếng Trung.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「马上」表示立刻</p><p class=\"gfm\">马上 + 动词</p><p class=\"gnote\">放在动词前，表示很短时间内就做。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我马上来。</p><p class=\"py\">wǒ mǎ shàng lái。</p><p class=\"vi\">Tôi đến ngay.</p></div><div class=\"gex\"><p class=\"zh\">他马上回家。</p><p class=\"py\">tā mǎ shàng huí jiā。</p><p class=\"vi\">Anh ấy về nhà ngay.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">今天是九月二十八日。</p><p class=\"py\">jīn tiān shì jiǔ yuè èr shí bā rì。</p><p class=\"vi\">Hôm nay là ngày 28 tháng 9.</p></div><div class=\"sent\"><p class=\"zh\">今年我学中文。</p><p class=\"py\">jīn nián wǒ xué Zhōng wén。</p><p class=\"vi\">Năm nay tôi học tiếng Trung.</p></div><div class=\"sent\"><p class=\"zh\">下个月我回家。</p><p class=\"py\">xià gè yuè wǒ huí jiā。</p><p class=\"vi\">Tháng sau tôi về nhà.</p></div><div class=\"sent\"><p class=\"zh\">明天是星期天。</p><p class=\"py\">míng tiān shì Xīng qī tiān。</p><p class=\"vi\">Mai là chủ nhật.</p></div><div class=\"sent\"><p class=\"zh\">我马上来。</p><p class=\"py\">wǒ mǎ shàng lái。</p><p class=\"vi\">Tôi đến ngay.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">今天几月几号？</p><p class=\"py\">jīn tiān jǐ yuè jǐ hào？</p><p class=\"vi\">Hôm nay là ngày mấy tháng mấy?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">九月二十八号。</p><p class=\"py\">jiǔ yuè èr shí bā hào。</p><p class=\"vi\">Ngày 28 tháng 9.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">明天是星期几？</p><p class=\"py\">míng tiān shì xīng qī jǐ？</p><p class=\"vi\">Mai là thứ mấy?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">星期天。</p><p class=\"py\">Xīng qī tiān。</p><p class=\"vi\">Chủ nhật.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你今年多大？</p><p class=\"py\">nǐ jīn nián duō dà？</p><p class=\"vi\">Năm nay bạn bao nhiêu tuổi?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我今年二十岁。</p><p class=\"py\">wǒ jīn nián èr shí suì。</p><p class=\"vi\">Năm nay tôi hai mươi tuổi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我马上来，你等我一会儿。</p><p class=\"py\">wǒ mǎ shàng lái， nǐ děng wǒ yī huìr。</p><p class=\"vi\">Tôi đến ngay, bạn đợi tôi một lát.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好。</p><p class=\"py\">hǎo。</p><p class=\"vi\">Được.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>日期接龙：从今天起往后说七天</li><li>星期问答：轮流问「明天是星期几？」</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>年月日从大到小说，顺序不能反</li><li>「星期天」和「星期日」都可以，口语多用「星期天」</li><li>「半年」= 六个月；「半天」口语里常指「很长时间」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出今天的日期和星期</li><li>在 App 上完成 L14 测验</li></ul>"},
    {title:"L15 早中晚", id:"l15", html:"<h1>L15 · 早中晚</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Sáng, trưa, tối</p>\n<div class=\"lead\"><b>本课目标：</b>会说一天中的时段，会表达频率</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">早</td><td class=\"pyc\">zǎo</td><td class=\"hv\">tảo</td><td>sớm；buổi sáng</td><td class=\"hint\">副形词 / 形容词</td></tr><tr><td class=\"hz\">早上</td><td class=\"pyc\">zǎo shang</td><td class=\"hv\">tảo thượng</td><td>buổi sáng sớm</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">上午</td><td class=\"pyc\">shàng wǔ</td><td class=\"hv\">thượng ngọ</td><td>buổi sáng</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">中午</td><td class=\"pyc\">zhōng wǔ</td><td class=\"hv\">trung ngọ</td><td>buổi trưa；trưa</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">下午</td><td class=\"pyc\">xià wǔ</td><td class=\"hv\">hạ ngọ</td><td>buổi chiều；p.m</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">晚</td><td class=\"pyc\">wǎn</td><td class=\"hv\">vãn</td><td>buổi tối；đêm</td><td class=\"hint\">时间语素 / 形容词</td></tr><tr><td class=\"hz\">晚上</td><td class=\"pyc\">wǎn shang</td><td class=\"hv\">vãn thượng</td><td>buổi tối；đêm</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">白天</td><td class=\"pyc\">bái tiān</td><td class=\"hv\">bạch thiên</td><td>ban ngày；trong ngày</td><td class=\"hint\">时间词</td></tr><tr><td class=\"hz\">天</td><td class=\"pyc\">tiān</td><td class=\"hv\">thiên</td><td>ngày；trời</td><td class=\"hint\">量词 / 名词</td></tr><tr><td class=\"hz\">常</td><td class=\"pyc\">cháng</td><td class=\"hv\">thường</td><td>luôn luôn；thường xuyên</td><td class=\"hint\">副词 / 人名</td></tr><tr><td class=\"hz\">常常</td><td class=\"pyc\">cháng cháng</td><td class=\"hv\">thường thường</td><td>thường xuyên；thường</td><td class=\"hint\">副词</td></tr><tr><td class=\"hz\">有时候</td><td class=\"pyc\">yǒu shí hou</td><td class=\"hv\">hữu thì hậu</td><td>đôi khi</td><td class=\"hint\">副词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 时段词 + 时间</p><p class=\"gfm\">早上 / 上午 / 中午 / 下午 / 晚上 + 几点</p><p class=\"gnote\">时段词放在具体时间前面。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我早上七点起床。</p><p class=\"py\">wǒ zǎo shang qī diǎn qǐ chuáng。</p><p class=\"vi\">Tôi thức dậy lúc bảy giờ sáng.</p></div><div class=\"gex\"><p class=\"zh\">晚上我看书。</p><p class=\"py\">wǎn shang wǒ kàn shū。</p><p class=\"vi\">Buổi tối tôi đọc sách.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 频率副词放在动词前</p><p class=\"gfm\">常 / 常常 / 有时候 + 动词</p><p class=\"gnote\">「常常」比「常」更强调重复。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我常常喝茶。</p><p class=\"py\">wǒ cháng cháng hē chá。</p><p class=\"vi\">Tôi thường uống trà.</p></div><div class=\"gex\"><p class=\"zh\">有时候我走路回家。</p><p class=\"py\">yǒu shí hou wǒ zǒu lù huí jiā。</p><p class=\"vi\">Có khi tôi đi bộ về nhà.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我早上七点起床。</p><p class=\"py\">wǒ zǎo shang qī diǎn qǐ chuáng。</p><p class=\"vi\">Tôi thức dậy lúc bảy giờ sáng.</p></div><div class=\"sent\"><p class=\"zh\">中午我吃饭。</p><p class=\"py\">zhōng wǔ wǒ chī fàn。</p><p class=\"vi\">Buổi trưa tôi ăn cơm.</p></div><div class=\"sent\"><p class=\"zh\">下午我有课。</p><p class=\"py\">xià wǔ wǒ yǒu kè。</p><p class=\"vi\">Buổi chiều tôi có tiết.</p></div><div class=\"sent\"><p class=\"zh\">晚上我看书。</p><p class=\"py\">wǎn shang wǒ kàn shū。</p><p class=\"vi\">Buổi tối tôi đọc sách.</p></div><div class=\"sent\"><p class=\"zh\">我常常喝茶。</p><p class=\"py\">wǒ cháng cháng hē chá。</p><p class=\"vi\">Tôi thường uống trà.</p></div><div class=\"sent\"><p class=\"zh\">有时候我走路回家。</p><p class=\"py\">yǒu shí hou wǒ zǒu lù huí jiā。</p><p class=\"vi\">Có khi tôi đi bộ về nhà.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你早上几点起床？</p><p class=\"py\">nǐ zǎo shang jǐ diǎn qǐ chuáng？</p><p class=\"vi\">Bạn thức dậy lúc mấy giờ sáng?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">六点半。</p><p class=\"py\">liù diǎn bàn。</p><p class=\"vi\">Sáu giờ rưỡi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">上午你干什么？</p><p class=\"py\">shàng wǔ nǐ gàn shén me？</p><p class=\"vi\">Buổi sáng bạn làm gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我上课。</p><p class=\"py\">wǒ shàng kè。</p><p class=\"vi\">Tôi đi học.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">下午呢？</p><p class=\"py\">xià wǔ ne？</p><p class=\"vi\">Còn buổi chiều?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">下午我常常去图书馆。</p><p class=\"py\">xià wǔ wǒ cháng cháng qù tú shū guǎn。</p><p class=\"vi\">Buổi chiều tôi thường đến thư viện.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">晚上你做什么？</p><p class=\"py\">wǎn shang nǐ zuò shén me？</p><p class=\"vi\">Buổi tối bạn làm gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">有时候看书，有时候听歌。</p><p class=\"py\">yǒu shí hou kàn shū， yǒu shí hou tīng gē。</p><p class=\"vi\">Có khi đọc sách, có khi nghe nhạc.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你一天很忙！</p><p class=\"py\">nǐ yī tiān hěn máng！</p><p class=\"vi\">Một ngày của bạn bận thật!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>一天时段排序卡：早上 → 上午 → 中午 → 下午 → 晚上</li><li>频率副词替换：常 / 常常 / 有时候</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「上午」和「早上」有重叠，上午一般到 11 点左右</li><li>「天」既可指「一天」，也可指「白天」，看搭配</li><li>频率副词放动词前；放句首时要说「有时候我……」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文写出一份自己的一日作息表</li><li>在 App 上完成 L15 测验</li></ul>"},
    {title:"L16 吃与喝", id:"l16", html:"<h1>L16 · 吃与喝</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Ăn và uống</p>\n<div class=\"lead\"><b>本课目标：</b>会点吃喝，会表达饿和渴</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">吃</td><td class=\"pyc\">chī</td><td class=\"hv\">ngật</td><td>ăn; tiêu thụ；ăn ở (nhà ăn, v.v.)</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">吃饭</td><td class=\"pyc\">chī fàn</td><td class=\"hv\">ngật phạn</td><td>dùng bữa；ăn</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">好吃</td><td class=\"pyc\">hǎo chī</td><td class=\"hv\">hảo ngật</td><td>ngon; ngon miệng</td><td class=\"hint\">形容词</td></tr><tr><td class=\"hz\">喝</td><td class=\"pyc\">hē</td><td class=\"hv\">hát</td><td>uống</td><td class=\"hint\">语素 / 动名词</td></tr><tr><td class=\"hz\">水</td><td class=\"pyc\">shuǐ</td><td class=\"hv\">thủy</td><td>nước；sông</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">茶</td><td class=\"pyc\">chá</td><td class=\"hv\">trà</td><td>trà；cây trà</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">牛奶</td><td class=\"pyc\">niú nǎi</td><td class=\"hv\">ngưu nãi</td><td>sữa bò；LT:瓶,杯</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">奶</td><td class=\"pyc\">nǎi</td><td class=\"hv\">nãi</td><td>vú；sữa</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">饿</td><td class=\"pyc\">è</td><td class=\"hv\">ngạ</td><td>đói；làm cho đói</td><td class=\"hint\">动词 / 形容词</td></tr><tr><td class=\"hz\">渴</td><td class=\"pyc\">kě</td><td class=\"hv\">khát</td><td>khát</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">肉</td><td class=\"pyc\">ròu</td><td class=\"hv\">nhục</td><td>thịt；thịt quả</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">菜</td><td class=\"pyc\">cài</td><td class=\"hv\">thái</td><td>rau；(kỹ năng, v.v.) yếu; kém</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「好吃」作谓语</p><p class=\"gfm\">名词 + 很好吃</p><p class=\"gnote\">「好吃」是形容词，直接作谓语，前面一般加「很」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个菜很好吃。</p><p class=\"py\">zhè ge cài hěn hǎo chī。</p><p class=\"vi\">Món này rất ngon.</p></div><div class=\"gex\"><p class=\"zh\">这个面包很好吃。</p><p class=\"py\">zhè ge miàn bāo hěn hǎo chī。</p><p class=\"vi\">Bánh mì này rất ngon.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「想」+ 动词</p><p class=\"gfm\">想 + 动词</p><p class=\"gnote\">表示意愿。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我想喝茶。</p><p class=\"py\">wǒ xiǎng hē chá。</p><p class=\"vi\">Tôi muốn uống trà.</p></div><div class=\"gex\"><p class=\"zh\">我想吃饭。</p><p class=\"py\">wǒ xiǎng chī fàn。</p><p class=\"vi\">Tôi muốn ăn cơm.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我吃饭。</p><p class=\"py\">wǒ chī fàn。</p><p class=\"vi\">Tôi ăn cơm.</p></div><div class=\"sent\"><p class=\"zh\">这个菜很好吃。</p><p class=\"py\">zhè ge cài hěn hǎo chī。</p><p class=\"vi\">Món này rất ngon.</p></div><div class=\"sent\"><p class=\"zh\">我喝茶，你喝水。</p><p class=\"py\">wǒ hē chá， nǐ hē shuǐ。</p><p class=\"vi\">Tôi uống trà, bạn uống nước.</p></div><div class=\"sent\"><p class=\"zh\">我饿了。</p><p class=\"py\">wǒ è le。</p><p class=\"vi\">Tôi đói rồi.</p></div><div class=\"sent\"><p class=\"zh\">我渴了，想喝水。</p><p class=\"py\">wǒ kě le， xiǎng hē shuǐ。</p><p class=\"vi\">Tôi khát rồi, muốn uống nước.</p></div><div class=\"sent\"><p class=\"zh\">我吃肉，不吃菜。</p><p class=\"py\">wǒ chī ròu， bù chī cài。</p><p class=\"vi\">Tôi ăn thịt, không ăn rau.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你饿吗？</p><p class=\"py\">nǐ è ma？</p><p class=\"vi\">Bạn đói không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">饿。我们吃饭吧。</p><p class=\"py\">è。 wǒ men chī fàn ba。</p><p class=\"vi\">Đói. Chúng ta ăn cơm đi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你吃什么？</p><p class=\"py\">nǐ chī shén me？</p><p class=\"vi\">Bạn ăn gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我吃米饭和肉。</p><p class=\"py\">wǒ chī mǐ fàn hé ròu。</p><p class=\"vi\">Tôi ăn cơm và thịt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你喝什么？</p><p class=\"py\">nǐ hē shén me？</p><p class=\"vi\">Bạn uống gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我喝茶。你呢？</p><p class=\"py\">wǒ hē chá。 nǐ ne？</p><p class=\"vi\">Tôi uống trà. Còn bạn?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我喝牛奶。</p><p class=\"py\">wǒ hē niú nǎi。</p><p class=\"vi\">Tôi uống sữa.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">这个菜好吃吗？</p><p class=\"py\">zhè ge cài hǎo chī ma？</p><p class=\"vi\">Món này ngon không?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">很好吃！</p><p class=\"py\">hěn hǎo chī！</p><p class=\"vi\">Rất ngon!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>吃喝卡配对：吃 / 喝 + 名词</li><li>情景练习：进餐厅点菜，一人当服务员一人当客人</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「吃饭」是动宾结构，中间可以插「了」：吃了饭</li><li>「饿」「渴」是形容词，直接说「我饿了」</li><li>「奶」是「牛奶」的简称，单独用较少</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文说出今天三餐吃了什么</li><li>在 App 上完成 L16 测验</li></ul>"},
    {title:"L17 饭与菜", id:"l17", html:"<h1>L17 · 饭与菜</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Cơm và món ăn</p>\n<div class=\"lead\"><b>本课目标：</b>会说三餐，会点主食，会用「桌子上有」</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">饭</td><td class=\"pyc\">fàn</td><td class=\"hv\">phạn</td><td>cơm đã nấu；bữa ăn</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">米饭</td><td class=\"pyc\">mǐ fàn</td><td class=\"hv\">mễ phạn</td><td>(cơm) đã nấu</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">早饭</td><td class=\"pyc\">zǎo fàn</td><td class=\"hv\">tảo phạn</td><td>bữa sáng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">午饭</td><td class=\"pyc\">wǔ fàn</td><td class=\"hv\">ngọ phạn</td><td>bữa trưa</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">晚饭</td><td class=\"pyc\">wǎn fàn</td><td class=\"hv\">vãn phạn</td><td>bữa tối；cơm tối</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">鸡蛋</td><td class=\"pyc\">jī dàn</td><td class=\"hv\">kê đản</td><td>trứng (gà)；trứng gà</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">水果</td><td class=\"pyc\">shuǐ guǒ</td><td class=\"hv\">thủy quả</td><td>trái cây</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">面包</td><td class=\"pyc\">miàn bāo</td><td class=\"hv\">diện bao</td><td>bánh mì</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">面条儿</td><td class=\"pyc\">miàn tiáo r</td><td class=\"hv\">diện điều nhi</td><td>mì sợi</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">包子</td><td class=\"pyc\">bāo zi</td><td class=\"hv\">bao tử</td><td>bánh bao (bánh hấp có nhân)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">桌子</td><td class=\"pyc\">zhuō zi</td><td class=\"hv\">trác tử</td><td>bàn；bàn làm việc</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">饭店</td><td class=\"pyc\">fàn diàn</td><td class=\"hv\">phạn điếm</td><td>nhà hàng；khách sạn</td><td class=\"hint\">名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 三餐 + 吃</p><p class=\"gfm\">吃 + 早饭 / 午饭 / 晚饭</p><p class=\"gnote\">三餐名称前面直接加「吃」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我早上吃面包。</p><p class=\"py\">wǒ zǎo shang chī miàn bāo。</p><p class=\"vi\">Buổi sáng tôi ăn bánh mì.</p></div><div class=\"gex\"><p class=\"zh\">中午我吃米饭。</p><p class=\"py\">zhōng wǔ wǒ chī mǐ fàn。</p><p class=\"vi\">Buổi trưa tôi ăn cơm.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 存在句「地点 + 有 + 名词」</p><p class=\"gfm\">地点 + 有 + 名词</p><p class=\"gnote\">表示某处存在某物。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">桌子上有水果。</p><p class=\"py\">zhuō zi shàng yǒu shuǐ guǒ。</p><p class=\"vi\">Trên bàn có hoa quả.</p></div><div class=\"gex\"><p class=\"zh\">桌子上有鸡蛋。</p><p class=\"py\">zhuō zi shàng yǒu jī dàn。</p><p class=\"vi\">Trên bàn có trứng.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我早上吃面包和鸡蛋。</p><p class=\"py\">wǒ zǎo shang chī miàn bāo hé jī dàn。</p><p class=\"vi\">Buổi sáng tôi ăn bánh mì và trứng.</p></div><div class=\"sent\"><p class=\"zh\">中午我吃米饭。</p><p class=\"py\">zhōng wǔ wǒ chī mǐ fàn。</p><p class=\"vi\">Buổi trưa tôi ăn cơm.</p></div><div class=\"sent\"><p class=\"zh\">晚上我们吃面条儿。</p><p class=\"py\">wǎn shang wǒ men chī miàn tiáor。</p><p class=\"vi\">Buổi tối chúng tôi ăn mì.</p></div><div class=\"sent\"><p class=\"zh\">桌子上有水果。</p><p class=\"py\">zhuō zi shàng yǒu shuǐ guǒ。</p><p class=\"vi\">Trên bàn có hoa quả.</p></div><div class=\"sent\"><p class=\"zh\">我们去饭店吃饭。</p><p class=\"py\">wǒ men qù fàn diàn chī fàn。</p><p class=\"vi\">Chúng tôi đi nhà hàng ăn cơm.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你早饭吃什么？</p><p class=\"py\">nǐ zǎo fàn chī shén me？</p><p class=\"vi\">Bữa sáng bạn ăn gì?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我吃面包和鸡蛋。</p><p class=\"py\">wǒ chī miàn bāo hé jī dàn。</p><p class=\"vi\">Tôi ăn bánh mì và trứng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">午饭呢？</p><p class=\"py\">wǔ fàn ne？</p><p class=\"vi\">Còn bữa trưa?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我吃米饭和菜。</p><p class=\"py\">wǒ chī mǐ fàn hé cài。</p><p class=\"vi\">Tôi ăn cơm và rau.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">晚上我们去饭店，好不好？</p><p class=\"py\">wǎn shang wǒ men qù fàn diàn， hǎo bù hǎo？</p><p class=\"vi\">Tối chúng ta đi nhà hàng, được không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好！我想吃面条儿。</p><p class=\"py\">hǎo！ wǒ xiǎng chī miàn tiáor。</p><p class=\"vi\">Được! Tôi muốn ăn mì.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">桌子上有水果，你先吃。</p><p class=\"py\">zhuō zi shàng yǒu shuǐ guǒ， nǐ xiān chī。</p><p class=\"vi\">Trên bàn có hoa quả, bạn ăn trước đi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">谢谢！</p><p class=\"py\">xiè xie！</p><p class=\"vi\">Cảm ơn!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>三餐卡：早饭 / 午饭 / 晚饭 + 主食搭配</li><li>「桌子上有……」看图说话</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「饭」可指米饭，也可泛指一顿饭（吃饭）</li><li>「面条儿」必须儿化，读 miàn tiáor</li><li>「饭店」既指餐厅也指旅馆，看上下文</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>写出自己昨天的三餐内容</li><li>在 App 上完成 L17 测验</li></ul>"},
    {title:"L18 身体与健康", id:"l18", html:"<h1>L18 · 身体与健康</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Cơ thể và sức khỏe</p>\n<div class=\"lead\"><b>本课目标：</b>会说身体不适，会表达累和休息</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">身体</td><td class=\"pyc\">shēn tǐ</td><td class=\"hv\">thân thể</td><td>cơ thể；sức khỏe</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">身上</td><td class=\"pyc\">shēn shang</td><td class=\"hv\">thân thượng</td><td>trên cơ thể；trong tay</td><td class=\"hint\">处所词</td></tr><tr><td class=\"hz\">手</td><td class=\"pyc\">shǒu</td><td class=\"hv\">thủ</td><td>tay；(trang trọng) cầm</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">病</td><td class=\"pyc\">bìng</td><td class=\"hv\">bệnh</td><td>bệnh；bệnh tật</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">病人</td><td class=\"pyc\">bìng rén</td><td class=\"hv\">bệnh nhân</td><td>người bệnh；bệnh nhân</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">生病</td><td class=\"pyc\">shēng bìng</td><td class=\"hv\">sinh bệnh</td><td>bị ốm</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">医院</td><td class=\"pyc\">yī yuàn</td><td class=\"hv\">y viện</td><td>bệnh viện；LT:所,家,座</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">医生</td><td class=\"pyc\">yī shēng</td><td class=\"hv\">y sinh</td><td>bác sĩ</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">看病</td><td class=\"pyc\">kàn bìng</td><td class=\"hv\">khán bệnh</td><td>đi khám bệnh；khám bệnh nhân</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">累</td><td class=\"pyc\">lèi</td><td class=\"hv\">lụy</td><td>mệt；mỏi</td><td class=\"hint\">形容词 / 动词</td></tr><tr><td class=\"hz\">休息</td><td class=\"pyc\">xiū xi</td><td class=\"hv\">hưu tức</td><td>nghỉ；nghỉ ngơi</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">毛</td><td class=\"pyc\">máo</td><td class=\"hv\">mao</td><td>tóc；lông</td><td class=\"hint\">人名 / 名词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「生病了」表示状态变化</p><p class=\"gfm\">主语 + 生病了</p><p class=\"gnote\">「了」表示出现了新情况。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他生病了。</p><p class=\"py\">tā shēng bìng le。</p><p class=\"vi\">Anh ấy bị ốm rồi.</p></div><div class=\"gex\"><p class=\"zh\">我生病了，很累。</p><p class=\"py\">wǒ shēng bìng le， hěn lèi。</p><p class=\"vi\">Tôi bị ốm, rất mệt.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「累」作谓语</p><p class=\"gfm\">主语 + 很累</p><p class=\"gnote\">「累」是形容词，直接作谓语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我很累。</p><p class=\"py\">wǒ hěn lèi。</p><p class=\"vi\">Tôi rất mệt.</p></div><div class=\"gex\"><p class=\"zh\">他一点儿也不累。</p><p class=\"py\">tā yī diǎnr yě bù lèi。</p><p class=\"vi\">Anh ấy không mệt chút nào.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我身体很好。</p><p class=\"py\">wǒ shēn tǐ hěn hǎo。</p><p class=\"vi\">Sức khỏe tôi rất tốt.</p></div><div class=\"sent\"><p class=\"zh\">他生病了。</p><p class=\"py\">tā shēng bìng le。</p><p class=\"vi\">Anh ấy bị ốm rồi.</p></div><div class=\"sent\"><p class=\"zh\">我们去医院看病。</p><p class=\"py\">wǒ men qù yī yuàn kàn bìng。</p><p class=\"vi\">Chúng tôi đến bệnh viện khám bệnh.</p></div><div class=\"sent\"><p class=\"zh\">医生很忙。</p><p class=\"py\">yī shēng hěn máng。</p><p class=\"vi\">Bác sĩ rất bận.</p></div><div class=\"sent\"><p class=\"zh\">我很累，想休息。</p><p class=\"py\">wǒ hěn lèi， xiǎng xiū xi。</p><p class=\"vi\">Tôi rất mệt, muốn nghỉ ngơi.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你怎么了？</p><p class=\"py\">nǐ zěn me le？</p><p class=\"vi\">Bạn sao vậy?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">我生病了，很累。</p><p class=\"py\">wǒ shēng bìng le， hěn lèi。</p><p class=\"vi\">Tôi bị ốm, rất mệt.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们去医院吧。</p><p class=\"py\">wǒ men qù yī yuàn ba。</p><p class=\"vi\">Chúng ta đến bệnh viện đi.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好。医生在吗？</p><p class=\"py\">hǎo。 yī shēng zài ma？</p><p class=\"vi\">Được. Bác sĩ có ở đó không?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">在。他现在不忙。</p><p class=\"py\">zài。 tā xiàn zài bù máng。</p><p class=\"vi\">Có. Bây giờ ông ấy không bận.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">谢谢！</p><p class=\"py\">xiè xie！</p><p class=\"vi\">Cảm ơn!</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你好好休息。</p><p class=\"py\">nǐ hǎo hǎo xiū xi。</p><p class=\"vi\">Bạn nghỉ ngơi cho tốt.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，谢谢您！</p><p class=\"py\">hǎo， xiè xie nín！</p><p class=\"vi\">Vâng, cảm ơn ông/bà!</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>身体词卡：身体 / 身上 / 手</li><li>情景对话：说自己哪里不舒服，同伴给建议</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「看病」是去看医生，「看医生」也可以说</li><li>「病人」是名词，指生病的人，不是形容词</li><li>「休息」是动词，不能说「做休息」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用中文说出自己身体最好的地方和最累的时候</li><li>在 App 上完成 L18 测验</li></ul>"},
    {title:"L19 睡觉与洗漱", id:"l19", html:"<h1>L19 · 睡觉与洗漱</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Ngủ và vệ sinh</p>\n<div class=\"lead\"><b>本课目标：</b>会说作息，会描述住处</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">睡</td><td class=\"pyc\">shuì</td><td class=\"hv\">thụy</td><td>ngủ；nằm xuống</td><td class=\"hint\">动词 / 动名词</td></tr><tr><td class=\"hz\">睡觉</td><td class=\"pyc\">shuì jiào</td><td class=\"hv\">thụy giác</td><td>đi ngủ；ngủ</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">起床</td><td class=\"pyc\">qǐ chuáng</td><td class=\"hv\">khởi sàng</td><td>thức dậy; ngủ dậy</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">洗</td><td class=\"pyc\">xǐ</td><td class=\"hv\">tẩy</td><td>rửa; tắm；rửa ảnh</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">洗手间</td><td class=\"pyc\">xǐ shǒu jiān</td><td class=\"hv\">tẩy thủ gian</td><td>nhà vệ sinh；phòng vệ sinh</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">干净</td><td class=\"pyc\">gān jìng</td><td class=\"hv\">can tịnh</td><td>sạch；gọn gàng</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">床</td><td class=\"pyc\">chuáng</td><td class=\"hv\">sàng</td><td>giường；ghế dài</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">房间</td><td class=\"pyc\">fáng jiān</td><td class=\"hv\">phòng gian</td><td>phòng</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">房子</td><td class=\"pyc\">fáng zi</td><td class=\"hv\">phòng tử</td><td>nhà；tòa nhà (một hoặc hai tầng)</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">家</td><td class=\"pyc\">jiā</td><td class=\"hv\">gia</td><td>nhà；gia đình</td><td class=\"hint\">名词 / 量词</td></tr><tr><td class=\"hz\">家里</td><td class=\"pyc\">jiā lǐ</td><td class=\"hv\">gia lý</td><td>nhà</td><td class=\"hint\">处所词 / 名词</td></tr><tr><td class=\"hz\">在家</td><td class=\"pyc\">zài jiā</td><td class=\"hv\">tại gia</td><td>ở nhà；(tại nơi làm việc) có mặt</td><td class=\"hint\">动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 「睡觉 / 起床」是固定搭配</p><p class=\"gfm\">几点 + 睡觉 / 起床</p><p class=\"gnote\">时间词放在动词前。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">我晚上十点睡觉。</p><p class=\"py\">wǒ wǎn shang shí diǎn shuì jiào。</p><p class=\"vi\">Tôi ngủ lúc mười giờ tối.</p></div><div class=\"gex\"><p class=\"zh\">我早上六点起床。</p><p class=\"py\">wǒ zǎo shang liù diǎn qǐ chuáng。</p><p class=\"vi\">Tôi thức dậy lúc sáu giờ sáng.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「在 + 地点」表位置</p><p class=\"gfm\">主语 + 在 + 地点</p><p class=\"gnote\">「在家」「在学校」「在家里」都可以。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">他在家。</p><p class=\"py\">tā zài jiā。</p><p class=\"vi\">Anh ấy ở nhà.</p></div><div class=\"gex\"><p class=\"zh\">我在家里。</p><p class=\"py\">wǒ zài jiā lǐ。</p><p class=\"vi\">Tôi ở trong nhà.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">我晚上十点睡觉。</p><p class=\"py\">wǒ wǎn shang shí diǎn shuì jiào。</p><p class=\"vi\">Tôi ngủ lúc mười giờ tối.</p></div><div class=\"sent\"><p class=\"zh\">我早上六点起床。</p><p class=\"py\">wǒ zǎo shang liù diǎn qǐ chuáng。</p><p class=\"vi\">Tôi thức dậy lúc sáu giờ sáng.</p></div><div class=\"sent\"><p class=\"zh\">我去洗手间洗手。</p><p class=\"py\">wǒ qù xǐ shǒu jiān xǐ shǒu。</p><p class=\"vi\">Tôi vào nhà vệ sinh rửa tay.</p></div><div class=\"sent\"><p class=\"zh\">我的房间很干净。</p><p class=\"py\">wǒ de fáng jiān hěn gān jìng。</p><p class=\"vi\">Phòng của tôi rất sạch.</p></div><div class=\"sent\"><p class=\"zh\">他在家。</p><p class=\"py\">tā zài jiā。</p><p class=\"vi\">Anh ấy ở nhà.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你晚上几点睡觉？</p><p class=\"py\">nǐ wǎn shang jǐ diǎn shuì jiào？</p><p class=\"vi\">Buổi tối bạn ngủ lúc mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">十点。</p><p class=\"py\">shí diǎn。</p><p class=\"vi\">Mười giờ.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">早上几点起床？</p><p class=\"py\">zǎo shang jǐ diǎn qǐ chuáng？</p><p class=\"vi\">Sáng thức dậy lúc mấy giờ?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">六点。你呢？</p><p class=\"py\">liù diǎn。 nǐ ne？</p><p class=\"vi\">Sáu giờ. Còn bạn?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我七点。我的房间很干净。</p><p class=\"py\">wǒ qī diǎn。 wǒ de fáng jiān hěn gān jìng。</p><p class=\"vi\">Tôi bảy giờ. Phòng tôi rất sạch.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">你家在哪儿？</p><p class=\"py\">nǐ jiā zài nǎr？</p><p class=\"vi\">Nhà bạn ở đâu?</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">在学校旁边。</p><p class=\"py\">zài xué xiào páng biān。</p><p class=\"vi\">Ở cạnh trường.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，下次我去你家。</p><p class=\"py\">hǎo， xià cì wǒ qù nǐ jiā。</p><p class=\"vi\">Được, lần sau tôi đến nhà bạn.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>作息时间表：用中文标出睡觉和起床时间</li><li>房间物品指认：床 / 洗手间 / 房间 / 房子</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「睡觉」是离合词，可说「睡了一觉」</li><li>「家」指家庭，「房子」指建筑，不能混用</li><li>「干净」是形容词，不说「很干净了」</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>描述自己的房间，用三个形容词</li><li>在 App 上完成 L19 测验</li></ul>"},
    {title:"L20 天气与自然", id:"l20", html:"<h1>L20 · 天气与自然</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　Thời tiết và thiên nhiên</p>\n<div class=\"lead\"><b>本课目标：</b>会谈论天气，会描述自然景物</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">天气</td><td class=\"pyc\">tiān qì</td><td class=\"hv\">thiên khí</td><td>thời tiết</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">热</td><td class=\"pyc\">rè</td><td class=\"hv\">nhiệt</td><td>nóng；nóng bức</td><td class=\"hint\">形容词 / 名词</td></tr><tr><td class=\"hz\">冷</td><td class=\"pyc\">lěng</td><td class=\"hv\">lãnh</td><td>lạnh</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">雨</td><td class=\"pyc\">yǔ</td><td class=\"hv\">vũ</td><td>mưa</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">下雨</td><td class=\"pyc\">xià yǔ</td><td class=\"hv\">hạ vũ</td><td>trời mưa</td><td class=\"hint\">动词</td></tr><tr><td class=\"hz\">风</td><td class=\"pyc\">fēng</td><td class=\"hv\">phong</td><td>gió；tin tức</td><td class=\"hint\">名词 / 语素</td></tr><tr><td class=\"hz\">山</td><td class=\"pyc\">shān</td><td class=\"hv\">sơn</td><td>núi; đồi；(thông tục) bó rơm nhỏ cho tằm làm</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">树</td><td class=\"pyc\">shù</td><td class=\"hv\">thụ</td><td>cây；trồng</td><td class=\"hint\">名词 / 动词</td></tr><tr><td class=\"hz\">花</td><td class=\"pyc\">huā</td><td class=\"hv\">hoa</td><td>hoa；bông</td><td class=\"hint\">动词 / 名词</td></tr><tr><td class=\"hz\">电</td><td class=\"pyc\">diàn</td><td class=\"hv\">điện</td><td>sét；điện</td><td class=\"hint\">名词</td></tr><tr><td class=\"hz\">重</td><td class=\"pyc\">zhòng</td><td class=\"hv\">trọng</td><td>nặng；nghiêm trọng</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">远</td><td class=\"pyc\">yuǎn</td><td class=\"hv\">viễn</td><td>xa；xa xôi</td><td class=\"hint\">形容词 / 副形词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 天气 + 形容词</p><p class=\"gfm\">天气 + 很 + 形容词</p><p class=\"gnote\">「热」「冷」直接作谓语。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">今天天气很好。</p><p class=\"py\">jīn tiān tiān qì hěn hǎo。</p><p class=\"vi\">Hôm nay thời tiết rất đẹp.</p></div><div class=\"gex\"><p class=\"zh\">天气很热。</p><p class=\"py\">tiān qì hěn rè。</p><p class=\"vi\">Thời tiết rất nóng.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 「下雨了」表示天气变化</p><p class=\"gfm\">下雨了 / 有风</p><p class=\"gnote\">「下雨」是动宾结构，中间可插「了」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">昨天下雨了。</p><p class=\"py\">zuó tiān xià yǔ le。</p><p class=\"vi\">Hôm qua trời mưa.</p></div><div class=\"gex\"><p class=\"zh\">今天有风。</p><p class=\"py\">jīn tiān yǒu fēng。</p><p class=\"vi\">Hôm nay có gió.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">今天天气很好。</p><p class=\"py\">jīn tiān tiān qì hěn hǎo。</p><p class=\"vi\">Hôm nay thời tiết rất đẹp.</p></div><div class=\"sent\"><p class=\"zh\">天气很热。</p><p class=\"py\">tiān qì hěn rè。</p><p class=\"vi\">Thời tiết rất nóng.</p></div><div class=\"sent\"><p class=\"zh\">昨天下雨了。</p><p class=\"py\">zuó tiān xià yǔ le。</p><p class=\"vi\">Hôm qua trời mưa.</p></div><div class=\"sent\"><p class=\"zh\">今天有风。</p><p class=\"py\">jīn tiān yǒu fēng。</p><p class=\"vi\">Hôm nay có gió.</p></div><div class=\"sent\"><p class=\"zh\">那个山很远。</p><p class=\"py\">nà ge shān hěn yuǎn。</p><p class=\"vi\">Ngọn núi kia rất xa.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">今天天气好吗？</p><p class=\"py\">jīn tiān tiān qì hǎo ma？</p><p class=\"vi\">Hôm nay thời tiết đẹp không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很好，不冷也不热。</p><p class=\"py\">hěn hǎo， bù lěng yě bù rè。</p><p class=\"vi\">Rất đẹp, không lạnh cũng không nóng.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">明天呢？</p><p class=\"py\">míng tiān ne？</p><p class=\"vi\">Còn ngày mai?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">明天下雨。</p><p class=\"py\">míng tiān xià yǔ。</p><p class=\"vi\">Mai trời mưa.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那我们不去山上了。</p><p class=\"py\">nà wǒ men bù qù shān shàng le。</p><p class=\"vi\">Vậy chúng ta không lên núi nữa.</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">好，在家休息。</p><p class=\"py\">hǎo， zài jiā xiū xi。</p><p class=\"vi\">Được, ở nhà nghỉ ngơi.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">你冷吗？</p><p class=\"py\">nǐ lěng ma？</p><p class=\"vi\">Bạn lạnh không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">不冷。</p><p class=\"py\">bù lěng。</p><p class=\"vi\">Không lạnh.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>天气卡：热 / 冷 / 下雨 / 有风 / 有电</li><li>天气播报：每人用一句中文说今天的天气</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>「下雨」是动宾结构，不能说「雨下」</li><li>「热」「冷」是形容词，前面可加「很」</li><li>「重」读 zhòng，不读 chóng</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>连续三天用中文记录天气</li><li>在 App 上完成 L20 测验</li></ul>"},
    {title:"L21 大小与好坏", id:"l21", html:"<h1>L21 · 大小与好坏</h1>\n<p class=\"sub\">第二阶段 · 日常生活　|　To nhỏ, tốt xấu</p>\n<div class=\"lead\"><b>本课目标：</b>会用形容词描述大小、多少、好坏</div>\n<h2>一、生词 12 个</h2>\n<table class=\"words\"><tr><th style=\"width:14%\">汉字</th><th style=\"width:18%\">拼音</th><th style=\"width:18%\">汉越音</th><th style=\"width:36%\">越南语释义</th><th style=\"width:14%\">词性</th></tr><tr><td class=\"hz\">白</td><td class=\"pyc\">bái</td><td class=\"hv\">bạch</td><td>trắng；tuyết</td><td class=\"hint\">形容词 / 人名</td></tr><tr><td class=\"hz\">大</td><td class=\"pyc\">dà</td><td class=\"hv\">đại</td><td>to; lớn; vĩ đại；lớn tuổi hơn</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">小</td><td class=\"pyc\">xiǎo</td><td class=\"hv\">tiểu</td><td>nhỏ；bé</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">多</td><td class=\"pyc\">duō</td><td class=\"hv\">đa</td><td>nhiều；quá nhiều; dư thừa</td><td class=\"hint\">形容词 / 数词</td></tr><tr><td class=\"hz\">少</td><td class=\"pyc\">shǎo</td><td class=\"hv\">thiểu</td><td>ít；hơn</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">高</td><td class=\"pyc\">gāo</td><td class=\"hv\">cao</td><td>cao；khoảng trên trung bình</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">新</td><td class=\"pyc\">xīn</td><td class=\"hv\">tân</td><td>mới；vừa mới</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">老</td><td class=\"pyc\">lǎo</td><td class=\"hv\">lão</td><td>già；cũ; lâu năm</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">快</td><td class=\"pyc\">kuài</td><td class=\"hv\">khoái</td><td>nhanh；nhanh chóng</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">慢</td><td class=\"pyc\">màn</td><td class=\"hv\">mạn</td><td>chậm</td><td class=\"hint\">形容词 / 副形词</td></tr><tr><td class=\"hz\">好</td><td class=\"pyc\">hǎo</td><td class=\"hv\">hảo</td><td>tốt；thích hợp; đúng</td><td class=\"hint\">形容词 / 副词</td></tr><tr><td class=\"hz\">差</td><td class=\"pyc\">chà</td><td class=\"hv\">sai</td><td>khác；sai; nhầm</td><td class=\"hint\">形容词 / 动词</td></tr></table>\n<h2>二、语法点</h2>\n<div class=\"g\"><p class=\"gpt\">1. 形容词作谓语要加程度副词</p><p class=\"gfm\">主语 + 很 + 形容词</p><p class=\"gnote\">单个形容词作谓语会显得在比较，一般要加「很」。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个很大。</p><p class=\"py\">zhè ge hěn dà。</p><p class=\"vi\">Cái này rất to.</p></div><div class=\"gex\"><p class=\"zh\">我们班学生很多。</p><p class=\"py\">wǒ men bān xué sheng hěn duō。</p><p class=\"vi\">Lớp chúng tôi rất đông học sinh.</p></div></div></div>\n<div class=\"g\"><p class=\"gpt\">2. 反义配对</p><p class=\"gfm\">大—小　多—少　快—慢　好—差　新—老</p><p class=\"gnote\">成对记，效率最高。</p><div class=\"gwrap\"><div class=\"gex\"><p class=\"zh\">这个很大，那个很小。</p><p class=\"py\">zhè ge hěn dà， nà ge hěn xiǎo。</p><p class=\"vi\">Cái này to, cái kia nhỏ.</p></div><div class=\"gex\"><p class=\"zh\">这个好，那个不好。</p><p class=\"py\">zhè ge hǎo， nà ge bù hǎo。</p><p class=\"vi\">Cái này tốt, cái kia không tốt.</p></div></div></div>\n<h2>三、例句</h2>\n<div class=\"exwrap\"><div class=\"sent\"><p class=\"zh\">这个很大，那个很小。</p><p class=\"py\">zhè ge hěn dà， nà ge hěn xiǎo。</p><p class=\"vi\">Cái này to, cái kia nhỏ.</p></div><div class=\"sent\"><p class=\"zh\">我们班学生很多。</p><p class=\"py\">wǒ men bān xué sheng hěn duō。</p><p class=\"vi\">Lớp chúng tôi rất đông học sinh.</p></div><div class=\"sent\"><p class=\"zh\">他很快。</p><p class=\"py\">tā hěn kuài。</p><p class=\"vi\">Anh ấy rất nhanh.</p></div><div class=\"sent\"><p class=\"zh\">这本书很新。</p><p class=\"py\">zhè běn shū hěn xīn。</p><p class=\"vi\">Cuốn sách này rất mới.</p></div><div class=\"sent\"><p class=\"zh\">那个老人很老。</p><p class=\"py\">nà ge lǎo rén hěn lǎo。</p><p class=\"vi\">Ông lão kia rất già.</p></div><div class=\"sent\"><p class=\"zh\">这个不好，那个好。</p><p class=\"py\">zhè ge bù hǎo， nà ge hǎo。</p><p class=\"vi\">Cái này không tốt, cái kia tốt.</p></div></div>\n<h2>四、对话</h2>\n<div class=\"dlg\"><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">这个房子大吗？</p><p class=\"py\">zhè ge fáng zi dà ma？</p><p class=\"vi\">Ngôi nhà này to không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很大。</p><p class=\"py\">hěn dà。</p><p class=\"vi\">Rất to.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">那个呢？</p><p class=\"py\">nà ge ne？</p><p class=\"vi\">Còn cái kia?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">那个小一点儿。</p><p class=\"py\">nà ge xiǎo yī diǎnr。</p><p class=\"vi\">Cái kia nhỏ hơn một chút.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">我们班学生多吗？</p><p class=\"py\">wǒ men bān xué sheng duō ma？</p><p class=\"vi\">Lớp chúng tôi đông không?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">很多。有二十个人。</p><p class=\"py\">hěn duō。 yǒu èr shí gè rén。</p><p class=\"vi\">Rất đông. Có hai mươi người.</p></div></div><div class=\"line\"><span class=\"who\">A</span><div><p class=\"zh\">谁最快？</p><p class=\"py\">shéi zuì kuài？</p><p class=\"vi\">Ai nhanh nhất?</p></div></div><div class=\"line\"><span class=\"who\">B</span><div><p class=\"zh\">他最快。</p><p class=\"py\">tā zuì kuài。</p><p class=\"vi\">Anh ấy nhanh nhất.</p></div></div></div>\n<h2>五、课堂操练</h2><ul class=\"plain\"><li>反义词配对卡：大-小、多-少、快-慢、好-差、新-老</li><li>看图比较：两人一组比较教室里两样东西的大小</li></ul>\n<h2>六、易错点</h2><ul class=\"pit\"><li>形容词作谓语一般要加「很」，否则听起来像在比较</li><li>「老」既可指年龄大，也可指旧（老房子）</li><li>「少」读 shǎo（第三声），不是 shào</li></ul>\n<h2>七、作业</h2><ul class=\"plain\"><li>用五个形容词各写一句描述自己的房间</li><li>在 App 上完成 L21 测验</li></ul>"}
  ]},
